<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>สมุดบัญชี - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <h1 class="text-4xl font-bold mb-5">สมุดบัญชี</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">รายการธุรกรรม</h2>
                <div class="overflow-x-auto">
                    <div class="table-responsive-sm">
                        <table aria-busy="false" aria-colcount="6" class="table b-table b-table-stacked-md w-full"
                            role="table">
                            <thead class="bg-gray-100" role="rowgroup">
                                <tr role="row">
                                    <th aria-colindex="1"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        รหัสธุรกรรม
                                    </th>
                                    <th aria-colindex="2"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        วันที่
                                    </th>
                                    <th aria-colindex="3"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        รายละเอียด
                                    </th>
                                    <th aria-colindex="4"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        เครดิตเวลา
                                    </th>
                                    <th aria-colindex="5"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        ชื่อกิจกรรม
                                    </th>
                                    <th aria-colindex="6"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        ชื่อผู้ขอ
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="transaction-tbody" role="rowgroup">
                                <!-- Transactions will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="flex items-center justify-center mt-5" id="pagination">
                    <!-- Pagination buttons will be dynamically inserted here -->
                </div>
                <div class="flex justify-center mt-4">
                    <button
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        onclick="window.history.back()">
                        ย้อนกลับ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let memberId = new URLSearchParams(window.location.search).get('memberId');
        if (!memberId) {
            alert('ไม่พบรหัสสมาชิกใน URL');
            throw new Error('No memberId provided in the URL');
        }

        let transactions = [];
        let currentPage = 1;
        const pageSize = 10;
        let totalTransactions = 0;

        async function fetchTransactions(page) {
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/transactions?page=${page}&pageSize=${pageSize}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data.transactions)) {
                    transactions = data.transactions;
                    totalTransactions = data.total;
                    renderTable(transactions);
                    renderPagination();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลธุรกรรม');
                }
            } catch (error) {
                console.error('Error fetching transactions:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลธุรกรรม');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('transaction-tbody');
            tbody.innerHTML = '';
            data.forEach((transaction, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                const timeCreditsClass = transaction.transaction_type === 'earn' ? 'text-green-500' : 'text-red-500';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="รหัสธุรกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.transaction_id}
                    </td>
                    <td aria-colindex="2" data-label="วันที่" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${new Date(transaction.date).toLocaleDateString()}
                    </td>
                    <td aria-colindex="3" data-label="รายละเอียด" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.details}
                    </td>
                    <td aria-colindex="4" data-label="เครดิตเวลา" role="cell" class="py-2 px-4 border-b border-gray-200 ${timeCreditsClass}">
                        ${transaction.time_credits}
                    </td>
                    <td aria-colindex="5" data-label="ชื่อกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.activity_title || ''}
                    </td>
                    <td aria-colindex="6" data-label="ชื่อผู้ขอ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.requester_name || ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalTransactions / pageSize);

            const firstButton = document.createElement('button');
            firstButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            firstButton.textContent = 'First';
            firstButton.onclick = () => {
                currentPage = 1;
                fetchTransactions(currentPage);
            };
            paginationContainer.appendChild(firstButton);

            const prevButton = document.createElement('button');
            prevButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            prevButton.textContent = 'Prev';
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchTransactions(currentPage);
                }
            };
            paginationContainer.appendChild(prevButton);

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1 ${i === currentPage ? 'bg-blue-700' : ''}`;
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    fetchTransactions(currentPage);
                };
                paginationContainer.appendChild(pageButton);
            }

            const nextButton = document.createElement('button');
            nextButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            nextButton.textContent = 'Next';
            nextButton.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchTransactions(currentPage);
                }
            };
            paginationContainer.appendChild(nextButton);

            const lastButton = document.createElement('button');
            lastButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            lastButton.textContent = 'Last';
            lastButton.onclick = () => {
                currentPage = totalPages;
                fetchTransactions(currentPage);
            };
            paginationContainer.appendChild(lastButton);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchTransactions(currentPage);
        });
    </script>
    <script src="navbar.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .day-part {
            display: inline-block;
            width: 40px;
        }

        .month-year-part {
            display: inline-block;
            width: 80px;
        }
    </style>
    <script src="navbar.js"></script>
    <script>
        let activities = [];
        let currentPage = 1;
        const pageSize = 10;
        let totalActivities = 0;
        let sortOrder = {
            title: 'asc',
            start_date: 'asc',
            status: 'asc'
        };

        async function confirmAndRemove(event, rowId, activityId) {
                event.preventDefault();

                openConfirmDelete(async () => {
                    try {
                        const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            }
                        });

                        if (response.ok) {
                            document.getElementById(rowId).remove();
                        } else {
                            console.error("Failed to delete activity");
                        }
                    } catch (error) {
                        console.error('Error deleting activity:', error);
                    }
                });
            }

        async function fetchActivities(page = 1) {
            console.log(`📌 Fetching activities for page ${page}...`);

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities?page=${page}&pageSize=${pageSize}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                if (!data.activities) {
                    console.warn("⚠️ No activities found in API response.");
                    return;
                }

                console.log("✅ Activities fetched successfully.", data.activities);

                activities = Object.values(data.activities).flat();
                totalActivities = data.total;
                updateActivityStatus();
                await fetchParticipants();
                renderTable(activities);
                renderPagination();
            } catch (error) {
                console.error('❌ Error fetching activities:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลกิจกรรม กรุณาลองใหม่อีกครั้ง');
            }
        }

        async function fetchParticipants() {
            console.log("📌 Fetching participants for activities...");

            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/activities/${activity.activity_id}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }

                    const participants = await response.json();
                    activity.current_participants = participants.length;

                    console.log(`✅ Activity ID: ${activity.activity_id} - Participants fetched: ${participants.length}`);
                } catch (error) {
                    console.error(`❌ Error fetching participants for activity ${activity.activity_id}:`, error);
                    activity.current_participants = 0;
                }
            }
        }

        function updateActivityStatus() {
            const now = new Date();
            activities.forEach(activity => {
                if (activity.status === 'กำลังจะเริ่ม') {
                    const activityEndDate = new Date(activity.end_date);
                    const activityEndTime = activity.end_time.split(':');
                    activityEndDate.setHours(activityEndTime[0], activityEndTime[1], activityEndTime[2]);

                    if (activityEndDate < now) {
                        activity.status = 'เกินเวลา';
                    }
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('activity-tbody');
            tbody.innerHTML = '';
            data.forEach((activity, index) => {
                const statusColor =
                    activity.status === 'กำลังจะเริ่ม' ? 'bg-blue-500' :
                    activity.status === 'กำลังทำกิจกรรม' ? 'bg-yellow-500' :
                    activity.status === 'รอผู้ขอยืนยันผล' ? 'bg-pink-500' :
                    activity.status === 'รอการอนุมัติ' ? 'bg-indigo-500' :
                    activity.status === 'เสร็จสิ้น' ? 'bg-green-500' :
                    activity.status === 'เกินเวลา' ? 'bg-orange-500' :
                    activity.status === 'ผู้เข้าร่วมไม่ครบ' ? 'bg-red-600' :
                    'bg-gray-500';
        
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                <td class="py-2 px-4 border-b border-gray-200 font-semibold text-center align-middle">
                    <span class="${activity.activity_type === 'exchange' ? 'text-lime-500' : 'text-gray-400'} font-semibold">
                        ${activity.activity_type === 'exchange' ? 'มีเครดิต' : 'ไม่มีเครดิต'}
                    </span>
                </td>
                <td class="py-2 px-4 border-b border-gray-200 align-middle">${activity.title}</td>
                <td class="py-2 px-4 border-b border-gray-200 align-middle">${activity.required_skill_name || '-'}</td>
                <td class="py-2 px-4 border-b border-gray-200">
                <div class="text-gray-800 leading-snug">
                    <div>${formatDate(activity.start_date)}</div>
                    <div class="text-gray-600 text-[15px]">${formatTime(activity.start_time)} - ${formatTime(activity.end_time)}</div>
                </div>
                </td>
                <td class="py-2 px-2 border-b border-gray-200 text-left">
                <div class="flex justify-start">
                    <span class="inline-block px-3 py-1 rounded-md text-white font-medium text-base ${statusColor}">
                    ${activity.status}
                    </span>
                </div>
                </td>
                <td class="py-2.5 px-4 border-b border-gray-200 text-center text-[16px] font-medium">
                ${activity.current_participants} / ${activity.max_participants}
                </td>
                <td class="py-2 px-4 border-b border-gray-200 text-center text-left">
                    <div class="flex justify-start items-center gap-2 whitespace-nowrap">
                        <a href="activity-details.html?id=${activity.activity_id}"
                        class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold py-1.5 px-4 rounded-full whitespace-nowrap">
                        รายละเอียด
                        </a>
                        ${
                        activity.status === 'รอการอนุมัติ'
                        ? `<a href="activity-approval.html?id=${activity.activity_id}"
                            class="bg-yellow-400 hover:bg-yellow-500 text-white text-sm font-semibold py-1.5 px-4 rounded-full whitespace-nowrap">
                            รอการอนุมัติ
                            </a>`
                        : activity.status === 'รอผู้ขอยืนยันผล'
                            ? `<span class="text-yellow-500 text-sm font-semibold whitespace-nowrap">รอการยืนยันจากผู้ขอ</span>`
                            : ``
                        }
                        <button onclick="confirmAndRemove(event, 'row-${index + 1}', ${activity.activity_id})"
                        class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold py-1.5 px-4 rounded-full whitespace-nowrap">
                        ลบ
                        </button>
                    </div>
                    </td>

              `;
              
                tbody.appendChild(row);
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear() + 543; // พ.ศ.
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[date.getMonth()];
            const day = date.getDate();
            return `${day} ${month} ${year}`;
        }
        
        function formatTime(timeString) {
            if (!timeString) return '';
            const [hour, minute] = timeString.split(':');
            return `${hour}.${minute} น.`;
        }
        
          

        function sortTable(column, type) {
            const order = sortOrder[column] === 'asc' ? 'desc' : 'asc';
            sortOrder[column] = order;

            const sortedActivities = [...activities].sort((a, b) => {
                if (type === 'string') {
                    return order === 'asc' ? a[column].localeCompare(b[column]) : b[column].localeCompare(a[column]);
                } else if (type === 'date') {
                    return order === 'asc' ? new Date(a[column]) - new Date(b[column]) : new Date(b[column]) - new Date(a[column]);
                }
            });
            renderTable(sortedActivities);
        }

        function searchActivities() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredActivities = activities.filter(activity => {
                return (
                    (activity.activity_id && activity.activity_id.toString().includes(searchTerm)) ||
                    (activity.title && activity.title.toLowerCase().includes(searchTerm)) ||
                    (activity.description && activity.description.toLowerCase().includes(searchTerm)) ||
                    (activity.location && activity.location.toLowerCase().includes(searchTerm)) ||
                    (activity.requester_id && activity.requester_id.toString().includes(searchTerm))
                );
            });
            renderTable(filteredActivities);
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalActivities / pageSize);

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = `px-3 py-1 mx-1 rounded ${i === currentPage ? 'bg-blue-500 text-white' : 'bg-white text-blue-500'}`;
                pageButton.onclick = () => {
                    currentPage = i;
                    fetchActivities(currentPage);
                };
                paginationContainer.appendChild(pageButton);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log("📌 Page Loaded: Fetching data...");
                await fetchActivities();

                console.log("✅ Page initialization complete.");
            } catch (error) {
                console.error("❌ Error during page initialization:", error);
            }

            // Ensure elements exist before modifying them
            const mainHeading = document.querySelector('h1');
            if (mainHeading) {
                mainHeading.textContent = "จัดการกิจกรรม";
            } else {
                console.warn("⚠️ Warning: Element 'h1' not found in the document.");
            }

            const subHeading = document.querySelector('h2');
            if (subHeading) {
                subHeading.textContent = "กิจกรรม";
            } else {
                console.warn("⚠️ Warning: Element 'h2' not found in the document.");
            }
        });

        async function approveActivity(activityId) {
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/manager-approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
        
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Unknown error');
                }

                showSuccessModal('กิจกรรมได้รับการอนุมัติเรียบร้อยแล้ว');
                fetchActivities();
            } catch (error) {
                console.error('Error approving activity:', error);
                showErrorModal('เกิดข้อผิดพลาดในการอนุมัติกิจกรรม: ' + error.message);
            }
        }
        
    </script>
</head>

    <script>
        let deleteActivityCallback = null;

            function openConfirmDelete(callback) {
                deleteActivityCallback = callback;
                document.getElementById('confirm-delete-modal').classList.remove('hidden');
            }

            function closeConfirmDelete() {
                document.getElementById('confirm-delete-modal').classList.add('hidden');
            }

            function openSuccessModal() {
                document.getElementById('success-modal').classList.remove('hidden');
            }

            function showSuccessModal(message) {
                    document.getElementById('success-message').textContent = message;
                    document.getElementById('success-modal').classList.remove('hidden');
                }

                function showErrorModal(message) {
                    document.getElementById('error-message').textContent = message;
                    document.getElementById('error-modal').classList.remove('hidden');
                }

                function closeModal(modalId) {
                    document.getElementById(modalId).classList.add('hidden');
                }

            // Event listener ปุ่มใน confirm modal
            document.getElementById('confirm-delete-btn').addEventListener('click', () => {
                if (deleteActivityCallback) {
                    deleteActivityCallback();
                }
                closeConfirmDelete();
                openSuccessModal();
            });

            document.getElementById('cancel-delete-btn').addEventListener('click', () => {
                closeConfirmDelete();
            });

        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');
            const navList = document.getElementById('navList');
            const mainHeading = document.querySelector('h1');
            const subHeading = document.querySelector('h2');
            const searchPlaceholder = document.querySelector('input[placeholder]');
            const addButton = document.getElementById('add-activity-btn');
            const calendarButton = document.querySelector('a[href="activity-calendar.html"]');
            const tableHeaders = document.querySelectorAll('th');

            const translations = {
                thai: {
                    mainHeading: 'จัดการกิจกรรม',
                    subHeading: 'กิจกรรม',
                    searchPlaceholder: 'ค้นหากิจกรรม',
                    addButton: 'เพิ่ม',
                    calendarButton: 'ปฏิทิน',
                    nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวดหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                    tableHeaders: ['กิจกรรม', 'วันที่', 'สถานะ', 'จำนวนผู้เข้าร่วม', 'การจัดการ'],
                },
                english: {
                    mainHeading: 'Manage Activities',
                    subHeading: 'Activities',
                    searchPlaceholder: 'Search Activities',
                    addButton: 'Add',
                    calendarButton: 'Calendar',
                    nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                    tableHeaders: ['Activity', 'Date', 'Status', 'Participants', 'Actions'],
                },
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            const updateContent = (lang) => {
                const langData = translations[lang];

                // Ensure elements exist before modifying them
                const mainHeading = document.querySelector('h1');
                const subHeading = document.querySelector('h2');

                if (!mainHeading) {
                    console.warn("⚠️ Warning: Element 'h1' not found in the document.");
                } else {
                    mainHeading.textContent = langData.mainHeading;
                }

                if (!subHeading) {
                    console.warn("⚠️ Warning: Element 'h2' not found in the document.");
                } else {
                    subHeading.textContent = langData.subHeading;
                }

                // Update static text
                mainHeading.textContent = langData.mainHeading;
                subHeading.textContent = langData.subHeading;
                searchPlaceholder.placeholder = langData.searchPlaceholder;
                addButton.textContent = langData.addButton;
                calendarButton.textContent = langData.calendarButton;

                // Update table headers
                tableHeaders.forEach((header, index) => {
                    header.textContent = langData.tableHeaders[index];
                });

                // Update navigation
                const navItems = navList.querySelectorAll('a');
                navItems.forEach((link, index) => {
                    const icon = link.querySelector('i');
                    link.innerHTML = ''; // Clear existing content
                    if (icon) link.appendChild(icon); // Re-add the icon
                    link.append(` ${langData.nav[index]}`); // Add translated text
                });
            };
        });
    </script>

    <script src="notification.js"></script>

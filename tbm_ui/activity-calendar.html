<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ปฏิทินกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="navbar.js"></script>
    <script>
        let activities = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        async function fetchActivities() {
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                activities = data.activities; // Store activities grouped by date
                renderCalendar(currentMonth, currentYear);
            } catch (error) {
                console.error('Error fetching activities:', error);
                alert('Error fetching activities. Please try again.');
            }
        }

        function renderCalendar(month, year) {
            const calendarBody = document.getElementById('calendar-body');
            calendarBody.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let date = 1;

            for (let i = 0; i < 6; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    const cell = document.createElement('td');
                    cell.className = 'border p-2 h-28 align-top relative bg-white';
                    if (i === 0 && j < firstDay) {
                        cell.innerHTML = '';
                    } else if (date > daysInMonth) {
                        break;
                    } else {
                        const cellDate = new Date(year, month, date);
                        const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

                        // **Container for Date**
                        const dateDiv = document.createElement('div');
                        dateDiv.className = 'date-number font-bold text-gray-800 cursor-pointer';
                        dateDiv.innerHTML = `${date}`;
                        dateDiv.addEventListener("click", function () {
                            window.location.href = `create-activity.html?date=${formattedDate}`;
                        });

                        // **Container for Activity List**
                        const activityList = document.createElement('div');
                        activityList.className = 'activity-list mt-2';
                        if (activities[formattedDate]) {
                            activities[formattedDate].forEach(activity => {
                                let activityClass = "bg-gray-400"; // Default color
                                switch (activity.status) {
                                    case 'กำลังจะเริ่ม':
                                        activityClass = "bg-blue-500";
                                        break; // Upcoming
                                    case 'เสร็จสิ้น':
                                        activityClass = "bg-green-500";
                                        break; // Completed
                                    case 'ยกเลิก':
                                        activityClass = "bg-red-500";
                                        break; // Canceled
                                }
                                const activityDiv = document.createElement('div');
                                activityDiv.className = `activity-item ${activityClass} text-white rounded px-2 py-1 mt-1 text-xs`;
                                activityDiv.innerHTML = `${activity.title}`;
                                activityDiv.setAttribute("data-id", activity.activity_id);
                                activityDiv.classList.add("clickable-activity");
                                activityDiv.addEventListener("click", function () {
                                    window.location.href = `activity-details.html?id=${this.getAttribute("data-id")}`;
                                });
                                activityList.appendChild(activityDiv);
                            });
                        }

                        // Append date and activity list to cell
                        cell.appendChild(dateDiv);
                        cell.appendChild(activityList);
                        date++;
                    }
                    row.appendChild(cell);
                }
                calendarBody.appendChild(row);
            }
            document.getElementById('month-year').textContent = `${year} ${new Intl.DateTimeFormat('th-TH', { month: 'long' }).format(new Date(year, month))}`;
        }

        function changeMonth(direction) {
            if (direction === 'prev') {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
            } else if (direction === 'next') {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
            }
            renderCalendar(currentMonth, currentYear);
        }

        function changeYear(year) {
            currentYear = year;
            renderCalendar(currentMonth, currentYear);
        }

        function changeMonthDirect(month) {
            currentMonth = month;
            renderCalendar(currentMonth, currentYear);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchActivities();
            // Populate the year selection dropdown in AD format
            populateYearSelect();
        });

        function populateYearSelect() {
            const yearSelect = document.getElementById('year-select');
            yearSelect.innerHTML = ''; // Clear existing options
            let currentYear = new Date().getFullYear(); // Get current year in AD format
            let startYear = currentYear - 5; // Show last 5 years
            let endYear = currentYear + 5; // Show next 5 years
            for (let year = startYear; year <= endYear; year++) {
                let option = document.createElement('option');
                option.value = year;
                option.textContent = `${year}`;
                if (year === currentYear) {
                    option.selected = true; // Set current year as default
                }
                yearSelect.appendChild(option);
            }
            yearSelect.addEventListener('change', () => {
                changeYear(parseInt(yearSelect.value));
            });
        }
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" id="lang-th" data-lang="th"> ภาษาไทย </span>
                    <span class="toggle-label" id="lang-en" data-lang="en"> English </span>
                </div>
            </div>
            <h1 class="text-4xl font-bold mb-5">ปฏิทินกิจกรรม</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">ปฏิทิน</h2>
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth('prev')" class="bg-blue-500 text-white px-4 py-2 rounded">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="month-year" class="text-xl font-bold"></span>
                    <button onclick="changeMonth('next')" class="bg-blue-500 text-white px-4 py-2 rounded">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <select id="year-select" class="bg-gray-200 text-black px-4 py-2 rounded"
                        onchange="changeYear(this.value)">
                        <option value="2565">พ.ศ. 2565</option>
                        <option value="2566" selected>พ.ศ. 2566</option>
                        <option value="2567">พ.ศ. 2567</option>
                        <option value="2568">พ.ศ. 2568</option>
                        <option value="2569">พ.ศ. 2569</option>
                        <option value="2570">พ.ศ. 2570</option>
                        <option value="2571">พ.ศ. 2571</option>
                        <option value="2572">พ.ศ. 2572</option>
                        <option value="2573">พ.ศ. 2573</option>
                        <option value="2574">พ.ศ. 2574</option>
                        <option value="2575">พ.ศ. 2575</option>
                    </select>
                    <select id="month-select" class="bg-gray-200 text-black px-4 py-2 rounded"
                        onchange="changeMonthDirect(this.value)">
                        <option value="0">January</option>
                        <option value="1">February</option>
                        <option value="2">March</option>
                        <option value="3">April</option>
                        <option value="4">May</option>
                        <option value="5">June</option>
                        <option value="6">July</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">October</option>
                        <option value="10">November</option>
                        <option value="11">December</option>
                    </select>
                    <button onclick="window.location.href='activity.html'"
                        class="bg-blue-500 text-white px-4 py-2 rounded">
                        <i class="fas fa-arrow-left"></i> Back to Activities
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse table-fixed">
                        <thead>
                            <tr class="bg-gray-200">
                                <th class="border px-4 py-2 text-center w-1/7">อาทิตย์</th>
                                <th class="border px-4 py-2 text-center w-1/7">จันทร์</th>
                                <th class="border px-4 py-2 text-center w-1/7">อังคาร</th>
                                <th class="border px-4 py-2 text-center w-1/7">พุธ</th>
                                <th class="border px-4 py-2 text-center w-1/7">พฤหัสบดี</th>
                                <th class="border px-4 py-2 text-center w-1/7">ศุกร์</th>
                                <th class="border px-4 py-2 text-center w-1/7">เสาร์</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-body">
                            <!-- Calendar will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
                <style>
                    td {
                        width: 14.2%;
                        height: 100px;
                        text-align: left;
                        vertical-align: top;
                        padding: 5px;
                        background-color: white;
                        position: relative;
                    }

                    .date-number {
                        position: relative;
                        top: 5px;
                        left: 5px;
                        font-size: 14px;
                        color: #333;
                    }

                    .activity-list {
                        margin-top: 20px;
                    }

                    .activity-item {
                        display: block;
                        font-size: 12px;
                        padding: 3px;
                        margin-top: 3px;
                        border-radius: 4px;
                        text-align: center;
                        color: white;
                    }

                    .activity-upcoming {
                        background-color: #3b82f6;
                    }

                    .activity-completed {
                        background-color: #10b981;
                    }

                    .activity-canceled {
                        background-color: #ef4444;
                    }

                    .activity-default {
                        background-color: #9ca3af;
                    }

                    .toggle-container {
                        display: flex;
                        background-color: #E5E7EB;
                        border-radius: 20px;
                        padding: 6px;
                        align-items: center;
                        justify-content: space-between;
                        width: 180px;
                    }

                    .toggle-label {
                        flex: 1;
                        text-align: center;
                        font-size: 0.9rem;
                        font-weight: 500;
                        color: gray;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        border-radius: 9999px;
                        padding: 5px;
                    }

                    .toggle-label.active {
                        background-color: white;
                        color: #1D4ED8;
                        font-weight: bold;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                    }

                    .toggle-label.disabled {
                        pointer-events: none;
                        background-color: white;
                        color: #6B7280;
                        font-weight: bold;
                    }

                    .clickable-activity {
                        cursor: pointer;
                        transition: opacity 0.2s ease-in-out;
                    }

                    .clickable-activity:hover {
                        opacity: 0.8;
                    }
                </style>
                <script src="selected-language.js"></script>
                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const langThai = document.getElementById('lang-th');
                        const langEnglish = document.getElementById('lang-en');
                        const navList = document.getElementById('navList');
                        const mainHeading = document.querySelector('h1');
                        const subHeading = document.querySelector('h2');
                        const tableHeaders = document.querySelectorAll('th');
                        const translations = {
                            thai: {
                                mainHeading: 'ปฏิทินกิจกรรม',
                                subHeading: 'ปฏิทิน',
                                nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวดหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                                days: ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'],
                            },
                            english: {
                                mainHeading: 'Activity Calendar',
                                subHeading: 'Calendar',
                                nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                                days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
                            },
                        };
                        let currentLang = localStorage.getItem('selectedLanguage') || 'thai';
                        const updateContent = (lang) => {
                            const langData = translations[lang];
                            mainHeading.textContent = langData.mainHeading;
                            subHeading.textContent = langData.subHeading;
                            // Update table headers
                            tableHeaders.forEach((header, index) => {
                                header.textContent = langData.days[index];
                            });
                            // Update navigation
                            const navItems = navList.querySelectorAll('a');
                            navItems.forEach((link, index) => {
                                const icon = link.querySelector('i');
                                link.innerHTML = '';
                                if (icon) link.appendChild(icon);
                                link.append(` ${langData.nav[index]}`);
                            });
                            // Update language toggle styles
                            if (lang === 'thai') {
                                langThai.classList.add('active');
                                langEnglish.classList.remove('active');
                            } else {
                                langEnglish.classList.add('active');
                                langThai.classList.remove('active');
                            }
                        };
                        langThai.addEventListener('click', () => {
                            currentLang = 'thai';
                            localStorage.setItem('selectedLanguage', currentLang);
                            updateContent(currentLang);
                        });
                        langEnglish.addEventListener('click', () => {
                            currentLang = 'english';
                            localStorage.setItem('selectedLanguage', currentLang);
                            updateContent(currentLang);
                        });
                        // Initialize content on page load
                        updateContent(currentLang);
                    });
                </script>
            </div>
        </div>
    </div>
</body>

</html>

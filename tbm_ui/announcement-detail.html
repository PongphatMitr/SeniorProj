<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Announcement Detail - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul class="space-y-4" id="navList">
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10 relative">
            <!-- Back Button -->
            <div class="absolute top-5 left-5">
                <button class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition duration-300"
                    id="backButton">
                    <i class="fas fa-arrow-left">
                    </i>
                    กลับ
                </button>
            </div>
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <button class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 transition duration-300"
                    id="modifyButton">
                    แก้ไข
                </button>
                <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition duration-300"
                    id="deleteButton">
                    ลบ
                </button>
                <!-- Notification Placeholder -->
                <div class="relative" id="mainNotificationPanel">
                </div>
            </div>
            <div class="mt-16">
                <h1 class="text-4xl font-bold mb-5" id="announcementTitle">
                    หัวข้อประกาศ
                </h1>
                <div class="bg-white text-black p-6 rounded-lg shadow-md flex">
                    <img alt="Announcement image placeholder" class="h-60 w-1/3 object-cover mb-5 rounded" height="400"
                        id="announcementImage"
                        src="https://storage.googleapis.com/a1aa/image/de7d387a-6fc8-4a17-5692-7621331660ae.jpg"
                        width="600" />
                    <div class="ml-6 w-2/3">
                        <h2 class="text-xl font-bold mb-2" id="announcementTitleDetail">
                            อาสาเพื่อนรับฟังเยี่ยมเยียนยาย เพื่อผู้สูงอายุในชุมชนยามไร้ วันที่ 16 พ.ย. 2567 ที่
                            ชุมชนภูมิใจ
                        </h2>
                        <p class="mb-2" id="announcementDate">
                            <i class="fas fa-calendar-alt">
                            </i>
                        </p>
                        <p class="mb-2">
                            <i class="fas fa-building">
                            </i>
                            ชุมชน :
                            <span id="announcementBranch">
                                โคกสลุง
                            </span>
                        </p>
                    </div>
                </div>
                <div class="bg-white text-black p-6 rounded-lg shadow-md mt-4">
                    <p id="announcementDescription">
                    </p>
                </div>
            </div>
        </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="delete-modal">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-red-600 mt-6">
                ยืนยันการลบประกาศ
            </h2>
            <p class="text-gray-700 text-lg mt-4">
                ต้องการลบประกาศหรือไม่?
            </p>
            <div class="mt-6 flex justify-center">
                <button
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300 mr-4"
                    id="confirm-delete-btn">
                    ยืนยัน
                </button>
                <button
                    class="px-6 py-3 bg-gray-600 text-white text-lg font-semibold rounded-lg hover:bg-gray-700 transition duration-300"
                    id="cancel-delete-btn">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>
    <!-- Success Message Modal -->
    <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="success-modal">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div
                    class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        </path>
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">
                ลบสำเร็จ!
            </h2>
            <p class="text-gray-700 text-lg mt-4" id="success-message">
                ลบประกาศ
            </p>
            <button
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300"
                id="success-confirm-btn">
                OK
            </button>
        </div>
    </div>

    <!-- Error Message Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                    <svg class="w-12 h-12 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด!</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message"></p>
            <button onclick="closeModal('error-modal')"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>
    <script>
        // Function สำหรับแสดง Modal Error
            function showErrorModal(message) {
                const errorMessage = document.getElementById('error-message');
                if (errorMessage) errorMessage.textContent = message;
                const errorModal = document.getElementById('error-modal');
                if (errorModal) errorModal.classList.remove('hidden');
            }

            // Function ปิด Modal ทั่วไป
            function closeModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) modal.classList.add('hidden');
            }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 announcement-detail.js loaded and DOM ready!');

            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    title: 'หัวข้อประกาศ',
                    date: 'วันที่ประกาศ',
                    description: 'รายละเอียดประกาศ',
                },
                english: {
                    title: 'Announcement Title',
                    date: 'Announcement Date',
                    description: 'Announcement Description',
                }
            };

            const announcementTitle = document.getElementById('announcementTitle');
            const announcementDescription = document.getElementById('announcementDescription');
            const announcementImage = document.getElementById('announcementImage');
            const announcementTitleDetail = document.getElementById('announcementTitleDetail');
            const announcementDate = document.getElementById('announcementDate');
            const announcementBranch = document.getElementById('announcementBranch');

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];
                if (announcementTitle) announcementTitle.textContent = langData.title;
                if (announcementDescription) announcementDescription.textContent = langData.description;
                // Toggle active state
                if (lang === 'thai') {
                    langThai?.classList.add('active');
                    langEnglish?.classList.remove('active');
                } else {
                    langEnglish?.classList.add('active');
                    langThai?.classList.remove('active');
                }
                localStorage.setItem('selectedLanguage', lang);
            }

            if (langThai && langEnglish) {
                langThai.addEventListener('click', () => {
                    currentLang = 'thai';
                    updateContent(currentLang);
                });
                langEnglish.addEventListener('click', () => {
                    currentLang = 'english';
                    updateContent(currentLang);
                });
            }

            // Initialize content
            updateContent(currentLang);

            function arrayBufferToBase64(buffer) {
                if (!buffer || !buffer.length) return '';
                const binary = buffer.map((b) => String.fromCharCode(b)).join('');
                return window.btoa(binary);
            }

            // Fetch and render announcement details
            function fetchAnnouncementDetails() {
                const urlParams = new URLSearchParams(window.location.search);
                const announcementId = urlParams.get('id');
                if (!announcementId) {
                    console.error('❌ No announcement ID found in URL');
                    return;
                }
                console.log(`🔄 Fetching details for announcement ID: ${announcementId}`);
                fetch(`http://localhost:3000/api/tbm/announcements/${announcementId}`)
                    .then(res => {
                        console.log('📡 API Response:', res);
                        if (!res.ok) throw new Error(`❌ Failed to fetch. Status: ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        console.log('📦 Data:', data);
                        if (announcementTitle) announcementTitle.textContent = data.title || '';
                        if (announcementDescription) announcementDescription.textContent = data.description || '';
                        if (announcementTitleDetail) announcementTitleDetail.textContent = data.title || '';
                        if (announcementBranch) announcementBranch.textContent = data.branch_name || '';
                        if (announcementDate) announcementDate.innerHTML = `<i class="fas fa-calendar-alt"></i> ${new Date(data.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })}`;

                        let imageUrl = 'https://placehold.co/600x400?text=No+Image';
                        if (data.image?.data && Array.isArray(data.image.data)) {
                            try {
                                imageUrl = `data:image/jpeg;base64,${arrayBufferToBase64(data.image.data)}`;
                                console.log(`🖼️ Converted image for announcement ID: ${announcementId}`);
                            } catch (e) {
                                console.warn(`⚠️ Image conversion failed for announcement ID: ${announcementId}`, e);
                            }
                        }
                        if (announcementImage) announcementImage.src = imageUrl;
                    })
                    .catch(err => {
                        console.error('🚨 Error fetching announcement details:', err);
                    });
            }

            fetchAnnouncementDetails();

            // Add event listeners only if elements exist
            const modifyButton = document.getElementById('modifyButton');
            if (modifyButton) {
                modifyButton.addEventListener('click', () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const announcementId = urlParams.get('id');
                    if (announcementId) {
                        window.location.href = `announcement-modify.html?id=${announcementId}`;
                    } else {
                        console.error('❌ No announcement ID found in URL');
                    }
                });
            }

            const deleteButton = document.getElementById('deleteButton');
            if (deleteButton) {
                deleteButton.addEventListener('click', () => {
                    const deleteModal = document.getElementById('delete-modal');
                    if (deleteModal) deleteModal.classList.remove('hidden');
                });
            }

            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            if (confirmDeleteBtn) {
                confirmDeleteBtn.addEventListener('click', async () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const announcementId = urlParams.get('id');
                    const token = localStorage.getItem('token');

                    try {
                        const response = await fetch(`http://localhost:3000/api/tbm/announcements/${announcementId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        });

                        if (response.ok) {
                            const deleteModal = document.getElementById('delete-modal');
                            if (deleteModal) deleteModal.classList.add('hidden');
                            showSuccessModal('ลบประกาศสำเร็จ');
                        } else {
                            showErrorModal('ลบประกาศไม่สำเร็จ');
                        }
                    } catch (error) {
                        console.error('Error deleting announcement:', error);
                        showErrorModal('เกิดข้อผิดพลาดในการลบประกาศ');
                    }
                });
            }

            const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            if (cancelDeleteBtn) {
                cancelDeleteBtn.addEventListener('click', () => {
                    const deleteModal = document.getElementById('delete-modal');
                    if (deleteModal) deleteModal.classList.add('hidden');
                });
            }

            const backButton = document.getElementById('backButton');
            if (backButton) {
                backButton.addEventListener('click', () => {
                    window.history.back();
                });
            }

            const successConfirmBtn = document.getElementById('success-confirm-btn');
            if (successConfirmBtn) {
                successConfirmBtn.addEventListener('click', () => {
                    const successModal = document.getElementById('success-modal');
                    if (successModal) successModal.classList.add('hidden');
                    window.location.href = 'homepage.html';
                });
            }

            function showSuccessModal(message) {
                const successMessage = document.getElementById('success-message');
                if (successMessage) successMessage.textContent = message;
                const successModal = document.getElementById('success-modal');
                if (successModal) successModal.classList.remove('hidden');
            }
        });
    </script>
    <script src="navbar.js">
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js">
    </script>
    <script src="notification.js">
    </script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>

            <h1 class="text-4xl font-bold mb-5">จัดการชุมชน</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg w-full max-w-3xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">การตั้งค่าชุมชน</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="default-time-token">ค่าเริ่มต้นของ
                        Time Token เมื่อสร้างสมาชิก</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="default-time-token" type="number" placeholder="ค่าเริ่มต้นของ Time Token" value="100" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="exchange-rate">อัตราแลกเปลี่ยน Time
                        Token</label>
                    <select
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="exchange-rate" onchange="handleExchangeRateChange()">
                    </select>
                </div>
                <div id="new-exchange-rate-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2"
                        for="new-exchange-rate">เพิ่มอัตราแลกเปลี่ยนใหม่</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="new-exchange-rate" type="text" placeholder="อัตราแลกเปลี่ยนใหม่" />
                </div>
                <div id="minimum-time-token-field" class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2"
                        for="minimum-time-token">เวลาขั้นต่ำที่จะแลกเปลี่ยนหลังทำกิจกรรมสำเร็จ</label>
                    <div class="flex space-x-2">
                        <div class="flex items-center">
                            <input
                                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="minimum-time-token-hours" type="number" min="0" max="24" placeholder="ชั่วโมง" />
                            <span class="ml-2 text-gray-700">ชั่วโมง</span>
                        </div>
                        <div class="flex items-center">
                            <input
                                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="minimum-time-token-minutes" type="number" min="0" max="60" placeholder="นาที" />
                            <span class="ml-2 text-gray-700">นาที</span>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="branch-name">ชื่อสาขา</label>
                    <select
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="branch-name" onchange="handleBranchChange()">
                    </select>
                </div>
                <div id="new-branch-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="new-branch">เพิ่มสาขาใหม่</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="new-branch" type="text" placeholder="สาขาใหม่" />
                </div>
                <div class="flex items-center justify-center">
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="button" onclick="saveConfig()">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">แก้ไขสำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4" id="success-message">แก้ไขประกาศสำเร็จ</p>
            <button id="success-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>
    
    <!-- Error Message Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                    <svg class="w-12 h-12 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด!</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message"></p>
            <button id="error-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>

    <script>
        let defaultTimeToken = 100;
        let exchangeRates = [];
        let defaultExchangeRateId = null;
        let branchId = null;
        let branchName = '';
        let branches = [];
        let userRole = '';
        let minimumTimeTokenHours = 0;
        let minimumTimeTokenMinutes = 0;

        function showSuccessModal(message) {
                document.getElementById('success-message').textContent = message;
                document.getElementById('success-modal').classList.remove('hidden');
            }

            function showErrorModal(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-modal').classList.remove('hidden');
            }

            // ปิด Modal เมื่อคลิกปุ่มยืนยัน
            document.getElementById('success-confirm-btn').addEventListener('click', () => {
                document.getElementById('success-modal').classList.add('hidden');
            });

            document.getElementById('error-confirm-btn').addEventListener('click', () => {
                document.getElementById('error-modal').classList.add('hidden');
            });

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                    defaultExchangeRateId = data.default_exchange_rate_id;
                    minimumTimeTokenHours = data.minimum_time_token_hours || minimumTimeTokenHours;
                    minimumTimeTokenMinutes = data.minimum_time_token_minutes || minimumTimeTokenMinutes;
                    await fetchExchangeRates();
                    await fetchBranches();
                    renderConfig();
                } else {
                    console.error('Expected data but got:', data);
                    showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                exchangeRates = data;
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลอัตราแลกเปลี่ยน');
            }
        }

        async function fetchBranches() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/branches', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                branches = data;
            } catch (error) {
                console.error('Error fetching branches:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลสาขา');
            }
        }

        function renderConfig() {
            document.getElementById('default-time-token').value = defaultTimeToken;
            document.getElementById('minimum-time-token-hours').value = minimumTimeTokenHours;
            document.getElementById('minimum-time-token-minutes').value = minimumTimeTokenMinutes;
            const exchangeRateSelect = document.getElementById('exchange-rate');
            exchangeRateSelect.innerHTML = '';
            exchangeRates.forEach(rate => {
                const option = document.createElement('option');
                option.value = rate.rate_id;
                option.textContent = rate.description;
                if (rate.rate_id === defaultExchangeRateId) {
                    option.selected = true;
                }
                exchangeRateSelect.appendChild(option);
            });
            const newOption = document.createElement('option');
            newOption.value = 'new';
            newOption.textContent = 'เพิ่มอัตราแลกเปลี่ยนใหม่';
            exchangeRateSelect.appendChild(newOption);

            const branchSelect = document.getElementById('branch-name');
            branchSelect.innerHTML = '';
            branches.forEach(branch => {
                const option = document.createElement('option');
                option.value = branch.branch_id;
                option.textContent = branch.branch_name;
                if (branch.branch_id === branchId) {
                    option.selected = true;
                }
                branchSelect.appendChild(option);
            });
            if (userRole === 'Admin') {
                const newBranchOption = document.createElement('option');
                newBranchOption.value = 'new';
                newBranchOption.textContent = 'เพิ่มสาขาใหม่';
                branchSelect.appendChild(newBranchOption);
            }

            // Show minimum time token field if the selected exchange rate is "1 โทเคนเวลา ต่อ 1 ชั่วโมง"
            if (exchangeRateSelect.options[exchangeRateSelect.selectedIndex].text === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                document.getElementById('minimum-time-token-field').classList.remove('hidden');
            }
        }

        function handleExchangeRateChange() {
            const exchangeRateSelect = document.getElementById('exchange-rate');
            const newExchangeRateField = document.getElementById('new-exchange-rate-field');
            const minimumTimeTokenField = document.getElementById('minimum-time-token-field');
            if (exchangeRateSelect.value === 'new') {
                newExchangeRateField.classList.remove('hidden');
                minimumTimeTokenField.classList.add('hidden');
            } else if (exchangeRateSelect.options[exchangeRateSelect.selectedIndex].text === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                minimumTimeTokenField.classList.remove('hidden');
                newExchangeRateField.classList.add('hidden');
            } else {
                newExchangeRateField.classList.add('hidden');
                minimumTimeTokenField.classList.add('hidden');
            }
        }

        function handleBranchChange() {
            const branchSelect = document.getElementById('branch-name');
            const newBranchField = document.getElementById('new-branch-field');
            if (branchSelect.value === 'new') {
                newBranchField.classList.remove('hidden');
            } else {
                newBranchField.classList.add('hidden');
            }
        }

        async function saveConfig() {
            const newDefaultTimeToken = parseInt(document.getElementById('default-time-token').value, 10);
            const newExchangeRate = document.getElementById('exchange-rate').value;
            const newExchangeRateDescription = document.getElementById('new-exchange-rate').value;
            const newBranch = document.getElementById('branch-name').value;
            const newBranchName = document.getElementById('new-branch').value;
            const minimumTimeTokenHours = parseInt(document.getElementById('minimum-time-token-hours').value, 10);
            const minimumTimeTokenMinutes = parseInt(document.getElementById('minimum-time-token-minutes').value, 10);

            let defaultExchangeRateId = parseInt(newExchangeRate, 10);
            let branchId = parseInt(newBranch, 10);

            // 🛡️ Validation ใหม่ (เพิ่มตรงนี้)
            if (isNaN(minimumTimeTokenHours) || minimumTimeTokenHours < 0 || minimumTimeTokenHours > 24) {
                showErrorModal('กรุณากรอกจำนวนชั่วโมงระหว่าง 0 ถึง 24 เท่านั้น');
                return;
            }
            if (isNaN(minimumTimeTokenMinutes) || minimumTimeTokenMinutes < 0 || minimumTimeTokenMinutes > 60) {
                showErrorModal('กรุณากรอกจำนวนนาทีระหว่าง 0 ถึง 60 เท่านั้น');
                return;
            }

            if (newExchangeRate === 'new' && newExchangeRateDescription) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ description: newExchangeRateDescription })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        defaultExchangeRateId = data.rate_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        showErrorModal('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new exchange rate:', error);
                    showErrorModal('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                    return;
                }
            }

            if (newBranch === 'new' && newBranchName) {
                if (userRole !== 'Admin') {
                    showErrorModal('คุณไม่มีสิทธิ์เพิ่มสาขาใหม่');
                    return;
                }
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/branches', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ branch_name: newBranchName })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        branchId = data.branch_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        showErrorModal('เกิดข้อผิดพลาดในการเพิ่มสาขาใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new branch:', error);
                    showErrorModal('เกิดข้อผิดพลาดในการเพิ่มสาขาใหม่');
                    return;
                }
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/community-config`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        default_time_token: newDefaultTimeToken,
                        default_exchange_rate_id: defaultExchangeRateId,
                        branch_name: newBranchName || null,
                        branch_id: branchId,
                        minimum_time_token_hours: minimumTimeTokenHours || 0,
                        minimum_time_token_minutes: minimumTimeTokenMinutes || 0
                    })
                });

                if (response.ok) {
                    showSuccessModal('การตั้งค่าชุมชนถูกบันทึกเรียบร้อยแล้ว');
                    window.dispatchNotificationRefresh?.();
                    fetchCommunityConfig();
                } else {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    showErrorModal('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error saving community config:', error);
                showErrorModal('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                console.error('No token found. Redirecting to login page.');
                window.location.href = 'login.html';
                return;
            }

            // Fetch user profile information
            fetch('http://localhost:3000/api/tbm/auth/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    branchId = data.branch_id;
                    branchName = data.branch_name;
                    userRole = data.role;
                    document.getElementById('branch-name').value = branchName;
                })
                .catch(error => {
                    console.error('Error:', error);
                    showErrorModal('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                });

            // Initialize the sidebar
            fetchCommunityConfig();
        });

                function logout() {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            </script>
    <script src="navbar.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="notification.js"></script>
    </body>
    
    </html>

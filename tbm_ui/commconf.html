<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let defaultTimeToken = 100;
        let exchangeRates = [];
        let defaultExchangeRateId = null;

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                    defaultExchangeRateId = data.default_exchange_rate_id;
                    await fetchExchangeRates();
                    renderConfig();
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                exchangeRates = data;
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลอัตราแลกเปลี่ยน');
            }
        }

        function renderConfig() {
            document.getElementById('default-time-token').value = defaultTimeToken;
            const exchangeRateSelect = document.getElementById('exchange-rate');
            exchangeRateSelect.innerHTML = '';
            exchangeRates.forEach(rate => {
                const option = document.createElement('option');
                option.value = rate.rate_id;
                option.textContent = rate.description;
                if (rate.rate_id === defaultExchangeRateId) {
                    option.selected = true;
                }
                exchangeRateSelect.appendChild(option);
            });
            const newOption = document.createElement('option');
            newOption.value = 'new';
            newOption.textContent = 'เพิ่มอัตราแลกเปลี่ยนใหม่';
            exchangeRateSelect.appendChild(newOption);
        }

        function handleExchangeRateChange() {
            const exchangeRateSelect = document.getElementById('exchange-rate');
            const newExchangeRateField = document.getElementById('new-exchange-rate-field');
            if (exchangeRateSelect.value === 'new') {
                newExchangeRateField.classList.remove('hidden');
            } else {
                newExchangeRateField.classList.add('hidden');
            }
        }

        async function saveConfig() {
            const newDefaultTimeToken = parseInt(document.getElementById('default-time-token').value, 10);
            const newExchangeRate = document.getElementById('exchange-rate').value;
            const newExchangeRateDescription = document.getElementById('new-exchange-rate').value;

            let defaultExchangeRateId = parseInt(newExchangeRate, 10);

            if (newExchangeRate === 'new' && newExchangeRateDescription) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ description: newExchangeRateDescription })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        defaultExchangeRateId = data.rate_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new exchange rate:', error);
                    alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                    return;
                }
            }

            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        default_time_token: newDefaultTimeToken,
                        default_exchange_rate_id: defaultExchangeRateId
                    })
                });

                if (response.ok) {
                    alert('การตั้งค่าชุมชนถูกบันทึกเรียบร้อยแล้ว');
                    fetchCommunityConfig();
                } else {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error saving community config:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {

    <script src="selected-language.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    pageTitle: 'จัดการชุมชน - Time Bank',
                    mainHeading: 'จัดการชุมชน',
                    configHeading: 'การตั้งค่าชุมชน',
                    defaultTimeTokenLabel: 'ค่าเริ่มต้นของ Time Token เมื่อสร้างสมาชิก',
                    exchangeRateLabel: 'อัตราแลกเปลี่ยน Time Token',
                    addExchangeRateLabel: 'เพิ่มอัตราแลกเปลี่ยนใหม่',
                    saveButton: 'บันทึกการตั้งค่า',
                    nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],

                },
                english: {
                    pageTitle: 'Community Management - Time Bank',
                    mainHeading: 'Community Management',
                    configHeading: 'Community Configuration',
                    defaultTimeTokenLabel: 'Default Time Token for New Members',
                    exchangeRateLabel: 'Time Token Exchange Rate',
                    addExchangeRateLabel: 'Add New Exchange Rate',
                    saveButton: 'Save Configuration',
                    nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],

                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            const updateContent = (lang) => {
                const langData = translations[lang];

                // Update page title
                document.title = langData.pageTitle;

                // Update main heading and subheadings
                document.querySelector('h1').textContent = langData.mainHeading;
                document.querySelector('h2').textContent = langData.configHeading;

                // Update form labels
                document.querySelector('label[for="default-time-token"]').textContent = langData.defaultTimeTokenLabel;
                document.querySelector('label[for="exchange-rate"]').textContent = langData.exchangeRateLabel;
                document.querySelector('label[for="new-exchange-rate"]').textContent = langData.addExchangeRateLabel;

                // Update save button text
                document.querySelector('button[onclick="saveConfig()"]').textContent = langData.saveButton;

                // Update navigation bar
                const navLinks = document.querySelectorAll('nav ul li a');
                langData.nav.forEach((text, index) => {
                    if (navLinks[index]) {
                        const icon = navLinks[index].querySelector('i');
                        navLinks[index].innerHTML = '';
                        if (icon) navLinks[index].appendChild(icon);
                        navLinks[index].appendChild(document.createTextNode(text));
                    }
                });

                // Highlight the active language toggle
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }
            };

            // Language toggle event listeners
            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            // Initialize content on page load
            updateContent(currentLang);

            // Fetch community configuration and initialize other page data

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" id="lang-th" data-lang="th">
                        ภาษาไทย
                    </span>
                    <span class="toggle-label" id="lang-en" data-lang="en">
                        English
                    </span>
                </div>
            </div>

            <h1 class="text-4xl font-bold mb-5">จัดการชุมชน</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">การตั้งค่าชุมชน</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="default-time-token">ค่าเริ่มต้นของ
                        Time Token เมื่อสร้างสมาชิก</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="default-time-token" type="number" placeholder="ค่าเริ่มต้นของ Time Token" value="100" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="exchange-rate">อัตราแลกเปลี่ยน Time
                        Token</label>
                    <select
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="exchange-rate" onchange="handleExchangeRateChange()">
                    </select>
                </div>
                <div id="new-exchange-rate-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2"
                        for="new-exchange-rate">เพิ่มอัตราแลกเปลี่ยนใหม่</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="new-exchange-rate" type="text" placeholder="อัตราแลกเปลี่ยนใหม่" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="branch-name">ชื่อสาขา</label>
                    <select
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="branch-name" onchange="handleBranchChange()">
                    </select>
                </div>
                <div id="new-branch-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="new-branch">เพิ่มสาขาใหม่</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="new-branch" type="text" placeholder="สาขาใหม่" />
                </div>
                <div class="flex items-center justify-center">
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="button" onclick="saveConfig()">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>

    <script>
        let defaultTimeToken = 100;
        let exchangeRates = [];
        let defaultExchangeRateId = null;
        let branchId = null;
        let branchName = '';
        let branches = [];
        let userRole = '';

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                    defaultExchangeRateId = data.default_exchange_rate_id;
                    await fetchExchangeRates();
                    await fetchBranches();
                    renderConfig();
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                exchangeRates = data;
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลอัตราแลกเปลี่ยน');
            }
        }

        async function fetchBranches() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/branches', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                branches = data;
            } catch (error) {
                console.error('Error fetching branches:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลสาขา');
            }
        }

        function renderConfig() {
            document.getElementById('default-time-token').value = defaultTimeToken;
            const exchangeRateSelect = document.getElementById('exchange-rate');
            exchangeRateSelect.innerHTML = '';
            exchangeRates.forEach(rate => {
                const option = document.createElement('option');
                option.value = rate.rate_id;
                option.textContent = rate.description;
                if (rate.rate_id === defaultExchangeRateId) {
                    option.selected = true;
                }
                exchangeRateSelect.appendChild(option);
            });
            const newOption = document.createElement('option');
            newOption.value = 'new';
            newOption.textContent = 'เพิ่มอัตราแลกเปลี่ยนใหม่';
            exchangeRateSelect.appendChild(newOption);

            const branchSelect = document.getElementById('branch-name');
            branchSelect.innerHTML = '';
            branches.forEach(branch => {
                const option = document.createElement('option');
                option.value = branch.branch_id;
                option.textContent = branch.branch_name;
                if (branch.branch_id === branchId) {
                    option.selected = true;
                }
                branchSelect.appendChild(option);
            });
            if (userRole === 'Admin') {
                const newBranchOption = document.createElement('option');
                newBranchOption.value = 'new';
                newBranchOption.textContent = 'เพิ่มสาขาใหม่';
                branchSelect.appendChild(newBranchOption);
            }
        }

        function handleExchangeRateChange() {
            const exchangeRateSelect = document.getElementById('exchange-rate');
            const newExchangeRateField = document.getElementById('new-exchange-rate-field');
            if (exchangeRateSelect.value === 'new') {
                newExchangeRateField.classList.remove('hidden');
            } else {
                newExchangeRateField.classList.add('hidden');
            }
        }

        function handleBranchChange() {
            const branchSelect = document.getElementById('branch-name');
            const newBranchField = document.getElementById('new-branch-field');
            if (branchSelect.value === 'new') {
                newBranchField.classList.remove('hidden');
            } else {
                newBranchField.classList.add('hidden');
            }
        }

        async function saveConfig() {
            const newDefaultTimeToken = parseInt(document.getElementById('default-time-token').value, 10);
            const newExchangeRate = document.getElementById('exchange-rate').value;
            const newExchangeRateDescription = document.getElementById('new-exchange-rate').value;
            const newBranch = document.getElementById('branch-name').value;
            const newBranchName = document.getElementById('new-branch').value;

            let defaultExchangeRateId = parseInt(newExchangeRate, 10);
            let branchId = parseInt(newBranch, 10);

            if (newExchangeRate === 'new' && newExchangeRateDescription) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/exchange-rates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ description: newExchangeRateDescription })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        defaultExchangeRateId = data.rate_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new exchange rate:', error);
                    alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                    return;
                }
            }

            if (newBranch === 'new' && newBranchName) {
                if (userRole !== 'Admin') {
                    alert('คุณไม่มีสิทธิ์เพิ่มสาขาใหม่');
                    return;
                }
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/branches', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ branch_name: newBranchName })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        branchId = data.branch_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        alert('เกิดข้อผิดพลาดในการเพิ่มสาขาใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new branch:', error);
                    alert('เกิดข้อผิดพลาดในการเพิ่มสาขาใหม่');
                    return;
                }
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/branches/${branchId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        branch_name: newBranchName
                    })
                });

                if (response.ok) {
                    alert('การตั้งค่าชุมชนถูกบันทึกเรียบร้อยแล้ว');
                    fetchCommunityConfig();
                } else {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error saving community config:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                console.error('No token found. Redirecting to login page.');
                window.location.href = 'login.html';
                return;
            }

            // Fetch user profile information
            fetch('http://localhost:3000/api/tbm/auth/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    branchId = data.branch_id;
                    branchName = data.branch_name;
                    userRole = data.role;
                    document.getElementById('branch-name').value = branchName;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });

            // Initialize the sidebar
            checkLoginStatus();
            fetchCommunityConfig();
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
    <script src="navbar.js"></script>
</body>

</html>

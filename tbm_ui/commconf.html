<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let defaultTimeToken = 100;
        let exchangeRates = [];
        let defaultExchangeRateId = null;

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                    defaultExchangeRateId = data.default_exchange_rate_id;
                    await fetchExchangeRates();
                    renderConfig();
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('http://localhost:3000/api/exchange-rates', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                exchangeRates = data;
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลอัตราแลกเปลี่ยน');
            }
        }

        function renderConfig() {
            document.getElementById('default-time-token').value = defaultTimeToken;
            const exchangeRateSelect = document.getElementById('exchange-rate');
            exchangeRateSelect.innerHTML = '';
            exchangeRates.forEach(rate => {
                const option = document.createElement('option');
                option.value = rate.rate_id;
                option.textContent = rate.description;
                if (rate.rate_id === defaultExchangeRateId) {
                    option.selected = true;
                }
                exchangeRateSelect.appendChild(option);
            });
            const newOption = document.createElement('option');
            newOption.value = 'new';
            newOption.textContent = 'เพิ่มอัตราแลกเปลี่ยนใหม่';
            exchangeRateSelect.appendChild(newOption);
        }

        function handleExchangeRateChange() {
            const exchangeRateSelect = document.getElementById('exchange-rate');
            const newExchangeRateField = document.getElementById('new-exchange-rate-field');
            if (exchangeRateSelect.value === 'new') {
                newExchangeRateField.classList.remove('hidden');
            } else {
                newExchangeRateField.classList.add('hidden');
            }
        }

        async function saveConfig() {
            const newDefaultTimeToken = parseInt(document.getElementById('default-time-token').value, 10);
            const newExchangeRate = document.getElementById('exchange-rate').value;
            const newExchangeRateDescription = document.getElementById('new-exchange-rate').value;

            let defaultExchangeRateId = parseInt(newExchangeRate, 10);

            if (newExchangeRate === 'new' && newExchangeRateDescription) {
                try {
                    const response = await fetch('http://localhost:3000/api/exchange-rates', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ description: newExchangeRateDescription })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        defaultExchangeRateId = data.rate_id;
                    } else {
                        const errorData = await response.json();
                        console.error('Error response from server:', errorData);
                        alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                        return;
                    }
                } catch (error) {
                    console.error('Error adding new exchange rate:', error);
                    alert('เกิดข้อผิดพลาดในการเพิ่มอัตราแลกเปลี่ยนใหม่');
                    return;
                }
            }

            try {
                const response = await fetch('http://localhost:3000/api/community-config', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        default_time_token: newDefaultTimeToken,
                        default_exchange_rate_id: defaultExchangeRateId
                    })
                });

                if (response.ok) {
                    alert('การตั้งค่าชุมชนถูกบันทึกเรียบร้อยแล้ว');
                    fetchCommunityConfig();
                } else {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error saving community config:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกการตั้งค่าชุมชน');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchCommunityConfig);
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">จัดการชุมชน</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">การตั้งค่าชุมชน</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="default-time-token">ค่าเริ่มต้นของ
                        Time Token เมื่อสร้างสมาชิก</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="default-time-token" type="number" placeholder="ค่าเริ่มต้นของ Time Token" value="100" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="exchange-rate">อัตราแลกเปลี่ยน Time
                        Token</label>
                    <select
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="exchange-rate" onchange="handleExchangeRateChange()">
                        <!-- Options will be dynamically inserted here -->
                    </select>
                </div>
                <div id="new-exchange-rate-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2"
                        for="new-exchange-rate">เพิ่มอัตราแลกเปลี่ยนใหม่</label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="new-exchange-rate" type="text" placeholder="อัตราแลกเปลี่ยนใหม่" />
                </div>
                <div class="flex items-center justify-center">
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="button" onclick="saveConfig()">บันทึกการตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

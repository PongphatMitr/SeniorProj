<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>อนุมัติกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let participants = [];

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const activity = await response.json();

                if (activity) {
                    document.getElementById('activity-title').innerText = activity.title;
                    document.getElementById('activity-description').innerText = activity.description;
                    document.getElementById('activity-location').innerText = activity.location;
                    document.getElementById('activity-date').innerText = new Date(activity.start_date).toLocaleDateString();
                    document.getElementById('activity-start-time').innerText = activity.start_time;
                    document.getElementById('activity-end-time').innerText = activity.end_time;
                    document.getElementById('activity-max-participants').innerText = activity.max_participants;
                    document.getElementById('activity-requester-name').innerText = activity.requester_name;
                    document.getElementById('activity-status').innerText = activity.status;

                    fetchParticipants(activityId);
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        async function fetchParticipants(activityId) {
            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}/participants`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                participants = await response.json();

                if (Array.isArray(participants)) {
                    renderParticipants(participants);
                } else {
                    console.error('Expected an array but got:', participants);
                }
            } catch (error) {
                console.error('Error fetching participants:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้เข้าร่วม');
            }
        }

        function renderParticipants(data) {
            const tbody = document.getElementById('participants-tbody');
            tbody.innerHTML = '';
            data.forEach((participant, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td class="py-2 px-4 border-b border-gray-200">${participant.name}</td>
                    <td class="py-2 px-4 border-b border-gray-200">${participant.email}</td>
                    <td class="py-2 px-4 border-b border-gray-200">
                        <button class="bg-red-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline" onclick="removeParticipant(${index})">ลบ</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function searchParticipants() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredParticipants = participants.filter(participant =>
                participant.name.toLowerCase().includes(searchTerm) ||
                participant.email.toLowerCase().includes(searchTerm)
            );
            renderParticipants(filteredParticipants);
        }

        function removeParticipant(index) {
            participants.splice(index, 1);
            renderParticipants(participants);
        }

        async function approveActivity() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert('กิจกรรมได้รับการอนุมัติเรียบร้อยแล้ว');
                window.location.href = 'activity.html'; // Redirect to the activity management page
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการอนุมัติกิจกรรม');
            }
        }

        async function rejectActivity() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}/reject`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert('กิจกรรมถูกปฏิเสธเรียบร้อยแล้ว');
                window.location.href = 'activity.html'; // Redirect to the activity management page
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการปฏิเสธกิจกรรม');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchActivityDetails);
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/6t1MaHbBbTIgDpuvsgqNCRgI8YA5CpIPUb3TeH0Wp2q4XafTA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                อนุมัติกิจกรรม
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h2 class="text-4xl font-bold mb-6 text-center text-blue-700" id="activity-title">
                            <!-- Activity Title will be inserted here -->
                        </h2>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                รายละเอียด:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-description">
                                <!-- Activity Description will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                สถานที่จัด:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-location">
                                <!-- Activity Location will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                วันที่:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-date">
                                <!-- Activity Date will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                เวลาเริ่มต้น:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-start-time">
                                <!-- Activity Start Time will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                เวลาสิ้นสุด:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-end-time">
                                <!-- Activity End Time will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                จำนวนคน:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-max-participants">
                                <!-- Activity Max Participants will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                ชื่อผู้ขอบริการ:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-requester-name">
                                <!-- Activity Requester Name will be inserted here -->
                            </p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-lg font-bold mb-2">
                                สถานะ:
                            </label>
                            <p class="text-gray-700 text-lg" id="activity-status">
                                <!-- Activity Status will be inserted here -->
                            </p>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-4 text-blue-700">
                            รายชื่อผู้เข้าร่วม
                        </h3>
                        <div class="mb-4 flex items-center">
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" id="search-input" placeholder="ค้นหาผู้เข้าร่วม"
                                oninput="searchParticipants()" />
                        </div>
                        <div class="overflow-x-auto">
                            <div class="table-responsive-sm">
                                <table aria-busy="false" aria-colcount="3"
                                    class="table b-table b-table-stacked-md w-full" role="table">
                                    <thead class="bg-gray-100" role="rowgroup">
                                        <tr role="row">
                                            <th aria-colindex="1"
                                                class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                                role="columnheader" scope="col">
                                                ชื่อ
                                            </th>
                                            <th aria-colindex="2"
                                                class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                                role="columnheader" scope="col">
                                                อีเมล
                                            </th>
                                            <th aria-colindex="3"
                                                class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                                role="columnheader" scope="col">
                                                การจัดการ
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody id="participants-tbody" role="rowgroup">
                                        <!-- Participants will be dynamically inserted here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-center mt-6">
                    <button
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                        onclick="window.history.back()" type="button">
                        ย้อนกลับ
                    </button>
                    <button
                        class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                        onclick="approveActivity()" type="button">
                        อนุมัติ
                    </button>
                    <button
                        class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                        onclick="rejectActivity()" type="button">
                        ปฏิเสธ
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

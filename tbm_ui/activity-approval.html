<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>อนุมัติกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script src="navbar.js"></script>
    <script>
        let globalUserId = null;
        let activityId = null;
        let minimumTimeTokenHours = null;
        let minimumTimeTokenMinutes = null;

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            activityId = urlParams.get('id');
            if (!activityId) {
                showMessage('ไม่พบรหัสกิจกรรม', true);
                return;
            }
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`HTTP error! status: ${response.status}, response: ${errorText}`);
                    if (response.status === 404) {
                        showMessage('ไม่พบกิจกรรมที่ระบุ', true);
                    } else if (response.status === 400 && errorText.includes('Invalid token')) {
                        showMessage('Invalid token. กำลังกลับไปหน้าเข้าสู่ระบบ', true);
                        localStorage.removeItem('token');
                        setTimeout(() => window.location.href = 'login.html', 2000);
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const activity = await response.json();
                if (activity) {
                    document.getElementById('activity-title').innerText = activity.title;
                    document.getElementById('activity-description').innerText = activity.description;
                    document.getElementById('activity-location').innerText = activity.location;
                    document.getElementById('activity-date').innerText = new Date(activity.start_date).toLocaleDateString();
                    document.getElementById('activity-end-date').innerText = new Date(activity.end_date).toLocaleDateString();
                    document.getElementById('activity-start-time').innerText = activity.start_time;
                    document.getElementById('activity-end-time').innerText = activity.end_time;
                    document.getElementById('activity-time-tokens').innerText = activity.time_tokens_required;
                    document.getElementById('activity-requester-name').innerText = activity.requester_name;

                    // Fetch participants
                    const participantsResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!participantsResponse.ok) {
                        const errorText = await participantsResponse.text();
                        console.error(`HTTP error! status: ${participantsResponse.status}, response: ${errorText}`);
                        throw new Error(`HTTP error! status: ${participantsResponse.status}`);
                    }
                    const participants = await participantsResponse.json();
                    const participantsCount = Array.isArray(participants) ? participants.length : 0;
                    document.getElementById('activity-max-participants').innerText = `${participantsCount}/${activity.max_participants}`;
                    document.getElementById('activity-status').innerText = activity.status;

                    // Handle required skills display
                    displayRequiredSkills(activity.required_skills);

                    // Calculate and display time difference
                    calculateTimeDifference();
                } else {
                    showMessage('ไม่พบรายละเอียดกิจกรรม', true);
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                showMessage('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม', true);
            }
        }

        function displayRequiredSkills(requiredSkills) {
            const skillsContainer = document.getElementById('selected-skills-list');
            skillsContainer.innerHTML = ''; // Clear previous content
            try {
                // Ensure requiredSkills is an integer (skill_id) and fetch skill details from API
                if (!requiredSkills || isNaN(requiredSkills)) {
                    skillsContainer.innerHTML = '<li class="text-gray-500">ไม่มีทักษะที่ระบุ</li>';
                    return;
                }
                // Fetch skill details using the skill_id
                fetch(`http://localhost:3000/api/tbm/skills/${requiredSkills}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                })
                    .then(response => response.json())
                    .then(skill => {
                        if (!skill || !skill.name || !skill.category) {
                            skillsContainer.innerHTML = '<li class="text-gray-500">ไม่พบข้อมูลทักษะ</li>';
                            return;
                        }
                        // Create list item with proper spacing
                        const listItem = document.createElement('li');
                        listItem.innerHTML = `
                        <strong class="text-blue-600 text-lg font-semibold">หมวดหมู่:</strong>
                        <span class="mr-4">${skill.category}</span>
                        <strong class="text-green-600 text-lg font-semibold">ทักษะ:</strong>
                        <span>${skill.name}</span>
                    `;
                        skillsContainer.appendChild(listItem);
                    })
                    .catch(error => {
                        console.error('Error fetching skill details:', error);
                        skillsContainer.innerHTML = '<li class="text-red-500">เกิดข้อผิดพลาดในการโหลดทักษะ</li>';
                    });
            } catch (error) {
                console.error('Error parsing required skills:', error);
                skillsContainer.innerHTML = '<li class="text-red-500">เกิดข้อผิดพลาดในการโหลดทักษะ</li>';
            }
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                minimumTimeTokenHours = data.minimum_time_token_hours;
                minimumTimeTokenMinutes = data.minimum_time_token_minutes;
                console.log('Minimum Time Token:', minimumTimeTokenHours, minimumTimeTokenMinutes);
            } catch (error) {
                console.error('Error fetching community config:', error);
                showMessage('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน', true);
            }
        }

        function calculateTimeDifference() {
            const startTime = document.getElementById('activity-start-time').innerText;
            const endTime = document.getElementById('activity-end-time').innerText;
            if (startTime && endTime) {
                const [startHours, startMinutes] = startTime.split(':').map(Number);
                const [endHours, endMinutes] = endTime.split(':').map(Number);
                let startDateTime = new Date();
                startDateTime.setHours(startHours, startMinutes, 0);
                let endDateTime = new Date();
                endDateTime.setHours(endHours, endMinutes, 0);
                let durationInMinutes = (endDateTime - startDateTime) / (1000 * 60);
                if (durationInMinutes < 0) {
                    durationInMinutes += 24 * 60;
                }
                const hours = Math.floor(durationInMinutes / 60);
                const minutes = durationInMinutes % 60;
                const totalDurationInHours = hours + (minutes / 60);
                const timeDifferenceElement = document.getElementById('time-difference');
                timeDifferenceElement.innerText = `${hours} ชั่วโมง ${minutes} นาที`;

                const minimumDurationInHours = minimumTimeTokenHours + (minimumTimeTokenMinutes / 60);
                const minimumTimeElement = document.getElementById('minimum-time');
                minimumTimeElement.innerText = `(ขั้นต่ำ: ${minimumTimeTokenHours} ชั่วโมง ${minimumTimeTokenMinutes} นาที)`;

                if (totalDurationInHours < minimumDurationInHours) {
                    timeDifferenceElement.classList.remove('text-green-600');
                    timeDifferenceElement.classList.add('text-red-600');
                } else {
                    timeDifferenceElement.classList.remove('text-red-600');
                    timeDifferenceElement.classList.add('text-green-600');
                }
            }
        }

        async function approveActivity() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');
            
            showConfirmation('คุณต้องการอนุมัติกิจกรรมนี้ใช่หรือไม่?', async () => {
                try {
                    showLoading("กำลังอนุมัติกิจกรรม..."); // ✅ Show loading right after confirm
        
                    const approveResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/approve`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
        
                    if (!approveResponse.ok) {
                        const errorText = await approveResponse.text();
                        throw new Error(`Approval failed: ${errorText}`);
                    }
        
                    showMessage('กิจกรรมได้รับการอนุมัติและแจกเครดิตเวลาเรียบร้อยแล้ว');
                    setTimeout(() => window.location.href = 'activity.html', 1500);
                } catch (error) {
                    console.error('Error:', error);
                    showMessage('เกิดข้อผิดพลาดในการอนุมัติกิจกรรม', true);
                }
            });
        }
        
        

        async function logTransaction(transactionData) {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/transactions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(transactionData)
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Transaction logging failed: ${errorText}`);
                }
            } catch (error) {
                console.error('Transaction error:', error);
                throw error;
            }
        }
        

        async function rejectActivity() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');
            showConfirmation('คุณต้องการปฏิเสธกิจกรรมนี้ใช่หรือไม่?', async () => {
                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/reject`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Rejection failed: ${errorText}`);
                    }
        
                    showMessage('กิจกรรมถูกปฏิเสธเรียบร้อยแล้ว');
                    setTimeout(() => window.location.href = 'activity.html', 1500);
                } catch (error) {
                    console.error('Error:', error);
                    showMessage('เกิดข้อผิดพลาดในการปฏิเสธกิจกรรม', true);
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchActivityDetails();
            fetchCommunityConfig();
            document.getElementById('participants-button').addEventListener('click', () => {
                const activityId = new URLSearchParams(window.location.search).get('id');
                window.location.href = `activity-details-participant.html?id=${activityId}`;
            });
        });
    </script>
</head>

    <script>
        function showMessage(message, isError = false) {
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('message-title');
            const text = document.getElementById('message-text');
            const icon = document.getElementById('message-icon');
            const iconSvg = document.getElementById('message-icon-svg');
            const iconPath = document.getElementById('message-icon-path');
        
            text.textContent = message;
            modal.classList.remove('hidden');
        
            title.classList.remove('text-red-600', 'text-green-600');
            icon.classList.remove('bg-red-100', 'border-red-500', 'bg-green-100', 'border-green-500');
            iconSvg.classList.remove('text-red-500', 'text-green-500');
        
            if (isError) {
                title.textContent = "เกิดข้อผิดพลาด!";
                title.classList.add('text-red-600');
                icon.classList.add('bg-red-100', 'border-red-500');
                iconSvg.classList.add('text-red-500');
                iconPath.setAttribute("d", "M6 18L18 6M6 6l12 12");
            } else {
                title.textContent = "สำเร็จ!";
                title.classList.add('text-green-600');
                icon.classList.add('bg-green-100', 'border-green-500');
                iconSvg.classList.add('text-green-500');
                iconPath.setAttribute("d", "M5 13l4 4L19 7");
            }

            document.getElementById('confirm-message-btn').style.display = '';
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        
            document.getElementById('confirm-message-btn').onclick = () => {
                modal.classList.add('hidden');
                modal.classList.remove('opacity-100', 'scale-100');
            };
        }
        
        function showConfirmation(message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const text = document.getElementById('confirm-message');
        
            text.textContent = message;
            modal.classList.remove('hidden');
        
            document.getElementById('confirm-yes-btn').onclick = () => {
                modal.classList.add('hidden');
                onConfirm();
            };
        
            document.getElementById('confirm-no-btn').onclick = () => {
                modal.classList.add('hidden');
            };
        }

        document.querySelector(".bg-green-500").onclick = () => {
            approveActivity(); 
        };
        
        
        document.querySelector(".bg-red-500").onclick = () => {
            showConfirmation("คุณต้องการปฏิเสธกิจกรรมนี้ใช่หรือไม่?", () => {
                rejectActivity(); // only runs if confirmed
            });
        };
        
        function showLoading(text = "กำลังดำเนินการ...") {
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('message-title');
            const textElement = document.getElementById('message-text');
            const icon = document.getElementById('message-icon');
            const iconSvg = document.getElementById('message-icon-svg');
            const iconPath = document.getElementById('message-icon-path');
        
            // Reset states
            title.textContent = "";
            textElement.textContent = text;
            modal.classList.remove('hidden');
        
            icon.className = 'w-24 h-24 flex items-center justify-center rounded-full border-4 border-blue-500 bg-blue-100 animate-spin';
            iconSvg.className = 'w-16 h-16 text-blue-500';
            iconPath.setAttribute("d", "M12 4v4m0 8v4m8-8h-4m-8 0H4"); // some spinner shape
        
            document.getElementById('confirm-message-btn').style.display = 'none';
        }
        
        
        function hideLoading() {
            const modal = document.getElementById('message-modal');
            modal.classList.add('hidden');
            modal.classList.remove('opacity-100', 'scale-100');
            document.getElementById('confirm-message-btn').style.display = '';
        }
        
        
    </script>

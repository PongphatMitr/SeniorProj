<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   อนุมัติกิจกรรม - Time Bank
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <script src="navbar.js">
  </script>
  <script>
    async function fetchActivityDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const activityId = urlParams.get('id');
    
        if (!activityId) {
            alert('ไม่พบรหัสกิจกรรม');
            return;
        }
    
        try {
            const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
    
            if (!response.ok) {
                const errorText = await response.text();
                console.error(`HTTP error! status: ${response.status}, response: ${errorText}`);
                if (response.status === 404) {
                    alert('ไม่พบกิจกรรมที่ระบุ');
                } else if (response.status === 400 && errorText.includes('Invalid token')) {
                    alert('Invalid token. Redirecting to login page.');
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
                throw new Error(`HTTP error! status: ${response.status}`);
            }
    
            const activity = await response.json();
    
            if (activity) {
                document.getElementById('activity-title').innerText = activity.title;
                document.getElementById('activity-description').innerText = activity.description;
                document.getElementById('activity-location').innerText = activity.location;
                document.getElementById('activity-date').innerText = new Date(activity.start_date).toLocaleDateString();
                document.getElementById('activity-start-time').innerText = activity.start_time;
                document.getElementById('activity-end-time').innerText = activity.end_time;
                document.getElementById('activity-time-tokens').innerText = activity.time_tokens_required;
                document.getElementById('activity-requester-name').innerText = activity.requester_name;
    
                // Fetch participants
                const participantsResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
    
                if (!participantsResponse.ok) {
                    const errorText = await participantsResponse.text();
                    console.error(`HTTP error! status: ${participantsResponse.status}, response: ${errorText}`);
                    throw new Error(`HTTP error! status: ${participantsResponse.status}`);
                }
    
                const participants = await participantsResponse.json();
                const participantsCount = Array.isArray(participants) ? participants.length : 0;
                document.getElementById('activity-max-participants').innerText = `${participantsCount}/${activity.max_participants}`;
                document.getElementById('activity-status').innerText = activity.status;
            } else {
                alert('ไม่พบรายละเอียดกิจกรรม');
            }
        } catch (error) {
            console.error('Error fetching activity details:', error);
            alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
        }
    }
    
    async function approveActivity() {
        const urlParams = new URLSearchParams(window.location.search);
        const activityId = urlParams.get('id');
    
        try {
            // Approve the activity
            const approveResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/approve`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
    
            if (!approveResponse.ok) {
                const errorText = await approveResponse.text();
                throw new Error(`Approval failed: ${errorText}`);
            }
    
            // Fetch activity details to get requester_id and time tokens
            const activityResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
    
            if (!activityResponse.ok) {
                throw new Error(`Failed to fetch activity details`);
            }
    
            const activity = await activityResponse.json();
            const requesterId = activity.requester_id;
            const timeTokensPerParticipant = activity.time_tokens_per_participant;
    
            // Deduct time credits from requester
            await logTransaction({
                user_id: requesterId,
                activity_id: activityId,
                transaction_type: 'spend',
                time_credits: activity.time_tokens_required,
                details: `Approved activity: ${activity.title}`,
                requester_id: requesterId
            });
    
            // Fetch participants and award time credits
            const participantsResponse = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
    
            const participants = await participantsResponse.json();
    
            for (const participant of participants) {
                await logTransaction({
                    user_id: participant.user_id,
                    activity_id: activityId,
                    transaction_type: 'earn',
                    time_credits: timeTokensPerParticipant,
                    details: `Earned time credits for activity: ${activity.title}`,
                    requester_id: requesterId,
                    participant_id: participant.user_id
                });
            }
    
            alert('กิจกรรมได้รับการอนุมัติและแจกเครดิตเวลาเรียบร้อยแล้ว');
            window.location.href = 'activity.html';
        } catch (error) {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการอนุมัติกิจกรรม');
        }
    }
    
    async function logTransaction(transactionData) {
        try {
            const response = await fetch('http://localhost:3000/api/tbm/transactions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(transactionData)
            });
    
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Transaction logging failed: ${errorText}`);
            }
        } catch (error) {
            console.error('Transaction error:', error);
            throw error;
        }
    }
    
    async function rejectActivity() {
        const urlParams = new URLSearchParams(window.location.search);
        const activityId = urlParams.get('id');
    
        try {
            const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/reject`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
    
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Rejection failed: ${errorText}`);
            }
    
            alert('กิจกรรมถูกปฏิเสธเรียบร้อยแล้ว');
            window.location.href = 'activity.html';
        } catch (error) {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการปฏิเสธกิจกรรม');
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        fetchActivityDetails();
    
        document.getElementById('participants-button').addEventListener('click', () => {
            const activityId = new URLSearchParams(window.location.search).get('id');
            window.location.href = `activity-participant.html?id=${activityId}`;
        });
    
        checkLoginStatus();
    });
    
  </script>
 </head>

    </div>
    <nav>
     <ul id="navList">
      <li class="mb-4">

        </i>

      </li>
      <li class="mb-4">
       <a class="text-gray-700 hover:text-blue-600" href="activities.html">

        </i>

       </a>
      </li>

       <a class="text-gray-700 hover:text-blue-600" href="settings.html">

        </i>

       </a>
      </li>
     </ul>
    </nav>
   </div>
   <!-- Main Content -->
   <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
    <h1 class="text-4xl font-bold mb-5">
     อนุมัติกิจกรรม
    </h1>
    <div class="bg-white text-black p-12 rounded-lg shadow-lg max-w-6xl mx-auto">
     <h2 class="text-4xl font-bold mb-6 text-center text-blue-700" id="activity-title">
      <!-- Activity Title will be inserted here -->

     <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div>

     <div class="flex items-center justify-center mt-6">
      <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-4 px-6 ml-2 rounded focus:outline-none focus:shadow-outline" onclick="window.history.back()" type="button">

      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-4 px-6 ml-2 rounded focus:outline-none focus:shadow-outline" id="participants-button" type="button">

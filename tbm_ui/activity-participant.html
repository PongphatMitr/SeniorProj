<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>รายชื่อผู้เข้าร่วม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <h1 class="text-4xl font-bold mb-5">
                รายชื่อผู้เข้าร่วม
            </h1>
            <div class="bg-white text-black p-12 rounded-lg shadow-lg max-w-6xl mx-auto">
                <div class="mb-4 flex items-center relative">
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        type="text" id="search-input" placeholder="ค้นหาสมาชิก" oninput="searchMembers()" />
                </div>
                <div id="search-results-dropdown" class="bg-white border border-gray-300 mt-1 rounded shadow-lg z-10">
                    <!-- Search results will be dynamically inserted here -->
                </div>
                <div class="overflow-x-auto mt-4">
                    <div class="table-responsive-sm">
                        <table aria-busy="false" aria-colcount="4" class="table b-table b-table-stacked-md w-full"
                            role="table">
                            <thead class="bg-gray-100" role="rowgroup">
                                <tr role="row">
                                    <th aria-colindex="1"
                                        class="py-4 px-6 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        ชื่อ
                                    </th>
                                    <th aria-colindex="2"
                                        class="py-4 px-6 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        อีเมล
                                    </th>
                                    <th aria-colindex="3"
                                        class="py-4 px-6 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        ทักษะ
                                    </th>
                                    <th aria-colindex="4"
                                        class="py-4 px-6 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        การจัดการ
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="participants-tbody" role="rowgroup">
                                <!-- Participants will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="flex items-center justify-center mt-6">
                    <button
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-4 px-6 ml-2 rounded focus:outline-none focus:shadow-outline"
                        onclick="window.history.back()" type="button">
                        ย้อนกลับ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div
                    class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">เข้าสู่ระบบสำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4">กำลังนำทางไปยังหน้าหลัก...</p>
            <button id="confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>

    <!-- Error Message Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                    <svg class="w-12 h-12 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด!</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message">ไม่สามารถเพิ่มผู้เข้าร่วมได้</p>
            <button id="error-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        let participants = [];

        async function fetchParticipants() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                participants = await response.json();

                if (Array.isArray(participants)) {
                    renderParticipants(participants);
                } else {
                    console.error('Expected an array but got:', participants);
                }
            } catch (error) {
                console.error('Error fetching participants:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้เข้าร่วม');
            }
        }

        function renderParticipants(data) {
            const tbody = document.getElementById('participants-tbody');
            tbody.innerHTML = '';
            data.forEach((participant) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td class="py-4 px-6 border-b border-gray-200">${participant.name}</td>
                    <td class="py-4 px-6 border-b border-gray-200">${participant.email}</td>
                    <td class="py-4 px-6 border-b border-gray-200">${participant.skills.length > 0 ? participant.skills.join(', ') : '-'}</td>
                    <td class="py-4 px-6 border-b border-gray-200">
                        <button class="bg-red-500 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" onclick="removeParticipant(${participant.user_id})">ลบ</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function searchMembers() {
            const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();

            if (!searchTerm) {
                renderSearchError('กรุณาใส่คำค้นหา');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const { members } = await response.json();
                renderSearchResults(members);
            } catch (error) {
                console.error('Error searching members:', error);
                renderSearchError('เกิดข้อผิดพลาดในการค้นหาสมาชิก');
            }
        }

        function renderSearchResults(data) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.innerHTML = '';
            data.forEach((member) => {
                const isParticipant = participants.some(participant => participant.user_id === member.user_id);
                const item = document.createElement('div');
                item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-gray-700">${member.name}</p>
                            <p class="text-gray-500 text-sm">${member.email}</p>
                            <p class="text-gray-500 text-sm">${member.skills.length > 0 ? member.skills.join(', ') : '-'}</p>
                        </div>
                        ${isParticipant ? '<span class="text-green-500 font-bold">เข้าร่วมแล้ว</span>' : `<button class="bg-green-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline" onclick="addParticipant(${member.user_id})">เพิ่ม</button>`}
                    </div>
                `;
                dropdown.appendChild(item);
            });
        }

        function renderSearchError(message) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'py-2 px-4 text-red-500';
            item.innerText = message;
            dropdown.appendChild(item);
        }

        async function addParticipant(userId) {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                alert('ผู้เข้าร่วมถูกเพิ่มเรียบร้อยแล้ว');
                fetchParticipants(); // Refresh the participant list
            } catch (error) {
                console.error('Error adding participant:', error);
                showErrorModal(error.message);
            }
        }

        async function removeParticipant(userId) {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            console.log(`Removing participant with userId: ${userId} from activityId: ${activityId}`);

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}/participants/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert('ผู้เข้าร่วมถูกลบเรียบร้อยแล้ว');
                fetchParticipants(); // Refresh the participant list
            } catch (error) {
                console.error('Error removing participant:', error);
                alert('เกิดข้อผิดพลาดในการลบผู้เข้าร่วม');
            }
        }

        function showErrorModal(message) {
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
            errorModal.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchParticipants();

            document.getElementById('error-confirm-btn').addEventListener('click', () => {
                document.getElementById('error-modal').classList.add('hidden');
            });
        });
    </script>
    <script src="navbar.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Basic client-side validation
            if (!username || !password) {
                alert('Please fill in both username and password');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Handle specific error cases
                    if (response.status === 401) {
                        alert('Invalid username or password');
                    } else {
                        alert(data.error || 'Login failed');
                    }
                    return;
                }

                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect to homepage
                window.location.href = 'report.html';

            } catch (error) {
                console.error('Login Error:', error);
                alert('Connection error. Please try again.');
            }
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        // Redirect to report.html if already logged in
                        window.location.href = 'report.html';
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                }
            } else {
                updateSidebar(false);
            }
        }

        // Check if the user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langTh = document.getElementById('lang-th');
            const langEn = document.getElementById('lang-en');
            const navList = document.querySelectorAll('#navList a');
            const toggleSwitch = document.getElementById('language-toggle'); // If a toggle switch exists

            const translations = {
                thai: {
                    nav: ['เข้าสู่ระบบ', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวดหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                    login: 'เข้าสู่ระบบ',
                    username: 'ชื่อผู้ใช้',
                    password: 'รหัสผ่าน',
                    noAccount: 'ยังไม่มีบัญชี? <a class="text-blue-500" href="register.html">ลงทะเบียน</a>'
                },
                english: {
                    nav: ['Login', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                    login: 'Login',
                    username: 'Username',
                    password: 'Password',
                    noAccount: "Don't have an account? <a class='text-blue-500' href='register.html'>Register</a>"
                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            // Function to update content dynamically
            function updateContent(lang) {
                const langData = translations[lang];
                navList.forEach((link, index) => {
                    link.innerHTML = `<i class="${link.querySelector('i').className}"></i> ${langData.nav[index]}`;
                });

                document.querySelector('h2').textContent = langData.login;
                document.querySelector('label[for="username"]').textContent = langData.username;
                document.querySelector('label[for="password"]').textContent = langData.password;
                document.querySelector('.text-center p').innerHTML = langData.noAccount;

                if (lang === 'thai') {
                    langTh.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langTh.classList.remove('active');
                }

                // Sync toggle switch state if toggleSwitch exists
                if (toggleSwitch) {
                    toggleSwitch.checked = lang === 'english';
                }
            }

            // Event listeners for buttons
            langTh.addEventListener('click', () => {
                if (currentLang !== 'thai') {
                    currentLang = 'thai';
                    localStorage.setItem('selectedLanguage', currentLang);
                    updateContent(currentLang);
                }
            });

            langEn.addEventListener('click', () => {
                if (currentLang !== 'english') {
                    currentLang = 'english';
                    localStorage.setItem('selectedLanguage', currentLang);
                    updateContent(currentLang);
                }
            });

            // Sync toggle switch with content
            if (toggleSwitch) {
                toggleSwitch.checked = currentLang === 'english';
                toggleSwitch.addEventListener('change', () => {
                    currentLang = toggleSwitch.checked ? 'english' : 'thai';
                    localStorage.setItem('selectedLanguage', currentLang);
                    updateContent(currentLang);
                });
            }

            // Initialize the content on page load
            updateContent(currentLang);
        });
    </script>

    <style>
        /* Toggle container */
        .toggle-container {

            background-color: #E5E7EB;
            border-radius: 20px;
            /* Increase border radius for larger container */
            padding: 6px;
            /* Larger padding for better spacing */
            align-items: center;
            justify-content: space-between;
            width: 180px;
            /* Increase width for a larger toggle */
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            /* Blue for active text */
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            /* Make it unclickable */
            background-color: white;
            color: #6B7280;
            /* Light gray text */
            font-weight: bold;
        }
    </style>

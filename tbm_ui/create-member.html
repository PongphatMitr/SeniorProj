    <script>
        let defaultTimeToken = 100;

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function createMember(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const branch = document.getElementById('branch').value;
            const status = document.getElementById('status').value;

            const userPayload = {
                username: username,
                password: password,
                email: email,
                role: 'Member'
            };

            try {
                const userResponse = await fetch('http://localhost:3000/api/tbm/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userPayload)
                });

                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    const memberPayload = {
                        user_id: userData.user_id,
                        name: name,
                        phone: phone,
                        address: address,
                        branch: branch,
                        status: status,
                        time_credits: defaultTimeToken
                    };

                    const memberResponse = await fetch('http://localhost:3000/api/tbm/members', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(memberPayload)
                    });

                    if (memberResponse.ok) {
                        const memberData = await memberResponse.json();
                        alert('บัญชีสมาชิกถูกสร้างเรียบร้อยแล้ว');
                        window.location.href = `create-member-skill.html?memberId=${memberData.member_id}`;
                    } else {
                        alert('เกิดข้อผิดพลาดในการสร้างบัญชีสมาชิก');
                    }
                } else {
                    alert('เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                document.querySelector('label[for="username"]').textContent = langData.labels.username;
                document.querySelector('label[for="password"]').textContent = langData.labels.password;
                document.querySelector('label[for="email"]').textContent = langData.labels.email;
                document.querySelector('label[for="name"]').textContent = langData.labels.name;
                document.querySelector('label[for="phone"]').textContent = langData.labels.phone;
                document.querySelector('label[for="branch"]').textContent = langData.labels.branch;
                document.querySelector('label[for="address"]').textContent = langData.labels.address;
                document.querySelector('label[for="status"]').textContent = langData.labels.status;

                // Update placeholders
                document.getElementById('username').placeholder = langData.placeholders.username;
                document.getElementById('password').placeholder = langData.placeholders.password;
                document.getElementById('email').placeholder = langData.placeholders.email;
                document.getElementById('name').placeholder = langData.placeholders.name;
                document.getElementById('phone').placeholder = langData.placeholders.phone;
                document.getElementById('branch').placeholder = langData.placeholders.branch;
                document.getElementById('address').placeholder = langData.placeholders.address;

                // Update status dropdown options
                const statusSelect = document.getElementById('status');
                statusSelect.innerHTML = '';
                langData.statusOptions.forEach((option) => {
                    const statusOption = document.createElement('option');
                    statusOption.value = option.toLowerCase();
                    statusOption.textContent = option;
                    statusSelect.appendChild(statusOption);
                });

                // Update "Next" button text
                document.querySelector('button[type="submit"]').textContent = langData.nextButton;

                // Update navigation bar (keep icons intact)
                const navLinks = document.querySelectorAll('nav ul li a');
                langData.nav.forEach((text, index) => {
                    if (navLinks[index]) {
                        const icon = navLinks[index].querySelector('i'); // Keep existing icon
                        navLinks[index].innerHTML = ''; // Clear content
                        if (icon) {
                            navLinks[index].appendChild(icon); // Re-add icon
                        }
                        navLinks[index].appendChild(document.createTextNode(text)); // Add translated text
                    }
                });

                // Update active language toggle
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }
            };

            // Event listeners for language toggle
            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            // Initialize content on page load
            updateContent(currentLang);
        });
    </script>


</body>

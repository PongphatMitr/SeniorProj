<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        สร้างบัญชีสมาชิก - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let defaultTimeToken = 100;

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function createMember(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const branch = document.getElementById('branch').value;
            const status = document.getElementById('status').value;

            const userPayload = {
                username: username,
                password: password,
                email: email,
                role: 'Member'
            };

            try {
                const userResponse = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userPayload)
                });

                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    const memberPayload = {
                        user_id: userData.user_id,
                        name: name,
                        phone: phone,
                        address: address,
                        branch: branch,
                        status: status,
                        time_credits: defaultTimeToken
                    };

                    const memberResponse = await fetch('http://localhost:3000/api/members', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(memberPayload)
                    });

                    if (memberResponse.ok) {
                        const memberData = await memberResponse.json();
                        alert('บัญชีสมาชิกถูกสร้างเรียบร้อยแล้ว');
                        window.location.href = `create-member-skill.html?memberId=${memberData.member_id}`;
                    } else {
                        alert('เกิดข้อผิดพลาดในการสร้างบัญชีสมาชิก');
                    }
                } else {
                    alert('เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchCommunityConfig();
        });
    </script>
</head>

            <div class="bg-white text-black p-5 rounded-lg">
                <form onsubmit="createMember(event)">
                    <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="username">

                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="name">

                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"

                        </div>

                    <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">

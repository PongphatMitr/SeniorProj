        // Generic function to create searchable dropdown
        function setupSearchableDropdown(inputId, dropdownId, dataArray) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(dropdownId);

            function filterList(value) {
                dropdown.innerHTML = '';
                const filtered = dataArray.filter(item => item.toLowerCase().includes(value.toLowerCase()));
                if (filtered.length === 0) {
                    const noItem = document.createElement('div');
                    noItem.textContent = 'ไม่พบข้อมูล';
                    noItem.className = 'text-gray-500 cursor-default select-none px-3 py-1';
                    dropdown.appendChild(noItem);
                } else {
                    filtered.forEach(item => {
                        const div = document.createElement('div');
                        div.textContent = item;
                        div.tabIndex = 0;
                        div.className = '';
                        div.addEventListener('click', () => {
                            input.value = item;
                            dropdown.classList.remove('active');
                        });
                        div.addEventListener('keydown', e => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                input.value = item;
                                dropdown.classList.remove('active');
                                input.focus();
                            }
                        });
                        dropdown.appendChild(div);
                    });
                }
            }

            input.addEventListener('input', () => {
                const val = input.value.trim();
                if (val.length > 0) {
                    filterList(val);
                    dropdown.classList.add('active');
                } else {
                    dropdown.classList.remove('active');
                }
            });

            input.addEventListener('focus', () => {
                if (input.value.trim().length > 0) {
                    filterList(input.value.trim());
                    dropdown.classList.add('active');
                }
            });

            input.addEventListener('blur', () => {
                // Delay hiding to allow click event on dropdown items
                setTimeout(() => {
                    dropdown.classList.remove('active');
                }, 150);
            });
        }

        // Setup all searchable dropdowns
        setupSearchableDropdown('roadInput', 'roadDropdown', roads);
        setupSearchableDropdown('subdistrictInput', 'subdistrictDropdown', subdistricts);
        setupSearchableDropdown('districtInput', 'districtDropdown', districts);
        setupSearchableDropdown('provinceInput', 'provinceDropdown', provinces);
        setupSearchableDropdown('branchInput', 'branchDropdown', []);

        // Fetch branches dynamically and update branchDropdown data
        async function fetchBranches() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/branches');
                if (!response.ok) throw new Error('Failed to fetch branches');
                const branches = await response.json();
                const branchNames = branches.map(b => b.branch_name);
                // Update branch dropdown data
                branchData = branchNames;
                // Re-setup branch dropdown with new data
                setupSearchableDropdown('branchInput', 'branchDropdown', branchData);
            } catch (error) {
                console.error('Error fetching branches:', error);
            }
        }

        let branchData = [];

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();

            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value.trim(),
                confirmPassword: document.getElementById('confirmPassword').value.trim(),
                name: firstName + ' ' + lastName, // Concatenate first and last name with space
                phone: document.getElementById('phone').value.trim(),
                branch: document.getElementById('branchInput').value.trim(),
                role: 'User', // Default role
                // Address fields combined into one string for backend
                address: '',
            };

            // Compose full address string in Thai format:
            // บ้านเลขที่, ซอย, ถนน, แขวง/ตำบล, เขต/อำเภอ, จังหวัด, รหัสไปรษณีย์
            const houseNumber = document.getElementById('houseNumber').value.trim();
            const soi = document.getElementById('soi').value.trim();
            const road = document.getElementById('roadInput').value.trim();
            const subdistrict = document.getElementById('subdistrictInput').value.trim();
            const district = document.getElementById('districtInput').value.trim();
            const province = document.getElementById('provinceInput').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();

            // Validate required address fields
            const addressErrors = [];
            if (!houseNumber) addressErrors.push('กรุณากรอก บ้านเลขที่');
            if (!subdistrict) addressErrors.push('กรุณากรอก แขวง/ตำบล');
            if (!district) addressErrors.push('กรุณากรอก เขต/อำเภอ');
            if (!province) addressErrors.push('กรุณาเลือก จังหวัด');
            if (!postalCode) addressErrors.push('กรุณากรอก รหัสไปรษณีย์');

            if (addressErrors.length > 0) {
                showFailureMessage(addressErrors.join('\n'));
                return;
            }

            // Compose address string
            let addressParts = [];
            addressParts.push(`บ้านเลขที่ ${houseNumber}`);
            if (soi) addressParts.push(`ซอย ${soi}`);
            if (road) addressParts.push(`ถนน ${road}`);
            addressParts.push(`แขวง/ตำบล ${subdistrict}`);
            addressParts.push(`เขต/อำเภอ ${district}`);
            addressParts.push(`จังหวัด ${province}`);
            addressParts.push(`รหัสไปรษณีย์ ${postalCode}`);

            formData.address = addressParts.join(' ');

            // Client-side validation
            const errors = [];

            // Validate first and last name: both required
            if (!firstName) {
                errors.push('กรุณากรอกชื่อ');
            }
            if (!lastName) {
                errors.push('กรุณากรอกนามสกุล');
            }

            // Validate email: allow empty but must be a valid format if provided
            if (formData.email && !/^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/.test(formData.email)) {
                errors.push('อีเมลไม่ถูกต้อง กรุณากรอกอีเมลให้ถูกต้องหรือเว้นว่างไว้');
            }

            // Validate phone: must be exactly 10 digits and start with 0
            if (!/^0[0-9]{9}$/.test(formData.phone)) {
                errors.push('หมายเลขโทรศัพท์ไม่ถูกต้อง ต้องมี 10 หลักและขึ้นต้นด้วยเลข 0');
            }

            // Validate postal code: 5 digits
            if (!/^\d{5}$/.test(postalCode)) {
                errors.push('รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก');
            }

            // Password validations
            if (formData.password !== formData.confirmPassword) {
                errors.push('รหัสผ่านไม่ตรงกัน');
            }
            if (formData.password.length < 8) {
                errors.push('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร');
            }

            // Display errors if any
            if (errors.length > 0) {
                showFailureMessage(errors.join('\n'));
                return;
            }

            // Submit data if validation passes
            try {
                const response = await fetch('http://localhost:3000/api/tbm/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'การลงทะเบียนล้มเหลว กรุณาลองใหม่');
                }

                // Save formData without password fields to sessionStorage for next step
                const formDataForSkills = { ...formData };
                sessionStorage.setItem('registerFormData', JSON.stringify(formDataForSkills));
                sessionStorage.setItem('registerUserId', data.user_id); // <-- this line is missing!
                sessionStorage.setItem('registerPassword', formData.password);
                sessionStorage.setItem('registerUserId', data.user_id); // 💾 save user_id from response

                showSuccessMessage('ลงทะเบียนสำเร็จ! กรุณาเพิ่มทักษะของคุณ', 'create-member-skill.html');
            } catch (error) {
                console.error('Registration Error:', error);
                showFailureMessage(error.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        });

        function showSuccessMessage(message, nextPage = null) {
                document.getElementById('success-message').textContent = message;
                const modal = document.getElementById('success-modal');
                modal.classList.remove('hidden');

                const confirmBtn = document.getElementById('success-confirm-btn');
                confirmBtn.onclick = () => {
                    modal.classList.add('hidden');
                    if (nextPage) {
                        window.location.href = nextPage;
                    }
                };
            }

        function showFailureMessage(message) {
                document.getElementById('failure-message').textContent = message;
                const modal = document.getElementById('failure-modal');
                modal.classList.remove('hidden');

                document.getElementById('failure-retry-btn').onclick = () => {
                    modal.classList.add('hidden');
                };
                document.getElementById('failure-cancel-btn').onclick = () => {
                    modal.classList.add('hidden');
                };
            }

        function closeMessage(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
    <script src="navbar.js"></script>
</body>

<html lang="en">

<head>

</head>

<body class="bg-gray-100">

                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">TIMEBANK</span>
            </div>
            <nav>
                <ul id="navList">
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-home"></i> หน้าหลัก</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-chart-bar"></i> รายงาน</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i

                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i

                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-cogs"></i> จัดการหมวดหมู่ทักษะ</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-piggy-bank"></i> จัดการกองทุนชุมชน</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-building"></i> จัดการชุมชน</a></li>
                    <li><a href="#" class="flex items-center py-2 px-4 text-gray-700 hover:bg-gray-200 rounded"><i
                                class="fas fa-exchange-alt"></i> ธุรกรรมทั้งหมด</a></li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex items-center justify-center bg-blue-700">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" data-lang="th" id="lang-th">ภาษาไทย</span>
                    <span class="toggle-label" data-lang="en" id="lang-en">English</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
                <h1 class="text-4xl font-bold text-center text-blue-900 mb-8">สร้างบัญชีสมาชิก</h1>
                <form id="createMemberForm">
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="username">ชื่อผู้ใช้</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="username" placeholder="ชื่อผู้ใช้" type="text" required />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">อีเมล</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="email" placeholder="อีเมล" type="email" required />
                        </div>
                    </div>
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">รหัสผ่าน</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="password" placeholder="รหัสผ่าน" type="password" required />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2"
                                for="confirmPassword">ยืนยันรหัสผ่าน</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="confirmPassword" placeholder="ยืนยันรหัสผ่าน" type="password" required />
                        </div>
                    </div>
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="name">ชื่อ</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="name" placeholder="ชื่อ" type="text" required />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">เบอร์โทรศัพท์</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="phone" placeholder="เบอร์โทรศัพท์" type="text" required />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="address">ที่อยู่</label>
                        <textarea
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="address" placeholder="ที่อยู่" required></textarea>
                    </div>
                    <div class="mb-4 relative">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="branch">สาขา</label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="branch" placeholder="สาขา" type="text" oninput="searchBranches()" required />
                        <div id="branch-results-dropdown"
                            class="absolute bg-white shadow-lg rounded w-full mt-1 hidden z-10"></div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="submit">ต่อไป</button>
                    </div>
                </form>
                <div id="error-message" class="text-red-500 mt-4 hidden"></div>
            </div>
        </div>
    </div>
    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            /* Increase border radius for larger container */
            padding: 6px;
            /* Larger padding for better spacing */
            align-items: center;
            justify-content: space-between;
            width: 180px;
            /* Increase width for a larger toggle */
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            /* Blue for active text */
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            /* Make it unclickable */
            background-color: white;
            color: #6B7280;
            /* Light gray text */
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langTh = document.getElementById('lang-th');
            const langEn = document.getElementById('lang-en');
            const toggleSwitch = document.getElementById('language-toggle'); // Reference to the toggle switch
            const navList = document.querySelectorAll('ul li a');
            const createMemberForm = document.getElementById('createMemberForm');

            const translations = {
                thai: {
                    nav: ['เข้าสู่ระบบ', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวดหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                    createMember: 'สร้างบัญชีสมาชิก',
                    username: 'ชื่อผู้ใช้',
                    email: 'อีเมล',
                    password: 'รหัสผ่าน',
                    confirmPassword: 'ยืนยันรหัสผ่าน',
                    name: 'ชื่อ',
                    phone: 'โทรศัพท์',
                    address: 'ที่อยู่',
                    branch: 'สาขา',
                    nextButton: 'ต่อไป'
                },
                english: {
                    nav: ['Login', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                    createMember: 'Create Member Account',
                    username: 'Username',
                    email: 'Email',
                    password: 'Password',
                    confirmPassword: 'Confirm Password',
                    name: 'Name',
                    phone: 'Phone',
                    address: 'Address',
                    branch: 'Branch',
                    nextButton: 'Next'
                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];

                // Update navigation menu
                navList.forEach((link, index) => {
                    link.innerHTML = `<i class="${link.querySelector('i').className}"></i> ${langData.nav[index]}`;
                });

                // Update form labels and placeholders
                document.querySelector('h1').textContent = langData.createMember;
                createMemberForm.querySelector('label[for="username"]').textContent = langData.username;
                createMemberForm.querySelector('label[for="email"]').textContent = langData.email;
                createMemberForm.querySelector('label[for="password"]').textContent = langData.password;
                createMemberForm.querySelector('label[for="confirmPassword"]').textContent = langData.confirmPassword;
                createMemberForm.querySelector('label[for="name"]').textContent = langData.name;
                createMemberForm.querySelector('label[for="phone"]').textContent = langData.phone;
                createMemberForm.querySelector('label[for="address"]').textContent = langData.address;
                createMemberForm.querySelector('label[for="branch"]').textContent = langData.branch;

                // Update "Next" button text
                document.querySelector('button[type="submit"]').textContent = langData.nextButton;

                // Highlight active language
                if (lang === 'thai') {
                    langTh.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langTh.classList.remove('active');
                }

                // Sync toggle switch state if toggleSwitch exists
                if (toggleSwitch) {
                    toggleSwitch.checked = lang === 'english';
                }

                // Store selected language
                localStorage.setItem('selectedLanguage', lang);
            }

            // Event listeners for buttons
            langTh.addEventListener('click', () => {
                if (currentLang !== 'thai') {
                    currentLang = 'thai';
                    updateContent(currentLang);
                }
            });

            langEn.addEventListener('click', () => {
                if (currentLang !== 'english') {
                    currentLang = 'english';
                    updateContent(currentLang);
                }
            });

            // Sync toggle switch with content
            if (toggleSwitch) {
                toggleSwitch.checked = currentLang === 'english';
                toggleSwitch.addEventListener('change', () => {
                    currentLang = toggleSwitch.checked ? 'english' : 'thai';
                    updateContent(currentLang);
                });
            }

            // Initialize content
            updateContent(currentLang);
        });

        async function searchBranches() {
            const searchTerm = document.getElementById('branch').value.toLowerCase();
            const resultsDropdown = document.getElementById('branch-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/branches?search=${searchTerm}`);
                    const branches = await response.json();
                    branches.forEach(branch => {
                        const item = document.createElement('div');
                        item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                        item.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-gray-700">${branch.branch_name}</p>
                                </div>
                            </div>
                        `;
                        item.onclick = () => {
                            document.getElementById('branch').value = branch.branch_name;
                            resultsDropdown.innerHTML = '';
                        };
                        resultsDropdown.appendChild(item);
                    });
                    resultsDropdown.classList.remove('hidden');
                } catch (error) {
                    console.error('Error fetching branches:', error);
                }
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        document.getElementById('createMemberForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            // Get all form values
            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value.trim(),
                confirmPassword: document.getElementById('confirmPassword').value.trim(),
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                role: 'Member' // Set default role to 'Member'
            };

            // Client-side validation
            const errors = [];
            if (!formData.name) errors.push('Name is required');
            if (!formData.phone) errors.push('Phone is required');
            if (!/^\d{10}$/.test(formData.phone)) errors.push('Phone must be 10 digits');
            if (formData.password !== formData.confirmPassword) errors.push('Passwords do not match');
            if (formData.password.length < 8) errors.push('Password must be at least 8 characters');

            if (errors.length > 0) {
                alert(errors.join('\n'));
                return;
            }

            try {
                const userPayload = {
                    username: formData.username,
                    password: formData.password,
                    email: formData.email,
                    role: formData.role,
                    name: formData.name,
                    phone: formData.phone,
                    address: formData.address,
                    branch: formData.branch
                };

                const userResponse = await fetch('http://localhost:3000/api/tbm/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userPayload)
                });

                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    const memberPayload = {
                        user_id: userData.user_id,
                        name: formData.name,
                        phone: formData.phone,
                        address: formData.address,
                        branch: formData.branch,
                        time_credits: 100 // Default time credits
                    };

                    const memberResponse = await fetch('http://localhost:3000/api/tbm/members', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(memberPayload)
                    });

                    if (memberResponse.ok) {
                        const memberData = await memberResponse.json();
                        alert('บัญชีสมาชิกถูกสร้างเรียบร้อยแล้ว');
                        window.location.href = `create-member-skill.html?memberId=${memberData.user_id}`;
                    } else {
                        const errorData = await memberResponse.json();
                        document.getElementById('error-message').textContent = errorData.error || 'เกิดข้อผิดพลาดในการสร้างบัญชีสมาชิก';
                        document.getElementById('error-message').classList.remove('hidden');
                    }
                } else if (userResponse.status === 409) {
                    const errorData = await userResponse.json();
                    document.getElementById('error-message').textContent = errorData.error;
                    document.getElementById('error-message').classList.remove('hidden');
                } else {
                    const errorData = await userResponse.json();
                    document.getElementById('error-message').textContent = errorData.error || 'เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้';
                    document.getElementById('error-message').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error-message').textContent = 'เกิดข้อผิดพลาดในการสร้างบัญชีผู้ใช้';
                document.getElementById('error-message').classList.remove('hidden');
            }
        });
                    </script>

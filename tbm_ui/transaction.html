<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ธุรกรรมทั้งหมด - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item b {
            color: rgb(0, 123, 255);
            transition: color 0.3s ease;
        }

        .dropdown-item:hover b {
            color: rgb(0, 86, 179);
        }

        .dropdown-item b.red {
            color: red;
        }

        .dropdown-item:hover b.red {
            color: darkred;
        }

        th.sortable:hover {
            cursor: pointer;
            background-color: #f1f1f1;
        }
    </style>
    <script>
        let transactions = [];
        let currentPage = 1;
        const pageSize = 10;
        let totalTransactions = 0;
        let sortColumn = '';
        let sortDirection = 'asc';

        async function fetchTransactions(page) {
            try {
                const response = await fetch(`http://localhost:3000/api/members/transactions/all?page=${page}&pageSize=${pageSize}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (Array.isArray(data.transactions)) {
                    transactions = data.transactions;
                    totalTransactions = data.total;
                    await fetchActivityDescriptions();
                    renderTable(transactions);
                    renderPagination();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลธุรกรรม');
                }
            } catch (error) {
                console.error('Error fetching transactions:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลธุรกรรม');
            }
        }

        async function fetchActivityDescriptions() {
            const activityIds = transactions.map(transaction => transaction.activity_id);
            const uniqueActivityIds = [...new Set(activityIds)];

            const activityDescriptions = {};

            for (const activityId of uniqueActivityIds) {
                try {
                    const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const activity = await response.json();
                    activityDescriptions[activityId] = activity.description;
                } catch (error) {
                    console.error('Error fetching activity description:', error);
                }
            }

            transactions = transactions.map(transaction => ({
                ...transaction,
                activity_description: activityDescriptions[transaction.activity_id] || 'No description available'
            }));
        }

        function renderTable(data) {
            const tbody = document.getElementById('transaction-tbody');
            tbody.innerHTML = '';
            data.forEach((transaction, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                const timeCreditsClass = transaction.transaction_type === 'earn' ? 'text-green-500' : 'text-red-500';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="รหัสธุรกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.transaction_id}
                    </td>
                    <td aria-colindex="2" data-label="วันที่" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${new Date(transaction.date).toLocaleDateString()}
                    </td>
                    <td aria-colindex="3" data-label="เวลา" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.time}
                    </td>
                    <td aria-colindex="4" data-label="เครดิตเวลา" role="cell" class="py-2 px-4 border-b border-gray-200 ${timeCreditsClass}">
                        ${transaction.time_credits}
                    </td>
                    <td aria-colindex="5" data-label="ชื่อผู้ขอ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.requester_name}
                    </td>
                    <td aria-colindex="6" data-label="ชื่อผู้เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.participant_name}
                    </td>
                    <td aria-colindex="7" data-label="ธุรกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.activity_title}
                    </td>
                    <td aria-colindex="8" data-label="รายละเอียดธุรกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${transaction.activity_description}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalTransactions / pageSize);

            const firstButton = document.createElement('button');
            firstButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            firstButton.textContent = 'First';
            firstButton.onclick = () => {
                currentPage = 1;
                fetchTransactions(currentPage);
            };
            paginationContainer.appendChild(firstButton);

            const prevButton = document.createElement('button');
            prevButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            prevButton.textContent = 'Prev';
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchTransactions(currentPage);
                }
            };
            paginationContainer.appendChild(prevButton);

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1 ${i === currentPage ? 'bg-blue-700' : ''}`;
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    fetchTransactions(currentPage);
                };
                paginationContainer.appendChild(pageButton);
            }

            const nextButton = document.createElement('button');
            nextButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            nextButton.textContent = 'Next';
            nextButton.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchTransactions(currentPage);
                }
            };
            paginationContainer.appendChild(nextButton);

            const lastButton = document.createElement('button');
            lastButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            lastButton.textContent = 'Last';
            lastButton.onclick = () => {
                currentPage = totalPages;
                fetchTransactions(currentPage);
            };
            paginationContainer.appendChild(lastButton);
        }

        function sortTable(column) {
            const direction = sortColumn === column && sortDirection === 'asc' ? 'desc' : 'asc';
            sortColumn = column;
            sortDirection = direction;

            transactions.sort((a, b) => {
                if (a[column] < b[column]) {
                    return direction === 'asc' ? -1 : 1;
                }
                if (a[column] > b[column]) {
                    return direction === 'asc' ? 1 : -1;
                }
                return 0;
            });

            renderTable(transactions);
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchTransactions(currentPage);

            document.querySelectorAll('th.sortable').forEach(header => {
                header.addEventListener('click', () => {
                    const column = header.getAttribute('data-column');
                    sortTable(column);
                });
            });
        });
    </script>
</head>

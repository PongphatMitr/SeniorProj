<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>แก้ไขกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const activity = await response.json();

                if (activity) {
                    document.getElementById('service-title').value = activity.title || '';
                    document.getElementById('service-description').value = activity.description || '';
                    document.getElementById('service-location').value = activity.location || '';
                    document.getElementById('service-start-date').value = activity.start_date ? activity.start_date.split('T')[0] : '';
                    document.getElementById('service-time-start').value = activity.start_time ? activity.start_time.substring(0, 5) : '';
                    document.getElementById('service-end-date').value = activity.end_date ? activity.end_date.split('T')[0] : '';
                    document.getElementById('service-time-end').value = activity.end_time ? activity.end_time.substring(0, 5) : '';
                    document.getElementById('service-people').value = activity.max_participants || '';
                    document.getElementById('requester-name').value = activity.requester_name || '';
                    document.getElementById('service-status').value = activity.status || '';
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        function enableEditing() {
            const fields = document.querySelectorAll('.editable');
            fields.forEach(field => {
                field.disabled = false;
            });

            document.getElementById('edit-button').style.display = 'none';
            document.getElementById('save-button').style.display = 'inline-block';
        }

        async function updateActivity(event) {
            event.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            const title = document.getElementById('service-title').value;
            const description = document.getElementById('service-description').value;
            const location = document.getElementById('service-location').value;
            const start_date = document.getElementById('service-start-date').value;
            const start_time = document.getElementById('service-time-start').value;
            const end_date = document.getElementById('service-end-date').value;
            const end_time = document.getElementById('service-time-end').value;
            const max_participants = document.getElementById('service-people').value;
            const requester_name = document.getElementById('requester-name').value;
            const status = document.getElementById('service-status').value;

            const activityData = {
                title,
                description,
                location,
                start_date,
                start_time,
                end_date,
                end_time,
                max_participants,
                requester_name,
                status
            };

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (response.ok) {
                    alert('กิจกรรมถูกแก้ไขเรียบร้อยแล้ว');
                    window.location.href = 'activity-details.html?id=' + activityId; // Redirect to the activity details page
                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการแก้ไขกิจกรรม');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchActivityDetails();

            // Set current date and time if fields are empty
            const currentDate = new Date().toISOString().split('T')[0];
            const currentTime = new Date().toTimeString().split(' ')[0].substring(0, 5);

            if (!document.getElementById('service-start-date').value) {
                document.getElementById('service-start-date').value = currentDate;
            }
            if (!document.getElementById('service-time-start').value) {
                document.getElementById('service-time-start').value = currentTime;
            }
            if (!document.getElementById('service-end-date').value) {
                document.getElementById('service-end-date').value = currentDate;
            }
            if (!document.getElementById('service-time-end').value) {
                document.getElementById('service-time-end').value = currentTime;
            }

            updateSidebar();
        });

                    </li>

                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">

                    <li class="mb-5">

                            href="transaction.html">

                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            }
        }
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                แก้ไขกิจกรรม
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="updateActivity(event)">
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-title">
                                ชื่อบริการ
                            </label>
                            <input id="service-title"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-start-date">
                                วันที่เริ่มต้น
                            </label>
                            <input id="service-start-date"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" disabled />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-start">
                                เวลาเริ่มต้น
                            </label>
                            <input id="service-time-start"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="time" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-end-date">
                                วันที่สิ้นสุด
                            </label>
                            <input id="service-end-date"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" disabled />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-end">
                                เวลาสิ้นสุด
                            </label>
                            <input id="service-time-end"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="time" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-location">
                                สถานที่จัด
                            </label>
                            <input id="service-location"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-people">
                                จำนวนคน
                            </label>
                            <input id="service-people"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                                ชื่อผู้ขอบริการ
                            </label>
                            <input id="requester-name"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-description">
                            รายละเอียดบริการ
                        </label>
                        <textarea id="service-description"
                            class="editable-textarea shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            disabled></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-status">
                            สถานะ
                        </label>
                        <select id="service-status"
                            class="editable-select shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            disabled>
                            <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            <option value="ยกเลิก">ยกเลิก</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.history.back()">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" id="edit-button" onclick="enableEditing()">แก้ไข</button>
                        <button
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit" id="save-button" style="display: none;">บันทึกการแก้ไข</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

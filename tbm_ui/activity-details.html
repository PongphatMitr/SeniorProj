<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>แก้ไขกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let members = [];
        let exchangeRate = null;

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const activity = await response.json();

                if (activity) {
                    document.getElementById('title').value = activity.title || '';
                    document.getElementById('description').value = activity.description || '';
                    document.getElementById('location').value = activity.location || '';
                    document.getElementById('start-date').value = activity.start_date ? activity.start_date.split('T')[0] : '';
                    document.getElementById('start-time').value = activity.start_time ? activity.start_time.substring(0, 5) : '';
                    document.getElementById('end-date').value = activity.end_date ? activity.end_date.split('T')[0] : '';
                    document.getElementById('end-time').value = activity.end_time ? activity.end_time.substring(0, 5) : '';
                    document.getElementById('max-participants').value = activity.max_participants || '';
                    document.getElementById('requester-name').value = activity.requester_name || '';
                    document.getElementById('requester-id').value = activity.requester_id || '';
                    document.getElementById('status').value = activity.status || '';
                    document.getElementById('time-tokens-required').value = activity.time_tokens_required || '';
                    document.getElementById('time-tokens-per-participant').value = activity.time_tokens_per_participant || '';
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                exchangeRate = data.default_exchange_rate_description;
                console.log('Exchange Rate:', exchangeRate);
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';

            if (searchTerm) {
                const filteredMembers = members.filter(member =>
                    member.name.toLowerCase().includes(searchTerm) ||
                    member.user_id.toString().includes(searchTerm)
                );

                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.user_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        document.getElementById('requester-id').value = member.user_id;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });

                // Show dropdown if there are results
                resultsDropdown.classList.remove('hidden');
            } else {
                // Hide dropdown if input is empty
                resultsDropdown.classList.add('hidden');
            }
        }

        function calculateTimeTokens() {
            // Get input values
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            // Check for invalid inputs and reset output fields if necessary
            if (
                isNaN(maxParticipants) ||
                maxParticipants <= 0 ||
                !startDate ||
                !endDate ||
                !startTime ||
                !endTime ||
                !exchangeRate
            ) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }

            // Parse date and time inputs
            const startDateTime = new Date(`${startDate}T${startTime}`);
            const endDateTime = new Date(`${endDate}T${endTime}`);

            // Calculate the duration in hours
            const durationInHours = Math.max(0, (endDateTime - startDateTime) / (1000 * 60 * 60));

            // Variables to hold calculation results
            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;

            // Calculate based on exchange rate
            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                // Rate 1: Tokens depend on the duration
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                // Rate 2: Fixed tokens regardless of duration
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }

            // Update the output fields
            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function updateActivity(event) {
            event.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipantsInput = document.getElementById('max-participants').value;
            const maxParticipants = maxParticipantsInput ? parseInt(maxParticipantsInput, 10) : null;
            const requesterId = document.getElementById('requester-id').value;
            const status = document.getElementById('status').value;
            const timeTokensRequiredInput = document.getElementById('time-tokens-required').value;
            const timeTokensRequired = timeTokensRequiredInput ? parseFloat(timeTokensRequiredInput) : null;
            const timeTokensPerParticipantInput = document.getElementById('time-tokens-per-participant').value;
            const timeTokensPerParticipant = timeTokensPerParticipantInput ? parseFloat(timeTokensPerParticipantInput) : null;

            // Log values to identify the problematic field
            console.log({
                title,
                description,
                location,
                startDate,
                startTime,
                endDate,
                endTime,
                maxParticipants,
                requesterId,
                status,
                timeTokensRequired,
                timeTokensPerParticipant
            });

            // Validate maxParticipants to ensure it's a positive integer
            if (maxParticipants !== null && (isNaN(maxParticipants) || maxParticipants <= 0)) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดให้ถูกต้อง');
                return;
            }
            if (maxParticipants !== null && !Number.isInteger(maxParticipants)) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดเป็นตัวเลข');
                return;
            }

            // Validate timeTokensRequired to ensure it's a positive number
            if (timeTokensRequired !== null && (isNaN(timeTokensRequired) || timeTokensRequired < 0)) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาที่ต้องการให้ถูกต้อง');
                return;
            }

            // Validate timeTokensPerParticipant to ensure it's a positive number
            if (timeTokensPerParticipant !== null && (isNaN(timeTokensPerParticipant) || timeTokensPerParticipant < 0)) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาต่อผู้เข้าร่วมให้ถูกต้อง');
                return;
            }

            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_id: requesterId,
                status,
                time_tokens_required: timeTokensRequired,
                time_tokens_per_participant: timeTokensPerParticipant
            };

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/activities/${activityId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (response.ok) {
                    alert('กิจกรรมถูกแก้ไขเรียบร้อยแล้ว');
                    window.location.href = 'activity-details.html?id=' + activityId; // Redirect to the activity details page
                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการแก้ไขกิจกรรม');
            }
        }

        function enableEditing() {
            const fields = document.querySelectorAll('.editable');
            fields.forEach(field => {
                field.disabled = false;
            });

            document.getElementById('edit-button').style.display = 'none';
            document.getElementById('save-button').style.display = 'inline-block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchActivityDetails();
            fetchMembers();
            fetchCommunityConfig();

            // Set current date and time if fields are empty
            const currentDate = new Date().toISOString().split('T')[0];
            const currentTime = new Date().toTimeString().split(' ')[0].substring(0, 5);

            if (!document.getElementById('start-date').value) {
                document.getElementById('start-date').value = currentDate;
            }
            if (!document.getElementById('start-time').value) {
                document.getElementById('start-time').value = currentTime;
            }
            if (!document.getElementById('end-date').value) {
                document.getElementById('end-date').value = currentDate;
            }
            if (!document.getElementById('end-time').value) {
                document.getElementById('end-time').value = currentTime;
            }

            updateSidebar();
        });

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->

            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">

                แก้ไขกิจกรรม
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="updateActivity(event)">
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">

                        </div>

                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">

                                <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                <option value="ยกเลิก">ยกเลิก</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-required">
                                จำนวนโทเค็นเวลาที่ต้องการ
                            </label>
                            <input id="time-tokens-required"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" readonly />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-per-participant">
                                จำนวนโทเค็นเวลาต่อผู้เข้าร่วม
                            </label>
                            <input id="time-tokens-per-participant"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" readonly />
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.history.back()">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" id="edit-button" onclick="enableEditing()">แก้ไข</button>
                        <button
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit" id="save-button" style="display: none;">บันทึกการแก้ไข</button>
                        <button
                            class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button"
                            onclick="window.location.href='activity-details-participant.html?id=' + new URLSearchParams(window.location.search).get('id')">รายชื่อผู้เข้าร่วม</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

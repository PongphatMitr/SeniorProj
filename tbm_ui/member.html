<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการสมาชิก - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .dropdown-content {
            display: none;
            position: fixed;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item b {
            color: rgb(0, 123, 255);
            transition: color 0.3s ease;
        }

        .dropdown-item:hover b {
            color: rgb(0, 86, 179);
        }

        .dropdown-item b.red {
            color: red;
        }

        .dropdown-item:hover b.red {
            color: darkred;
        }

        .dropdown-item b.green {
            color: green;
        }

        .dropdown-item:hover b.green {
            color: darkgreen;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white min-h-screen p-5 sticky top-0 flex flex-col z-[1] overflow-visible">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" id="lang-th" data-lang="th">
                        ภาษาไทย
                    </span>
                    <span class="toggle-label" id="lang-en" data-lang="en">
                        English
                    </span>
                </div>
            </div>

            <h1 class="text-4xl font-bold mb-5">จัดการสมาชิก</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">สมาชิก</h2>
                <div class="mb-4 flex items-center">
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="search-bar" oninput="searchMembers()" placeholder="ค้นหาสมาชิก" type="text" />
                    <a class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline ml-2"
                        href="create-member.html">
                        เพิ่ม
                    </a>
                </div>
                <div class="overflow-x-auto">
                    <div class="table-responsive-sm">
                        <table aria-busy="false" aria-colcount="8" class="table b-table b-table-stacked-md w-full"
                            role="table">
                            <thead class="bg-gray-100" role="rowgroup">
                                <tr role="row">
                                    <th aria-colindex="1"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('user_id')">
                                        รหัสสมาชิก <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="2"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('username')">
                                        ชื่อผู้ใช้ <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="3"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('name')">
                                        ชื่อ <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="4"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('time_credits')">
                                        เครดิตเวลา(คะแนน) <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="5"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('status')">
                                        สถานะ <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="6"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col" onclick="sortTable('role')">
                                        บทบาท <i class="fas fa-sort"></i>
                                    </th>
                                    <th aria-colindex="7"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        role="columnheader" scope="col">
                                        ล็อกอินไลน์
                                    </th>
                                    <th aria-colindex="8"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600"
                                        role="columnheader" scope="col">
                                        การจัดการ
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="member-tbody" role="rowgroup">
                                <!-- Members will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="flex items-center justify-center mt-5" id="pagination">
                    <!-- Pagination buttons will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script>
        let defaultTimeToken = 100;
        let members = [];
        let currentPage = 1;
        const pageSize = 10;
        let totalMembers = 0;
        let sortField = '';
        let sortOrder = 'asc';

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    defaultTimeToken = data.default_time_token || defaultTimeToken;
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        async function fetchMembers(page = 1, searchTerm = '', sortField = '', sortOrder = 'asc') {
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members?page=${page}&pageSize=${pageSize}&search=${encodeURIComponent(searchTerm)}&sortField=${sortField}&sortOrder=${sortOrder}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data.members)) {
                    members = data.members;
                    totalMembers = data.total;
                    renderTable(members);
                    renderPagination();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลสมาชิก');
                }
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลสมาชิก');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('member-tbody');
            tbody.innerHTML = '';
            data.forEach((member, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="รหัสสมาชิก" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.user_id}
                    </td>
                    <td aria-colindex="2" data-label="ชื่อผู้ใช้" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.username}
                    </td>
                    <td aria-colindex="3" data-label="ชื่อ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.name}
                    </td>
                    <td aria-colindex="4" data-label="เครดิตเวลา(คะแนน)" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.time_credits}
                    </td>
                    <td aria-colindex="5" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded ${member.status === 'active' ? 'bg-green-500' : 'bg-red-500'} text-white">${member.status === 'active' ? 'ปกติ' : 'ไม่ปกติ'}</span>
                    </td>
                    <td aria-colindex="6" data-label="บทบาท" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.role}
                    </td>
                    <td aria-colindex="7" data-label="ล็อกอินไลน์" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded ${member.logged_in ? 'bg-green-500' : 'bg-red-500'} text-white">${member.logged_in ? 'ล็อกอินเเล้ว' : 'ยังไม่ได้ล็อกอิน'}</span>
                    </td>
                    <td aria-colindex="8" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <div class="relative">
                            <button id="dropdown-${index + 1}__BV_toggle_" aria-haspopup="menu" aria-expanded="false" type="button"
                                class="btn bg-blue-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline"
                                onclick="toggleDropdown(event, ${index + 1})">เลือก</button>
                            <ul role="menu" tabindex="-1" aria-labelledby="dropdown-${index + 1}__BV_toggle_" class="dropdown-content">
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="member-profile.html?memberId=${member.user_id}" target="_self"><b>โปรไฟล์</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="member-transaction.html?memberId=${member.user_id}" target="_self"><b>สมุดบัญชี</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="member-skills.html?memberId=${member.user_id}" target="_self"><b>ความสามารถ</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>PDF</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>วันที่สะดวกทำงาน</b></a></li>
                                ${member.status === 'active' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="confirmAndRemove(event, 'row-${index + 1}', ${member.user_id})"><b class="red">ลบสมาชิก</b></a></li>` :
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="confirmAndRestore(event, 'row-${index + 1}', ${member.user_id})"><b class="green">กู้คืนสมาชิก</b></a></li>`
                    }
                                ${member.role === 'User' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="approveUser(event, ${member.user_id})"><b class="green">อนุมัติ</b></a></li>` : ''
                    }
                                ${member.role === 'Member' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="promoteRole(event, ${member.user_id}, 'TimeBankManager')"><b class="green">เลื่อนขั้นเป็น TimeBankManager</b></a></li>
                        <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="demoteToUser(event, ${member.user_id})"><b class="red">ไล่ออกจากชุมชน</b></a></li>` : ''
                    }
                                ${member.role === 'TimeBankManager' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="promoteRole(event, ${member.user_id}, 'Admin')"><b class="green">เลื่อนขั้นเป็น Admin</b></a></li>` : ''
                    }
                                ${member.role === 'TimeBankManager' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="demoteTimeBankManager(event, ${member.user_id})"><b class="red">ลดขั้น</b></a></li>` : ''
                    }
                                ${member.role === 'Admin' ?
                        `<li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self" onclick="demoteAdmin(event, ${member.user_id})"><b class="red">ลดขั้น</b></a></li>` : ''
                    }
                            </ul>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

                    const totalPages = Math.ceil(totalMembers / pageSize);

                    const firstButton = document.createElement('button');
                    firstButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
                    firstButton.textContent = 'First';
                    firstButton.onclick = () => {
                        currentPage = 1;
                        fetchMembers(currentPage, '', sortField, sortOrder);
                    };
                    paginationContainer.appendChild(firstButton);

                    const prevButton = document.createElement('button');
                    prevButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
                    prevButton.textContent = 'Prev';
                    prevButton.onclick = () => {
                        if (currentPage > 1) {
                            currentPage--;
                            fetchMembers(currentPage, '', sortField, sortOrder);
                        }
                    };
                    paginationContainer.appendChild(prevButton);

                    for (let i = 1; i <= totalPages; i++) {
                        const pageButton = document.createElement('button');
                        pageButton.className = `bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1 ${i === currentPage ? 'bg-blue-700' : ''}`;
                        pageButton.textContent = i;
                        pageButton.onclick = () => {
                            currentPage = i;
                            fetchMembers(currentPage, '', sortField, sortOrder);
                        };
                        paginationContainer.appendChild(pageButton);
                    }

                    const nextButton = document.createElement('button');
                    nextButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
                    nextButton.textContent = 'Next';
                    nextButton.onclick = () => {
                        if (currentPage < totalPages) {
                            currentPage++;
                            fetchMembers(currentPage, '', sortField, sortOrder);
                        }
                    };
                    paginationContainer.appendChild(nextButton);

                    const lastButton = document.createElement('button');
                    lastButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
                    lastButton.textContent = 'Last';
                    lastButton.onclick = () => {
                        currentPage = totalPages;
                        fetchMembers(currentPage, '', sortField, sortOrder);
                    };
                    paginationContainer.appendChild(lastButton);
                }

                function toggleDropdown(event, index) {
                    event.stopPropagation();
                    const dropdownContent = document.querySelector(`#dropdown-${index}__BV_toggle_`).nextElementSibling;
                    const rect = event.currentTarget.getBoundingClientRect();
                    dropdownContent.style.top = `${rect.bottom}px`;
                    dropdownContent.style.left = `${rect.left}px`;
                    dropdownContent.classList.toggle('show');
                }

                window.onclick = function (event) {
                    if (!event.target.matches('.dropdown-button')) {
                        const dropdowns = document.getElementsByClassName("dropdown-content");
                        for (let i = 0; i < dropdowns.length; i++) {
                            const openDropdown = dropdowns[i];
                            if (openDropdown.classList.contains('show')) {
                                openDropdown.classList.remove('show');
                            }
                        }
                    }
                }

                async function searchMembers() {
                    currentPage = 1;
                    const searchTerm = document.getElementById('search-bar').value.toLowerCase();

                    if (searchTerm.trim() === '') {
                        fetchMembers(currentPage, '', sortField, sortOrder);
                        return;
                    }

                    try {
                        const response = await fetch(`http://localhost:3000/api/tbm/members/search?term=${encodeURIComponent(searchTerm)}&page=${currentPage}&pageSize=${pageSize}&sortField=${sortField}&sortOrder=${sortOrder}`, {
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            }
                        });
                        const data = await response.json();
                        if (Array.isArray(data.members)) {
                            members = data.members;
                            totalMembers = data.total;
                            renderTable(members);
                            renderPagination();
                        } else {
                            console.error('Expected an array but got:', data);
                            alert('เกิดข้อผิดพลาดในการค้นหาสมาชิก');
                        }
                    } catch (error) {
                        console.error('Error searching members:', error);
                        alert('เกิดข้อผิดพลาดในการค้นหาสมาชิก');
                    }
                }

                async function confirmAndRemove(event, rowId, memberId) {
                    event.preventDefault();
                    const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบสมาชิกนี้?");
                    if (confirmation) {
                        try {
                            const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}`, {
                                method: 'DELETE',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                }
                            });
                            if (response.ok) {
                                document.getElementById(rowId).remove();
                                alert("สมาชิกถูกลบเรียบร้อยแล้ว");
                            } else {
                                alert("เกิดข้อผิดพลาดในการลบสมาชิก");
                            }
                        } catch (error) {
                            console.error('Error deleting member:', error);
                            alert("เกิดข้อผิดพลาดในการลบสมาชิก");
                        }
                    }
                }

                async function confirmAndRestore(event, rowId, memberId) {
                    event.preventDefault();
                    const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการกู้คืนสมาชิกนี้?");
                    if (confirmation) {
                        try {
                            const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/restore`, {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                }
                            });
                            if (response.ok) {
                                fetchMembers(currentPage, '', sortField, sortOrder);
                                alert("สมาชิกถูกกู้คืนเรียบร้อยแล้ว");
                            } else {
                                alert("เกิดข้อผิดพลาดในการกู้คืนสมาชิก");
                            }
                        } catch (error) {
                            console.error('Error restoring member:', error);
                            alert("เกิดข้อผิดพลาดในการกู้คืนสมาชิก");
                        }
                    }
                }

                async function approveUser(event, memberId) {
                    event.preventDefault();
                    const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการอนุมัติสมาชิกนี้?");
                    if (confirmation) {
                        try {
                            const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/approve`, {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                                    'Content-Type': 'application/json'
                                }
                            });
                            if (response.ok) {
                                fetchMembers(currentPage, '', sortField, sortOrder);
                                alert("สมาชิกถูกอนุมัติเรียบร้อยแล้ว");
                            } else {
                                const errorData = await response.json();
                                alert(`เกิดข้อผิดพลาดในการอนุมัติสมาชิก: ${errorData.error}`);
                            }
                        } catch (error) {
                            console.error('Error approving member:', error);
                            alert("เกิดข้อผิดพลาดในการอนุมัติสมาชิก");
                        }
                    }
                }

                async function promoteRole(event, memberId, newRole) {
                    event.preventDefault();
                    const confirmation = confirm(`คุณแน่ใจหรือไม่ว่าต้องการเลื่อนขั้นสมาชิกนี้เป็น ${newRole}?`);
                    if (confirmation) {
                        try {
                            const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/promote`, {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ newRole })
                            });
                            if (response.ok) {
                                fetchMembers(currentPage, '', sortField, sortOrder);
                                alert(`สมาชิกถูกเลื่อนขั้นเป็น ${newRole} เรียบร้อยแล้ว`);
                            } else {
                                const errorData = await response.json();
                                alert(`เกิดข้อผิดพลาดในการเลื่อนขั้นสมาชิก: ${errorData.error}`);
                            }
                        } catch (error) {
                            console.error('Error promoting member:', error);
                            alert("เกิดข้อผิดพลาดในการเลื่อนขั้นสมาชิก");
                        }
                    }
                }

                async function demoteToUser(event, memberId) {
                    event.preventDefault();
                    const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการไล่ออกจากชุมชน?");
                    if (confirmation) {
                        try {
                            const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/demote`, {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                }
                            });
                            if (response.ok) {
                                fetchMembers(currentPage, '', sortField, sortOrder);
                                alert("สมาชิกถูกไล่ออกจากชุมชนเรียบร้อยแล้ว");
                            } else {
                                alert("เกิดข้อผิดพลาดในการไล่ออกจากชุมชน");
                            }
                        } catch (error) {
                            console.error('Error demoting member:', error);
                            alert("เกิดข้อผิดพลาดในการไล่ออกจากชุมชน");
                        }
                    }
                }

                async function demoteTimeBankManager(event, memberId) {
                    event.preventDefault();
                    const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลดขั้น TimeBankManager นี้?");
                    if (confirmation) {
                        try {

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');
            const mainHeading = document.querySelector('h1');
            const subHeading = document.querySelector('h2');
            const searchPlaceholder = document.querySelector('input[placeholder]');
            const addButton = document.querySelector('a[href="create-member.html"]');
            const tableHeaders = document.querySelectorAll('th');

            const translations = {
                thai: {
                    mainHeading: 'จัดการสมาชิก',
                    subHeading: 'สมาชิก',
                    searchPlaceholder: 'ค้นหาสมาชิก',
                    addButton: 'เพิ่ม',
                    tableHeaders: ['รหัสสมาชิก', 'ชื่อผู้ใช้', 'ชื่อ', 'เครดิตเวลา(คะแนน)', 'สถานะ', 'บทบาท', 'ล็อกอินไลน์', 'การจัดการ']
                },
                english: {
                    mainHeading: 'Manage Members',
                    subHeading: 'Members',
                    searchPlaceholder: 'Search Members',
                    addButton: 'Add',
                    tableHeaders: ['Member ID', 'Username', 'Name', 'Time Credits', 'Status', 'Role', 'LINE Login', 'Actions']
                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];

                // Update static text
                mainHeading.textContent = langData.mainHeading;
                subHeading.textContent = langData.subHeading;
                searchPlaceholder.placeholder = langData.searchPlaceholder;
                addButton.textContent = langData.addButton;

                // Update table headers
                tableHeaders.forEach((header, index) => {
                    header.textContent = langData.tableHeaders[index];
                });

                // Toggle active state
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }

                localStorage.setItem('selectedLanguage', lang);
            }

            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                updateContent(currentLang);
            });

            // Initialize content
            updateContent(currentLang);
        });
    </script>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการสมาชิก - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item b {
            color: rgb(0, 123, 255);
            transition: color 0.3s ease;
        }

        .dropdown-item:hover b {
            color: rgb(0, 86, 179);
        }

        .dropdown-item b.red {
            color: red;
        }

        .dropdown-item:hover b.red {
            color: darkred;
        }
    </style>
    <script>
        let members = [];

        async function confirmAndRemove(event, rowId, memberId) {
            event.preventDefault();
            const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบสมาชิกนี้?");
            if (confirmation) {
                const response = await fetch(`http://localhost:3000/api/members/${memberId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    document.getElementById(rowId).remove();
                    alert("สมาชิกถูกลบเรียบร้อยแล้ว");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบสมาชิก");
                }
            }
        }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                members = await response.json();
                renderTable(members);
            } catch (error) {
                console.error('Error fetching members:', error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('member-tbody');
            tbody.innerHTML = '';
            data.forEach((member, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="รหัสสมาชิก" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.member_id}
                    </td>
                    <td aria-colindex="2" data-label="ชื่อ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.name}
                    </td>
                    <td aria-colindex="3" data-label="เครดิตเวลา(คะแนน)" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${member.time_credits}
                    </td>
                    <td aria-colindex="4" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="badge badge-success" style="width: 100px;">${member.status === 'active' ? 'ปกติ' : 'ไม่ปกติ'}</span>
                    </td>
                    <td aria-colindex="5" data-label="ล็อกอินไลน์" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="badge badge-success" style="width: 100px;">ล็อกอินเเล้ว</span>
                    </td>
                    <td aria-colindex="6" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <div class="dropdown b-dropdown m-md-2 btn-group">
                            <button id="dropdown-${index + 1}__BV_toggle_" aria-haspopup="menu" aria-expanded="false" type="button"
                                class="btn bg-blue-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline"
                                onclick="toggleDropdown(event)">เลือก</button>
                            <ul role="menu" tabindex="-1" aria-labelledby="dropdown-${index + 1}__BV_toggle_" class="dropdown-content">
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>โปรไฟล์</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>สมุดบัญชี</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>แก้ไข</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>PDF</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>ความสามารถ</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b>วันที่สะดวกทำงาน</b></a></li>
                                <li role="presentation" class="dropdown-item"><a role="menuitem" href="#" target="_self"><b class="red">ลบสมาชิก</b></a></li>
                            </ul>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdownContent = event.currentTarget.nextElementSibling;
            dropdownContent.classList.toggle('show');
        }

        window.onclick = function (event) {
            if (!event.target.matches('.dropdown-button')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', fetchMembers);
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/GOMFBEaepyxe3E3gz2xaZviBDO0q04rV6Cz8h1wgcnNFaw5TA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">จัดการสมาชิก</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">สมาชิก</h2>
                <div class="mb-4 flex items-center">
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        type="text" placeholder="ค้นหาสมาชิก" />
                    <a href="create-member.html"
                        class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline ml-2">เพิ่ม</a>
                </div>
                <div class="overflow-x-auto">
                    <div class="table-responsive-sm">
                        <table role="table" aria-busy="false" aria-colcount="6"
                            class="table b-table b-table-stacked-md w-full">
                            <thead role="rowgroup" class="bg-gray-100">
                                <tr role="row">
                                    <th role="columnheader" scope="col" aria-colindex="1"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        รหัสสมาชิก
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="2"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        ชื่อ
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="3"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        เครดิตเวลา(คะแนน)
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="4"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        สถานะ
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="5"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        ล็อกอินไลน์
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="6"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        การจัดการ
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="member-tbody" role="rowgroup">
                                <!-- Members will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

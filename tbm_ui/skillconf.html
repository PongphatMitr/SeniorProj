<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการหมวดหมู่ทักษะ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let skills = [];

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    renderSkills(skills);
                    renderCategoryButtons();
                } else {
                    console.error('Expected an array but got:', data);
                    showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        function escapeSelector(selector) {
            return selector.replace(/([!"#$%&'()*+,.\/:;<=>?@[\\\]^`{|}~])/g, '\\$1');
        }

        function renderSkills(data) {
            const skillContainer = document.getElementById('skill-container');
            skillContainer.innerHTML = '';
            // เก็บเวลาของหมวดหมู่ตามข้อมูลใน skills
const categoryMap = {};
data.forEach(skill => {
    if (!categoryMap[skill.category] || new Date(skill.updated_at) > new Date(categoryMap[skill.category])) {
        categoryMap[skill.category] = skill.updated_at;
    }
});

// เอาหมวดหมู่ทั้งหมดมาเรียงใหม่ตาม updated_at ล่าสุด
const categories = Object.keys(categoryMap)
    .sort((a, b) => new Date(categoryMap[b]) - new Date(categoryMap[a]));


            categories.forEach(category => {
                const escapedCategory = escapeSelector(category);
                const categoryDiv = document.createElement('div');
                categoryDiv.className = `bg-gray-100 p-7 rounded-lg category w-full md:w-1/ mb-5`;
                categoryDiv.setAttribute('data-category', category);

                categoryDiv.innerHTML = `
    <div class="mb-2">
        <p class="text-2xl font-bold text-gray-1000 mb-1">หมวดหมู่</p>
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl category-name ml-4">${category}</h3>
            <div>
                <button
                    class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline"
                    type="button" onclick="modifyCategory('${category.replace(/'/g, "\\'")}')">แก้ไข</button>
            </div>
        </div>
        <p class="text-2xl font-bold text-gray-700 mb-2">ทักษะ</p>
    </div>
`;

                data.filter(skill => skill.category === category).forEach(skill => {
                    const skillP = document.createElement('p');
                    skillP.className = 'mb-2 flex justify-between items-center';
                    skillP.innerHTML = `
    <span class="text-lg skill-name ml-4">${skill.name}</span>
    <button
        class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline hidden ml-4"
        type="button" onclick="removeSkill(${skill.skill_id})">ลบ</button>
`;
                    categoryDiv.appendChild(skillP);
                });

                skillContainer.appendChild(categoryDiv);
            });
        }

        function renderCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('category-buttons');
            categoryButtonsContainer.innerHTML = '';

            const categories = [...new Set(skills.map(skill => skill.category))];

            const allButton = document.createElement('button');
            allButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
            allButton.textContent = 'All';
            allButton.onclick = () => showCategory('all');
            categoryButtonsContainer.appendChild(allButton);

            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
                button.textContent = category;
                button.onclick = () => showCategory(category);
                categoryButtonsContainer.appendChild(button);
            });
        }

        function showCategory(category) {
            if (category === 'all') {
                renderSkills(skills);
            } else {
                const filteredSkills = skills.filter(skill => skill.category === category);
                renderSkills(filteredSkills);
            }
        }

        async function modifyCategory(category) {
            const escapedCategory = escapeSelector(category);
            const categoryDiv = [...document.querySelectorAll('.category')].find(div =>
                div.getAttribute('data-category') === category
            );
            if (!categoryDiv) {
                console.error(`Category div not found for category: ${category}`);
                return;
            }
            if (!categoryDiv) {
                console.error(`Category div not found for category: ${category}`);
                return;
            }
            const skillNames = categoryDiv.querySelectorAll('.skill-name');
            const deleteButtons = categoryDiv.querySelectorAll('button.bg-red-500');
            const categoryNameElement = categoryDiv.querySelector('.category-name');

            // Replace category name with input field
            const categoryInputContainer = document.createElement('div');
            categoryInputContainer.className = 'flex items-center space-x-2';
            const categoryInput = document.createElement('input');
            categoryInput.type = 'text';
            categoryInput.value = category;
            categoryInput.className = 'shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 text-xl leading-tight focus:outline-none focus:shadow-outline';
            // ✅ เพิ่ม padding และ font-size ให้ใหญ่กว่าปกติ
            categoryInputContainer.appendChild(categoryInput);
            categoryNameElement.replaceWith(categoryInputContainer);

            skillNames.forEach(skillName => {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = skillName.textContent;
                input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                skillName.replaceWith(input);
            });

            deleteButtons.forEach(button => {
                button.classList.remove('hidden');
            });

            // Add button to add new skills
            const addSkillButton = document.createElement('button');
            addSkillButton.className = 'bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 mt-2 rounded focus:outline-none focus:shadow-outline';
            addSkillButton.textContent = 'เพิ่มทักษะใหม่';
            addSkillButton.type = 'button';
            addSkillButton.onclick = () => {
                const newSkillInput = document.createElement('input');
                newSkillInput.type = 'text';
                newSkillInput.placeholder = 'ชื่อทักษะใหม่';
                newSkillInput.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-2';
                categoryDiv.insertBefore(newSkillInput, addSkillButton);
            };
            categoryDiv.appendChild(addSkillButton);

            const modifyButton = categoryDiv.querySelector('button.bg-yellow-500');
            modifyButton.textContent = 'บันทึก';
            modifyButton.onclick = async () => {
                const newSkills = [];
                const inputs = categoryDiv.querySelectorAll('input');
                const newCategory = categoryInput.value;

                inputs.forEach((input, index) => {
                    if (index > 0) {
                        newSkills.push({ name: input.value, skill_id: skills.find(skill => skill.name === skillNames[index - 1]?.textContent)?.skill_id || null });
                    }
                });

                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/skills/category/${encodeURIComponent(category)}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ newCategory, newSkills })
                    });

                    if (response.ok) {
                        showSuccessModal('หมวดหมู่ถูกแก้ไขเรียบร้อยแล้ว');
                        fetchSkills();
                    } else {
                        const errorText = await response.text();
                        console.error('Error response:', errorText);
                        showErrorModal('เกิดข้อผิดพลาดในการแก้ไขหมวดหมู่');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showErrorModal('เกิดข้อผิดพลาดในการแก้ไขหมวดหมู่');
                }
            };
        }

        async function removeSkill(skillId) {
            showConfirmModal('คุณแน่ใจหรือไม่ว่าต้องการลบทักษะนี้?', async () => {
                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/skills/${skillId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (response.ok) {
                        showSuccessModal('ทักษะถูกลบเรียบร้อยแล้ว');
                        fetchSkills();
                    } else {
                        showErrorModal('เกิดข้อผิดพลาดในการลบทักษะ');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showErrorModal('เกิดข้อผิดพลาดในการลบทักษะ');
                }
            });
        }

        async function searchSkills() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    renderSkills(data);
                } else {
                    console.error('Expected an array but got:', data);
                    showErrorModal('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                showErrorModal('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchSkills();
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>  
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>

            <h1 class="text-4xl font-bold mb-5">จัดการหมวดหมู่ทักษะ</h1>
            <div class="flex justify-center">
                <div class="bg-white text-black p-5 rounded-lg w-full md:w-full lg:w-full">
                    <div class="mb-4 flex items-center">
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" id="search-bar" placeholder="ค้นหาทักษะหรือหมวดหมู่" oninput="searchSkills()" />
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.location.href='create-skill.html'">เพิ่ม</button>
                    </div>
                    <div id="category-buttons" class="flex justify-center mb-5">
                        <!-- Category buttons will be dynamically inserted here -->
                    </div>
                    <div id="skill-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <!-- Skills will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
<!-- Success Modal -->
<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="success-modal">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
        <div class="flex justify-center">
            <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
            </div>
        </div>
        <h2 class="text-3xl font-bold text-green-600 mt-6">สำเร็จ!</h2>
        <p class="text-gray-700 text-lg mt-4" id="success-message">ทำรายการเรียบร้อยแล้ว</p>
        <button id="success-confirm-btn"
            class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
            ตกลง
        </button>
    </div>
</div>

<!-- Error Modal -->
<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="error-modal">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
        <div class="flex justify-center">
            <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    </path>
                </svg>
            </div>
        </div>
        <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด</h2>
        <p class="text-gray-700 text-lg mt-4" id="error-message">มีบางอย่างผิดพลาด</p>
        <button id="error-confirm-btn"
            class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
            ตกลง
        </button>
    </div>
</div>

<!-- Confirm Modal -->
<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden" id="confirm-modal">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
        <h2 class="text-3xl font-bold text-yellow-500" id="confirm-title">ยืนยัน</h2>
        <p class="text-gray-700 text-lg mt-4" id="confirm-message">คุณแน่ใจหรือไม่?</p>
        <div class="mt-6 flex justify-center gap-4">
            <button id="confirm-yes-btn"
                class="px-6 py-3 bg-green-600 text-white text-lg font-semibold rounded-lg hover:bg-green-700 transition duration-300">ตกลง</button>
            <button id="confirm-no-btn"
                class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300">ยกเลิก</button>
        </div>
    </div>
</div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            /* Increase border radius for larger container */
            padding: 6px;
            /* Larger padding for better spacing */
            align-items: center;
            justify-content: space-between;
            width: 180px;
            /* Increase width for a larger toggle */
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            /* Blue for active text */
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            /* Make it unclickable */
            background-color: white;
            color: #6B7280;
            /* Light gray text */
            font-weight: bold;
        }
    </style>

    <script src="navbar.js"></script>

    <script>
        function showConfirmModal(message, onConfirm) {
                const modal = document.getElementById('confirm-modal');
                document.getElementById('confirm-message').textContent = message;
                modal.classList.remove('hidden');

                document.getElementById('confirm-yes-btn').onclick = () => {
                    modal.classList.add('hidden');
                    onConfirm(); // ถ้ากดตกลง ให้ทำสิ่งที่สั่ง
                };

                document.getElementById('confirm-no-btn').onclick = () => {
                    modal.classList.add('hidden'); // ถ้ากดยกเลิก แค่ปิด modal
                };
            }

        function showSuccessModal(message) {
                const modal = document.getElementById('success-modal');
                document.getElementById('success-message').textContent = message;
                modal.classList.remove('hidden');
                document.getElementById('success-confirm-btn').onclick = () => modal.classList.add('hidden');
            }

            function showErrorModal(message) {
                const modal = document.getElementById('error-modal');
                document.getElementById('error-message').textContent = message;
                modal.classList.remove('hidden');
                document.getElementById('error-confirm-btn').onclick = () => modal.classList.add('hidden');
            }

        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    pageTitle: 'จัดการหมวดหมู่ทักษะ - Time Bank',
                    mainHeading: 'จัดการหมวดหมู่ทักษะ',
                    searchPlaceholder: 'ค้นหาทักษะหรือหมวดหมู่',
                    addButton: 'เพิ่ม',
                    nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],

                },
                english: {
                    pageTitle: 'Skill Categories Management - Time Bank',
                    mainHeading: 'Skill Categories Management',
                    searchPlaceholder: 'Search skills or categories',
                    addButton: 'Add',
                    nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],

                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            const updateContent = (lang) => {
                const langData = translations[lang];

                // Update page title
                document.title = langData.pageTitle;

        // Update main heading
                document.querySelector('h1').textContent = langData.mainHeading;

                // Update search placeholder
                document.getElementById('search-bar').placeholder = langData.searchPlaceholder;

                // Update add button text
                document.querySelector('button[onclick="window.location.href=\'create-skill.html\'"]').textContent = langData.addButton;

                // Update navigation
                const navLinks = document.querySelectorAll('nav ul li a');
                langData.nav.forEach((text, index) => {
                    if (navLinks[index]) {
                        const icon = navLinks[index].querySelector('i');
                        navLinks[index].innerHTML = '';
                        if (icon) navLinks[index].appendChild(icon);
                        navLinks[index].appendChild(document.createTextNode(text));
                    }
                });
            };
        });
        </script>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการหมวดหมู่ทักษะ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let skills = [];

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    renderSkills(skills);
                    renderCategoryButtons();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        function renderSkills(data) {
            const skillContainer = document.getElementById('skill-container');
            skillContainer.innerHTML = '';
            const categories = [...new Set(data.map(skill => skill.category))];

            categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = `bg-gray-100 p-7 rounded-lg category category-${category} w-full md:w-1/ mb-5`;
                categoryDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold category-name">${category}</h3>
                        <div>
                            <button
                                class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline"
                                type="button" onclick="modifyCategory('${category}')">แก้ไข</button>
                        </div>
                    </div>
                `;

                data.filter(skill => skill.category === category).forEach(skill => {
                    const skillP = document.createElement('p');
                    skillP.className = 'mb-2';
                    skillP.innerHTML = `
                        <span class="skill-name">${skill.name}</span>
                        <button
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 ml-2 mt-2 rounded focus:outline-none focus:shadow-outline hidden"
                            type="button" onclick="removeSkill(${skill.skill_id})">ลบ</button>
                    `;
                    categoryDiv.appendChild(skillP);
                });

                skillContainer.appendChild(categoryDiv);
            });
        }

        function renderCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('category-buttons');
            categoryButtonsContainer.innerHTML = '';

            const categories = [...new Set(skills.map(skill => skill.category))];

            const allButton = document.createElement('button');
            allButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
            allButton.textContent = 'All';
            allButton.onclick = () => showCategory('all');
            categoryButtonsContainer.appendChild(allButton);

            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
                button.textContent = category;
                button.onclick = () => showCategory(category);
                categoryButtonsContainer.appendChild(button);
            });
        }

        function showCategory(category) {
            if (category === 'all') {
                renderSkills(skills);
            } else {
                const filteredSkills = skills.filter(skill => skill.category === category);
                renderSkills(filteredSkills);
            }
        }

        async function modifyCategory(category) {
            const categoryDiv = document.querySelector(`.category-${category}`);
            const skillNames = categoryDiv.querySelectorAll('.skill-name');
            const deleteButtons = categoryDiv.querySelectorAll('button.bg-red-500');
            const categoryNameElement = categoryDiv.querySelector('.category-name');

            // Replace category name with input field
            const categoryInputContainer = document.createElement('div');
            categoryInputContainer.className = 'flex items-center space-x-2';
            const categoryInput = document.createElement('input');
            categoryInput.type = 'text';
            categoryInput.value = category;
            categoryInput.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
            categoryInputContainer.appendChild(categoryInput);
            categoryNameElement.replaceWith(categoryInputContainer);

            skillNames.forEach(skillName => {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = skillName.textContent;
                input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                skillName.replaceWith(input);
            });

            deleteButtons.forEach(button => {
                button.classList.remove('hidden');
            });

            // Add button to add new skills
            const addSkillButton = document.createElement('button');
            addSkillButton.className = 'bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 mt-2 rounded focus:outline-none focus:shadow-outline';
            addSkillButton.textContent = 'เพิ่มทักษะใหม่';
            addSkillButton.type = 'button';
            addSkillButton.onclick = () => {
                const newSkillInput = document.createElement('input');
                newSkillInput.type = 'text';
                newSkillInput.placeholder = 'ชื่อทักษะใหม่';
                newSkillInput.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-2';
                categoryDiv.insertBefore(newSkillInput, addSkillButton);
            };
            categoryDiv.appendChild(addSkillButton);

            const modifyButton = categoryDiv.querySelector('button.bg-yellow-500');
            modifyButton.textContent = 'บันทึก';
            modifyButton.onclick = async () => {
                const newSkills = [];
                const inputs = categoryDiv.querySelectorAll('input');
                const newCategory = categoryInput.value;

                inputs.forEach((input, index) => {
                    if (index > 0) { // Skip the first input which is the category input
                        newSkills.push({ name: input.value, skill_id: skills.find(skill => skill.name === skillNames[index - 1]?.textContent)?.skill_id || null });
                    }
                });

                console.log('Sending update request for category:', category);
                console.log('New category name:', newCategory);
                console.log('New skills data:', newSkills);

                try {
                    const response = await fetch(`http://localhost:3000/api/skills/category/${encodeURIComponent(category)}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ newCategory, newSkills })
                    });

                    if (response.ok) {
                        alert('หมวดหมู่ถูกแก้ไขเรียบร้อยแล้ว');
                        fetchSkills();
                    } else {
                        const errorText = await response.text();
                        console.error('Error response:', errorText);
                        alert('เกิดข้อผิดพลาดในการแก้ไขหมวดหมู่');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('เกิดข้อผิดพลาดในการแก้ไขหมวดหมู่');
                }
            };
        }

        async function removeSkill(skillId) {
            const confirmation = confirm('คุณแน่ใจหรือไม่ว่าต้องการลบทักษะนี้?');
            if (confirmation) {
                try {
                    const response = await fetch(`http://localhost:3000/api/skills/${skillId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (response.ok) {
                        alert('ทักษะถูกลบเรียบร้อยแล้ว');
                        fetchSkills();
                    } else {
                        alert('เกิดข้อผิดพลาดในการลบทักษะ');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('เกิดข้อผิดพลาดในการลบทักษะ');
                }
            }
        }

        async function searchSkills() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            try {
                const response = await fetch(`http://localhost:3000/api/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    renderSkills(data);
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

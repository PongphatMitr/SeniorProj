<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ความสามารถ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet" />
    <script src="navbar.js"></script>
    <script>
        let memberId;
        let skills = [];
        let memberSkills = [];

        async function fetchMemberId() {
            const urlParams = new URLSearchParams(window.location.search);
            memberId = urlParams.get('memberId');
            if (!memberId) {
                alert('ไม่พบรหัสสมาชิก');
                return;
            }
            await fetchSkills();
        }

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    await fetchMemberSkills();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        async function fetchMemberSkills() {
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/skills`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Fetched member skills:', data);
                memberSkills = [
                    data.skills[0] ? { skill_id: data.skills[0].skill_id, name: data.skills[0].name, category: data.skills[0].category } : { skill_id: null, name: 'ยังไม่มีทักษะ', category: 'ไม่ระบุ' },
                    data.skills[1] ? { skill_id: data.skills[1].skill_id, name: data.skills[1].name, category: data.skills[1].category } : { skill_id: null, name: 'ยังไม่มีทักษะ', category: 'ไม่ระบุ' },
                    data.skills[2] ? { skill_id: data.skills[2].skill_id, name: data.skills[2].name, category: data.skills[2].category } : { skill_id: null, name: 'ยังไม่มีทักษะ', category: 'ไม่ระบุ' }
                ];
                renderSkills();
                populateCategoryDropdowns();
            } catch (error) {
                console.error('Error fetching member skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะของสมาชิก');
            }
        }

        // Populate all category dropdowns on initial load
        function populateCategoryDropdowns() {
            for (let i = 1; i <= 3; i++) {
                populateCategoryDropdown(i);
            }
        }

        function renderSkills() {
            for (let i = 1; i <= 3; i++) {
                const skill = memberSkills[i - 1];
                const skillContainer = document.getElementById(`skill-display-${i}`);
                if (!skillContainer) continue;
                skillContainer.innerHTML = `
      <div>
        <h3 class="text-xl font-semibold text-gray-700">หมวดหมู่: <span class="text-2xl font-bold text-blue-600">${skill?.category || 'ไม่ระบุหมวดหมู่'}</span></h3>
        <h3 class="text-xl font-semibold text-gray-700 mt-1">ทักษะ: <span class="text-2xl font-bold text-green-600">${skill?.name || 'ยังไม่มีทักษะที่ลงทะเบียน'}</span></h3>
        <div class="flex justify-center mt-3">
          <button class="bg-blue-500 text-white px-4 py-2 rounded transition duration-300 hover:bg-blue-600 hover:scale-105" onclick="toggleEdit(${i})">แก้ไข</button>
        </div>
      </div>
    `;
            }
        }

        function toggleEdit(index) {
            const displaySection = document.getElementById(`skill-display-${index}`);
            const editSection = document.getElementById(`edit-container-${index}`);
            displaySection.classList.add('hidden');
            editSection.classList.remove('hidden');
            populateCategoryDropdown(index);
            populateSkillDropdown(index);
            clearSearchBar(index);
            clearSearchResults(index);
        }

        function cancelEdit(index) {
            document.getElementById(`skill-display-${index}`).classList.remove('hidden');
            document.getElementById(`edit-container-${index}`).classList.add('hidden');
            clearSearchBar(index);
            clearSearchResults(index);
        }

        function clearSearchBar(index) {
            const searchBar = document.getElementById(`search-bar-${index}`);
            if (searchBar) searchBar.value = '';
        }

        function clearSearchResults(index) {
            const resultsContainer = document.getElementById(`search-results-${index}`);
            if (resultsContainer) resultsContainer.innerHTML = '';
        }

        function populateCategoryDropdown(index) {
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
            if (!categoryDropdown) return;
            const categories = [...new Set(skills.map(skill => skill.category))];
            categoryDropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>';
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryDropdown.appendChild(option);
            });
            categoryDropdown.value = memberSkills[index - 1]?.category || '';
        }

        function populateSkillDropdown(index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            if (!skillDropdown) return;
            const selectedSkillIds = memberSkills
                .map((skill, i) => (i + 1 !== index ? skill.skill_id : null))
                .filter(id => id !== null);
            skillDropdown.innerHTML = '';
            // Show all skills in the member's category or all if none selected
            const currentCategory = document.getElementById(`category-dropdown-${index}`).value;
            let filteredSkills = skills;
            if (currentCategory) {
                filteredSkills = skills.filter(skill => skill.category === currentCategory);
            }
            filteredSkills.forEach(skill => {
                if (!selectedSkillIds.includes(skill.skill_id) || memberSkills[index - 1]?.skill_id === skill.skill_id) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                }
            });
            skillDropdown.value = memberSkills[index - 1]?.skill_id || '';
            skillDropdown.disabled = filteredSkills.length === 0;
        }

        function filterSkillsByCategory(event) {
            const selectedCategory = event.target.value;
            const skillDropdownId = event.target.id.replace('category-dropdown', 'skill-dropdown');
            const skillDropdown = document.getElementById(skillDropdownId);
            if (!skillDropdown) return;
            skillDropdown.innerHTML = '';
            if (!selectedCategory) {
                skillDropdown.disabled = true;
                return;
            }
            const selectedIndex = parseInt(skillDropdownId.split('-').pop(), 10);
            const selectedSkillIds = memberSkills
                .map((skill, i) => (i + 1 !== selectedIndex ? skill.skill_id : null))
                .filter(id => id !== null);
            const filteredSkills = skills.filter(skill => skill.category === selectedCategory);
            filteredSkills.forEach(skill => {
                if (!selectedSkillIds.includes(skill.skill_id)) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                }
            });
            skillDropdown.disabled = filteredSkills.length === 0;
        }

        async function searchSkills(event, index) {
            const searchTerm = event.target.value.trim().toLowerCase();
            const resultsContainer = document.getElementById(`search-results-${index}`);
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            if (!resultsContainer || !skillDropdown) return;
            resultsContainer.innerHTML = '';
            if (!searchTerm) {
                // If search is empty, repopulate dropdown based on selected category
                const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
                if (categoryDropdown && categoryDropdown.value) {
                    filterSkillsByCategory({ target: categoryDropdown });
                } else {
                    populateSkillDropdown(index);
                }
                skillDropdown.disabled = false;
                return;
            }
            try {
                // Use encodeURIComponent to handle Thai characters properly
                const response = await fetch(`http://localhost:3000/api/tbm/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    const registeredSkillIds = memberSkills.map(skill => skill.skill_id).filter(id => id !== null);
                    const filteredSkills = data.filter(skill => !registeredSkillIds.includes(skill.skill_id) || memberSkills[index - 1]?.skill_id === skill.skill_id);
                    if (filteredSkills.length === 0) {
                        resultsContainer.innerHTML = `<div class="p-2 text-gray-500">ไม่พบทักษะที่ค้นหา</div>`;
                        skillDropdown.disabled = true;
                        return;
                    }
                    filteredSkills.forEach(skill => {
                        const div = document.createElement('div');
                        div.className = "cursor-pointer p-2 hover:bg-blue-100 text-gray-800 border-b border-gray-200";
                        div.textContent = `${skill.name} (${skill.category})`;
                        div.tabIndex = 0;
                        div.setAttribute('role', 'button');
                        div.setAttribute('aria-label', `เลือกทักษะ ${skill.name} หมวดหมู่ ${skill.category}`);
                        div.onclick = () => {
                            selectSkillFromSearch(skill, index);
                        };
                        div.onkeydown = (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                selectSkillFromSearch(skill, index);
                            }
                        };
                        resultsContainer.appendChild(div);
                    });
                    skillDropdown.disabled = false;
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        function selectSkillFromSearch(skill, index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            if (!skillDropdown) return;
            skillDropdown.value = skill.skill_id;
            clearSearchResults(index);
            const searchBar = document.getElementById(`search-bar-${index}`);
            if (searchBar) searchBar.value = skill.name;
            // Optionally, focus the skill dropdown after selection
            skillDropdown.focus();
        }

        async function saveSkill(index) {
            const dropdown = document.getElementById(`skill-dropdown-${index}`);
            if (!dropdown) return;
            const selectedSkillId = dropdown.value;
            if (!selectedSkillId) {
                showErrorMessage("กรุณาเลือกทักษะก่อนบันทึก");
                return;
            }
            if (memberSkills.some(skill => skill.skill_id === selectedSkillId && skill.skill_id !== memberSkills[index - 1].skill_id)) {
                showErrorMessage("คุณได้ลงทะเบียนทักษะนี้แล้ว กรุณาเลือกทักษะอื่น");
                return;
            }
            const payload = {
                skill_1: memberSkills[0].skill_id,
                skill_2: memberSkills[1].skill_id,
                skill_3: memberSkills[2].skill_id
            };
            payload[`skill_${index}`] = selectedSkillId;
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/skills`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(payload)
                });
                const responseData = await response.json();
                if (response.ok) {
                    await fetchMemberSkills();
                    renderSkills();
                    cancelEdit(index);
                    showSuccessMessage(responseData.message || `บันทึกทักษะที่ ${index} สำเร็จ!`);
                } else {
                    console.error('Server responded with an error:', responseData);
                    showErrorMessage(responseData.error || 'เกิดข้อผิดพลาดในการบันทึกทักษะ');
                }
            } catch (error) {
                console.error('Error in saveSkill:', error);
                showErrorMessage('เกิดข้อผิดพลาดในการบันทึกทักษะ');
            }
        }

        function clearSkill(index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
            if (skillDropdown) skillDropdown.value = "";
            if (categoryDropdown) categoryDropdown.value = "";
            memberSkills[index - 1] = { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" };
            renderSkills();
            cancelEdit(index);
        }

        function showSuccessMessage(message) {
            document.getElementById('success-message').textContent = message;
            const modal = document.getElementById('success-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        }

        function showErrorMessage(message) {
            alert(message);
        }

        function confirmAction(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
            document.getElementById('confirm-btn').onclick = function () {
                closeModal('confirm-modal');
                onConfirm();
            };
            document.getElementById('cancel-btn').onclick = function () {
                closeModal('confirm-modal');
            };
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('opacity-100', 'scale-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchMemberId();
            const confirmSuccessBtn = document.getElementById('confirm-success-btn');
            const confirmErrorBtn = document.getElementById('confirm-error-btn');
            if (confirmSuccessBtn) {
                confirmSuccessBtn.addEventListener('click', function () {
                    closeModal('success-modal');
                });
            }
            if (confirmErrorBtn) {
                confirmErrorBtn.addEventListener('click', function () {
                    closeModal('error-modal');
                });
            }
        });
    </script>

</head>

        </div>
    </div>
    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-xl text-center">
            <h2 class="text-3xl font-bold text-gray-900">ยืนยันการกระทำ</h2>
            <p id="confirm-message" class="text-gray-700 text-lg mt-4"></p>
            <div class="flex justify-center mt-6 space-x-4">
                <button id="confirm-btn"
                    class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition">ตกลง</button>
                <button id="cancel-btn"
                    class="bg-gray-400 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-500 transition">ยกเลิก</button>
            </div>
        </div>
    </div>
    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center">
            <h2 class="text-4xl font-bold text-green-600 mt-6">✅ สำเร็จ!</h2>
            <p id="success-message" class="text-gray-700 text-xl mt-4"></p>
            <button id="confirm-success-btn"
                class="mt-8 px-8 py-4 bg-blue-600 text-white text-xl font-semibold rounded-lg hover:bg-blue-700 transition">ตกลง</button>
        </div>
    </div>
    <!-- Error Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center">
            <h2 class="text-4xl font-bold text-red-600 mt-6">❌ เกิดข้อผิดพลาด</h2>
            <p id="error-message" class="text-gray-700 text-xl mt-4"></p>
            <button id="confirm-error-btn"
                class="mt-8 px-8 py-4 bg-red-600 text-white text-xl font-semibold rounded-lg hover:bg-red-700 transition">ตกลง</button>
        </div>
    </div>
</body>

</html>

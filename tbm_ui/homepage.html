<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <li class="mb-4">
                        <a class="text-blue-600 hover:text-blue-800" href="homepage.html">
                            Home
                        </a>
                    </li>
                    <li class="mb-4">
                        <a class="text-blue-600 hover:text-blue-800" href="announcement.html">
                            Announcements
                        </a>
                    </li>
                    <li class="mb-4">
                        <a class="text-blue-600 hover:text-blue-800" href="about.html">
                            About
                        </a>
                    </li>
                    <li class="mb-4">
                        <a class="text-blue-600 hover:text-blue-800" href="contact.html">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10 relative">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" data-lang="th" id="lang-th">ภาษาไทย</span>
                    <span class="toggle-label" data-lang="en" id="lang-en">English</span>
                </div>
            </div>
            <h1 class="text-4xl font-bold mb-5">TIME BANK</h1>
            <h2 class="text-3xl font-bold mb-5">ธนาคารเวลา คืออะไร ?</h2>
            <p class="mb-10">
                เป็นรูปแบบกิจกรรม ที่ช่วยส่งเสริมให้ชุมชนดูแลซึ่งกันและกัน ด้วยการแลกเปลี่ยนทักษะ ประสบการณ์
                บริการขั้นพื้นฐาน และสามารถสะสมเวลาไว้ เสมือนเราออมเงิน
            </p>
            <div class="flex items-center mb-5">
                <h2 class="text-3xl font-bold mr-4">ข่าวสารประชาสัมพันธ์</h2>
                <a class="bg-white text-blue-600 px-4 py-2 rounded" href="announcement.html">Add Announcement</a>
            </div>
            <div class="grid grid-cols-2 gap-5" id="newsContainer">
                <!-- News items will be dynamically inserted here -->
            </div>
        </div>
    </div>
    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 homepage.js loaded and DOM ready!');

            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    mainHeading: 'ธนาคารเวลา',
                    subHeading: 'ธนาคารเวลา คืออะไร ?',
                    description: 'เป็นรูปแบบกิจกรรม ที่ช่วยส่งเสริมให้ชุมชนดูแลซึ่งกันและกัน ด้วยการแลกเปลี่ยนทักษะ ประสบการณ์ บริการขั้นพื้นฐาน และสามารถสะสมเวลาไว้ เสมือนเราออมเงิน',
                    newsHeader: 'ข่าวสารประชาสัมพันธ์',
                },
                english: {
                    mainHeading: 'TIME BANK',
                    subHeading: 'What is a Time Bank?',
                    description: 'A Time Bank is an activity model that helps communities support each other by exchanging skills, experiences, and basic services, allowing participants to save time as if saving money.',
                    newsHeader: 'News and Announcements',
                }
            };

            const mainHeading = document.querySelector('h1');
            const subHeading = document.querySelector('h2:nth-of-type(1)');
            const description = document.querySelector('p.mb-10');
            const newsHeader = document.querySelector('h2:nth-of-type(2)');
            const newsContainer = document.getElementById('newsContainer');

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];

                if (mainHeading) mainHeading.textContent = langData.mainHeading;
                if (subHeading) subHeading.textContent = langData.subHeading;
                if (description) description.textContent = langData.description;
                if (newsHeader) newsHeader.textContent = langData.newsHeader;

                // Toggle active state
                if (lang === 'thai') {
                    langThai?.classList.add('active');
                    langEnglish?.classList.remove('active');
                } else {
                    langEnglish?.classList.add('active');
                    langThai?.classList.remove('active');
                }

                localStorage.setItem('selectedLanguage', lang);
            }

            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                updateContent(currentLang);
            });

            // Initialize content
            updateContent(currentLang);

            function arrayBufferToBase64(buffer) {
                if (!buffer || !buffer.length) return '';
                const binary = buffer.map((b) => String.fromCharCode(b)).join('');
                return window.btoa(binary);
            }

            // ✅ Fetch and render announcements with detailed logging
            function fetchAnnouncements() {
                console.log('🔄 Connecting to database to fetch announcements...');

                fetch('http://localhost:3000/api/tbm/announcements/')
                    .then(res => {
                        console.log('📡 API Response:', res);
                        if (!res.ok) throw new Error(`❌ Failed to fetch. Status: ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        console.log('📦 Data:', data);
                        newsContainer.innerHTML = '';

                        data.forEach((announcement, index) => {
                            const newsElement = document.createElement('div');
                            newsElement.classList.add('bg-white', 'text-black', 'p-5', 'rounded-lg', 'shadow', 'relative', 'cursor-pointer');
                            newsElement.addEventListener('click', () => {
                                window.location.href = `announcement-detail.html?id=${announcement.announcement_id}`;
                            });

                            let imageUrl = 'https://placehold.co/300x200?text=No+Image';
                            if (announcement.image?.data && Array.isArray(announcement.image.data)) {
                                try {
                                    imageUrl = `data:image/jpeg;base64,${arrayBufferToBase64(announcement.image.data)}`;
                                    console.log(`🖼️ Converted image for #${index + 1}`);
                                } catch (e) {
                                    console.warn(`⚠️ Image conversion failed at #${index + 1}`, e);
                                }
                            }

                            newsElement.innerHTML = `
                            <button class="absolute top-2 right-2 bg-red-600 text-white px-2 py-1 rounded delete-btn" data-id="${announcement.announcement_id}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <img src="${imageUrl}" class="h-40 w-full object-cover mb-5 rounded" alt="Announcement image">
                            <p class="text-gray-500 mb-2">${new Date(announcement.date).toLocaleDateString()}</p>
                            <p class="font-bold text-lg">${announcement.title}</p>
                            <p>${announcement.description}</p>
                        `;

                            newsContainer.appendChild(newsElement);
                            console.log(`✅ Rendered #${index + 1}`);
                        });

                        if (data.length === 0) {
                            console.log('📭 No announcements in DB');
                        }

                        // Add event listeners to delete buttons
                        document.querySelectorAll('.delete-btn').forEach(button => {
                            button.addEventListener('click', async (e) => {
                                e.stopPropagation(); // Prevent the click event from propagating to the parent element
                                const announcementId = button.getAttribute('data-id');
                                const token = localStorage.getItem('token');

                                if (confirm('Are you sure you want to delete this announcement?')) {
                                    try {
                                        const response = await fetch(`http://localhost:3000/api/tbm/announcements/${announcementId}`, {
                                            method: 'DELETE',
                                            headers: {
                                                'Authorization': `Bearer ${token}`
                                            }
                                        });

                                        if (response.ok) {
                                            alert('Announcement deleted successfully.');
                                            fetchAnnouncements(); // Refresh the announcements list
                                        } else {
                                            alert('Failed to delete announcement.');
                                        }
                                    } catch (error) {
                                        console.error('Error deleting announcement:', error);
                                        alert('An error occurred while deleting the announcement.');
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.error('🚨 Error fetching announcements:', err);
                    });
            }

            fetchAnnouncements();
        });
    </script>
    <script src="navbar.js"></script>
</body>

</html>

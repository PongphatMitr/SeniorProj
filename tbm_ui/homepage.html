<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" id="lang-th" data-lang="th">
                        ภาษาไทย
                    </span>
                    <span class="toggle-label" id="lang-en" data-lang="en">
                        English
                    </span>
                </div>
            </div>

            <h1 class="text-4xl font-bold mb-5">
                TIME BANK
            </h1>
            <h2 class="text-3xl font-bold mb-5">
                ธนาคารเวลา คืออะไร ?
            </h2>
            <p class="mb-10">
                เป็นรูปแบบกิจกรรม ที่ช่วยส่งเสริมให้ชุมชนดูแลซึ่งกันและกัน ด้วยการแลกเปลี่ยนทักษะ ประสบการณ์
                บริการขั้นพื้นฐาน และสามารถสะสมเวลาไว้ เสมือนเราออมเงิน
            </p>
            <div class="flex items-center mb-5">
                <h2 class="text-3xl font-bold mr-4">
                    ข่าวสารประชาสัมพันธ์
                </h2>
                <a href="announcement.html" class="bg-white text-blue-600 px-4 py-2 rounded">Add Announcement</a>
            </div>
            <div class="grid grid-cols-2 gap-5" id="newsContainer">
                <!-- News items will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>

    <script src="navbar.js"></script>
    <script src="selected-language.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    mainHeading: 'ธนาคารเวลา',
                    subHeading: 'ธนาคารเวลา คืออะไร ?',
                    description: 'เป็นรูปแบบกิจกรรม ที่ช่วยส่งเสริมให้ชุมชนดูแลซึ่งกันและกัน ด้วยการแลกเปลี่ยนทักษะ ประสบการณ์ บริการขั้นพื้นฐาน และสามารถสะสมเวลาไว้ เสมือนเราออมเงิน',
                    newsHeader: 'ข่าวสารประชาสัมพันธ์',
                    news: [
                        { date: '01/01/2023', title: 'กิจกรรมทำความสะอาดชุมชน' },
                        { date: '15/01/2023', title: 'กิจกรรมสอนคอมพิวเตอร์' },
                        { date: '20/01/2023', title: 'กิจกรรมดูแลผู้สูงอายุ' },
                        { date: '25/01/2023', title: 'กิจกรรมซ่อมแซมบ้าน' },
                        { date: '30/01/2023', title: 'กิจกรรมทำอาหาร' },
                        { date: '05/02/2023', title: 'กิจกรรมทำสวน' },
                        { date: '10/02/2023', title: 'กิจกรรมซ่อมรถ' },
                        { date: '15/02/2023', title: 'กิจกรรมดูแลเด็ก' }
                    ],
                },
                english: {
                    mainHeading: 'TIME BANK',
                    subHeading: 'What is a Time Bank?',
                    description: 'A Time Bank is an activity model that helps communities support each other by exchanging skills, experiences, and basic services, allowing participants to save time as if saving money.',
                    newsHeader: 'News and Announcements',
                    news: [
                        { date: '01/01/2023', title: 'Community Cleanup Activity' },
                        { date: '15/01/2023', title: 'Computer Training Activity' },
                        { date: '20/01/2023', title: 'Elderly Care Activity' },
                        { date: '25/01/2023', title: 'Home Repair Activity' },
                        { date: '30/01/2023', title: 'Cooking Activity' },
                        { date: '05/02/2023', title: 'Gardening Activity' },
                        { date: '10/02/2023', title: 'Car Repair Activity' },
                        { date: '15/02/2023', title: 'Childcare Activity' }
                    ],
                }
            };

            const mainHeading = document.querySelector('h1');
            const subHeading = document.querySelector('h2:nth-of-type(1)');
            const description = document.querySelector('p.mb-10');
            const newsHeader = document.querySelector('h2:nth-of-type(2)');
            const newsContainer = document.getElementById('newsContainer');

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];

                // Update main content
                mainHeading.textContent = langData.mainHeading;
                subHeading.textContent = langData.subHeading;
                description.textContent = langData.description;
                newsHeader.textContent = langData.newsHeader;

                // Update news
                newsContainer.innerHTML = '';
                langData.news.forEach(newsItem => {
                    const newsElement = document.createElement('div');
                    newsElement.classList.add('bg-white', 'text-black', 'p-5', 'rounded-lg');
                    newsElement.innerHTML = `
                        <img alt="News image placeholder, a generic image with text 'News Image' in the center"
                            class="h-40 w-full object-cover mb-5" height="200"
                            src="https://storage.googleapis.com/a1aa/image/e9VxoFV0eAsrlU8uOeanTOXq5j5CkmFkRSnKOhypDpZUaetPB.jpg"
                            width="300" />
                        <p class="text-gray-500 mb-2">${newsItem.date}</p>
                        <p>${newsItem.title}</p>
                    `;
                    newsContainer.appendChild(newsElement);
                });

                // Toggle active state
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }

                localStorage.setItem('selectedLanguage', lang);
            }

            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                updateContent(currentLang);
            });

            // Initialize content
            updateContent(currentLang);

            // Fetch and display announcements
            async function fetchAnnouncements() {
                try {
                    const response = await fetch('/tbm/announcements');
                    const announcements = await response.json();

                    newsContainer.innerHTML = '';
                    announcements.forEach(announcement => {
                        const newsElement = document.createElement('div');
                        newsElement.classList.add('bg-white', 'text-black', 'p-5', 'rounded-lg');
                        const imageUrl = `data:image/jpeg;base64,${btoa(String.fromCharCode(...new Uint8Array(announcement.image.data)))}`;
                        newsElement.innerHTML = `
                            <img alt="Announcement image" class="h-40 w-full object-cover mb-5" height="200" src="${imageUrl}" width="300" />
                            <p class="text-gray-500 mb-2">${announcement.date}</p>
                            <p class="font-bold">${announcement.title}</p>
                            <p>${announcement.description}</p>
                        `;
                        newsContainer.appendChild(newsElement);
                    });
                } catch (error) {
                    console.error('Error fetching announcements:', error);
                }
            }

            fetchAnnouncements();
        });
    </script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Profile Skills - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10 flex flex-col justify-center items-center">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <!-- Menu List -->
            <div class="w-full max-w-3xl mb-10">
                <nav class="flex justify-around">
                    <a href="profile.html" class="text-white hover:text-gray-300 font-bold">
                        <i class="fas fa-user mr-2"></i> โปรไฟล์
                    </a>
                    <a href="profile-skills.html" class="text-white hover:text-gray-300 font-bold">
                        <i class="fas fa-cogs mr-2"></i> ทักษะความสามารถ
                    </a>
                </nav>
            </div>
            <div class="bg-white text-black p-10 rounded-xl shadow-xl w-full max-w-3xl border border-gray-200">
                <h1 class="text-4xl font-bold mb-5 text-center">ทักษะความสามารถ</h1>
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">ทักษะของผู้ใช้</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-36 gap-y-4 ml-24" id="skills-container">
                    <!-- Skills will be dynamically inserted here -->
                </div>
                <div class="flex justify-center mt-4 space-x-4">
                    <button
                        class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal แบบใหม่ -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                    <svg class="w-12 h-12 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด!</h2>
            <p id="error-message" class="text-gray-700 text-lg mt-4">เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง</p>
            <button id="error-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <script>
        function showErrorModal(message) {
                document.getElementById('error-message').textContent = message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
                document.getElementById('error-modal').classList.remove('hidden');
            }

            function setupErrorModal() {
                const errorConfirmBtn = document.getElementById('error-confirm-btn');
                if (errorConfirmBtn) {
                    errorConfirmBtn.addEventListener('click', () => {
                        document.getElementById('error-modal').classList.add('hidden');
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                setupErrorModal();
            });

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                console.error('No token found. Redirecting to login page.');
                window.location.href = 'login.html';
                return;
            }

            // Fetch user profile information to get user ID
            fetch('http://localhost:3000/api/tbm/auth/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(profileData => {
                    const userId = profileData.user_id;
                    // Fetch user skills information using the user ID
                    fetch(`http://localhost:3000/api/tbm/skills/members/${userId}/skills`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(data => {
                            const skills = data.skills;
                            renderUserSkills(skills);
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            showErrorModal('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                        });
                })
                .catch(error => {
                    console.error('Error:', error);
                    showErrorModal('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                });

        });

        function renderUserSkills(skills) {
            const skillsContainer = document.getElementById('skills-container');
            skillsContainer.innerHTML = ''; // Clear any existing content

            skills.forEach((skill, index) => {
                const skillElement = document.createElement('div');
                skillElement.classList.add('mb-4');
                skillElement.innerHTML = `
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="user-skill-${index + 1}">ทักษะ ${index + 1}:</label>
                    <p class="text-gray-700 text-lg" id="user-skill-${index + 1}">${skill.name || 'N/A'}</p>
                `;
                skillsContainer.appendChild(skillElement);
            });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('profileData');
            window.location.href = 'login.html';
        }
    </script>
    <script src="navbar.js"></script>
    <script src="selected-language.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>รายงาน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script>
        async function fetchReportData() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/report', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data) {
                    document.getElementById('total-transactions').textContent = `${data.totalTransactions} รายการ`;
                    document.getElementById('total-activities').textContent = `${data.totalActivities} กิจกรรม`;

                    // Top Ranking Members
                    const topMembersContainer = document.getElementById('top-members');
                    topMembersContainer.innerHTML = '';
                    data.topMembers.forEach(member => {
                        const div = document.createElement('div');
                        div.className = 'flex justify-between text-lg text-blue-600 mb-2';
                        const name = document.createElement('span');
                        name.className = 'mr-2';
                        name.textContent = member.name;
                        const count = document.createElement('span');
                        count.textContent = `${member.activity_count} กิจกรรม`;
                        div.appendChild(name);
                        div.appendChild(count);
                        topMembersContainer.appendChild(div);
                    });

                    // Total Volume Flow
                    document.getElementById('total-volume').textContent = `${data.totalTransactions} รายการ`;

                    // Daily, Monthly, Yearly Volume Flow
                    updateVolumeFlow(data.dailyVolume, 'daily');
                    updateVolumeFlow(data.monthlyVolume, 'monthly');
                    updateVolumeFlow(data.yearlyVolume, 'yearly');
                } else {
                    console.error('Expected data but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลรายงาน');
                }
            } catch (error) {
                console.error('Error fetching report data:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลรายงาน');
            }
        }

        function updateVolumeFlow(volumeData, type) {
            const container = document.getElementById(`${type}-volume`);
            if (container) {
                container.innerHTML = '';
                const count = volumeData.reduce((acc, item) => acc + parseInt(item[`${type}_volume`]), 0);
                const p = document.createElement('p');
                p.textContent = `${count} รายการ`;
                p.className = 'text-lg text-center text-blue-600';
                container.appendChild(p);
            }
        }

        function showVolume(type) {
            const volumeSections = document.querySelectorAll('.volume-section');
            volumeSections.forEach(section => {
                section.style.display = 'none';
            });

            document.querySelectorAll(`.${type}-volume`).forEach(section => {
                section.style.display = 'block';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchReportData();
            showVolume('daily'); // Default to daily volume
        });
    </script>
</head>

<body class="bg-gray-100 font-roboto">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be populated by navbar.js -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">รายงาน</h1>
            <div class="flex justify-center mb-4">
                <button onclick="showVolume('daily')"
                    class="bg-white text-blue-500 border border-blue-500 px-4 py-2 rounded mr-2">รายวัน</button>
                <button onclick="showVolume('monthly')"
                    class="bg-white text-blue-500 border border-blue-500 px-4 py-2 rounded mr-2">รายเดือน</button>
                <button onclick="showVolume('yearly')"
                    class="bg-white text-blue-500 border border-blue-500 px-4 py-2 rounded">รายปี</button>
            </div>
            <div class="flex flex-col md:flex-row gap-5">
                <div class="bg-white text-black p-4 rounded-lg shadow-lg md:w-1/4 h-full">
                    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">สมาชิกที่เข้าร่วมกิจกรรมมากที่สุด</h2>
                    <div id="top-members" class="text-blue-600">
                        <p class="text-lg text-center text-blue-600">Loading...</p>
                    </div>
                </div>
                <div class="flex flex-col gap-1/2 flex-1">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">จำนวนธุรกรรม</h2>
                            <p id="total-transactions" class="text-lg text-center text-blue-600">Loading...</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">จำนวนกิจกรรม</h2>
                            <p id="total-activities" class="text-lg text-center text-blue-600">Loading...</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">ปริมาณการไหล</h2>
                            <p id="total-volume" class="text-lg text-center text-blue-600">Loading...</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-5">
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 1</h2>
                            <p class="text-lg text-center text-blue-600">Content 1</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 2</h2>
                            <p class="text-lg text-center text-blue-600">Content 2</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 3</h2>
                            <p class="text-lg text-center text-blue-600">Content 3</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-5">
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 4</h2>
                            <p class="text-lg text-center text-blue-600">Content 4</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 5</h2>
                            <p class="text-lg text-center text-blue-600">Content 5</p>
                        </div>
                        <div class="bg-white text-black p-4 rounded-lg shadow-lg">
                            <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Box 6</h2>
                            <p class="text-lg text-center text-blue-600">Content 6</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
</body>

</html>

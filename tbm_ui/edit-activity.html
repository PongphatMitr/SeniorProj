<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        แก้ไขกิจกรรม - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const activity = await response.json();

                if (activity) {
                    document.getElementById('service-title').value = activity.title;
                    document.getElementById('service-description').value = activity.description;
                    document.getElementById('service-location').value = activity.location;
                    document.getElementById('service-date').value = activity.date;
                    document.getElementById('service-time-start').value = activity.start_time;
                    document.getElementById('service-time-end').value = activity.end_time;
                    document.getElementById('service-people').value = activity.max_participants;
                    document.getElementById('requester-name').value = activity.requester_name;
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        async function updateActivity(event) {
            event.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            const title = document.getElementById('service-title').value;
            const description = document.getElementById('service-description').value;
            const location = document.getElementById('service-location').value;
            const date = document.getElementById('service-date').value;
            const start_time = document.getElementById('service-time-start').value;
            const end_time = document.getElementById('service-time-end').value;
            const max_participants = document.getElementById('service-people').value;
            const requester_name = document.getElementById('requester-name').value;
            const status = 'upcoming'; // Default status for updated activities

            const activityData = {
                title,
                description,
                location,
                date,
                start_time,
                end_time,
                max_participants,
                requester_name,
                status
            };

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (response.ok) {
                    alert('กิจกรรมถูกแก้ไขเรียบร้อยแล้ว');
                    window.location.href = 'activity-details.html?id=' + activityId; // Redirect to the activity details page
                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการแก้ไขกิจกรรม');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchActivityDetails);
    </script>
</head>

<body class="bg-gray-100">

                    width="50" />

                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">

                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                แก้ไขกิจกรรม
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="updateActivity(event)">
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-title">
                                ชื่อบริการ
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-title" placeholder="ชื่อบริการ" type="text" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-date">
                                วันที่ให้บริการ
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-calendar-alt text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-date').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-date" type="date" required />
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-start">
                                เวลาเริ่มต้น
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-clock text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-time-start').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-time-start" type="time" required />
                            </div>
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-end">
                                เวลาสิ้นสุด
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-clock text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-time-end').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-time-end" type="time" required />
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-location">
                                สถานที่จัด
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-location" placeholder="สถานที่จัด" type="text" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-people">
                                จำนวนคน
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-people" placeholder="จำนวนคน" type="number" required />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                                ชื่อผู้ขอบริการ
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="requester-name" placeholder="ชื่อผู้ขอบริการ" type="text" required />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-description">
                            รายละเอียดบริการ
                        </label>
                        <textarea
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="service-description" placeholder="รายละเอียดบริการ" required></textarea>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.history.back()">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">
                            บันทึกการแก้ไข
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

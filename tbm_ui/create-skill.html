<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>เพิ่มทักษะใหม่ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        function addCategory() {
            const newCategory = prompt("กรุณาใส่ชื่อหมวดหมู่ใหม่:");
            if (newCategory) {
                const select = document.getElementById('categorySelect');
                const option = document.createElement('option');
                option.value = newCategory;
                option.text = newCategory;
                select.add(option);
                select.value = newCategory;
            }
        }
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/GOMFBEaepyxe3E3gz2xaZviBDO0q04rV6Cz8h1wgcnNFaw5TA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">เพิ่มทักษะใหม่</h1>
            <div class="bg-white text-black p-5 rounded-lg">
                <form>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="skillName">
                            ชื่อทักษะ
                        </label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="skillName" type="text" placeholder="ชื่อทักษะ" />
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="categorySelect">
                            หมวดหมู่
                        </label>
                        <div class="flex items-center">
                            <select
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="categorySelect">
                                <option value="หมวดหมู่ทักษะ 1">หมวดหมู่ทักษะ 1</option>
                                <option value="หมวดหมู่ทักษะ 2">หมวดหมู่ทักษะ 2</option>
                                <option value="หมวดหมู่ทักษะ 3">หมวดหมู่ทักษะ 3</option>
                                <option value="หมวดหมู่ทักษะ 4">หมวดหมู่ทักษะ 4</option>
                                <option value="หมวดหมู่ทักษะ 5">หมวดหมู่ทักษะ 5</option>
                                <option value="หมวดหมู่ทักษะ 6">หมวดหมู่ทักษะ 6</option>
                            </select>
                            <button
                                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 whitespace-nowrap rounded focus:outline-none focus:shadow-outline"
                                type="button" onclick="addCategory()">เพิ่มหมวดหมู่</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.history.back()">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">บันทึก</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

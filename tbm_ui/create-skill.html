<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>เพิ่มทักษะใหม่ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <h1 class="text-4xl font-bold mb-5">เพิ่มทักษะใหม่</h1>
            <div class="bg-white text-black p-5 rounded-lg">
                <form onsubmit="createSkill(event)">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="skillName">ชื่อทักษะ</label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="skillName" placeholder="ชื่อทักษะ" required="" type="text" />
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="categorySelect">หมวดหมู่</label>
                        <div class="flex items-center">
                            <select
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="categorySelect" required="">
                            </select>
                            <button
                                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 whitespace-nowrap rounded focus:outline-none focus:shadow-outline"
                                onclick="addCategory()" type="button">เพิ่มหมวดหมู่</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            onclick="window.history.back()" type="button">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">บันทึก</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">เพิ่มทักษะสำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4" id="success-message">ข้อความ</p>
            <button id="success-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <!-- Error Modal (styled like Delete Confirm) -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message">ข้อความ</p>
            <div class="mt-6 flex justify-center">
                <button id="error-confirm-btn"
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="add-category-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-bold text-blue-600 mb-4">เพิ่มหมวดหมู่ใหม่</h2>
            <input id="new-category-name" type="text"
                class="shadow appearance-none border rounded w-full py-2 px-3 mb-6 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                placeholder="กรุณาใส่ชื่อหมวดหมู่ใหม่" />
            <div class="flex justify-center gap-4">
                <button id="confirm-add-category"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">
                    ตกลง
                </button>
                <button id="cancel-add-category"
                    class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>

    <script>
        function showSuccessModal(message, redirectUrl = null) {
                document.getElementById('success-message').textContent = message;
                const modal = document.getElementById('success-modal');
                modal.classList.remove('hidden');

                const confirmBtn = document.getElementById('success-confirm-btn');
                confirmBtn.onclick = () => {
                    modal.classList.add('hidden');
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    }
                };
            }

            function showErrorModal(message) {
                    document.getElementById('error-message').textContent = message;
                    const modal = document.getElementById('error-modal');
                    modal.classList.remove('hidden');

                    document.getElementById('error-confirm-btn').onclick = () => {
                        modal.classList.add('hidden');
                    };
                }

        async function fetchCategories() {
            const token = localStorage.getItem('token');
            console.log('Token:', token);  // ตรวจสอบว่า token ถูกส่งหรือไม่

            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills/categories', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const categories = await response.json();
                console.log('Fetched Categories:', categories);  // ตรวจสอบค่าที่ดึงได้

                const select = document.getElementById('categorySelect');
                select.innerHTML = '';  // ล้างค่าเก่าก่อนแสดงผลใหม่

                if (Array.isArray(categories)) {
                    categories.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.category_id;  // ตรวจสอบว่ามี category_id หรือไม่
                        option.text = category.category;
                        select.add(option);
                    });
                } else {
                    console.error('Expected an array but received:', categories);
                    showErrorModal('ไม่สามารถโหลดหมวดหมู่ได้');
                }
            } catch (error) {
                console.error('Error fetching categories:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลหมวดหมู่');
            }
        }

        function addCategory() {
                const modal = document.getElementById('add-category-modal');
                const input = document.getElementById('new-category-name');
                const confirmBtn = document.getElementById('confirm-add-category');
                const cancelBtn = document.getElementById('cancel-add-category');

                input.value = ''; // เคลียร์ input ก่อนโชว์
                modal.classList.remove('hidden');

                confirmBtn.onclick = async () => {
                    const newCategory = input.value.trim();
                    if (newCategory) {
                        try {
                            const response = await fetch('http://localhost:3000/api/tbm/skills/categories', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                },
                                body: JSON.stringify({ category: newCategory })
                            });

                            if (response.ok) {
                                const category = await response.json();
                                const select = document.getElementById('categorySelect');
                                const option = document.createElement('option');
                                option.value = category.category_id;
                                option.text = category.category;
                                select.add(option);
                                select.value = category.category_id;
                                modal.classList.add('hidden');
                            } else {
                                showErrorModal('เกิดข้อผิดพลาดในการเพิ่มหมวดหมู่');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            showErrorModal('เกิดข้อผิดพลาดในการเพิ่มหมวดหมู่');
                        }
                    } else {
                        showErrorModal('กรุณากรอกชื่อหมวดหมู่');
                    }
                };

                cancelBtn.onclick = () => {
                    modal.classList.add('hidden');
                };
            }

        async function createSkill(event) {
            event.preventDefault();
            const skillName = document.getElementById('skillName').value;
            const category_id = document.getElementById('categorySelect').value;

            const skillPayload = {
                name: skillName,
                category_id: category_id
            };

            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(skillPayload)
                });

                if (response.ok) {
                    showSuccessModal('ทักษะถูกเพิ่มเรียบร้อยแล้ว', 'skillconf.html');
                } else {
                    showErrorModal('เกิดข้อผิดพลาดในการเพิ่มทักษะ');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorModal('เกิดข้อผิดพลาดในการเพิ่มทักษะ');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchCategories();
        });
    </script>
    <script src="navbar.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการกองทุนชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <h1 class="text-4xl font-bold mb-5">จัดการกองทุนชุมชน</h1>
            <div class="bg-white text-black p-5 rounded-lg">
                <div class="grid grid-cols-2 gap-5">
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">ยอดคงเหลือในกองทุน</h3>
                        <p id="totalHours" class="text-4xl font-bold text-center text-blue-600">Loading...</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">จำนวนชั่วโมงที่กู้</h3>
                        <p id="borrowedHours" class="text-4xl font-bold text-center text-red-600">Loading...</p>
                    </div>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-4">เพิ่มชั่วโมงเข้าสู่กองทุน</h2>
                    <div class="mb-4">
                        <input id="addHoursInput"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="updateFund('add')">เพิ่มชั่วโมง</button>
                    </div>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-4">กู้ชั่วโมงจากกองทุน</h2>
                    <div class="mb-4">
                        <input id="borrowHoursInput"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="updateFund('borrow')">กู้ชั่วโมง</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">สำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4" id="success-message">ข้อความสำเร็จ</p>
            <button id="success-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <!-- Error Message Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message">ข้อความผิดพลาด</p>
            <div class="mt-6 flex justify-center">
                <button id="error-confirm-btn"
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <script>
        function showSuccessModal(message) {
                document.getElementById('success-message').textContent = message;
                document.getElementById('success-modal').classList.remove('hidden');
                document.getElementById('success-confirm-btn').onclick = function () {
                    document.getElementById('success-modal').classList.add('hidden');
                };
            }

            function showErrorModal(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-modal').classList.remove('hidden');
                document.getElementById('error-confirm-btn').onclick = function () {
                    document.getElementById('error-modal').classList.add('hidden');
                };
            }

        async function fetchFundData() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/fund', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const fundData = await response.json();
                document.getElementById('totalHours').innerText = `${fundData.total_hours} ชั่วโมง`;
                document.getElementById('borrowedHours').innerText = `${fundData.borrowed_hours} ชั่วโมง`;
            } catch (error) {
                console.error('Error fetching fund data:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลกองทุน');
            }
        }

        async function updateFund(action) {
            const hours = document.getElementById(`${action}HoursInput`).value;
            if (!hours) {
                showErrorModal('กรุณาใส่จำนวนชั่วโมง');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/fund/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ hours: parseInt(hours) })
                });

                if (response.ok) {
                    showSuccessModal(`ชั่วโมงถูก${action === 'add' ? 'เพิ่ม' : 'กู้'}เรียบร้อยแล้ว`);
                    fetchFundData();
                } else {
                    showErrorModal(`เกิดข้อผิดพลาดในการ${action === 'add' ? 'เพิ่ม' : 'กู้'}ชั่วโมง`);
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorModal(`เกิดข้อผิดพลาดในการ${action === 'add' ? 'เพิ่ม' : 'กู้'}ชั่วโมง`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchFundData();
        });
    </script>
    <script src="navbar.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

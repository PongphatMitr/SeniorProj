<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการกองทุนชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        async function fetchFundData() {
            try {
                const response = await fetch('http://localhost:3000/api/fund', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const fundData = await response.json();
                document.getElementById('totalHours').innerText = `${fundData.total_hours} ชั่วโมง`;
                document.getElementById('borrowedHours').innerText = `${fundData.borrowed_hours} ชั่วโมง`;
            } catch (error) {
                console.error('Error fetching fund data:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลกองทุน');
            }
        }

        async function updateFund(action) {
            const hours = document.getElementById(`${action}HoursInput`).value;
            if (!hours) {
                alert('กรุณาใส่จำนวนชั่วโมง');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/fund/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ hours: parseInt(hours) })
                });

                if (response.ok) {
                    alert(`ชั่วโมงถูก${action === 'add' ? 'เพิ่ม' : 'กู้'}เรียบร้อยแล้ว`);
                    fetchFundData();
                } else {
                    alert(`เกิดข้อผิดพลาดในการ${action === 'add' ? 'เพิ่ม' : 'กู้'}ชั่วโมง`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert(`เกิดข้อผิดพลาดในการ${action === 'add' ? 'เพิ่ม' : 'กู้'}ชั่วโมง`);
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                            รายงาน

                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม

                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"

                    <li class="mb-5">

                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchFundData();
        });
    </script>
</head>

            <div class="bg-white text-black p-5 rounded-lg">
                <div class="grid grid-cols-2 gap-5">
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">ยอดคงเหลือในกองทุน</h3>
                        <p id="totalHours" class="text-4xl font-bold text-center text-blue-600">Loading...</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">จำนวนชั่วโมงที่กู้</h3>

                </div>

                    <h2 class="text-2xl font-bold mb-4">เพิ่มชั่วโมงเข้าสู่กองทุน</h2>

                        <input
                            id="addHoursInput"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="updateFund('add')">เพิ่มชั่วโมง</button>
                    </div>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-4">กู้ชั่วโมงจากกองทุน</h2>
                    <div class="mb-4">
                        <input
                            id="borrowHoursInput"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="updateFund('borrow')">กู้ชั่วโมง</button>
                    </div>
                </div>

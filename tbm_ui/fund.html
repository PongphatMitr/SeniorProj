<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>จัดการกองทุนชุมชน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-1/5 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/GOMFBEaepyxe3E3gz2xaZviBDO0q04rV6Cz8h1wgcnNFaw5TA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">TIMEBANK</span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="homepage.html">
                            <i class="fas fa-home mr-3"></i>หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="member.html">
                            <i class="fas fa-users mr-3"></i>จัดการสมาชิก
                        </a>
                    </li>
                    <li>
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>Login
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-4/5 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">จัดการกองทุนชุมชน</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">กองทุนชุมชน</h2>
                <div class="grid grid-cols-2 gap-5">
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">ยอดคงเหลือในกองทุน</h3>
                        <p class="text-4xl font-bold text-center text-blue-600">200 ชั่วโมง</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-lg">
                        <h3 class="text-xl font-bold mb-4">จำนวนชั่วโมงที่กู้</h3>
                        <p class="text-4xl font-bold text-center text-red-600">50 ชั่วโมง</p>
                    </div>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-4">เพิ่มชั่วโมงเข้าสู่กองทุน</h2>
                    <div class="mb-4">
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button">เพิ่มชั่วโมง</button>
                    </div>
                </div>
                <div class="mt-10">
                    <h2 class="text-2xl font-bold mb-4">กู้ชั่วโมงจากกองทุน</h2>
                    <div class="mb-4">
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" placeholder="จำนวนชั่วโมง" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button">กู้ชั่วโมง</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        โปรไฟล์สมาชิก - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item b {
            color: rgb(0, 123, 255);
            transition: color 0.3s ease;
        }

        .dropdown-item:hover b {
            color: rgb(0, 86, 179);
        }

        .dropdown-item b.red {
            color: red;
        }

        .dropdown-item:hover b.red {
            color: darkred;
        }
    </style>
    <script>
        let memberId = 1; // This should be dynamically set based on the member being viewed

        async function fetchMemberProfile() {
            try {
                const response = await fetch(`http://localhost:3000/api/members/${memberId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const member = await response.json();
                renderMemberProfile(member);
            } catch (error) {
                console.error('Error fetching member profile:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลโปรไฟล์สมาชิก');
            }
        }

        function renderMemberProfile(member) {
            document.getElementById('member-name').textContent = member.name;
            document.getElementById('member-phone').textContent = member.phone;
            document.getElementById('member-address').textContent = member.address;
            document.getElementById('member-branch').textContent = member.branch;
            document.getElementById('member-time-credits').textContent = member.time_credits;
            document.getElementById('member-status').textContent = member.status === 'active' ? 'ปกติ' : 'ไม่ปกติ';
        }

        function enableEditing() {
            const fields = ['member-name', 'member-phone', 'member-address', 'member-branch', 'member-time-credits', 'member-status'];
            fields.forEach(field => {
                const element = document.getElementById(field);
                const input = document.createElement('input');
                input.type = 'text';
                input.value = element.textContent;
                input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                element.parentNode.replaceChild(input, element);
                input.id = field;
            });

            const editButton = document.getElementById('edit-button');
            editButton.textContent = 'บันทึก';
            editButton.onclick = saveChanges;
        }

        async function saveChanges() {
            const member = {
                name: document.getElementById('member-name').value,
                phone: document.getElementById('member-phone').value,
                address: document.getElementById('member-address').value,
                branch: document.getElementById('member-branch').value,
                time_credits: document.getElementById('member-time-credits').value,
                status: document.getElementById('member-status').value
            };

            try {
                const response = await fetch(`http://localhost:3000/api/members/${memberId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(member)
                });

                if (response.ok) {
                    renderMemberProfile(member);
                    const fields = ['member-name', 'member-phone', 'member-address', 'member-branch', 'member-time-credits', 'member-status'];
                    fields.forEach(field => {
                        const element = document.getElementById(field);
                        const p = document.createElement('p');
                        p.textContent = element.value;
                        p.className = 'text-gray-700 text-lg';
                        element.parentNode.replaceChild(p, element);
                        p.id = field;
                    });

                    const editButton = document.getElementById('edit-button');
                    editButton.textContent = 'แก้ไข';
                    editButton.onclick = enableEditing;
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                }
            } catch (error) {
                console.error('Error saving member profile:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMemberProfile();
        });
    </script>
</head>

<body class="bg-gray-100">

                    class="w-10 h-10 rounded-full" height="50" src="https://placehold.co/50x50" width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3">
                            </i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3">
                            </i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3">
                            </i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3">
                            </i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3">
                            </i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"

                            </i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                โปรไฟล์สมาชิก
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    ข้อมูลสมาชิก
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-name">
                            ชื่อ:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-name">
                        </p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-phone">
                            เบอร์โทร:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-phone">
                        </p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-address">
                            ที่อยู่:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-address">
                        </p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-branch">
                            สาขา:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-branch">
                        </p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-time-credits">
                            เครดิตเวลา:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-time-credits">
                        </p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-status">
                            สถานะ:
                        </label>
                        <p class="text-gray-700 text-lg" id="member-status">
                        </p>
                    </div>
                </div>
                <div class="flex justify-end mt-4">
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id="edit-button" onclick="enableEditing()">
                        แก้ไข
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>โปรไฟล์สมาชิก - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let memberId;
        let memberStatus;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            memberId = urlParams.get('memberId');

            if (!memberId) {
                console.error('No memberId provided in the URL');
                alert('ไม่พบรหัสสมาชิกใน URL');
                return;
            }

            console.log('Member ID:', memberId); // Debugging line
            fetchMemberProfile(memberId);
        });

        async function fetchMemberProfile(memberId) {
            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/tbm/${memberId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const member = await response.json();
                memberStatus = member.status; // Store the status for later use
                renderMemberProfile(member);
            } catch (error) {
                console.error('Error fetching member profile:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลโปรไฟล์สมาชิก');
            }
        }

        function renderMemberProfile(member) {
            document.getElementById('member-name').textContent = member.name || 'N/A';
            document.getElementById('member-phone').textContent = member.phone || 'N/A';
            document.getElementById('member-address').textContent = member.address || 'N/A';
            document.getElementById('member-branch').textContent = member.branch || 'N/A';
            document.getElementById('member-time-credits').textContent = member.time_credits || 'N/A';
            document.getElementById('member-status').textContent = member.status === 'active' ? 'ปกติ' : 'ไม่ปกติ';
        }

        function enableEditing() {
            const fields = ['member-name', 'member-phone', 'member-address'];
            fields.forEach(field => {
                const element = document.getElementById(field);
                const input = document.createElement('input');
                input.type = 'text';
                input.value = element.textContent;
                input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                element.parentNode.replaceChild(input, element);
                input.id = field;
            });

            const editButton = document.getElementById('edit-button');
            editButton.textContent = 'บันทึก';
            editButton.onclick = saveChanges;
        }

        async function saveChanges() {
            const member = {
                name: document.getElementById('member-name').value,
                phone: document.getElementById('member-phone').value,
                address: document.getElementById('member-address').value,
                status: memberStatus // Include the status in the request body
            };

            try {
                const response = await fetch(`http://localhost:3000/api/members/tbm/${memberId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(member)
                });

                if (response.ok) {
                    renderMemberProfile(member);
                    const fields = ['member-name', 'member-phone', 'member-address'];
                    fields.forEach(field => {
                        const element = document.getElementById(field);
                        const p = document.createElement('p');
                        p.textContent = element.value;
                        p.className = 'text-gray-700 text-lg';
                        element.parentNode.replaceChild(p, element);
                        p.id = field;
                    });

                    const editButton = document.getElementById('edit-button');
                    editButton.textContent = 'แก้ไข';
                    editButton.onclick = enableEditing;
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                }
            } catch (error) {
                console.error('Error saving member profile:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

            if (isLoggedIn) {
                navList.innerHTML = `

                            โปรไฟล์
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">

                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">

                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>

                    <li class="mb-5">

                            href="commconf.html">

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>

                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>

                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">

                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transaction.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            ธุรกรรมทั้งหมด
                        </a>
                    </li>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10 flex justify-center items-center">
            <div class="bg-white text-black p-8 rounded-lg shadow-lg w-full max-w-3xl">
                <h1 class="text-4xl font-bold mb-5 text-center">โปรไฟล์สมาชิก</h1>
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">ข้อมูลสมาชิก</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-name">ชื่อ:</label>
                        <p class="text-gray-700 text-lg" id="member-name"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-phone">เบอร์โทร:</label>
                        <p class="text-gray-700 text-lg" id="member-phone"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-address">ที่อยู่:</label>
                        <p class="text-gray-700 text-lg" id="member-address"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-branch">สาขา:</label>
                        <p class="text-gray-700 text-lg" id="member-branch"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2"
                            for="member-time-credits">เครดิตเวลา:</label>
                        <p class="text-gray-700 text-lg" id="member-time-credits"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-status">สถานะ:</label>
                        <p class="text-gray-700 text-lg" id="member-status"></p>
                    </div>
                </div>
                <div class="flex justify-center mt-4 space-x-4">
                    <button
                        class="bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id="edit-button" onclick="enableEditing()">
                        แก้ไข
                    </button>
                    <button
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        onclick="window.history.back()">
                        ย้อนกลับ
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>โปรไฟล์สมาชิก - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let globalUserId = null; // Global variable to store user_id

        // เพิ่มฟังก์ชันแสดง modal ข้อผิดพลาด
            function showErrorModal(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-modal').classList.remove('hidden');
                document.getElementById('error-confirm-btn').onclick = function () {
                    document.getElementById('error-modal').classList.add('hidden');
                };
            }

            // เพิ่มฟังก์ชันแสดง modal ยืนยันการบันทึก (Promise-based)
            function showConfirmSaveModal() {
                return new Promise((resolve) => {
                    const modal = document.getElementById('confirm-save-modal');
                    modal.classList.remove('hidden');

                    const confirmBtn = document.getElementById('confirm-save-btn');
                    const cancelBtn = document.getElementById('cancel-save-btn');

                    const cleanup = () => {
                        modal.classList.add('hidden');
                        confirmBtn.onclick = null;
                        cancelBtn.onclick = null;
                    };

                    confirmBtn.onclick = () => { cleanup(); resolve(true); };
                    cancelBtn.onclick = () => { cleanup(); resolve(false); };
                });
            }

        function showSuccessModal(message, callback) {
                document.getElementById('success-message').textContent = message;
                document.getElementById('success-modal').classList.remove('hidden');
                document.getElementById('success-confirm-btn').onclick = function () {
                    document.getElementById('success-modal').classList.add('hidden');
                    if (typeof callback === 'function') callback();
                };
            }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMemberProfile();
        });

        async function fetchMemberProfile() {
            try {
                const response = await fetch(`http://localhost:3000/api/user/auth/profile`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const member = await response.json();
                console.log('✅ Fetched Member:', member);  // Debugging

                globalUserId = member.user_id;

                if (member.branch_id) {
                    console.log('✅ Branch ID:', member.branch_id); // Check if branch_id exists
                    member.branch = await fetchBranchName(member.branch_id);
                } else {
                    console.warn('⚠️ User does not have a branch_id assigned.');
                    member.branch = 'N/A';
                }

                renderMemberProfile(member);
            } catch (error) {
                console.error('❌ Error fetching member profile:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลโปรไฟล์สมาชิก');
            }
        }

        async function fetchBranchName(branchId) {
            if (!branchId) return 'N/A';
            try {
                const response = await fetch(`http://localhost:3000/api/user/branches`);
                if (!response.ok) {
                    throw new Error(`Network response was not ok (${response.status})`);
                }
                const branches = await response.json();
                console.log('Fetched Branches:', branches); // Debugging

                const branch = branches.find(branch => parseInt(branch.branch_id) === parseInt(branchId));
                return branch ? branch.branch_name : 'N/A';
            } catch (error) {
                console.error('Error fetching branch name:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลสาขา');
                return 'N/A';
            }
        }

        function renderMemberProfile(member) {
            document.getElementById('member-name').textContent = member.name || 'N/A';
            document.getElementById('member-phone').textContent = member.phone || 'N/A';
            document.getElementById('member-address').textContent = member.address || 'N/A';
            document.getElementById('member-branch').textContent = member.branch || 'N/A'; // ใช้ค่าที่ได้จาก fetchBranchName
            document.getElementById('member-time-credits').textContent = member.time_credits || 'N/A';
            document.getElementById('member-status').textContent = member.status === 'active' ? 'ปกติ' : 'ไม่ปกติ';
        }

        let originalData = {}; // To store the old data

        function enableEditing() {
            if (!globalUserId) {
                showErrorModal('ไม่พบ User ID กรุณารีเฟรชหน้าเว็บใหม่');
                return;
            }

            const fields = ['member-name', 'member-phone', 'member-address'];
            originalData = {}; // Clear previous data

            fields.forEach(field => {
                const element = document.getElementById(field);
                originalData[field] = element.textContent;

                let input;
                if (field === 'member-address') {
                    // Use textarea for address to support multiple lines
                    input = document.createElement('textarea');
                    input.rows = 4; // Adjust height of the textarea
                    input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline resize-none';
                } else {
                    // Keep using input for name and phone
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline';
                }

                input.value = element.textContent;
                element.parentNode.replaceChild(input, element);
                input.id = field;
            });

            const editButton = document.getElementById('edit-button');
            const backButton = document.getElementById('back-button');

            editButton.textContent = 'บันทึก';
            editButton.onclick = saveChanges;

            backButton.style.display = 'inline-block';
            backButton.onclick = () => revertChanges(fields);
        }


        function revertChanges(fields) {
            fields.forEach(field => {
                const element = document.getElementById(field);
                const p = document.createElement('p');
                p.textContent = originalData[field];
                p.className = 'text-gray-700 text-lg';
                element.parentNode.replaceChild(p, element);
                p.id = field;
            });

            const editButton = document.getElementById('edit-button');
            const backButton = document.getElementById('back-button');

            // Reset the "แก้ไข" button
            editButton.textContent = 'แก้ไข';
            editButton.onclick = enableEditing;

            // Hide the "ย้อนกลับ" button
            backButton.style.display = 'none';
        }

        async function saveChanges() {
            const fullName = document.getElementById('member-name').value.trim();
            const phone = document.getElementById('member-phone').value.trim();
            const address = document.getElementById('member-address').value.trim();

            // Validate name (must include at least two words)
            if (fullName.split(' ').length < 2) {
                showErrorModal('กรุณากรอกชื่อและนามสกุลให้ครบถ้วน');
                return;
            }

            // Validate Thai phone number (must start with 0 and be 10 digits)
            const phoneRegex = /^0[0-9]{9}$/;
            if (!phoneRegex.test(phone)) {
                showErrorModal('กรุณากรอกหมายเลขโทรศัพท์ให้ถูกต้อง (10 หลักและขึ้นต้นด้วย 0)');
                return;
            }

            // Advanced address validation: must contain house number and keywords like เขต/อำเภอ/ตำบล/จังหวัด
            const addressRegex = /\d+.*(เขต|อำเภอ|ตำบล|จังหวัด)/;
            if (!addressRegex.test(address)) {
                showErrorModal('กรุณากรอกที่อยู่ให้ครบถ้วน รวมถึงเลขที่บ้าน เขต/อำเภอ และจังหวัด');
                return;
            }

            // แสดง modal ยืนยันการบันทึก
            const userConfirmed = await showConfirmSaveModal();
            if (!userConfirmed) return;

            const member = {
                name: fullName,
                phone: phone,
                address: address
            };

            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(member)
                });

                if (response.ok) {
                    showSuccessModal('บันทึกข้อมูลโปรไฟล์สำเร็จแล้ว!');
                    renderMemberProfile(member);

                    const fields = ['member-name', 'member-phone', 'member-address'];
                    fields.forEach(field => {
                        const element = document.getElementById(field);
                        const p = document.createElement('p');
                        p.textContent = element.value;
                        p.className = 'text-gray-700 text-lg';
                        element.parentNode.replaceChild(p, element);
                        p.id = field;
                    });

                    document.getElementById('edit-button').textContent = 'แก้ไข';
                    document.getElementById('edit-button').onclick = enableEditing;
                    document.getElementById('back-button').style.display = 'none';

                    fetchMemberProfile();  // Refresh profile after saving
                } else {
                    const errorData = await response.json();
                    showErrorModal(`เกิดข้อผิดพลาดในการบันทึกข้อมูล: ${errorData.error || 'ไม่ทราบสาเหตุ'}`);
                }
            } catch (error) {
                console.error('Error saving member profile:', error);
                showErrorModal('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10 flex justify-center items-center">
            <div class="absolute top-5 right-5 flex items-center gap-4">
                <!-- Notification Placeholder -->
                <div id="mainNotificationPanel" class="relative"></div>
            </div>
            <div class="bg-white text-black p-10 rounded-xl shadow-xl w-full max-w-3xl border border-gray-200">
                <h1 class="text-4xl font-bold mb-5 text-center">โปรไฟล์สมาชิก</h1>
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">ข้อมูลสมาชิก</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-36 gap-y-4 ml-24">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-name">ชื่อ:</label>
                        <p class="text-gray-700 text-lg" id="member-name"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-phone">เบอร์โทร:</label>
                        <p class="text-gray-700 text-lg" id="member-phone"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-address">ที่อยู่:</label>
                        <p class="text-gray-700 text-lg" id="member-address"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-branch">สาขา:</label>
                        <p class="text-gray-700 text-lg" id="member-branch"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2"
                            for="member-time-credits">เครดิตเวลา:</label>
                        <p class="text-gray-700 text-lg" id="member-time-credits"></p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="member-status">สถานะ:</label>
                        <p class="text-gray-700 text-lg" id="member-status"></p>
                    </div>
                </div>
                <div class="flex justify-center mt-4 space-x-4">
                    <button
                        class="bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id="edit-button" onclick="enableEditing()">
                        แก้ไข
                    </button>
                    <button
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id="back-button" style="display: none;" onclick="window.history.back()">
                        ย้อนกลับ
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">แก้ไขสำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4" id="success-message">แก้ไขประกาศสำเร็จ</p>
            <button id="success-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ยืนยัน
            </button>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-red-600 mt-6">ยืนยันการลบประกาศ</h2>
            <p class="text-gray-700 text-lg mt-4">ต้องการลบประกาศหรือไม่?</p>
            <div class="mt-6 flex justify-center">
                <button id="confirm-delete-btn"
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300 mr-4">
                    ยืนยัน
                </button>
                <button id="cancel-delete-btn"
                    class="px-6 py-3 bg-gray-600 text-white text-lg font-semibold rounded-lg hover:bg-gray-700 transition duration-300">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-red-100 border-4 border-red-500">
                    <svg class="w-12 h-12 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-red-600 mt-6">เกิดข้อผิดพลาด!</h2>
            <p class="text-gray-700 text-lg mt-4" id="error-message"></p>
            <button id="error-confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>
    
    <!-- Save Confirmation Modal -->
    <div id="confirm-save-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-blue-600 mt-6">ยืนยันการบันทึก</h2>
            <p class="text-gray-700 text-lg mt-4">คุณต้องการบันทึกการเปลี่ยนแปลงหรือไม่?</p>
            <div class="mt-6 flex justify-center">
                <button id="confirm-save-btn"
                    class="px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300 mr-4">
                    ยืนยัน
                </button>
                <button id="cancel-save-btn"
                    class="px-6 py-3 bg-gray-600 text-white text-lg font-semibold rounded-lg hover:bg-gray-700 transition duration-300">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="notification.js"></script>
</body>

</html>

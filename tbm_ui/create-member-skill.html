<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        จัดการทักษะของสมาชิก - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let skills = [];

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    renderSkills(skills);
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        function renderSkills(data) {
            const skillContainer = document.getElementById('skill-container');
            skillContainer.innerHTML = '';
            const categories = [...new Set(data.map(skill => skill.category))];

            function renderCategoryTree(categories, parentElement) {
                if (categories.length === 0) return;

                const midIndex = Math.floor(categories.length / 2);
                const leftCategories = categories.slice(0, midIndex);
                const rightCategories = categories.slice(midIndex + 1);
                const currentCategory = categories[midIndex];

                const categoryDiv = document.createElement('div');
                categoryDiv.className = `bg-gray-100 p-6 rounded-lg category category-${currentCategory} w-3/4 mx-auto mb-5`;
                categoryDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold category-name">${currentCategory}</h3>
                    </div>
                `;

                data.filter(skill => skill.category === currentCategory).forEach(skill => {
                    const skillP = document.createElement('p');
                    skillP.className = 'mb-2 flex items-center';
                    skillP.innerHTML = `
                        <input type="checkbox" class="mr-2" id="skill-${skill.skill_id}" />
                        <span class="skill-name">${skill.name}</span>
                    `;
                    categoryDiv.appendChild(skillP);
                });

                parentElement.appendChild(categoryDiv);

                const leftDiv = document.createElement('div');
                leftDiv.className = 'w-full';
                parentElement.appendChild(leftDiv);
                renderCategoryTree(leftCategories, leftDiv);

                const rightDiv = document.createElement('div');
                rightDiv.className = 'w-full';
                parentElement.appendChild(rightDiv);
                renderCategoryTree(rightCategories, rightDiv);
            }

            renderCategoryTree(categories, skillContainer);
        }

        async function saveMemberSkills(event) {
            event.preventDefault();
            const memberId = new URLSearchParams(window.location.search).get('memberId');
            const selectedSkills = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(checkbox => parseInt(checkbox.id.replace('skill-', '')));

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/members/${memberId}/skills`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ skills: selectedSkills })
                });

                if (response.ok) {
                    alert('ทักษะของสมาชิกถูกบันทึกเรียบร้อยแล้ว');
                    window.location.href = 'member.html';
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกทักษะของสมาชิก');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกทักษะของสมาชิก');
            }
        }

        async function searchSkills() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            try {
                const response = await fetch(`http://localhost:3000/api/tbm/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    renderSkills(data);
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            /* Increase border radius for larger container */
            padding: 6px;
            /* Larger padding for better spacing */

            justify-content: space-between;
            width: 180px;
            /* Increase width for a larger toggle */
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            /* Blue for active text */
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            /* Make it unclickable */
            background-color: white;
            color: #6B7280;
            /* Light gray text */
            font-weight: bold;
        }
    </style>

    <script src="selected-language.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    pageTitle: 'จัดการทักษะของสมาชิก - Time Bank',
                    mainHeading: 'จัดการทักษะของสมาชิก',
                    searchPlaceholder: 'ค้นหาทักษะหรือหมวดหมู่',
                    saveButton: 'บันทึก',
                    nav: [
                        'โปรไฟล์',
                        'หน้าหลัก',
                        'รายงาน',
                        'จัดการกิจกรรม',
                        'จัดการสมาชิก',
                        'จัดการหมวดหมู่ทักษะ',
                        'จัดการกองทุนชุมชน',
                        'จัดการชุมชน',
                        'ธุรกรรมทั้งหมด'
                    ]
                },
                english: {
                    pageTitle: 'Manage Member Skills - Time Bank',
                    mainHeading: 'Manage Member Skills',
                    searchPlaceholder: 'Search skills or categories',
                    saveButton: 'Save',
                    nav: [
                        'Profile',
                        'Homepage',
                        'Reports',
                        'Activity Management',
                        'Member Management',
                        'Skill Categories',
                        'Fund Management',
                        'Community Settings',
                        'Transactions'
                    ]
                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            const updateContent = (lang) => {
                const langData = translations[lang];

                // Update page title
                document.title = langData.pageTitle;

                // Update main heading
                document.querySelector('h1').textContent = langData.mainHeading;

                // Update search bar placeholder
                document.getElementById('search-bar').placeholder = langData.searchPlaceholder;

                // Update Save button text
                document.querySelector('button[type="submit"]').textContent = langData.saveButton;

                // Update navigation bar items (Icons remain unchanged)
                const navLinks = document.querySelectorAll('nav ul li a');
                langData.nav.forEach((text, index) => {
                    if (navLinks[index]) {
                        const icon = navLinks[index].querySelector('i'); // Preserve existing icon
                        navLinks[index].innerHTML = ''; // Clear content
                        if (icon) {
                            navLinks[index].appendChild(icon); // Re-add icon
                        }
                        navLinks[index].appendChild(document.createTextNode(text)); // Add translated text
                    }
                });

                // Update active language toggle
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }
            };

            // Event listeners for language toggle
            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            // Initialize content on page load
            updateContent(currentLang);
        });
    </script>

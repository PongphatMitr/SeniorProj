<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ลงทะเบียนทักษะ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* Custom styles for searchable dropdown */
        .suggestions-container {
            position: absolute;
            z-index: 50;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0 0 0.375rem 0.375rem;
            box-shadow: 0 4px 6px rgb(0 0 0 / 0.1);
            display: none;
        }

        .suggestions-container.visible {
            display: block;
        }

        .suggestion-item {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #e5e7eb;
        }
    </style>
</head>

            class="w-full md:w-5/6 bg-blue-700 text-white p-10 pt-[50px] flex flex-col justify-center items-center overflow-auto">

                        <div id="skill-container-2" class="flex justify-between items-center mb-4">

                                <div id="suggestions-2"

                                    onchange="filterSkillsByCategory(event, 2)">

                            <div class="mb-4">

                                    class="block text-gray-700 text-sm font-bold mb-2">เลือกทักษะ:</label>
                                <select id="skill-dropdown-2"
                                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    onchange="validateNoDuplicateSkills(2)">

                            <div class="mb-4">

                                    <button

    <!-- Success Modal -->

    <!-- Error Modal -->

            <button id="confirm-error-btn"
                class="mt-8 px-8 py-4 bg-red-600 text-white text-xl font-semibold rounded-lg hover:bg-red-700 transition">ตกลง</button>
        </div>

    <script>
        // Global variables
        let skills = [];
        let categories = [];
        let memberSkills = [
            { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" },
            { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" },
            { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" }
        ];
        let originalSkills = [];

        // Get user_id from sessionStorage (set in register.html)
        const userId = sessionStorage.getItem('registerUserId');
        if (!userId) {
            alert('ไม่พบข้อมูลผู้ใช้ กรุณาลงทะเบียนใหม่');
            window.location.href = 'register.html';
        }

        // Fetch all skills and categories on load
        async function fetchSkillsAndCategories() {
            try {
                const response = await fetch('http://localhost:3000/api/user/skills');
                if (!response.ok) throw new Error('ไม่สามารถดึงข้อมูลทักษะได้');
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('ข้อมูลทักษะไม่ถูกต้อง');

                skills = data.map(s => ({
                    skill_id: s.skill_id,
                    name: s.name,
                    category: s.category
                }));

                // Extract unique categories
                categories = [...new Set(skills.map(s => s.category))].sort();

                populateCategoryDropdowns();
                populateSkillDropdowns();

            } catch (error) {
                console.error(error);
                showErrorMessage('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ กรุณาลองใหม่อีกครั้ง');
            }
        }

        // Fetch member's existing skills (if any)
        async function fetchMemberSkills() {
            try {
                const response = await fetch(`http://localhost:3000/api/user/members/${userId}/skills`);
                if (!response.ok) throw new Error('ไม่สามารถดึงข้อมูลทักษะของสมาชิกได้');
                const data = await response.json();

                if (data.skills && Array.isArray(data.skills)) {
                    memberSkills = data.skills.map(skill => ({
                        skill_id: skill.skill_id || null,
                        name: skill.name || "ไม่ลงทะเบียนทักษะ",
                        category: skill.category || "ไม่ระบุหมวดหมู่"
                    }));
                } else {
                    memberSkills = [
                        { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" },
                        { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" },
                        { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" }
                    ];
                }

                renderSkills();
                populateCategoryDropdowns();
                populateSkillDropdowns();

            } catch (error) {
                console.error(error);
                showErrorMessage('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะของสมาชิก กรุณาลองใหม่อีกครั้ง');
            }
        }

        // Render skill display sections
        function renderSkills() {
            for (let i = 1; i <= 3; i++) {
                const skillContainer = document.getElementById(`skill-display-${i}`);
                const skill = memberSkills[i - 1];
                skillContainer.innerHTML = `
                    <div>
                        <h3 class="text-xl font-semibold text-gray-700">หมวดหมู่: 
                            <span class="text-2xl font-bold text-blue-600">${skill?.category || 'ไม่ระบุหมวดหมู่'}</span>
                        </h3>
                        <h3 class="text-xl font-semibold text-gray-700 mt-1">ทักษะ: 
                            <span class="text-2xl font-bold text-green-600">${skill?.name || 'ยังไม่มีทักษะที่ลงทะเบียน'}</span>
                        </h3>
                        <div class="flex justify-center mt-3">
                            <button class="bg-blue-500 text-white px-4 py-2 rounded transition duration-300 hover:bg-blue-600 hover:scale-105" onclick="toggleEdit(${i})">แก้ไข</button>
                        </div>
                    </div>
                `;
            }
        }

        // Populate category dropdowns
        function populateCategoryDropdowns() {
            for (let i = 1; i <= 3; i++) {
                const categoryDropdown = document.getElementById(`category-dropdown-${i}`);
                categoryDropdown.innerHTML = '<option value="all">เลือกหมวดหมู่</option>';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categoryDropdown.appendChild(option);
                });
            }
        }

        // Populate skill dropdowns with default state
        function populateSkillDropdowns() {
            for (let i = 1; i <= 3; i++) {
                const skillDropdown = document.getElementById(`skill-dropdown-${i}`);
                skillDropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่ก่อน</option>';
                skillDropdown.disabled = true;
            }
        }

        // Populate skill dropdown for editing with filtering and no duplicates
        function populateSkillDropdown(index) {
            const dropdown = document.getElementById(`skill-dropdown-${index}`);
            dropdown.innerHTML = ''; // Clear existing options

            // Add the "ไม่ลงทะเบียนทักษะ" option
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "ไม่ลงทะเบียนทักษะ";
            dropdown.appendChild(defaultOption);

            // Get all selected skill IDs (excluding current slot)
            const selectedSkillIds = memberSkills.map((skill, i) => i + 1 !== index ? skill.skill_id : null).filter(id => id);

            skills.forEach(skill => {
                const skillIdStr = String(skill.skill_id);
                const currentSkillId = String(memberSkills[index - 1]?.skill_id);
                if (!selectedSkillIds.includes(skillIdStr) || skillIdStr === currentSkillId) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    dropdown.appendChild(option);
                }
            });


            // Set current selection
            dropdown.value = memberSkills[index - 1]?.skill_id || '';
            dropdown.disabled = false;
        }

        // Filter skills by category for a specific dropdown index
        function filterSkillsByCategory(event, index) {
            const selectedCategory = event.target.value;
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);

            skillDropdown.innerHTML = '';

            if (!selectedCategory || selectedCategory === "all") {
                skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
                skillDropdown.disabled = true;
                return;
            }

            // Get skill IDs already selected in other slots to prevent duplicates
            const selectedSkillIds = memberSkills.map((s, i) => i + 1 !== index ? String(s.skill_id) : null).filter(id => id);
            for (let i = 1; i <= 3; i++) {
                if (i !== index) {
                    const val = document.getElementById(`skill-dropdown-${i}`).value;
                    if (val) selectedSkillIds.push(val);
                }
            }

            // Filter skills by category and exclude already selected skills
            const filteredSkills = skills.filter(s => s.category === selectedCategory && !selectedSkillIds.includes(String(s.skill_id)));

            if (filteredSkills.length === 0) {
                skillDropdown.innerHTML = '<option value="">ไม่มีทักษะในหมวดหมู่นี้</option>';
                skillDropdown.disabled = true;
                return;
            }

            skillDropdown.disabled = false;
            skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
            filteredSkills.forEach(skill => {
                const option = document.createElement('option');
                option.value = skill.skill_id;
                option.textContent = skill.name;
                skillDropdown.appendChild(option);
            });

            // If memberSkills has a skill in this slot and matches category, preselect it
            const currentSkill = memberSkills[index - 1];
            if (currentSkill && currentSkill.category === selectedCategory && currentSkill.skill_id) {
                skillDropdown.value = currentSkill.skill_id;
            } else {
                skillDropdown.value = '';
            }
        }

        async function searchSkills(event, index) {
            const searchTerm = event.target.value.toLowerCase();
            const suggestionsContainer = document.getElementById(`suggestions-${index}`);

            // Clear previous suggestions
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.classList.add('hidden');

            if (!searchTerm.trim()) {
                return; // Do nothing if search term is empty
            }

            try {
                const response = await fetch(`http://localhost:3000/api/user/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                const data = await response.json();

                if (!Array.isArray(data)) {
                    console.error('Expected an array but got:', data);
                    showErrorMessage('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                    return;
                }

                // Get already registered skills to prevent duplicates
                const registeredSkillIds = memberSkills.map(skill => skill.skill_id).filter(id => id !== null);

                // Filter out already selected skills
                const filteredSkills = data.filter(skill => !registeredSkillIds.includes(skill.skill_id));

                // Populate suggestions container with search results
                filteredSkills.forEach(skill => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.className = 'px-4 py-2 cursor-pointer hover:bg-gray-200';
                    suggestionItem.textContent = `${skill.name} (${skill.category})`;
                    suggestionItem.onclick = () => selectSkill(skill, index);
                    suggestionsContainer.appendChild(suggestionItem);
                });

                // Show suggestions container if skills are found
                if (filteredSkills.length > 0) {
                    suggestionsContainer.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error searching skills:', error);
                showErrorMessage('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        // Select skill from search suggestions
        function selectSkill(skill, index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
            const suggestionsContainer = document.getElementById(`suggestions-${index}`);
            const searchInput = document.getElementById(`search-bar-${index}`);

            // Set category in dropdown and manually trigger change to populate skills
            categoryDropdown.value = skill.category;
            filterSkillsByCategory({ target: categoryDropdown }, index);

            // Wait a tick to ensure dropdowns are populated, then set selected skill
            setTimeout(() => {
                skillDropdown.value = skill.skill_id;
                validateNoDuplicateSkills(index);
            }, 0);

            // Update local state immediately (to match what will be saved)
            memberSkills[index - 1] = {
                skill_id: skill.skill_id,
                name: skill.name,
                category: skill.category
            };

            // Clear the search bar
            if (searchInput) searchInput.value = '';

            // Hide suggestion container properly
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.classList.add('hidden');
        }


        // Toggle edit mode for a skill slot
        function toggleEdit(index) {
            const displaySection = document.getElementById(`skill-display-${index}`);
            const editSection = document.getElementById(`edit-container-${index}`);

            displaySection.classList.add('hidden');
            editSection.classList.remove('hidden');

            originalSkills[index] = { ...memberSkills[index - 1] };

            populateSkillDropdown(index);
        }

        // Cancel edit mode and revert changes
        function cancelEdit(index) {
            document.getElementById(`skill-display-${index}`).classList.remove('hidden');
            document.getElementById(`edit-container-${index}`).classList.add('hidden');

            memberSkills[index - 1] = { ...originalSkills[index] };
            renderSkills();
        }

        // Clear skill selection in edit mode
        function clearSkill(index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);

            if (skillDropdown) skillDropdown.value = "";
            if (categoryDropdown) categoryDropdown.value = "all";

            memberSkills[index - 1] = { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" };
            renderSkills();
        }

        // Validate no duplicate skills selected across all dropdowns
        function validateNoDuplicateSkills(changedIndex) {
            const selectedSkills = [];
            let duplicateFound = false;

            for (let i = 1; i <= 3; i++) {
                const dropdown = document.getElementById(`skill-dropdown-${i}`);
                if (!dropdown) continue;
                const val = dropdown.value;
                if (val && val !== "") {
                    if (selectedSkills.includes(val)) {
                        duplicateFound = true;
                        break;
                    }
                    selectedSkills.push(val);
                }
            }

            if (duplicateFound) {
                showErrorMessage('ไม่สามารถเลือกทักษะซ้ำกันได้ กรุณาเลือกทักษะใหม่');
                // Reset the changed dropdown to empty
                const changedDropdown = document.getElementById(`skill-dropdown-${changedIndex}`);
                if (changedDropdown) changedDropdown.value = "";
            }
        }

        // Save individual skill after confirmation
        async function saveSkill(index) {
            const dropdown = document.getElementById(`skill-dropdown-${index}`);
            const selectedSkillId = dropdown.value || null;

            // Before saving, validate no duplicates
            const selectedSkills = [];
            for (let i = 1; i <= 3; i++) {
                const val = document.getElementById(`skill-dropdown-${i}`).value;
                if (val && val !== "") {
                    selectedSkills.push(val);
                }
            }
            const uniqueSkills = new Set(selectedSkills);
            if (uniqueSkills.size !== selectedSkills.length) {
                showErrorMessage('ไม่สามารถเลือกทักษะซ้ำกันได้ กรุณาเลือกทักษะใหม่');
                return;
            }

            confirmAction("คุณต้องการบันทึกการเปลี่ยนแปลงหรือไม่?", async function () {
                const payload = {
                    skill_1: memberSkills[0]?.skill_id || null,
                    skill_2: memberSkills[1]?.skill_id || null,
                    skill_3: memberSkills[2]?.skill_id || null,
                };

                payload[`skill_${index}`] = selectedSkillId;

                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${userId}/skills`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    const responseData = await response.json();

                    if (response.ok) {
                        // Update local memberSkills with new selection
                        const selectedSkill = skills.find(s => String(s.skill_id) === String(selectedSkillId));
                        if (selectedSkill) {
                            memberSkills[index - 1] = {
                                skill_id: selectedSkill.skill_id,
                                name: selectedSkill.name,
                                category: selectedSkill.category
                            };
                        } else {
                            memberSkills[index - 1] = { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" };
                        }
                        renderSkills();
                        cancelEdit(index);
                        showSuccessMessage(`✅ บันทึกทักษะที่ ${index} สำเร็จ!`, "create-member-skill.html");
                    } else {
                        showErrorMessage(responseData.error || '❌ เกิดข้อผิดพลาดในการบันทึกทักษะ');
                    }
                } catch (error) {
                    showErrorMessage('❌ เกิดข้อผิดพลาดในการบันทึกทักษะ');
                }
                // After memberSkills[index - 1] update and renderSkills()
                for (let i = 1; i <= 3; i++) {
                    if (i !== index) {
                        populateSkillDropdown(i);
                    }
                }
            });
        }

        // Save all skills at once
        async function saveAllSkills() {
            // Collect selected skill IDs or null if empty
            const skill_1 = memberSkills[0]?.skill_id || null;
            const skill_2 = memberSkills[1]?.skill_id || null;
            const skill_3 = memberSkills[2]?.skill_id || null;

            // Validate no duplicate skills selected
            const selectedSkills = [skill_1, skill_2, skill_3].filter(s => s !== null && s !== '');
            const uniqueSkills = new Set(selectedSkills);
            if (uniqueSkills.size !== selectedSkills.length) {
                showErrorMessage('ไม่สามารถเลือกทักษะซ้ำกันได้ กรุณาเลือกทักษะใหม่');
                return;
            }

            const payload = { skill_1, skill_2, skill_3 };

            confirmAction("คุณต้องการบันทึกทักษะทั้งหมดหรือไม่?", async function () {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${userId}/skills`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccessMessage('บันทึกทักษะสำเร็จ!');
                        setTimeout(() => {
                            sessionStorage.removeItem('registerFormData');
                            sessionStorage.removeItem('registerUserId');
                            sessionStorage.removeItem('registerPassword');
                            window.location.href = 'member.html';
                        }, 3000);
                    } else {
                        showErrorMessage(data.error || 'เกิดข้อผิดพลาดในการบันทึกทักษะ กรุณาลองใหม่อีกครั้ง');
                    }
                } catch (error) {
                    console.error(error);
                    showErrorMessage('เกิดข้อผิดพลาดในการบันทึกทักษะ กรุณาลองใหม่อีกครั้ง');
                }
            });
        }

        // Skip skill registration and go to login
        function skipSkills() {
            sessionStorage.removeItem('registerFormData');
            sessionStorage.removeItem('registerUserId');
            sessionStorage.removeItem('registerPassword');
            window.location.href = 'log-in.html';
        }

        // Show success modal
        function showSuccessMessage(message, redirectUrl = null) {
            const modal = document.getElementById('success-modal');
            document.getElementById('success-message').textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);

            setTimeout(() => {
                closeModal('success-modal');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 3000);
        }

        // Show error modal
        function showErrorMessage(message, redirectUrl = null) {
            const modal = document.getElementById('error-modal');
            document.getElementById('error-message').textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);

            setTimeout(() => {
                closeModal('error-modal');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 3000);
        }

        // Confirm action modal
        function confirmAction(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);

            document.getElementById('confirm-btn').onclick = function () {
                closeModal('confirm-modal');
                onConfirm();
            };

            document.getElementById('cancel-btn').onclick = function () {
                closeModal('confirm-modal');
            };
        }

        // Close modal helper
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('opacity-100', 'scale-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // Close modals on button click
        document.getElementById('confirm-success-btn').addEventListener('click', () => closeModal('success-modal'));
        document.getElementById('confirm-error-btn').addEventListener('click', () => closeModal('error-modal'));

        // Close suggestions on blur with delay to allow click
        ['search-bar-1', 'search-bar-2', 'search-bar-3'].forEach(id => {
            const input = document.getElementById(id);
            const index = id.split('-')[2];
            const suggestions = document.getElementById(`suggestions-${index}`);
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    suggestions.classList.remove('visible');
                }, 150);
            });
        });

        // Attach event listeners for category dropdowns to filter skills
        document.getElementById('category-dropdown-1').addEventListener('change', (e) => filterSkillsByCategory(e, 1));
        document.getElementById('category-dropdown-2').addEventListener('change', (e) => filterSkillsByCategory(e, 2));
        document.getElementById('category-dropdown-3').addEventListener('change', (e) => filterSkillsByCategory(e, 3));

        // Attach event listeners for save all and skip buttons
        document.getElementById('saveSkillsBtn').addEventListener('click', saveAllSkills);
        document.getElementById('skipSkillsBtn').addEventListener('click', skipSkills);

        // Initialize page
        (async () => {
            await fetchSkillsAndCategories();
            await fetchMemberSkills();
        })();
    </script>
    <script src="navbar.js"></script>
</body>

</html>

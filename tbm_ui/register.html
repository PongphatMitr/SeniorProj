<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white min-h-screen p-5 sticky top-0 flex flex-col z-[1] overflow-visible">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex items-center justify-center bg-blue-700">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" data-lang="th" id="lang-th">ภาษาไทย</span>
                    <span class="toggle-label" data-lang="en" id="lang-en">English</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
                <h1 class="text-4xl font-bold text-center text-blue-900 mb-8">TIME BANK</h1>
                <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Register</h2>
                <form id="registerForm">
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="username" placeholder="Username" type="text" />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="email" placeholder="Email" type="email" />
                        </div>
                    </div>
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="password" placeholder="Password" type="password" />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="confirmPassword">Confirm
                                Password</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="confirmPassword" placeholder="Confirm Password" type="password" />
                        </div>
                    </div>
                    <div class="mb-4 flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Name</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="name" placeholder="Name" required="" type="text" />
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">Phone</label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="phone" placeholder="Phone" type="text" />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="address">Address</label>
                        <textarea
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="address" placeholder="Address"></textarea>
                    </div>
                    <div class="mb-4 relative">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="branch">Branch</label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="branch" placeholder="Branch" type="text" oninput="searchBranches()" />
                        <div id="branch-results-dropdown"
                            class="absolute bg-white shadow-lg rounded w-full mt-1 hidden z-10"></div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="submit">Next</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-gray-700">Already have an account? <a class="text-blue-500"
                            href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-6 rounded shadow-lg text-center">
            <h2 class="text-2xl font-bold text-green-500 mb-4">สำเร็จ!</h2>
            <p id="success-message" class="text-gray-700"></p>
            <button onclick="closeMessage('success-modal')"
                class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-700">
                ตกลง
            </button>
        </div>
    </div>

    <!-- Failure Message Modal -->
    <div id="failure-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-6 rounded shadow-lg text-center">
            <h2 class="text-2xl font-bold text-red-500 mb-4">ล้มเหลว!</h2>
            <p id="failure-message" class="text-gray-700"></p>
            <button onclick="closeMessage('failure-modal')"
                class="mt-4 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-700">
                ลองใหม่
            </button>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langTh = document.getElementById('lang-th');
            const langEn = document.getElementById('lang-en');
            const toggleSwitch = document.getElementById('language-toggle');
            const navList = document.querySelectorAll('ul li a');
            const registerForm = document.getElementById('registerForm');

            const translations = {
                thai: {
                    nav: ['เข้าสู่ระบบ', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวดหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                    register: 'ลงทะเบียน',
                    username: 'ชื่อผู้ใช้',
                    email: 'อีเมล',
                    password: 'รหัสผ่าน',
                    confirmPassword: 'ยืนยันรหัสผ่าน',
                    name: 'ชื่อ',
                    phone: 'โทรศัพท์',
                    address: 'ที่อยู่',
                    branch: 'สาขา',
                    alreadyAccount: 'มีบัญชีอยู่แล้ว?',
                    login: 'เข้าสู่ระบบ'
                },
                english: {
                    nav: ['Login', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                    register: 'Register',
                    username: 'Username',
                    email: 'Email',
                    password: 'Password',
                    confirmPassword: 'Confirm Password',
                    name: 'Name',
                    phone: 'Phone',
                    address: 'Address',
                    branch: 'Branch',
                    alreadyAccount: 'Already have an account?',
                    login: 'Login'
                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            function updateContent(lang) {
                const langData = translations[lang];

                // Update navigation menu
                navList.forEach((link, index) => {
                    link.innerHTML = `<i class="${link.querySelector('i').className}"></i> ${langData.nav[index]}`;
                });

                // Update form labels and placeholders
                document.querySelector('h2').textContent = langData.register;
                registerForm.querySelector('label[for="username"]').textContent = langData.username;
                registerForm.querySelector('label[for="email"]').textContent = langData.email;
                registerForm.querySelector('label[for="password"]').textContent = langData.password;
                registerForm.querySelector('label[for="confirmPassword"]').textContent = langData.confirmPassword;
                registerForm.querySelector('label[for="name"]').textContent = langData.name;
                registerForm.querySelector('label[for="phone"]').textContent = langData.phone;
                registerForm.querySelector('label[for="address"]').textContent = langData.address;
                registerForm.querySelector('label[for="branch"]').textContent = langData.branch;

                // Update footer text
                document.querySelector('.text-center p').innerHTML = `${langData.alreadyAccount} <a class="text-blue-500" href="login.html">${langData.login}</a>`;

                // Highlight active language
                if (lang === 'thai') {
                    langTh.classList.add('active');
                    langEn.classList.remove('active');
                } else {
                    langEn.classList.add('active');
                    langTh.classList.remove('active');
                }

                // Sync toggle switch state if toggleSwitch exists
                if (toggleSwitch) {
                    toggleSwitch.checked = lang === 'english';
                }

                // Store selected language
                localStorage.setItem('selectedLanguage', lang);
            }

            // Event listeners for buttons
            langTh.addEventListener('click', () => {
                if (currentLang !== 'thai') {
                    currentLang = 'thai';
                    updateContent(currentLang);
                }
            });

            langEn.addEventListener('click', () => {
                if (currentLang !== 'english') {
                    currentLang = 'english';
                    updateContent(currentLang);
                }
            });

            // Sync toggle switch with content
            if (toggleSwitch) {
                toggleSwitch.checked = currentLang === 'english';
                toggleSwitch.addEventListener('change', () => {
                    currentLang = toggleSwitch.checked ? 'english' : 'thai';
                    updateContent(currentLang);
                });
            }

            // Initialize content
            updateContent(currentLang);
        });

        async function searchBranches() {
            const searchTerm = document.getElementById('branch').value.toLowerCase();
            const resultsDropdown = document.getElementById('branch-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                try {
                    const response = await fetch(`http://localhost:3000/api/tbm/branches?search=${searchTerm}`);
                    const branches = await response.json();
                    branches.forEach(branch => {
                        const item = document.createElement('div');
                        item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                        item.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-gray-700">${branch.branch_name}</p>
                                </div>
                            </div>
                        `;
                        item.onclick = () => {
                            document.getElementById('branch').value = branch.branch_name;
                            resultsDropdown.innerHTML = '';
                        };
                        resultsDropdown.appendChild(item);
                    });
                    resultsDropdown.classList.remove('hidden');
                } catch (error) {
                    console.error('Error fetching branches:', error);
                }
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            // Get all form values
            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value.trim(),
                confirmPassword: document.getElementById('confirmPassword').value.trim(),
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                role: 'User' // Set default role to 'User'
            };

            // Client-side validation
            const errors = [];

            // Validate name: must contain at least two words (first name and surname)
            if (!formData.name || formData.name.split(/\s+/).length < 2) {
                errors.push('กรุณากรอกชื่อและนามสกุลให้ครบถ้วน โดยต้องมีเว้นวรรคระหว่างชื่อและนามสกุล');
            }

            // Validate address: must contain digits and keywords like เขต/อำเภอ/ตำบล/จังหวัด
            const addressRegex = /\d+.*(เขต|อำเภอ|ตำบล|จังหวัด)/;
            if (!addressRegex.test(formData.address)) {
                errors.push('กรุณากรอกที่อยู่ให้ครบถ้วน รวมถึงเลขที่บ้าน เขต/อำเภอ และจังหวัด');
            }

            // Validate phone: must be exactly 10 digits and start with 0
            if (!/^0[0-9]{9}$/.test(formData.phone)) {
                errors.push('หมายเลขโทรศัพท์ไม่ถูกต้อง ต้องมี 10 หลักและขึ้นต้นด้วยเลข 0');
            }

            // Password validations
            if (formData.password !== formData.confirmPassword) {
                errors.push('รหัสผ่านไม่ตรงกัน');
            }
            if (formData.password.length < 8) {
                errors.push('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร');
            }

            // Display errors if any
            if (errors.length > 0) {
                showFailureMessage(errors.join('\n'));
                return;
            }

            // Store form data in session storage
            sessionStorage.setItem('registerFormData', JSON.stringify(formData));

            // Redirect to skills selection page
            window.location.href = 'register-skills.html';
        });

        function showSuccessMessage(message) {
            document.getElementById('success-message').textContent = message;
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function showFailureMessage(message) {
            document.getElementById('failure-message').textContent = message;
            document.getElementById('failure-modal').classList.remove('hidden');
        }

        function closeMessage(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
    <script src="navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', checkLoginStatus);
    </script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let members = [];
        let exchangeRate = null;
        let minimumTimeTokenHours = null;
        let minimumTimeTokenMinutes = null;
        let skills = [];
        let categories = [];
        let selectedSkills = [];

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                exchangeRate = data.default_exchange_rate_description;
                minimumTimeTokenHours = data.minimum_time_token_hours;
                minimumTimeTokenMinutes = data.minimum_time_token_minutes;
                console.log('Exchange Rate:', exchangeRate);
                console.log('Minimum Time Token:', minimumTimeTokenHours, minimumTimeTokenMinutes);
                document.getElementById('minimum-time-token').innerText = `ใช้เวลาขั้นต่ำ ${minimumTimeTokenHours} ชั่วโมง ${minimumTimeTokenMinutes} นาที เพื่อแลกเปลี่ยนโทเคนของกิจกรรมที่ร้องขอ`;
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                const filteredMembers = members.filter(member => member.name.toLowerCase().includes(searchTerm) || member.user_id.toString().includes(searchTerm));
                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.user_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        document.getElementById('requester-id').value = member.user_id;
                        document.getElementById('phone').value = member.phone;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });
                resultsDropdown.classList.remove('hidden');
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        async function fetchSkillsAndCategories() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    categories = [...new Set(skills.map(skill => skill.category))];
                    populateCategoryDropdown();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        function populateCategoryDropdown() {
            const categoryDropdown = document.getElementById('category-dropdown');
            categoryDropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>';
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryDropdown.appendChild(option);
            });
            document.getElementById('skill-dropdown').disabled = true;
        }

        function updateSkillDropdown() {
            const selectedCategory = document.getElementById('category-dropdown').value;
            const skillDropdown = document.getElementById('skill-dropdown');
            skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
            if (!selectedCategory) {
                skillDropdown.disabled = true;
                return;
            }
            const filteredSkills = skills.filter(skill => skill.category === selectedCategory);
            filteredSkills.forEach(skill => {
                if (!selectedSkills.some(selected => selected.skill_id === skill.skill_id)) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                }
            });
            skillDropdown.disabled = false;
        }

        function addSkill() {
            const skillDropdown = document.getElementById('skill-dropdown');
            const selectedSkillId = skillDropdown.value;
            if (!selectedSkillId) return;
            if (selectedSkills.length > 0) {
                alert('คุณสามารถเลือกได้เพียง 1 ทักษะเท่านั้น');
                return;
            }
            const skill = skills.find(s => s.skill_id == selectedSkillId);
            if (!skill) return;
            selectedSkills = [skill];
            updateSelectedSkillsDisplay();
            skillDropdown.value = '';
        }

        function updateSelectedSkillsDisplay() {
            const selectedSkillsList = document.getElementById('selected-skills-list');
            selectedSkillsList.innerHTML = '';
            selectedSkills.forEach((skill, index) => {
                const listItem = document.createElement('li');
                listItem.className = "bg-gray-200 p-2 rounded flex justify-between items-center mb-2";
                listItem.innerHTML = `
                    <span>🛠 <strong>หมวดหมู่:</strong> ${skill.category} | <strong>ทักษะ:</strong> ${skill.name}</span>
                    <button class="text-red-600 font-bold" onclick="removeSkill(${index})">❌</button>
                `;
                selectedSkillsList.appendChild(listItem);
            });
            document.getElementById('skill-dropdown').disabled = selectedSkills.length >= 1;
        }

        function removeSkill(index) {
            selectedSkills.splice(index, 1);
            updateSelectedSkillsDisplay();
            document.getElementById('skill-dropdown').disabled = false;
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                exchangeRate = data.default_exchange_rate_description;
                minimumTimeTokenHours = data.minimum_time_token_hours;
                minimumTimeTokenMinutes = data.minimum_time_token_minutes;
                console.log('Exchange Rate:', exchangeRate);
                console.log('Minimum Time Token:', minimumTimeTokenHours, minimumTimeTokenMinutes);
                document.getElementById('minimum-time-token').innerText = `ใช้เวลาขั้นต่ำ ${minimumTimeTokenHours} ชั่วโมง ${minimumTimeTokenMinutes} นาที เพื่อแลกเปลี่ยนโทเคนของกิจกรรมที่ร้องขอ`;
                calculateTimeTokens();
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function calculateTimeTokens() {
            const startHours = document.getElementById('start-hours')?.value;
            const startMinutes = document.getElementById('start-minutes')?.value;
            const endHours = document.getElementById('end-hours')?.value;
            const endMinutes = document.getElementById('end-minutes')?.value;
            const maxParticipants = parseInt(document.getElementById('max-participants')?.value, 10) || 0;
            if (!startHours || !startMinutes || !endHours || !endMinutes || maxParticipants <= 0) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }
            const startTime = new Date();
            startTime.setHours(parseInt(startHours, 10), parseInt(startMinutes, 10), 0);
            const endTime = new Date();
            endTime.setHours(parseInt(endHours, 10), parseInt(endMinutes, 10), 0);
            let durationInHours = (endTime - startTime) / (1000 * 60 * 60);
            if (durationInHours < 0) {
                durationInHours += 24;
            }
            const minimumDurationInHours = minimumTimeTokenHours + (minimumTimeTokenMinutes / 60);
            if (durationInHours < minimumDurationInHours) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }
            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;
            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }
            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function submitActivity(event) {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const requesterId = document.getElementById('requester-id').value;
            const requesterPhone = document.getElementById('phone').value;
            const status = document.getElementById('status').value;
            const timeTokensRequired = parseFloat(document.getElementById('time-tokens-required').value);
            const timeTokensPerParticipant = parseFloat(document.getElementById('time-tokens-per-participant').value);
            const startHours = document.getElementById('start-hours').value;
            const startMinutes = document.getElementById('start-minutes').value;
            const endHours = document.getElementById('end-hours').value;
            const endMinutes = document.getElementById('end-minutes').value;
            if (!startHours || !startMinutes || !endHours || !endMinutes) {
                alert('กรุณาเลือกเวลาเริ่มต้นและเวลาสิ้นสุดให้ครบ');
                return;
            }
            const startTime = `${startHours}:${startMinutes}`;
            const endTime = `${endHours}:${endMinutes}`;
            if (selectedSkills.length === 0) {
                alert('กรุณาเลือก 1 ทักษะสำหรับกิจกรรม');
                return;
            }
            const required_skill = selectedSkills[0].skill_id;
            const activityData = {
                title, description, location, start_date: startDate, start_time: startTime, end_date: endDate, end_time: endTime,
                max_participants: maxParticipants, requester_id: requesterId, requester_phone: requesterPhone, status,
                time_tokens_required: timeTokensRequired, time_tokens_per_participant: timeTokensPerParticipant, required_skills: required_skill
            };
            try {
                const response = await fetch('http://localhost:3000/api/tbm/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Activity creation failed: ${errorData.error}`);
                }
                alert('สร้างกิจกรรมสำเร็จ!');
                window.location.href = 'activity.html';
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        }

        async function fetchUserDetails() {
            // Implement the function to fetch user details
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchUserDetails();
            fetchCommunityConfig();
            fetchSkillsAndCategories();
            fetchMembers();
            setStartDateRange();
            const startHours = document.getElementById('start-hours');
            const startMinutes = document.getElementById('start-minutes');
            const endHours = document.getElementById('end-hours');
            const endMinutes = document.getElementById('end-minutes');
            const maxParticipants = document.getElementById('max-participants');
            const startDate = document.getElementById('start-date');
            const endDate = document.getElementById('end-date');
            const startTime = document.getElementById('start-time');
            const endTime = document.getElementById('end-time');
            if (maxParticipants) {
                maxParticipants.addEventListener('input', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #max-participants element not found.");
            }
            if (startDate) {
                startDate.addEventListener('input', (event) => {
                    updateEndDate(event.target.value);
                    calculateTimeTokens();
                });
            } else {
                console.warn("⚠️ Warning: #start-date element not found.");
            }
            if (endDate) {
                endDate.addEventListener('input', (event) => {
                    syncDates(event.target.value);
                });
            } else {
                console.warn("⚠️ Warning: #end-date element not found.");
            }
            if (startTime) {
                startTime.addEventListener('input', (event) => {
                    adjustEndTime(event.target.value);
                    calculateTimeTokens();
                });
            } else {
                console.warn("⚠️ Warning: #start-time element not found.");
            }
            if (endTime) {
                endTime.addEventListener('input', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #end-time element not found.");
            }
            if (startHours) {
                startHours.addEventListener('change', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #start-hours element not found.");
            }
            if (startMinutes) {
                startMinutes.addEventListener('change', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #start-minutes element not found.");
            }
            if (endHours) {
                endHours.addEventListener('change', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #end-hours element not found.");
            }
            if (endMinutes) {
                endMinutes.addEventListener('change', calculateTimeTokens);
            } else {
                console.warn("⚠️ Warning: #end-minutes element not found.");
            }

            // Set the date from URL parameter if available
            const urlParams = new URLSearchParams(window.location.search);
            const dateParam = urlParams.get('date');
            if (dateParam) {
                document.getElementById('start-date').value = dateParam;
                document.getElementById('end-date').value = dateParam;
            }
        });

        function setStartDateRange() {
            const now = new Date();
            const minStartDate = new Date();
            minStartDate.setDate(now.getDate() + 3);
            const formattedMinStartDate = minStartDate.toISOString().split('T')[0];
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            startDateInput.setAttribute('min', formattedMinStartDate);
            endDateInput.setAttribute('min', formattedMinStartDate);
            endDateInput.value = formattedMinStartDate;
            syncDates(formattedMinStartDate);
        }

        function syncDates(selectedDate) {
            const startDateInput = document.getElementById('start-date');
                    const endDateInput = document.getElementById('end-date');
                    startDateInput.value = selectedDate;
                    endDateInput.value = selectedDate;
                }

                function adjustEndTime(startTime) {
                    if (!startTime) return;
                    let [hours, minutes] = startTime.split(":").map(Number);
                    hours += 1;
                    if (hours >= 24) hours = 0;
                    const endTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    document.getElementById('end-time').value = endTime;
                }

                function calculateTimeDifference() {
                    const startHours = parseInt(document.getElementById("start-hours").value, 10);
                    const startMinutes = parseInt(document.getElementById("start-minutes").value, 10);
                    const endHours = parseInt(document.getElementById("end-hours").value, 10);
                    const endMinutes = parseInt(document.getElementById("end-minutes").value, 10);
                    if (!isNaN(startHours) && !isNaN(startMinutes) && !isNaN(endHours) && !isNaN(endMinutes)) {
                        let startTime = new Date();
                        startTime.setHours(startHours, startMinutes, 0);
                        let endTime = new Date();
                        endTime.setHours(endHours, endMinutes, 0);
                        let durationInMinutes = (endTime - startTime) / (1000 * 60);
                        if (durationInMinutes < 0) {
                            durationInMinutes += 24 * 60;
                        }
                        const hours = Math.floor(durationInMinutes / 60);
                        const minutes = durationInMinutes % 60;
                        const totalDurationInHours = hours + (minutes / 60);
                        const timeDifferenceElement = document.getElementById("time-difference");
                        timeDifferenceElement.value = `${hours} ชั่วโมง ${minutes} นาที`;
                        const minimumDurationInHours = minimumTimeTokenHours + (minimumTimeTokenMinutes / 60);
                        if (totalDurationInHours < minimumDurationInHours) {
                            timeDifferenceElement.classList.remove('text-green-600');
                            timeDifferenceElement.classList.add('text-red-600');
                        } else {
                            timeDifferenceElement.classList.remove('text-red-600');
                            timeDifferenceElement.classList.add('text-green-600');
                        }
                    }
                }
            </script>
</head>
<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">สร้างกิจกรรม</h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">รายละเอียดกิจกรรม</h2>
                <p id="minimum-time-token" class="text-red-600 text-center mb-6"></p>
                <form onsubmit="submitActivity(event)">
                    <!-- Section: Requester Information -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="relative">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name"> ชื่อผู้ขอ </label>
                            <input id="requester-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" oninput="searchMembers()" placeholder="กรอก เลขบัญชี หรือ ชื่อ" required />
                            <input id="requester-id" type="hidden" />
                            <div id="search-results-dropdown" class="absolute w-full bg-white border rounded-lg mt-1 hidden z-10"></div>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="phone"> เบอร์โทรศัพท์ </label>
                            <input id="phone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" readonly />
                        </div>
                    </div>
                    <hr class="my-8 border-gray-200">
                    <!-- Section: Activity Details -->
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="title">ชื่อกิจกรรม</label>
                        <input id="title" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" placeholder="ระบุชื่อกิจกรรม" required />
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="description">รายละเอียด</label>
                        <textarea id="description" class="shadow border rounded w-full py-2 px-3 text-gray-700" placeholder="ระบุรายละเอียดกิจกรรม" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="location">สถานที่</label>
                        <input id="location" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" placeholder="ระบุสถานที่จัดกิจกรรม" required />
                    </div>
                    <!-- Section: Skill Selection -->
                    <hr class="my-8 border-gray-200">
                    <!-- Title -->
                    <div class="text-center">
                        <h1 class="text-2xl font-bold text-blue-700 mb-4">เลือกทักษะที่ต้องการ</h1>
                    </div>
                    <!-- Skill Selection Details -->
                    <div class="bg-gray-100 p-6 rounded-lg shadow-md">
                        <div class="mb-4">
                            <label for="category-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกหมวดหมู่:</label>
                            <select id="category-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" onchange="updateSkillDropdown()">
                                <option value="">กรุณาเลือกหมวดหมู่</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="skill-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกทักษะ (สามารถเลือกได้เพียง 1 ทักษะเท่านั้น):</label>
                            <select id="skill-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" disabled onchange="addSkill()">
                                <option value="">กรุณาเลือกทักษะ</option>
                            </select>
                        </div>
                        <!-- Selected Skills Display -->
                        <div id="selected-skills-container" class="mt-4 bg-white p-4 rounded-lg shadow-sm">
                            <h3 class="text-lg font-semibold text-blue-700">ทักษะที่เลือก:</h3>
                            <ul id="selected-skills-list" class="mt-2 list-disc list-inside text-gray-700"></ul>
                        </div>
                    </div>
                    <hr class="my-8 border-gray-200">
                    <!-- Section: Date -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="start-date">วันที่เริ่มต้น</label>
                            <input id="start-date" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="date" required />
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="end-date">วันที่สิ้นสุด</label>
                            <input id="end-date" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="date" required />
                        </div>
                    </div>
                    <!-- Section: Time -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="mb-6">
                            <label for="start-time" class="block text-gray-700 text-sm font-bold mb-2">เวลาเริ่มต้น</label>
                            <div class="flex items-center bg-white border shadow border rounded w-full py-2 px-3 text-gray-700">
                                <!-- Hour Selector -->
                                <select id="start-hours" name="start-hours" class="text-gray-700 w-full text-center focus:outline-none">
                                    <option value="" selected disabled>-- ชั่วโมง --</option>
                                    <script>
                                        for (let i = 0; i < 24; i++) {
                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาฬิกา</option>`);
                                        }
                                    </script>
                                </select>
                                <!-- Minute Selector -->
                                <select id="start-minutes" name="start-minutes" class="text-gray-700 w-full text-center focus:outline-none">
                                    <option value="00" selected>00 นาที</option>
                                    <script>
                                        for (let i = 0; i < 60; i += 5) {
                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาที</option>`);
                                        }
                                    </script>
                                </select>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label for="end-time" class="block text-gray-700 text-sm font-bold mb-2">เวลาสิ้นสุด</label>
                            <div class="flex items-center bg-white border shadow border rounded w-full py-2 px-3 text-gray-700">
                                <!-- Hour Selector -->
                                <select id="end-hours" name="end-hours" class="text-gray-700 w-full text-center focus:outline-none">
                                    <option value="" selected disabled>-- ชั่วโมง --</option>
                                    <script>
                                        for (let i = 0; i < 24; i++) {
                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาฬิกา</option>`);
                                        }
                                    </script>
                                </select>
                                <!-- Minute Selector -->
                                <select id="end-minutes" name="end-minutes" class="text-gray-700 w-full text-center focus:outline-none">
                                    <option value="00" selected>00 นาที</option>
                                    <script>
                                        for (let i = 0; i < 60; i += 5) {
                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาที</option>`);
                                        }
                                    </script>
                                </select>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label for="time-difference" class="block text-gray-700 text-sm font-bold mb-2">เวลาต่าง</label>
                            <input id="time-difference" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" readonly />
                        </div>
                        <script>
                            document.getElementById('start-hours').addEventListener('change', updateEndTime);
                            document.getElementById('start-minutes').addEventListener('change', updateEndTime);
                            document.getElementById('end-hours').addEventListener('change', calculateTimeDifference);
                            document.getElementById('end-minutes').addEventListener('change', calculateTimeDifference);

                            function updateEndTime() {
                                let startHours = parseInt(document.getElementById("start-hours").value, 10);
                                let startMinutes = parseInt(document.getElementById("start-minutes").value, 10);
                                if (!isNaN(startHours) && !isNaN(startMinutes)) {
                                    let endHours = startHours + 1;
                                    if (endHours >= 24) endHours = 0;
                                    document.getElementById("end-hours").value = endHours.toString().padStart(2, '0');
                                    document.getElementById("end-minutes").value = startMinutes.toString().padStart(2, '0');
                                    calculateTimeDifference();
                                }
                            }
                        </script>
                    </div>
                    <!-- Section: Participants & Status -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="max-participants">จำนวนผู้เข้าร่วมสูงสุด</label>
                            <input id="max-participants" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="number" required />
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="status">สถานะ</label>
                            <select id="status" class="shadow border rounded w-full py-2 px-3 text-gray-700" required>
                                <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                            </select>
                        </div>
                    </div>
                    <!-- Section: Time Tokens -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-required">จำนวนโทเค็นเวลาที่ต้องการ</label>
                            <input id="time-tokens-required" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" readonly />
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-per-participant">จำนวนโทเค็นเวลาต่อผู้เข้าร่วม</label>
                            <input id="time-tokens-per-participant" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" readonly />
                        </div>
                    </div>
                    <!-- Buttons -->
                    <div class="flex justify-center space-x-4">
                        <button onclick="window.history.back();" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"> ย้อนกลับ </button>
                        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit"> สร้างกิจกรรม </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="navbar.js"></script>
</body>
</html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let members = [];

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';

            if (searchTerm) {
                const filteredMembers = members.filter(member =>
                    member.name.toLowerCase().includes(searchTerm) ||
                    member.member_id.toString().includes(searchTerm)
                );

                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.member_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });

                // Show dropdown if there are results
                resultsDropdown.classList.remove('hidden');
            } else {
                // Hide dropdown if input is empty
                resultsDropdown.classList.add('hidden');
            }
        }

        async function submitActivity(event) {
            event.preventDefault();

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipantsInput = document.getElementById('max-participants').value;
            const maxParticipants = parseInt(maxParticipantsInput, 10);
            console.log('Max Participants Input:', maxParticipantsInput); // Debugging log
            const requesterName = document.getElementById('requester-name').value;
            const status = document.getElementById('status').value;

            // Validate maxParticipants to ensure it's a positive integer
            if (isNaN(maxParticipants) || maxParticipants <= 0) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดให้ถูกต้อง');
                return;
            }
            if (!Number.isInteger(maxParticipants)) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดเป็นตัวเลข');
                return;
            }

            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_name: requesterName,
                status,
            };

            // Debugging: Log the activity data being sent
            console.log('Activity Data:', activityData);

            try {
                const response = await fetch('http://localhost:3000/api/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert('สร้างกิจกรรมเรียบร้อยแล้ว!');
                window.location.href = 'activity.html'; // Redirect to the activity management page
            } catch (error) {
                console.error('Error creating activity:', error);
                alert('เกิดข้อผิดพลาดในการสร้างกิจกรรม กรุณาลองใหม่อีกครั้ง');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchMembers);
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i>
                            รายงาน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            จัดการกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3"></i>
                            จัดการสมาชิก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i>
                            จัดการหมวหมู่ทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3"></i>
                            จัดการกองทุนชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="commconf.html">
                            <i class="fas fa-cog mr-3"></i>
                            จัดการชุมชน
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                สร้างกิจกรรม
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="submitActivity(event)">
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">
                                ชื่อกิจกรรม
                            </label>
                            <input id="title"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                                ชื่อผู้ขอ
                            </label>
                            <input id="requester-name"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" oninput="searchMembers()" required />
                            <div id="search-results-dropdown"
                                class="bg-white border border-gray-300 mt-1 rounded shadow-lg z-10 hidden dropdown-content">
                                <!-- Search results will be dynamically inserted here -->
                            </div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="description">
                            รายละเอียด
                        </label>
                        <textarea id="description"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="location">
                            สถานที่
                        </label>
                        <input id="location"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" required />
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="start-date">
                                วันที่เริ่มต้น
                            </label>
                            <input id="start-date"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="start-time">
                                เวลาเริ่มต้น
                            </label>
                            <input id="start-time"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="time" required />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="end-date">
                                วันที่สิ้นสุด
                            </label>
                            <input id="end-date"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="end-time">
                                เวลาสิ้นสุด
                            </label>
                            <input id="end-time"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="time" required />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="max-participants">
                                จำนวนผู้เข้าร่วมสูงสุด
                            </label>
                            <input id="max-participants"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="status"
                                style="margin-left: 10px;">
                                สถานะ
                            </label>
                            <select id="status"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required>
                                <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                <option value="ยกเลิก">ยกเลิก</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button onclick="window.history.back();"
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            ย้อนกลับ
                        </button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">สร้างกิจกรรม</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

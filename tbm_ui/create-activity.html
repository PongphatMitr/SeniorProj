<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างกิจกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let members = [];
        let exchangeRate = null;

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                exchangeRate = data.default_exchange_rate_description;
                console.log('Exchange Rate:', exchangeRate);
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                const filteredMembers = members.filter(member => member.name.toLowerCase().includes(searchTerm) || member.user_id.toString().includes(searchTerm));
                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.user_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        document.getElementById('requester-id').value = member.user_id;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });
                resultsDropdown.classList.remove('hidden');
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        function calculateTimeTokens() {
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (isNaN(maxParticipants) || maxParticipants <= 0 || !startDate || !endDate || !startTime || !endTime || !exchangeRate) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }

            const startDateTime = new Date(`${startDate}T${startTime}`);
            const endDateTime = new Date(`${endDate}T${endTime}`);
            const durationInHours = Math.max(0, (endDateTime - startDateTime) / (1000 * 60 * 60));

            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;

            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }

            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function submitActivity(event) {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipantsInput = document.getElementById('max-participants').value;
            const maxParticipants = parseInt(maxParticipantsInput, 10);
            const requesterId = document.getElementById('requester-id').value;
            const status = document.getElementById('status').value;
            const timeTokensRequiredInput = document.getElementById('time-tokens-required').value;
            const timeTokensRequired = parseFloat(timeTokensRequiredInput);
            const timeTokensPerParticipantInput = document.getElementById('time-tokens-per-participant').value;
            const timeTokensPerParticipant = parseFloat(timeTokensPerParticipantInput);

            if (isNaN(maxParticipants) || maxParticipants <= 0) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดให้ถูกต้อง');
                return;
            }
            if (!Number.isInteger(maxParticipants)) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดเป็นตัวเลข');
                return;
            }
            if (isNaN(timeTokensRequired) || timeTokensRequired < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาที่ต้องการให้ถูกต้อง');
                return;
            }
            if (isNaN(timeTokensPerParticipant) || timeTokensPerParticipant < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาต่อผู้เข้าร่วมให้ถูกต้อง');
                return;
            }

            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_id: requesterId,
                status,
                time_tokens_required: timeTokensRequired,
                time_tokens_per_participant: timeTokensPerParticipant
            };

            console.log('Activity Data:', activityData);

            try {
                const response = await fetch('http://localhost:3000/api/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                alert('สร้างกิจกรรมเรียบร้อยแล้ว!');
                window.location.href = 'activity.html';
            } catch (error) {
                console.error('Error creating activity:', error);
                alert('เกิดข้อผิดพลาดในการสร้างกิจกรรม กรุณาลองใหม่อีกครั้ง');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                            <i class="fas fa-exchange-alt mr-3"></i> ${navItems[8]}

                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i> ${currentLang === 'thai' ? 'เข้าสู่ระบบ' : 'Login'}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="homepage.html">
                            <i class="fas fa-home mr-3"></i> ${navItems[1]}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="report.html">
                            <i class="fas fa-chart-bar mr-3"></i> ${navItems[2]}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="activity.html">
                            <i class="fas fa-calendar-alt mr-3"></i> ${navItems[3]}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="member.html">
                            <i class="fas fa-users mr-3"></i> ${navItems[4]}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="skillconf.html">
                            <i class="fas fa-cogs mr-3"></i> ${navItems[5]}
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="fund.html">

                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="commconf.html">
                            <i class="fas fa-cog mr-3"></i> ${navItems[7]}

                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" href="transaction.html">

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchMembers();
            fetchCommunityConfig();
            document.getElementById('max-participants').addEventListener('input', calculateTimeTokens);
            document.getElementById('start-date').addEventListener('input', calculateTimeTokens);
            document.getElementById('end-date').addEventListener('input', calculateTimeTokens);
            document.getElementById('start-time').addEventListener('input', calculateTimeTokens);
            document.getElementById('end-time').addEventListener('input', calculateTimeTokens);
        });
    </script>
</head>

                            <label class="block text-gray-700 text-sm font-bold mb-2" for="status"
                                style="margin-left: 10px;"> สถานะ </label>
                            <select id="status"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                required>
                                <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                <option value="ยกเลิก">ยกเลิก</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-required">
                                จำนวนโทเค็นเวลาที่ต้องการ </label>
                            <input id="time-tokens-required"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" readonly />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-per-participant">
                                จำนวนโทเค็นเวลาต่อผู้เข้าร่วม </label>
                            <input id="time-tokens-per-participant"
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" readonly />
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button onclick="window.history.back();"
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            ย้อนกลับ </button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">สร้างกิจกรรม</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            align-items: center;
            justify-content: space-between;
            width: 180px;
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            background-color: white;
            color: #6B7280;
            font-weight: bold;
        }
    </style>
    <script src="selected-language.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');
            const translations = {
                thai: {
                    pageTitle: 'สร้างกิจกรรม - Time Bank',
                    mainHeading: 'สร้างกิจกรรม',
                    subHeading: 'รายละเอียดกิจกรรม',
                    labels: {
                        title: 'ชื่อกิจกรรม',
                        requesterName: 'ชื่อผู้ขอ',
                        description: 'รายละเอียด',
                        location: 'สถานที่',
                        startDate: 'วันที่เริ่มต้น',
                        startTime: 'เวลาเริ่มต้น',
                        endDate: 'วันที่สิ้นสุด',
                        endTime: 'เวลาสิ้นสุด',
                        maxParticipants: 'จำนวนผู้เข้าร่วมสูงสุด',
                        status: 'สถานะ',
                        timeTokensRequired: 'จำนวนโทเค็นเวลาที่ต้องการ',
                        timeTokensPerParticipant: 'จำนวนโทเค็นเวลาต่อผู้เข้าร่วม',
                        backButton: 'ย้อนกลับ',
                        submitButton: 'สร้างกิจกรรม',
                    },
                    placeholders: {
                        title: 'ระบุชื่อกิจกรรม',
                        requesterName: 'ระบุชื่อผู้ขอ',
                        description: 'ระบุรายละเอียดกิจกรรม',
                        location: 'ระบุสถานที่จัดกิจกรรม',
                    },
                    statusOptions: ['กำลังจะเริ่ม', 'เสร็จสิ้น', 'ยกเลิก'],
                    nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],
                },
                english: {
                    pageTitle: 'Create Activity - Time Bank',
                    mainHeading: 'Create Activity',
                    subHeading: 'Activity Details',
                    labels: {
                        title: 'Activity Title',
                        requesterName: 'Requester Name',
                        description: 'Description',
                        location: 'Location',
                        startDate: 'Start Date',
                        startTime: 'Start Time',
                        endDate: 'End Date',
                        endTime: 'End Time',
                        maxParticipants: 'Maximum Participants',
                        status: 'Status',
                        timeTokensRequired: 'Time Tokens Required',
                        timeTokensPerParticipant: 'Time Tokens Per Participant',
                        backButton: 'Back',
                        submitButton: 'Create Activity',
                    },
                    placeholders: {
                        title: 'Enter activity title',
                        requesterName: 'Enter requester name',
                        description: 'Enter activity description',
                        location: 'Enter activity location',
                    },
                    statusOptions: ['Upcoming', 'Completed', 'Cancelled'],
                    nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],
                },
            };
            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';
            const updateContent = (lang) => {
                const langData = translations[lang];
                document.title = langData.pageTitle;
                document.querySelector('h1').textContent = langData.mainHeading;
                document.querySelector('h2').textContent = langData.subHeading;
                document.querySelector('label[for="title"]').textContent = langData.labels.title;
                document.querySelector('label[for="requester-name"]').textContent = langData.labels.requesterName;
                document.querySelector('label[for="description"]').textContent = langData.labels.description;
                document.querySelector('label[for="location"]').textContent = langData.labels.location;
                document.querySelector('label[for="start-date"]').textContent = langData.labels.startDate;
                document.querySelector('label[for="start-time"]').textContent = langData.labels.startTime;
                document.querySelector('label[for="end-date"]').textContent = langData.labels.endDate;
                document.querySelector('label[for="end-time"]').textContent = langData.labels.endTime;
                document.querySelector('label[for="max-participants"]').textContent = langData.labels.maxParticipants;
                document.querySelector('label[for="status"]').textContent = langData.labels.status;
                document.querySelector('label[for="time-tokens-required"]').textContent = langData.labels.timeTokensRequired;
                document.querySelector('label[for="time-tokens-per-participant"]').textContent = langData.labels.timeTokensPerParticipant;
                document.getElementById('title').placeholder = langData.placeholders.title;
                document.getElementById('requester-name').placeholder = langData.placeholders.requesterName;
                document.getElementById('description').placeholder = langData.placeholders.description;
                document.getElementById('location').placeholder = langData.placeholders.location;
                const statusSelect = document.getElementById('status');
                statusSelect.innerHTML = '';
                langData.statusOptions.forEach((option) => {
                    const statusOption = document.createElement('option');
                    statusOption.value = option;
                    statusOption.textContent = option;
                    statusSelect.appendChild(statusOption);
                });
                document.querySelector('button[onclick="window.history.back();"]').textContent = langData.labels.backButton;
                document.querySelector('button[type="submit"]').textContent = langData.labels.submitButton;
                const navItems = navList.querySelectorAll('a');
                navItems.forEach((link, index) => {
                    const icon = link.querySelector('i');
                    link.innerHTML = '';
                    if (icon) link.appendChild(icon);
                    link.append(` ${langData.nav[index]}`);
                });
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }
            };
            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });
            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });
            updateContent(currentLang);
        });
    </script>
</body>

</html>

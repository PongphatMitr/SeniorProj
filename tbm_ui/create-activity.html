<html lang="en">

    <title>สร้างกิจกรรม - Time Bank</title>

    <script>
        let members = [];
        let exchangeRate = null;
        let minimumTimeTokenHours = null;
        let minimumTimeTokenMinutes = null;
        let skills = [];
        let categories = [];
        let selectedSkills = [];

        // เพิ่มฟังก์ชันนี้หลังฟังก์ชัน showErrorModal
            function showConfirmation(message, onConfirm) {
                const modal = document.getElementById('confirm-modal');
                const messageElement = document.getElementById('confirm-message');

                messageElement.textContent = message;
                modal.classList.remove('hidden');

                // ลบ event listeners เดิมเพื่อป้องกันการเรียกซ้ำ
                const confirmBtn = document.getElementById('confirm-yes-btn');
                const cancelBtn = document.getElementById('confirm-no-btn');

                confirmBtn.onclick = null;
                cancelBtn.onclick = null;

                // กำหนดการทำงานเมื่อคลิกยืนยัน
                confirmBtn.onclick = () => {
                    modal.classList.add('hidden');
                    onConfirm();
                };

                // กำหนดการทำงานเมื่อคลิกยกเลิก
                cancelBtn.onclick = () => {
                    modal.classList.add('hidden');
                };
            }

        // แสดง Modal ข้อผิดพลาด
            function showErrorModal(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-modal').classList.remove('hidden');
            }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/community-config', {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    exchangeRate = data.default_exchange_rate_description;
                    minimumTimeTokenHours = parseInt(data.minimum_time_token_hours);
                    minimumTimeTokenMinutes = parseInt(data.minimum_time_token_minutes);

                    console.log('Exchange Rate:', exchangeRate);
                    console.log('Minimum Time Token:', minimumTimeTokenHours, minimumTimeTokenMinutes);

                    document.getElementById('minimum-time-token').innerText =
                        `ใช้เวลาขั้นต่ำ ${minimumTimeTokenHours} ชั่วโมง ${minimumTimeTokenMinutes} นาที เพื่อแลกเปลี่ยนโทเคนของกิจกรรมที่ร้องขอ`;

                } catch (error) {
                    console.error('Error fetching community config:', error);
                    showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
                }
                calculateTimeTokens();
            }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                const filteredMembers = members.filter(member => member.name.toLowerCase().includes(searchTerm) || member.user_id.toString().includes(searchTerm));
                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.user_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        document.getElementById('requester-id').value = member.user_id;
                        document.getElementById('phone').value = member.phone;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });
                resultsDropdown.classList.remove('hidden');
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        async function fetchSkillsAndCategories() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    categories = [...new Set(skills.map(skill => skill.category))];
                    populateCategoryDropdown();
                } else {
                    console.error('Expected an array but got:', data);
                    showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                showErrorModal('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        function populateCategoryDropdown() {
            const categoryDropdown = document.getElementById('category-dropdown');
            categoryDropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>';
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryDropdown.appendChild(option);
            });
            document.getElementById('skill-dropdown').disabled = true;
        }

        function updateSkillDropdown() {
            const selectedCategory = document.getElementById('category-dropdown').value;
            const skillDropdown = document.getElementById('skill-dropdown');
            skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
            if (!selectedCategory) {
                skillDropdown.disabled = true;
                return;
            }
            const filteredSkills = skills.filter(skill => skill.category === selectedCategory);
            filteredSkills.forEach(skill => {
                if (!selectedSkills.some(selected => selected.skill_id === skill.skill_id)) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                }
            });
            skillDropdown.disabled = false;
        }

        function addSkill() {
            const skillDropdown = document.getElementById('skill-dropdown');
            const selectedSkillId = skillDropdown.value;
            if (!selectedSkillId) return;
            if (selectedSkills.length > 0) {
                showErrorModal('คุณสามารถเลือกได้เพียง 1 ทักษะเท่านั้น');
                return;
            }
            const skill = skills.find(s => s.skill_id == selectedSkillId);
            if (!skill) return;
            selectedSkills = [skill];
            updateSelectedSkillsDisplay();
            skillDropdown.value = '';
        }

        function updateSelectedSkillsDisplay() {
            const selectedSkillsList = document.getElementById('selected-skills-list');
            selectedSkillsList.innerHTML = '';
            selectedSkills.forEach((skill, index) => {
                const listItem = document.createElement('li');
                listItem.className = "bg-gray-200 p-2 rounded flex justify-between items-center mb-2";
                listItem.innerHTML = `
                    <span>🛠 <strong>หมวดหมู่:</strong> ${skill.category} | <strong>ทักษะ:</strong> ${skill.name}</span>
                    <button class="text-red-600 font-bold" onclick="removeSkill(${index})">❌</button>
                `;
                selectedSkillsList.appendChild(listItem);
            });
            document.getElementById('skill-dropdown').disabled = selectedSkills.length >= 1;
        }

        function removeSkill(index) {
            selectedSkills.splice(index, 1);
            updateSelectedSkillsDisplay();
            document.getElementById('skill-dropdown').disabled = false;
        }

        // ใน create-activity.html แทนที่ฟังก์ชันเดิมด้วยโค้ดนี้
            function calculateTimeTokens() {
                const startHours = document.getElementById('start-hours')?.value;
                const startMinutes = document.getElementById('start-minutes')?.value;
                const endHours = document.getElementById('end-hours')?.value;
                const endMinutes = document.getElementById('end-minutes')?.value;
                const maxParticipants = parseInt(document.getElementById('max-participants')?.value, 10) || 0;

                const startDateInput = document.getElementById('start-date');
                const endDateInput = document.getElementById('end-date');

                if (!startHours || !startMinutes || !endHours || !endMinutes || !startDateInput || !endDateInput) {
                    document.getElementById('time-tokens-required').value = '0.00';
                    document.getElementById('time-tokens-per-participant').value = '0.00';
                    return;
                }

                // เพิ่มในส่วนต้นของ calculateTimeTokens()
                const activityType = document.getElementById('activity-type').value;
                if (activityType === 'non_exchange') {
                    document.getElementById('time-tokens-required').value = '0.00';
                    document.getElementById('time-tokens-per-participant').value = '0.00';
                    return;
                }

                const startDateStr = startDateInput.value;
                let endDateStr = endDateInput.value;

                // สร้าง Date object สำหรับคำนวณ
                const startDateTime = new Date(`${startDateStr}T${startHours}:${startMinutes}`);
                let endDateTime = new Date(`${endDateStr}T${endHours}:${endMinutes}`);

                // ✅ แก้ไขวันที่ถ้าเวลาสิ้นสุดน้อยกว่าเวลาเริ่มต้น
                if (endDateTime <= startDateTime) {
                    endDateTime.setDate(endDateTime.getDate() + 1);
                    const newEndDate = endDateTime.toISOString().split("T")[0];
                    endDateInput.value = newEndDate;
                    endDateInput.setAttribute("min", newEndDate);
                }

                // คำนวณระยะเวลาใหม่หลังจากแก้ไขวันที่
                const finalDuration = (endDateTime - startDateTime) / (1000 * 60 * 60);

                let timeTokensRequired = 0;
                let timeTokensPerParticipant = 0;

                if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                    timeTokensPerParticipant = finalDuration;
                    timeTokensRequired = maxParticipants * finalDuration;
                } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                    timeTokensPerParticipant = 1;
                    timeTokensRequired = maxParticipants;
                }

                document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
                document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
            }

        async function submitActivity(event) {
                event.preventDefault();

                const title = document.getElementById('title').value;
                const description = document.getElementById('description').value;
                const location = document.getElementById('location').value;
                const startDate = document.getElementById('start-date').value;
                const endDate = document.getElementById('end-date').value;
                const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
                const requesterId = document.getElementById('requester-id').value;
                const requesterPhone = document.getElementById('phone').value;
                const status = document.getElementById('status').value;
                const activityType = document.getElementById('activity-type').value;
                const timeTokensRequired = parseFloat(document.getElementById('time-tokens-required').value);
                const timeTokensPerParticipant = parseFloat(document.getElementById('time-tokens-per-participant').value);
                const startHours = document.getElementById('start-hours').value;
                const startMinutes = document.getElementById('start-minutes').value;
                const endHours = document.getElementById('end-hours').value;
                const endMinutes = document.getElementById('end-minutes').value;

                if (!activityType) {
                    showErrorModal('กรุณาเลือกประเภทของกิจกรรม');
                    return;
                }
                if (!requesterId) {
                    showErrorModal('กรุณาเลือกผู้ขอ');
                    return;
                }
                if (!maxParticipants || isNaN(maxParticipants)) {
                    showErrorModal('กรุณาระบุจำนวนผู้เข้าร่วม');
                    return;
                }
                if (!startHours || !startMinutes || !endHours || !endMinutes) {
                    showErrorModal('กรุณาเลือกเวลาเริ่มต้นและเวลาสิ้นสุดให้ครบ');
                    return;
                }
                if (selectedSkills.length === 0) {
                    showErrorModal('กรุณาเลือก 1 ทักษะสำหรับกิจกรรม');
                    return;
                }

                const startTime = `${startHours}:${startMinutes}`;
                const endTime = `${endHours}:${endMinutes}`;
                const required_skill = selectedSkills[0].skill_id;

                const activityData = {
                    title,
                    description,
                    location,
                    start_date: startDate,
                    start_time: startTime,
                    end_date: endDate,
                    end_time: endTime,
                    max_participants: Number(maxParticipants),
                    requester_id: Number(requesterId),
                    requester_phone: requesterPhone,
                    status,
                    time_tokens_required: activityType === 'exchange' ? timeTokensRequired : 0,
                    time_tokens_per_participant: activityType === 'exchange' ? timeTokensPerParticipant : 0,
                    required_skills: Number(required_skill),
                    activity_type: activityType
                };

                try {
                    const response = await fetch('http://localhost:3000/api/tbm/activities', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(activityData)
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`Activity creation failed: ${errorData.error}`);
                    }
                    showSuccessModal();
                } catch (error) {
                    console.error('Error while submitting activity:', error);
                    showErrorModal(error.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                }
            }

            function autoSetEndTime() {
                    const startHours = parseInt(document.getElementById('start-hours').value, 10);
                    const startMinutes = parseInt(document.getElementById('start-minutes').value, 10);

                    if (isNaN(startHours) || isNaN(startMinutes)) return;

                    let endHours = startHours + 1;
                    let endMinutes = startMinutes;

                    if (endHours >= 24) {
                        endHours = endHours % 24;
                        const endDateInput = document.getElementById('end-date');
                        const currentEndDate = new Date(endDateInput.value);
                        currentEndDate.setDate(currentEndDate.getDate() + 1);
                        const newEndDateStr = currentEndDate.toISOString().split('T')[0];
                        endDateInput.value = newEndDateStr;
                        endDateInput.setAttribute('min', newEndDateStr);
                    }

                    document.getElementById('end-hours').value = endHours.toString().padStart(2, '0');
                    document.getElementById('end-minutes').value = endMinutes.toString().padStart(2, '0');
                }

                function updateEndDate(startDateValue) {
                        const endDateInput = document.getElementById('end-date');
                        const startHours = parseInt(document.getElementById('start-hours').value, 10);
                        const startMinutes = parseInt(document.getElementById('start-minutes').value, 10);
                        const endHours = parseInt(document.getElementById('end-hours').value, 10);
                        const endMinutes = parseInt(document.getElementById('end-minutes').value, 10);

                        if (!endDateInput) return;

                        endDateInput.setAttribute('min', startDateValue);

                        if (endDateInput.value < startDateValue) {
                            endDateInput.value = startDateValue;
                        }

                        if (
                            endDateInput.value === startDateValue &&
                            !isNaN(startHours) && !isNaN(startMinutes) &&
                            !isNaN(endHours) && !isNaN(endMinutes)
                        ) {
                            const startTime = startHours * 60 + startMinutes;
                            const endTime = endHours * 60 + endMinutes;

                            if (startTime > endTime) {
                                const newEndDate = new Date(startDateValue);
                                newEndDate.setDate(newEndDate.getDate() + 1);
                                const formattedNewEndDate = newEndDate.toISOString().split('T')[0];
                                endDateInput.value = formattedNewEndDate;
                                endDateInput.setAttribute('min', formattedNewEndDate);
                            }
                        }
                    }

                function handleActivityTypeChange() {
                        const type = document.getElementById('activity-type').value;
                        const tokenFields = document.getElementById('token-fields');
                        if (!tokenFields) {
                            console.warn('token-fields not found, skipping...');
                            return; // ➔ ป้องกัน error
                        }
                        if (type === 'exchange') {
                            tokenFields.classList.remove('hidden');
                            calculateTimeTokens();
                        } else {
                            tokenFields.classList.add('hidden');
                        }
                    }

                    // Date initialization with local time
                        const initializeDates = () => {
                            const now = new Date();
                            const year = now.getFullYear();
                            const month = String(now.getMonth() + 1).padStart(2, '0');
                            const day = String(now.getDate()).padStart(2, '0');
                            const today = `${year}-${month}-${day}`;

                            const startDateInput = document.getElementById('start-date');
                            const endDateInput = document.getElementById('end-date');

                            startDateInput.value = today;
                            endDateInput.value = today;
                            startDateInput.min = today;
                            endDateInput.min = today;
                        };

                        // Time initialization with local time
                        const initializeTimes = () => {
                            const now = new Date();
                            const currentHour = now.getHours().toString().padStart(2, '0');
                            const currentMinute = String(Math.floor(now.getMinutes() / 5) * 5).padStart(2, '0');

                            // Set start time
                            document.getElementById('start-hours').value = currentHour;
                            document.getElementById('start-minutes').value = currentMinute;

                            // Set end time (start time + 1 hour)
                            updateEndTime();
                        };

                        function updateEndTime() {
                                const startHours = parseInt(document.getElementById("start-hours").value, 10);
                                const startMinutes = parseInt(document.getElementById("start-minutes").value, 10);

                                if (!isNaN(startHours)) {
                                    let endHours = startHours + 1;
                                    const endMinutes = startMinutes;

                                    // Handle midnight rollover
                                    if (endHours >= 24) endHours = 0;

                                    document.getElementById("end-hours").value = endHours.toString().padStart(2, '0');
                                    document.getElementById("end-minutes").value = endMinutes.toString().padStart(2, '0');

                                    calculateTimeDifference();
                                    calculateTimeTokens();
                                }
                            }

        function calculateTimeDifference() {
                const startHours = parseInt(document.getElementById("start-hours").value, 10);
                const startMinutes = parseInt(document.getElementById("start-minutes").value, 10);
                const endHours = parseInt(document.getElementById("end-hours").value, 10);
                const endMinutes = parseInt(document.getElementById("end-minutes").value, 10);

                if (!isNaN(startHours) && !isNaN(startMinutes) && !isNaN(endHours) && !isNaN(endMinutes)) {
                    let startTime = new Date();
                    startTime.setHours(startHours, startMinutes, 0);
                    let endTime = new Date();
                    endTime.setHours(endHours, endMinutes, 0);
                    let durationInMinutes = (endTime - startTime) / (1000 * 60);
                    if (durationInMinutes < 0) {
                        durationInMinutes += 24 * 60;
                    }
                    const hours = Math.floor(durationInMinutes / 60);
                    const minutes = durationInMinutes % 60;
                    const totalDurationInHours = hours + (minutes / 60);
                    const timeDifferenceElement = document.getElementById("time-difference");
                    timeDifferenceElement.value = `${hours} ชั่วโมง ${minutes} นาที`;
                    const minimumDurationInHours = minimumTimeTokenHours + (minimumTimeTokenMinutes / 60);
                    if (totalDurationInHours < minimumDurationInHours) {
                        timeDifferenceElement.classList.remove('text-green-600');
                        timeDifferenceElement.classList.add('text-red-600');
                    } else {
                        timeDifferenceElement.classList.remove('text-red-600');
                        timeDifferenceElement.classList.add('text-green-600');
                    }
                }
                calculateTimeTokens(); // ✨ เพิ่มตรงนี้
            }

        // In the script section
        function setStartDateRange() {
                const now = new Date();
                const minStartDate = new Date();
                minStartDate.setDate(now.getDate() + 3);

                const formattedMinStartDate = minStartDate.toISOString().split('T')[0];

                const startDateInput = document.getElementById('start-date');
                const endDateInput = document.getElementById('end-date');

                startDateInput.setAttribute('min', formattedMinStartDate);
                startDateInput.value = formattedMinStartDate;
                endDateInput.setAttribute('min', formattedMinStartDate);
                endDateInput.value = formattedMinStartDate;

                syncDates(formattedMinStartDate);
            }

        function syncDates() {
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            
            // If start date is changed to a later date than end date, update end date
            if (new Date(startDateInput.value) > new Date(endDateInput.value)) {
                endDateInput.value = startDateInput.value;
            }
            
            // Always keep end date minimum same as start date
            endDateInput.min = startDateInput.value;
}

        function adjustEndTime(startTime) {
            if (!startTime) return;
            let [hours, minutes] = startTime.split(":").map(Number);
            hours += 1;
            if (hours >= 24) hours = 0;
            const endTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            document.getElementById('end-time').value = endTime;
        }

        function calculateTimeDifference() {
            const startHours = parseInt(document.getElementById("start-hours").value, 10);
            const startMinutes = parseInt(document.getElementById("start-minutes").value, 10);
            const endHours = parseInt(document.getElementById("end-hours").value, 10);
            const endMinutes = parseInt(document.getElementById("end-minutes").value, 10);
            if (!isNaN(startHours) && !isNaN(startMinutes) && !isNaN(endHours) && !isNaN(endMinutes)) {
                let startTime = new Date();
                startTime.setHours(startHours, startMinutes, 0);
                let endTime = new Date();
                endTime.setHours(endHours, endMinutes, 0);
                let durationInMinutes = (endTime - startTime) / (1000 * 60);
                if (durationInMinutes < 0) {
                    durationInMinutes += 24 * 60;
                }
                const hours = Math.floor(durationInMinutes / 60);
                const minutes = durationInMinutes % 60;
                const totalDurationInHours = hours + (minutes / 60);
                const timeDifferenceElement = document.getElementById("time-difference");
                timeDifferenceElement.value = `${hours} ชั่วโมง ${minutes} นาที`;
                const minimumDurationInHours = minimumTimeTokenHours + (minimumTimeTokenMinutes / 60);
                if (totalDurationInHours < minimumDurationInHours) {
                    timeDifferenceElement.classList.remove('text-green-600');
                    timeDifferenceElement.classList.add('text-red-600');
                } else {
                    timeDifferenceElement.classList.remove('text-red-600');
                    timeDifferenceElement.classList.add('text-green-600');
                }
            }
        }
    </script>
</head>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        เพิ่มกิจกรรมใหม่ - Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        function validateDates() {
            const startDate = document.getElementById('service-start-date');
            const endDate = document.getElementById('service-end-date');
            const startTime = document.getElementById('service-time-start');
            const endTime = document.getElementById('service-time-end');
            const submitButton = document.getElementById('submit-button');

            if (startDate.value && endDate.value) {
                if (new Date(endDate.value) < new Date(startDate.value)) {
                    alert('วันที่สิ้นสุดไม่สามารถอยู่ก่อนวันที่เริ่มต้นได้');
                    endDate.value = ''; // Clear the end date
                    endTime.value = ''; // Clear the end time
                    submitButton.disabled = true;
                    return;
                }
            }

            if (startDate.value && endDate.value && startTime.value && endTime.value) {
                if (new Date(endDate.value).getTime() === new Date(startDate.value).getTime() && endTime.value < startTime.value) {
                    alert('เวลาสิ้นสุดไม่สามารถอยู่ก่อนเวลาเริ่มต้นได้');
                    endTime.value = ''; // Clear the end time
                    submitButton.disabled = true;
                    return;
                }
            }

            submitButton.disabled = false;
        }

        async function submitActivity(event) {
            event.preventDefault();

            const title = document.getElementById('service-title').value;
            const start_date = document.getElementById('service-start-date').value;
            const start_time = document.getElementById('service-time-start').value;
            const end_date = document.getElementById('service-end-date').value;
            const end_time = document.getElementById('service-time-end').value;
            const location = document.getElementById('service-location').value;
            const max_participants = document.getElementById('service-people').value;
            const requester_name = document.getElementById('requester-name').value;
            const description = document.getElementById('service-description').value;
            const status = 'กำลังจะเริ่ม'; // Default status for new activities

            const activityData = {
                title,
                description,
                location,
                start_date,
                start_time,
                end_date,
                end_time,
                max_participants,
                requester_name,
                status
            };

            try {
                const response = await fetch('http://localhost:3000/api/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (response.ok) {
                    alert('กิจกรรมถูกเพิ่มเรียบร้อยแล้ว');
                    window.location.href = 'activity.html'; // Redirect to the activity management page
                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการยื่นกิจกรรม');
            }
        }
    </script>
</head>

<body class="bg-gray-100">

        <!-- Sidebar -->

                    src="https://storage.googleapis.com/a1aa/image/0evJInagqwwexUvOsHx1Vbr97igUPawzadfRGe7hUbautO3PB.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3">
                            </i>
                            <span class="ml-3">
                                Login
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="homepage.html">
                            <i class="fas fa-home mr-3">
                            </i>
                            <span class="ml-3">
                                หน้าหลัก
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="report.html">
                            <i class="fas fa-chart-bar mr-3">
                            </i>
                            <span class="ml-3">
                                รายงาน
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="activity.html">
                            <i class="fas fa-calendar-alt mr-3">
                            </i>
                            <span class="ml-3">
                                จัดการกิจกรรม
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="member.html">
                            <i class="fas fa-users mr-3">
                            </i>
                            <span class="ml-3">
                                จัดการสมาชิก
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-cogs mr-3">
                            </i>
                            <span class="ml-3">
                                จัดการหมวหมู่ทักษะ
                            </span>
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="fund.html">
                            <i class="fas fa-hand-holding-usd mr-3">
                            </i>
                            <span class="ml-3">
                                จัดการกองทุนชุมชน
                            </span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                เพิ่มกิจกรรมใหม่
            </h1>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="submitActivity(event)">
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-title">
                                ชื่อบริการ
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-title" placeholder="ชื่อบริการ" type="text" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-start-date">
                                วันที่เริ่มต้น
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-calendar-alt text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-start-date').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-start-date" type="date" required onchange="validateDates()" />
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-start">
                                เวลาเริ่มต้น
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-clock text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-time-start').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-time-start" type="time" required onchange="validateDates()" />
                            </div>
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-end-date">
                                วันที่สิ้นสุด
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-calendar-alt text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-end-date').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-end-date" type="date" required onchange="validateDates()" />
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-end">
                                เวลาสิ้นสุด
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                    <i class="fas fa-clock text-gray-400 cursor-pointer"
                                        onclick="document.getElementById('service-time-end').focus()">
                                    </i>
                                </span>
                                <input
                                    class="shadow appearance-none border rounded w-full py-2 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    id="service-time-end" type="time" required onchange="validateDates()" />
                            </div>
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-location">
                                สถานที่จัด
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-location" placeholder="สถานที่จัด" type="text" required />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-people">
                                จำนวนคน
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="service-people" placeholder="จำนวนคน" type="number" required />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                                ชื่อผู้ขอบริการ
                            </label>
                            <input
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="requester-name" placeholder="ชื่อผู้ขอบริการ" type="text" required />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-description">
                            รายละเอียดบริการ
                        </label>
                        <textarea
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="service-description" placeholder="รายละเอียดบริการ" required></textarea>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="window.history.back()">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit" id="submit-button">
                            ยื่นกิจกรรม
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

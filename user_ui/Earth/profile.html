<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Edit Profile - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <img src="https://storage.googleapis.com/a1aa/image/GOMFBEaepyxe3E3gz2xaZviBDO0q04rV6Cz8h1wgcnNFaw5TA.jpg" alt="Logo" class="logo" />
                <span class="brand-name">TIMEBANK</span>
            </div>
            <nav>
                <ul>
                    <li>
                        <a href="login.html">
                            <i class="fas fa-sign-in-alt"></i>
                            <span class="link-text">Login</span>
                        </a>
                    </li>
                    <li>
                        <a href="HomePage.html">
                            <i class="fas fa-home"></i>
                            <span class="link-text">หน้าหลัก</span>
                        </a>
                    </li>
                    <!-- การบริการ Dropdown -->
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">
                            <i class="fas fa-cogs"></i>
                            <span class="link-text">การบริการ</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="service.html" class="sub-link">ยื่นข้อของานบริการ</a>
                            </li>
                        </ul>
                    </li>
                    <!-- การจัดการบัญชี Dropdown -->
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">
                            <i class="fas fa-user-circle"></i>
                            <span class="link-text">การจัดการบัญชี</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="profile.html" class="sub-link">แก้ไขประวัติ</a>
                            </li>
                            <li>
                                <a href="skillconf.html" class="sub-link">แก้ไขทักษะ</a>
                            </li>
                            <li>
                                <a href="balance.html" class="sub-link">ยอดคงเหลือ</a>
                            </li>
                            <li>
                                <a href="history.html" class="sub-link">ประวัติ</a>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <a href="contact.html">
                            <i class="fas fa-phone"></i>
                            <span class="link-text">ติดต่อเรา</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="page-profile">
            <form>
                <h1 class="text-4xl font-bold mb-6 text-center">แก้ไขประวัติ</h1>
                <div class="mb-4">
                    <label for="name">ชื่อ</label>
                    <input id="name" type="text" placeholder="ชื่อ" />
                </div>
                <div class="mb-4">
                    <label for="email">อีเมล</label>
                    <input id="email" type="email" placeholder="อีเมล" />
                </div>
                <div class="mb-4">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input id="phone" type="text" placeholder="เบอร์โทรศัพท์" />
                </div>
                <div class="mb-4">
                    <label for="address">ที่อยู่</label>
                    <textarea id="address" placeholder="ที่อยู่"></textarea>
                </div>
                <div class="mb-4">
                    <label for="branch">สาขา</label>
                    <select id="branch">
                        <option value="central">สาขากลาง</option>
                        <option value="north">สาขาเหนือ</option>
                        <option value="northeast">สาขาอีสาน</option>
                        <option value="east">สาขาตะวันออก</option>
                        <option value="west">สาขาตะวันตก</option>
                        <option value="south">สาขาใต้</option>
                    </select>
                </div>
                <div class="flex items-center justify-center">
                    <button type="submit">บันทึก</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
            const sidebar = document.querySelector('.sidebar');
    
            // Handle dropdown toggle click
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevent default anchor behavior
                    const parent = toggle.parentElement;
                    parent.classList.toggle('open'); // Toggle the "open" class
                });
            });
    
            // Reset dropdowns when the mouse leaves the sidebar
            sidebar.addEventListener('mouseleave', () => {
                const dropdowns = document.querySelectorAll('.dropdown');
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('open'); // Remove "open" class
                });
            });
        });
    </script>
</body>

</html>

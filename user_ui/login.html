<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="page-login">
    <div class="container">
        <!-- Main Content -->
        <div class="center-wrapper">
            <h1 class="site-title">TIME BANK</h1>
            <div class="login-container">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="mb-4">
                        <input id="username" placeholder="ชื่อผู้ใช้" required="" type="text" class="input-field" />
                    </div>
                    <div class="mb-6">
                        <input id="password" placeholder="รหัสผ่าน" required="" type="password" class="input-field" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button class="login-button" type="submit">เข้าสู่ระบบ</button>
                    </div>
                </form>
                <p class="signup-text">
                    ไม่มีบัญชีผู้ใช้ ?
                    <a href="register.html" id="signup-link">สมัครสมาชิก</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'An error occurred');
                }

                const data = await response.json();

                // Save the token in localStorage
                localStorage.setItem('token', data.token);
                // Update the sidebar
                window.location.href = 'HomePage.html';
            } catch (error) {
                console.error('Error:', error);
                alert(error.message);
            }
        });

        document.getElementById('signup-link').addEventListener('click', (e) => {
            console.log('Sign-up link clicked:', e.target.href);
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
            const sidebar = document.querySelector('.sidebar');
    
            // Handle dropdown toggle click
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevent default anchor behavior
                    const parent = toggle.parentElement;
                    parent.classList.toggle('open'); // Toggle the "open" class
                });
            });
    
            // Reset dropdowns when the mouse leaves the sidebar
            sidebar.addEventListener('mouseleave', () => {
                const dropdowns = document.querySelectorAll('.dropdown');
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('open'); // Remove "open" class
                });
            });
        });
    </script>
    

</body>

</html>

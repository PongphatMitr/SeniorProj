<html lang="en">

        let members = [];
        let exchangeRate = null;

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const activity = await response.json();

                if (activity) {
                    document.getElementById('title').value = activity.title || '';
                    document.getElementById('description').value = activity.description || '';
                    document.getElementById('location').value = activity.location || '';
                    document.getElementById('start-date').value = activity.start_date ? activity.start_date.split('T')[0] : '';
                    document.getElementById('start-time').value = activity.start_time ? activity.start_time.substring(0, 5) : '';
                    document.getElementById('end-date').value = activity.end_date ? activity.end_date.split('T')[0] : '';
                    document.getElementById('end-time').value = activity.end_time ? activity.end_time.substring(0, 5) : '';
                    document.getElementById('max-participants').value = activity.max_participants || '';
                    document.getElementById('requester-name').value = activity.requester_name || '';
                    document.getElementById('status').value = activity.status || '';
                    document.getElementById('time-tokens-required').value = activity.time_tokens_required || '';
                    document.getElementById('time-tokens-per-participant').value = activity.time_tokens_per_participant || '';
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {

                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';

            if (searchTerm) {
                const filteredMembers = members.filter(member =>
                    member.name.toLowerCase().includes(searchTerm) ||
                    member.member_id.toString().includes(searchTerm)

                filteredMembers.forEach(member => {

                            </div>

                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        document.getElementById('requester-id').value = member.member_id;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });

                resultsDropdown.classList.remove('hidden');
            } else {
                // Hide dropdown if input is empty
                resultsDropdown.classList.add('hidden');
            }
        }

        function calculateTimeTokens() {
            // Get input values
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            // Check for invalid inputs and reset output fields if necessary
            if (
                isNaN(maxParticipants) ||
                maxParticipants <= 0 ||
                !startDate ||
                !endDate ||
                !startTime ||
                !endTime ||
                !exchangeRate
            ) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }

            // Parse date and time inputs
            const startDateTime = new Date(`${startDate}T${startTime}`);
            const endDateTime = new Date(`${endDate}T${endTime}`);

            // Calculate the duration in hours
            const durationInHours = Math.max(0, (endDateTime - startDateTime) / (1000 * 60 * 60));

            // Variables to hold calculation results
            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;

            // Calculate based on exchange rate
            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                // Rate 1: Tokens depend on the duration
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                // Rate 2: Fixed tokens regardless of duration
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }

            // Update the output fields
            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function updateActivity(event) {
            event.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id');

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipantsInput = document.getElementById('max-participants').value;
            const maxParticipants = parseInt(maxParticipantsInput, 10);
            const requesterId = document.getElementById('requester-id').value;
            const status = document.getElementById('status').value;
            const timeTokensRequiredInput = document.getElementById('time-tokens-required').value;
            const timeTokensRequired = parseFloat(timeTokensRequiredInput);
            const timeTokensPerParticipantInput = document.getElementById('time-tokens-per-participant').value;
            const timeTokensPerParticipant = parseFloat(timeTokensPerParticipantInput);

            // Validate maxParticipants to ensure it's a positive integer
            if (isNaN(maxParticipants) || maxParticipants <= 0) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดให้ถูกต้อง');
                return;
            }
            if (!Number.isInteger(maxParticipants)) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดเป็นตัวเลข');
                return;
            }

            // Validate timeTokensRequired to ensure it's a positive number
            if (isNaN(timeTokensRequired) || timeTokensRequired < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาที่ต้องการให้ถูกต้อง');
                return;
            }

            // Validate timeTokensPerParticipant to ensure it's a positive number
            if (isNaN(timeTokensPerParticipant) || timeTokensPerParticipant < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาต่อผู้เข้าร่วมให้ถูกต้อง');
                return;
            }

            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_id: requesterId,
                status,
                time_tokens_required: timeTokensRequired,
                time_tokens_per_participant: timeTokensPerParticipant
            };

            try {
                const response = await fetch(`http://localhost:3000/api/activities/${activityId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (response.ok) {
                    alert('กิจกรรมถูกแก้ไขเรียบร้อยแล้ว');
                    window.location.href = 'activity-details.html?id=' + activityId; // Redirect to the activity details page
                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการแก้ไขกิจกรรม');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const userData = await response.json();
                        localStorage.setItem('user_id', userData.user_id);
                        updateSidebar(true);
                        fetchActivities(); // Fetch activities only if the user is logged in
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

                    (activity.title && activity.title.toLowerCase().includes(searchTerm)) ||
                    (activity.description && activity.description.toLowerCase().includes(searchTerm)) ||
                    (activity.location && activity.location.toLowerCase().includes(searchTerm)) ||
                    (activity.requester_id && activity.requester_id.toString().includes(searchTerm))
                );
            });
            renderTable(filteredActivities);
        }

<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   โปรไฟล์สมาชิก - Time Bank
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <script>
   let globalUserId = null;
        let members = [];

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchMemberProfile();
            fetchUserDetails();
            fetchMembers();
        });

        async function fetchMemberProfile() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                globalUserId = data.user_id;

                const balanceElement = document.getElementById('userBalance');
                balanceElement.innerText = `${data.time_credits} ชั่วโมง`;

                balanceElement.style.color = data.time_credits > 0 ? "#32CD32" :
                                             data.time_credits < 0 ? "red" : "gray";

            } catch (error) {
                console.error('Error fetching member profile:', error);
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

        async function updateSidebar(isLoggedIn) {
            const navList = document.getElementById('navList');

            if (isLoggedIn) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch user details');
                    }

                    const member = await response.json();
                    const memberId = member.userId || member.user_id;

                    navList.innerHTML = `
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                                href="log-out.html">
                                <i class="fas fa-user mr-3"></i>
                                โปรไฟล์
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="homepage.html">
                                <i class="fas fa-home mr-3"></i>
                                หน้าหลัก
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="service.html">
                                <i class="fas fa-clipboard-list mr-3"></i>
                                กิจกรรมชุมชน
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="profile.html">
                                <i class="fas fa-user-edit mr-3"></i>
                                แก้ไขประวัติ
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="skillconf.html">
                                <i class="fas fa-tools mr-3"></i>
                                แก้ไขทักษะ
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="balance.html">
                                <i class="fas fa-wallet mr-3"></i>
                                ยอดคงเหลือ
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="history.html">
                                <i class="fas fa-history mr-3"></i>
                                ประวัติ
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="transfer.html">
                                <i class="fas fa-exchange-alt mr-3"></i>
                                แลกเปลี่ยนเวลา
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="contact.html">
                                <i class="fas fa-phone mr-3"></i>
                                ติดต่อเรา
                            </a>
                        </li>
                    `;
                } catch (error) {
                    console.error('Error fetching user details:', error);
                    alert('เกิดข้อผิดพลาดขณะโหลดข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่อีกครั้ง');
                }
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            เข้าสู่ระบบ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="service.html">
                            <i class="fas fa-clipboard-list mr-3"></i>
                            กิจกรรมชุมชน
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="profile.html">
                            <i class="fas fa-user-edit mr-3"></i>
                            แก้ไขประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="skillconf.html">
                            <i class="fas fa-tools mr-3"></i>
                            แก้ไขทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="balance.html">
                            <i class="fas fa-wallet mr-3"></i>
                            ยอดคงเหลือ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="history.html">
                            <i class="fas fa-history mr-3"></i>
                            ประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="transfer.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            แลกเปลี่ยนเวลา
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="contact.html">
                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                `;
            }
        }

        async function fetchUserDetails() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('senderName').innerText = data.name || '';
                document.getElementById('senderId').innerText = data.user_id || '';
       
            } catch (error) {
                console.error('Error fetching user details:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้');
            }
        }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/tbm/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลสมาชิก');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('recipient').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';
            if (searchTerm) {
                const filteredMembers = members.filter(member => member.user_id !== globalUserId && (member.name.toLowerCase().includes(searchTerm) || member.user_id.toString().includes(searchTerm)));
                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.user_id}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('recipient').value = member.name;
                        document.getElementById('recipient-id').value = member.user_id;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });
                resultsDropdown.classList.remove('hidden');
            } else {
                resultsDropdown.classList.add('hidden');
            }
        }

        async function handleTransfer(event) {
            event.preventDefault();
        
            const recipientId = document.getElementById('recipient-id').value;
            const amount = document.getElementById('amount').value;
        
            if (!recipientId || !amount || amount <= 0) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนและจำนวนต้องมากกว่า 0');
                return;
            }
        
            const confirmTransfer = confirm(`คุณต้องการโอน ${amount} เครดิตเวลาให้กับผู้ใช้ ID: ${recipientId} ใช่หรือไม่?`);
        
            if (confirmTransfer) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/transactions/transfer', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ recipientId, amount })
                    });
        
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Transaction failed');
        
                    alert('✅ การโอนสำเร็จ!');
                    fetchMemberProfile(); // Refresh balance
        
                } catch (error) {
                    console.error('❌ Transfer error:', error);
                    alert(`เกิดข้อผิดพลาด: ${error.message}`);
                }
            }
        }
        
  </script>
 </head>
 <body class="bg-gray-100">
  <!-- Main Content -->
  <div class="flex">
   <!-- Sidebar -->
   <div class="w-1/6 bg-white h-screen p-5">
    <div class="flex items-center mb-10">
     <img alt="Logo of Time Bank System, a clock with a handshake in the center" class="w-10 h-10 rounded-full" height="50" src="https://placehold.co/50x50" width="50"/>
     <span class="ml-3 text-xl font-bold text-blue-600">
      TIMEBANK
     </span>
    </div>
    <nav>
     <ul id="navList">
      <!-- Navigation items will be dynamically inserted here -->
     </ul>
    </nav>
   </div>
   <div class="w-5/6 bg-blue-700 text-white p-10 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold text-center mb-5">
     แลกเปลี่ยนเวลา
    </h1>
    <!-- User Balance Section -->
    <div class="bg-white text-gray-800 p-6 rounded-lg shadow-md mb-5">
     <h2 class="text-xl font-bold mb-2">
      ยอดคงเหลือ
     </h2>
     <div class="flex items-center">
      <i class="fas fa-wallet text-3xl text-blue-600 mr-4">
      </i>
      <span class="text-2xl font-bold" id="userBalance">
       000 เครดิต
      </span>
     </div>
    </div>
    <!-- Transfer Form -->
    <form class="bg-white text-gray-800 p-6 rounded-lg shadow-md" id="transferForm" onsubmit="handleTransfer(event)">
     <!-- Sender -->
     <div class="mb-4">
      <label class="block font-bold text-gray-700 mb-2">
       จาก
      </label>
      <div class="flex items-center bg-gray-100 p-3 rounded-lg">
       <i class="fas fa-user-circle text-3xl text-blue-600 mr-4">
       </i>
       <div>
        <span class="text-lg font-bold" id="senderName">
         ชื่อของคุณ
        </span>
        <p class="text-gray-500 text-sm" id="senderId">
         ID ของคุณ
        </p>
       </div>
      </div>
     </div>
     <!-- Recipient -->
     <div class="mb-4 relative">
      <label class="block font-bold text-gray-700 mb-2">
       ถึง
      </label>
      <input class="w-full p-3 rounded-lg border focus:ring focus:ring-blue-300" id="recipient" name="recipient" oninput="searchMembers()" placeholder="กรอก User ID หรือ ชื่อ" required=""/>
      <input id="recipient-id" name="recipient-id" type="hidden"/>
      <div class="absolute w-full bg-white border rounded-lg mt-1 hidden" id="search-results-dropdown">
      </div>
     </div>
     <!-- Amount -->
     <div class="mb-4">
      <label class="block font-bold text-gray-700 mb-2">
       จำนวนเครดิตเวลา
      </label>
      <input class="w-full p-3 rounded-lg border focus:ring focus:ring-blue-300" id="amount" min="0" name="amount" placeholder="กรอกจำนวน" required="" type="number"/>
     </div>
     <!-- Transfer Button -->
     <button class="w-full bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg">
      ยืนยันการโอน
     </button>
    </form>
   </div>
  </div>
 </body>
</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ยอดคงเหลือ - Time Bank</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="navbar.js"></script>
</head>

<body class="bg-gray-100 font-roboto">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold text-center mb-5" id="userName">user name</h1>
            <!-- User Balance Section -->
            <div class="bg-white text-gray-800 p-6 rounded-lg shadow-md mb-5">
                <h2 class="text-xl font-bold mb-2">ยอดคงเหลือ</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex items-center">
                        <i class="fas fa-wallet text-3xl text-blue-600 mr-4"></i>
                        <span class="text-2xl font-bold" id="userBalance">000 เครดิต</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-id-badge text-3xl text-blue-600 mr-4"></i>
                        <span class="text-2xl font-bold text-blue-600" id="userId"
                            style="font-family: 'Roboto Mono', monospace;">เลขที่บัญชี: 000</span>
                    </div>
                </div>
            </div>
            <!-- Transaction History Section -->
            <div class="bg-white text-gray-800 p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-2">ประวัติการแลกเปลี่ยนเวลา</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto text-base text-gray-800 bg-white border border-gray-300 rounded-lg shadow-sm overflow-hidden">
                        <thead class="bg-gray-50 border-b border-gray-200 text-base font-semibold text-gray-700 uppercase tracking-wide">
                          <tr>
                            <th class="px-4 py-3 text-left">รหัสธุรกรรม</th>
                            <th class="px-4 py-3 text-left">ชื่อ</th>
                            <th class="px-4 py-3 text-left">ประเภท</th>
                            <th class="px-4 py-3 text-left">จำนวน</th>
                            <th class="px-4 py-3 text-left">วันที่</th>
                            <th class="px-4 py-3 text-left">เวลา</th>
                          </tr>
                        </thead>
                        <tbody id="transactionLog" class="divide-y divide-gray-100 bg-white">
                          <!-- Transaction rows will be dynamically inserted here -->
                        </tbody>
                      </table>                                  
                </div>
            </div>
        </div>
    </div>
    <script>
        let globalUserId = null;
        let members = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchMemberProfile();
            await fetchMembers();
            await fetchTransactionLog();
        });

        async function fetchMemberProfile() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });

                if (!response.ok) throw new Error('Failed to fetch user profile');

                const data = await response.json();
                globalUserId = data.user_id;

                const userNameElement = document.getElementById('userName');
                userNameElement.innerText = data.name;

                const balanceElement = document.getElementById('userBalance');
                balanceElement.innerText = `${data.time_credits} ชั่วโมง`;

                const userIdElement = document.getElementById('userId');
                userIdElement.innerText = `เลขที่บัญชี: ${data.user_id}`;

                balanceElement.style.color = data.time_credits > 0 ? "#32CD32" :
                    data.time_credits < 0 ? "red" : "gray";

            } catch (error) {
                console.error('Error fetching member profile:', error);
            }
        }

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/user/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members.reduce((acc, member) => {
                    acc[member.user_id] = member.name;
                    return acc;
                }, {});
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลสมาชิก');
            }
        }

        async function fetchTransactionLog() {
            try {
                const response = await fetch('http://localhost:3000/api/user/transactions/log', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
        
                if (!response.ok) throw new Error(`Error fetching transaction log: ${response.status}`);
        
                const data = await response.json();
                const transactionLogElement = document.getElementById('transactionLog');
        
                if (!data.transactions || data.transactions.length === 0) {
                    transactionLogElement.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center text-gray-500 py-6 text-base font-medium">
                                ไม่มีประวัติธุรกรรมในระบบของคุณ
                            </td>
                        </tr>`;
                    return;
                }
        
                transactionLogElement.innerHTML = '';
        
                data.transactions.forEach(transaction => {
                    const isSender = transaction.transaction_type === 'โอนออก';
                    const amount = isSender ? -transaction.time_credit : transaction.time_credit;
                    const amountText = amount > 0 ? `+${amount} ชั่วโมง` : `−${Math.abs(amount)} ชั่วโมง`;
                    const amountColor = amount > 0 ? 'text-green-600' : 'text-red-600';
                    const otherPartyName = members[transaction.other_party_id] || 'ไม่ทราบชื่อ';
        
                    const dateObj = new Date(transaction.date);
                    const date = dateObj.toLocaleDateString('th-TH');
                    const time = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-100 transition text-base text-gray-800';
        
                    row.innerHTML = `
                        <td class="px-4 py-3 font-medium text-gray-700">${transaction.transaction_id}</td>
                        <td class="px-4 py-3">${otherPartyName}</td>
                        <td class="px-4 py-3">${transaction.transaction_type}</td>
                        <td class="px-4 py-3 ${amountColor} font-semibold">${amountText}</td>
                        <td class="px-4 py-3">${date}</td>
                        <td class="px-4 py-3">${time}</td>
                    `;
        
                    transactionLogElement.appendChild(row);
                });
        
            } catch (error) {
                console.error('Error fetching transaction log:', error);
            }
        }
        
        
    </script>
</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Profile Skills Management - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let skills = [];

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/user/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    renderSkills(skills);
                    renderCategoryButtons();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('Error fetching skills');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('Error fetching skills');
            }
        }

        function renderSkills(data) {
            const skillContainer = document.getElementById('skill-container');
            skillContainer.innerHTML = '';
            const categories = [...new Set(data.map(skill => skill.category))];

            categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = `bg-gray-100 p-7 rounded-lg category category-${category} w-full md:w-1/ mb-5`;
                categoryDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold category-name">${category}</h3>
                    </div>
                `;

                data.filter(skill => skill.category === category).forEach(skill => {
                    const skillP = document.createElement('div');
                    skillP.className = 'flex items-center mb-2';
                    skillP.innerHTML = `
                        <input type="checkbox" id="skill-${skill.skill_id}" name="skills" value="${skill.skill_id}" class="mr-2">
                        <label for="skill-${skill.skill_id}" class="text-gray-700">${skill.name}</label>
                    `;
                    categoryDiv.appendChild(skillP);
                });

                skillContainer.appendChild(categoryDiv);
            });
        }

        function renderCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('category-buttons');
            categoryButtonsContainer.innerHTML = '';

            const categories = [...new Set(skills.map(skill => skill.category))];

            const allButton = document.createElement('button');
            allButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
            allButton.textContent = 'All';
            allButton.onclick = () => showCategory('all');
            categoryButtonsContainer.appendChild(allButton);

            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
                button.textContent = category;
                button.onclick = () => showCategory(category);
                categoryButtonsContainer.appendChild(button);
            });
        }

        function showCategory(category) {
            if (category === 'all') {
                renderSkills(skills);
            } else {
                const filteredSkills = skills.filter(skill => skill.category === category);
                renderSkills(filteredSkills);
            }
        }

        async function searchSkills() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            try {
                const response = await fetch(`http://localhost:3000/api/user/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    renderSkills(data);
                } else {
                    console.error('Expected an array but got:', data);
                    alert('Error searching skills');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                alert('Error searching skills');
            }
        }

        async function saveSkills() {
            const selectedSkills = Array.from(document.querySelectorAll('input[name="skills"]:checked')).map(input => input.value);
            const formData = JSON.parse(sessionStorage.getItem('registerFormData'));
            formData.skills = selectedSkills;

            try {
                const response = await fetch('http://localhost:3000/api/user/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'login.html';
                } else {
                    console.error('Error:', data);
                    alert(data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchSkills();
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <!-- Language Toggle Switch -->
            <div class="absolute top-5 right-5">
                <div class="toggle-container" id="languageToggle">
                    <span class="toggle-label active" id="lang-th" data-lang="th">
                        ภาษาไทย
                    </span>
                    <span class="toggle-label" id="lang-en" data-lang="en">
                        English
                    </span>
                </div>
            </div>

            <h1 class="text-4xl font-bold mb-5">Profile Skills Management</h1>
            <div class="flex justify-center">
                <div class="bg-white text-black p-5 rounded-lg w-full md:w-full lg:w-full">
                    <div class="mb-4 flex items-center">
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" id="search-bar" placeholder="Search skills or categories"
                            oninput="searchSkills()" />
                    </div>
                    <div id="category-buttons" class="flex justify-center mb-5">
                        <!-- Category buttons will be dynamically inserted here -->
                    </div>
                    <div id="skill-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <!-- Skills will be dynamically inserted here -->
                    </div>
                    <div class="flex items-center justify-center mt-4">
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="saveSkills()">Save Skills</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Toggle container */
        .toggle-container {
            display: flex;
            background-color: #E5E7EB;
            border-radius: 20px;
            /* Increase border radius for larger container */
            padding: 6px;
            /* Larger padding for better spacing */
            align-items: center;
            justify-content: space-between;
            width: 180px;
            /* Increase width for a larger toggle */
        }

        /* Labels */
        .toggle-label {
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: gray;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 9999px;
            padding: 5px;
        }

        .toggle-label.active {
            background-color: white;
            color: #1D4ED8;
            /* Blue for active text */
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Disabled Label */
        .toggle-label.disabled {
            pointer-events: none;
            /* Make it unclickable */
            background-color: white;
            color: #6B7280;
            /* Light gray text */
            font-weight: bold;
        }
    </style>

    <script src="navbar.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langThai = document.getElementById('lang-th');
            const langEnglish = document.getElementById('lang-en');

            const translations = {
                thai: {
                    pageTitle: 'จัดการทักษะโปรไฟล์ - Time Bank',
                    mainHeading: 'จัดการทักษะโปรไฟล์',
                    searchPlaceholder: 'ค้นหาทักษะหรือหมวดหมู่',
                    saveButton: 'บันทึกทักษะ',
                    nav: ['โปรไฟล์', 'หน้าหลัก', 'รายงาน', 'จัดการกิจกรรม', 'จัดการสมาชิก', 'จัดการหมวหมู่ทักษะ', 'จัดการกองทุนชุมชน', 'จัดการชุมชน', 'ธุรกรรมทั้งหมด'],

                },
                english: {
                    pageTitle: 'Profile Skills Management - Time Bank',
                    mainHeading: 'Profile Skills Management',
                    searchPlaceholder: 'Search skills or categories',
                    saveButton: 'Save Skills',
                    nav: ['Profile', 'Homepage', 'Reports Overview', 'Activities Management', 'Members Management', 'Skills Management', 'Funds Management', 'Community Management', 'Transactions'],

                }
            };

            let currentLang = localStorage.getItem('selectedLanguage') || 'thai';

            const updateContent = (lang) => {
                const langData = translations[lang];

                // Update page title
                document.title = langData.pageTitle;

                // Update main heading
                document.querySelector('h1').textContent = langData.mainHeading;

                // Update search placeholder
                document.getElementById('search-bar').placeholder = langData.searchPlaceholder;

                // Update save button text
                document.querySelector('button[type="button"]').textContent = langData.saveButton;

                // Update navigation
                const navLinks = document.querySelectorAll('nav ul li a');
                langData.nav.forEach((text, index) => {
                    if (navLinks[index]) {
                        const icon = navLinks[index].querySelector('i');
                        navLinks[index].innerHTML = '';
                        if (icon) navLinks[index].appendChild(icon);
                        navLinks[index].appendChild(document.createTextNode(text));
                    }
                });

                // Update active toggle state
                if (lang === 'thai') {
                    langThai.classList.add('active');
                    langEnglish.classList.remove('active');
                } else {
                    langEnglish.classList.add('active');
                    langThai.classList.remove('active');
                }
            };

            // Language toggle event listeners
            langThai.addEventListener('click', () => {
                currentLang = 'thai';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            langEnglish.addEventListener('click', () => {
                currentLang = 'english';
                localStorage.setItem('selectedLanguage', currentLang);
                updateContent(currentLang);
            });

            // Initialize content on page load
            updateContent(currentLang);
        });
    </script>


</body>

</html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>รายละเอียดกิจกรรมของฉัน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let globalUserId = null;
        let activityId = null;

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            activityId = urlParams.get('id');
        
            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }
        
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
        
                if (!response.ok) {
                    throw new Error('Error fetching activity details');
                }
        
                const activity = await response.json();
        
                if (activity) {
                    document.getElementById('service-title').value = activity.title || '';
                    document.getElementById('service-description').value = activity.description || '';
                    document.getElementById('service-location').value = activity.location || '';
                    document.getElementById('service-start-date').value = activity.start_date ? activity.start_date.split('T')[0] : '';
                    document.getElementById('service-time-start').value = activity.start_time ? activity.start_time.substring(0, 5) : '';
                    document.getElementById('service-end-date').value = activity.end_date ? activity.end_date.split('T')[0] : '';
                    document.getElementById('service-time-end').value = activity.end_time ? activity.end_time.substring(0, 5) : '';
                    document.getElementById('service-people').value = activity.max_participants || '';
                    document.getElementById('requester-name').value = activity.requester_name || '';
                    document.getElementById('requester-phone').value = activity.requester_phone || '';
                    document.getElementById('service-status').value = activity.status || '';
        
                    // ✅ NEW: Handle required skills
                    displayRequiredSkills(activity.required_skills);
        
                    // Fetch participants and update the participant count
                    await fetchParticipants(activityId, activity.max_participants);
        
                    // Update join button based on activity status
                    updateJoinButton(activity.status);
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }

        function updateJoinButton(status) {
            const joinButton = document.getElementById('join-button');
            if (!joinButton) {
                console.warn("Join button not found in DOM.");
                return;
            }
        
            if (status === 'กำลังจะเริ่ม') {
                joinButton.innerText = 'เข้าร่วม';
                joinButton.classList.remove('bg-red-500');
                joinButton.classList.add('bg-green-500');
            } else {
                joinButton.innerText = 'ปิดรับสมัคร';
                joinButton.classList.remove('bg-green-500');
                joinButton.classList.add('bg-gray-500');
                joinButton.disabled = true;
            }
        }
        
        
        function displayRequiredSkills(requiredSkills) {
            const skillsContainer = document.getElementById('selected-skills-list');
            skillsContainer.innerHTML = ''; // Clear previous content
        
            try {
                // Check if `requiredSkills` is already an array or a string
                const skills = typeof requiredSkills === 'string' ? JSON.parse(requiredSkills) : requiredSkills;
        
                if (Array.isArray(skills) && skills.length > 0) {
                    skills.forEach(skill => {
                        const listItem = document.createElement('li');
                        listItem.textContent = skill; // Display skill name
                        skillsContainer.appendChild(listItem);
                    });
                } else {
                    skillsContainer.innerHTML = '<li class="text-gray-500">ไม่มีทักษะที่ระบุ</li>';
                }
            } catch (error) {
                console.error('Error parsing required skills:', error);
                skillsContainer.innerHTML = '<li class="text-red-500">เกิดข้อผิดพลาดในการโหลดทักษะ</li>';
            }
        }
        


        async function fetchParticipants(activityId, maxParticipants) {
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/participants`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
        
                if (!response.ok) {
                    throw new Error('Error fetching participants');
                }
        
                const participants = await response.json();
                const participantCount = participants.length;
        
                // Ensure maxParticipants is retrieved correctly if not provided
                if (!maxParticipants) {
                    const activityResponse = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
        
                    if (!activityResponse.ok) {
                        throw new Error('Error fetching activity details');
                    }
        
                    const activityData = await activityResponse.json();
                    maxParticipants = activityData.max_participants;
                }
        
                // Update the participant count in activity-detail
                const participantElement = document.getElementById('current-participants');
                if (participantElement) {
                    participantElement.innerText = `${participantCount} / ${maxParticipants}`;
                } else {
                    console.warn("Element 'current-participants' not found in DOM.");
                }
        
                // Check if the user has joined the activity
                const userJoined = participants.some(participant => participant.user_id === globalUserId);
                const joinButton = document.getElementById('join-button');
        
                if (joinButton) {
                    if (userJoined) {
                        joinButton.innerText = 'ยกเลิก';
                        joinButton.classList.remove('bg-green-500');
                        joinButton.classList.add('bg-red-500');
                    } else {
                        joinButton.innerText = 'เข้าร่วม';
                        joinButton.classList.remove('bg-red-500');
                        joinButton.classList.add('bg-green-500');
                    }
                } else {
                    console.warn("Join button not found in DOM.");
                }
        
            } catch (error) {
                console.error('Error fetching participants:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้เข้าร่วม');
            }
        }
        

        async function fetchMemberProfile() {
            try {
                const response = await fetch(`http://localhost:3000/api/user/auth/profile`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const member = await response.json();
                globalUserId = member.user_id; // Store user_id globally
                console.log('Member:', member);
            } catch (error) {
                console.error('Error fetching member profile:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลโปรไฟล์สมาชิก');
            }
        }
    

    
        function updateServicePageParticipants(activityId, newCount) {
            const servicePage = window.opener;
            if (servicePage && servicePage.document) {
                const participantsElement = servicePage.document.querySelector(`#participants-${activityId}`);
                if (participantsElement) {
                    participantsElement.innerText = newCount;
                }
            }
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            fetchMemberProfile().then(fetchActivityDetails);
    
            // Set current date and time if fields are empty
            const currentDate = new Date().toISOString().split('T')[0];
            const currentTime = new Date().toTimeString().split(' ')[0].substring(0, 5);
    
            if (!document.getElementById('service-start-date').value) {
                document.getElementById('service-start-date').value = currentDate;
            }
            if (!document.getElementById('service-time-start').value) {
                document.getElementById('service-time-start').value = currentTime;
            }
            if (!document.getElementById('service-end-date').value) {
                document.getElementById('service-end-date').value = currentDate;
            }
            if (!document.getElementById('service-time-end').value) {
                document.getElementById('service-time-end').value = currentTime;
            }
    
            updateSidebar();
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                }
            } else {
                updateSidebar(false);
            }
        }

        // Check if the user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            updateSidebar();
        });

        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'homepage.html'; // Change this to your default fallback page
            }
        }
        
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">

        <!-- Main Content -->
<div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
    <h1 class="text-4xl font-bold mb-5">
        แก้ไขกิจกรรม
    </h1>
    <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
            รายละเอียดกิจกรรม
        </h2>
        <form onsubmit="updateActivity(event)">
            <!-- Requester Information -->
            <div class="flex flex-wrap -mx-3 mb-4">
                <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">

                    </label>
                    <input id="requester-name"
                        class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"

                </div>
                <div class="w-full md:w-1/2 px-3">

                    </label>
                    <input id="requester-phone"

            </div>

            <hr class="my-8 border-gray-200">

                    type="text" disabled />
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="service-description">

                        type="date" disabled />
                </div>
                <div class="w-full md:w-1/2 px-3">

                    </label>

            <!-- Participant Count -->

                <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="service-people">
                        จำนวนคน
                    </label>
                    <input id="service-people"
                        class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        type="number" disabled />
                </div>
                <div class="w-full md:w-1/2 px-3">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        จำนวนผู้เข้าร่วม
                    </label>
                    <p id="current-participants" class="text-gray-700"></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-center">
                <button
                    class="bg-gray-500 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                    type="button" onclick="goBack()">ย้อนกลับ</button>
            </div>

        </form>
    </div>
</div>

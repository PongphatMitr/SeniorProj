    <script>
        let globalUserId = null;
        let activityId = null;

        async function fetchActivityDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            activityId = urlParams.get('id');
        
            if (!activityId) {
                alert('ไม่พบรหัสกิจกรรม');
                return;
            }
        
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
        
                if (!response.ok) {
                    throw new Error('Error fetching activity details');
                }
        
                const activity = await response.json();
        
                if (activity) {
                    document.getElementById('service-title').value = activity.title || '';
                    document.getElementById('service-description').value = activity.description || '';
                    document.getElementById('service-location').value = activity.location || '';
                    document.getElementById('service-start-date').value = activity.start_date ? activity.start_date.split('T')[0] : '';
                    document.getElementById('service-time-start').value = activity.start_time ? activity.start_time.substring(0, 5) : '';
                    document.getElementById('service-end-date').value = activity.end_date ? activity.end_date.split('T')[0] : '';
                    document.getElementById('service-time-end').value = activity.end_time ? activity.end_time.substring(0, 5) : '';
                    document.getElementById('service-people').value = activity.max_participants || '';
                    document.getElementById('requester-name').value = activity.requester_name || '';
                    document.getElementById('requester-phone').value = activity.requester_phone || '';
                    document.getElementById('service-status').value = activity.status || '';
        
                    const cancelButton = document.getElementById('cancel-activity-button');

                    // Combine start_date and start_time into a single datetime string
                    const activityStartDateTime = new Date(`${activity.start_date}T${activity.start_time}`); 
                    const now = new Date();
                    
                    // Disable cancel button if status is already "ยกเลิก"
                    if (activity.status === 'ยกเลิก') {
                        cancelButton.disabled = true;
                        cancelButton.innerText = 'กิจกรรมถูกยกเลิกแล้ว';
                        cancelButton.classList.add('bg-gray-500');
                    
                    // Disable cancel button if activity already started
                    } else if (now >= activityStartDateTime) {
                        cancelButton.disabled = true;
                        cancelButton.innerText = 'ไม่สามารถยกเลิกได้';
                        cancelButton.classList.remove('bg-red-600', 'hover:bg-red-700');
                        cancelButton.classList.add('bg-gray-500');
                    }
                    
        
                    // ✅ Handle required skills
                    displayRequiredSkills(activity.required_skills);
        
                    // ✅ Fetch participants and update the join button
                    await fetchParticipants(activityId, activity.max_participants);
        
                    // ✅ Update join button based on activity status
                    updateJoinButton(activity.status);
                } else {
                    alert('ไม่พบรายละเอียดกิจกรรม');
                }
            } catch (error) {
                console.error('Error fetching activity details:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายละเอียดกิจกรรม');
            }
        }
        

        function updateJoinButton(status) {
            const joinButton = document.getElementById('join-button');
            if (!joinButton) {
                console.warn("Join button not found in DOM.");
                return;
            }
        
            if (status === 'กำลังจะเริ่ม') {
                joinButton.innerText = 'เข้าร่วม';
                joinButton.classList.remove('bg-red-500');
                joinButton.classList.add('bg-green-500');
            } else {
                joinButton.innerText = 'ปิดรับสมัคร';
                joinButton.classList.remove('bg-green-500');
                joinButton.classList.add('bg-gray-500');
                joinButton.disabled = true;
            }
        }
        
        
        function displayRequiredSkills(requiredSkills) {
            const skillsContainer = document.getElementById('selected-skills-list');
            skillsContainer.innerHTML = ''; // Clear previous content
        
            try {
                // Ensure requiredSkills is an integer (skill_id) and fetch skill details from API
                if (!requiredSkills || isNaN(requiredSkills)) {
                    skillsContainer.innerHTML = '<li class="text-gray-500">ไม่มีทักษะที่ระบุ</li>';
                    return;
                }
        
                // Fetch skill details using the skill_id
                fetch(`http://localhost:3000/api/user/skills/${requiredSkills}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                })
                .then(response => response.json())
                .then(skill => {
                    if (!skill || !skill.name || !skill.category) {
                        skillsContainer.innerHTML = '<li class="text-gray-500">ไม่พบข้อมูลทักษะ</li>';
                        return;
                    }
        
                    // Create list item with proper spacing
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <strong class="text-blue-600 text-lg font-semibold">หมวดหมู่:</strong> 
                        <span class="mr-4">${skill.category}</span>  
                        <strong class="text-green-600 text-lg font-semibold">ทักษะ:</strong> 
                        <span>${skill.name}</span>
                    `;
                    skillsContainer.appendChild(listItem);
                })
                .catch(error => {
                    console.error('Error fetching skill details:', error);
                    skillsContainer.innerHTML = '<li class="text-red-500">เกิดข้อผิดพลาดในการโหลดทักษะ</li>';
                });
        
            } catch (error) {
                console.error('Error parsing required skills:', error);
                skillsContainer.innerHTML = '<li class="text-red-500">เกิดข้อผิดพลาดในการโหลดทักษะ</li>';
            }
        }
        
        


        async function fetchParticipants(activityId, maxParticipants) {
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/participants`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
        
                if (!response.ok) {
                    throw new Error('Error fetching participants');
                }
        
                const participants = await response.json();
                const participantCount = participants.length;
        
                // Ensure maxParticipants is retrieved correctly if not provided
                if (!maxParticipants) {
                    const activityResponse = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
        
                    if (!activityResponse.ok) {
                        throw new Error('Error fetching activity details');
                    }
        
                    const activityData = await activityResponse.json();
                    maxParticipants = activityData.max_participants;
                }
        
                // Update the participant count in activity-detail
                const participantElement = document.getElementById('current-participants');
                if (participantElement) {
                    participantElement.innerText = `${participantCount} / ${maxParticipants}`;
                } else {
                    console.warn("Element 'current-participants' not found in DOM.");
                }
        
                // Check if the user has joined the activity
                const userJoined = participants.some(participant => participant.user_id === globalUserId);
                const joinButton = document.getElementById('join-button');
        
                if (joinButton) {
                    if (userJoined) {
                        joinButton.innerText = 'ยกเลิก';
                        joinButton.classList.remove('bg-green-500');
                        joinButton.classList.add('bg-red-500');
                    } else {
                        joinButton.innerText = 'เข้าร่วม';
                        joinButton.classList.remove('bg-red-500');
                        joinButton.classList.add('bg-green-500');
                    }
                } else {
                    console.warn("Join button not found in DOM.");
                }
        
            } catch (error) {
                console.error('Error fetching participants:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้เข้าร่วม');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                }
            } else {
                updateSidebar(false);
            }
        }

        // Check if the user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            updateSidebar();
        });

        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'homepage.html'; // Change this to your default fallback page
            }
        }
        
        async function cancelActivity() {
            if (!activityId) {
                showMessage("ไม่พบรหัสกิจกรรม", false);
                return;
            }
        
            const cancelButton = document.getElementById('cancel-activity-button');
        
            // ✅ Prevent duplicate cancel attempts
            if (cancelButton.disabled) {
                return;
            }
        
            // ✅ Show confirmation message before proceeding
            showConfirmation("คุณแน่ใจหรือไม่ว่าต้องการยกเลิกกิจกรรมนี้?", async () => {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/cancel`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
        
                    const data = await response.json();
        
                    if (response.ok) {
                        showMessage("กิจกรรมถูกยกเลิกเรียบร้อยแล้ว!", true);
        
                        // ✅ Update status text
                        document.getElementById('service-status').value = 'ยกเลิก';
        
                        // ✅ Disable the cancel button
                        cancelButton.disabled = true;
                        cancelButton.innerText = 'กิจกรรมถูกยกเลิกแล้ว';
                        cancelButton.classList.add('bg-gray-500');
        
                        // ✅ Hide the cancel button after canceling (Optional)
                        // cancelButton.style.display = 'none';
        
                        // ✅ Disable join button
                        const joinButton = document.getElementById('join-button');
                        if (joinButton) {
                            joinButton.innerText = 'ปิดรับสมัคร';
                            joinButton.classList.remove('bg-green-500', 'bg-red-500');
                            joinButton.classList.add('bg-gray-500');
                            joinButton.disabled = true;
                        }
                    } else {
                        showMessage(data.error || "เกิดข้อผิดพลาดในการยกเลิกกิจกรรม", false);
                    }
                } catch (error) {
                    console.error('Error cancelling activity:', error);
                    showMessage("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง", false);
                }
            });
        }
        
        
        function showMessage(message, isSuccess = true) {
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('message-title');
            const text = document.getElementById('message-text');
            const icon = document.getElementById('message-icon');
            const iconSvg = document.getElementById('message-icon-svg');
            const iconPath = document.getElementById('message-icon-path');
        
            if (isSuccess) {
                // ✅ "สำเร็จ!" in green
                title.textContent = "สำเร็จ!";
                title.classList.add('text-green-600'); // Green title
        
                // ✅ Message text (default black)
                text.textContent = message;
                text.classList.remove('text-green-500', 'text-red-500'); // Remove any previous color classes
        
                // ✅ Apply green icon styles
                icon.classList.add('bg-green-100', 'border-green-500');
                iconSvg.classList.add('text-green-500');
                iconPath.setAttribute("d", "M5 13l4 4L19 7"); // Checkmark icon
            } else {
                // ❌ "เกิดข้อผิดพลาด!" in red
                title.textContent = "เกิดข้อผิดพลาด!";
                title.classList.add('text-red-600');
        
                // ❌ Message text (default black)
                text.textContent = message;
                text.classList.remove('text-green-500', 'text-red-500');
        
                // ❌ Apply red icon styles
                icon.classList.add('bg-red-100', 'border-red-500');
                iconSvg.classList.add('text-red-500');
                iconPath.setAttribute("d", "M6 18L18 6M6 6l12 12"); // Error cross icon
            }
        
            // Show the modal
            modal.classList.remove('hidden');
        
            // Close modal on button click
            document.getElementById('confirm-message-btn').onclick = () => {
                modal.classList.add('hidden');
            };
        }
        

        function showConfirmation(message, callback) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
        
            document.getElementById('confirm-yes-btn').onclick = () => {
                modal.classList.add('hidden');
                callback(); // ✅ Execute the callback function (cancelActivity)
            };
        
            document.getElementById('confirm-no-btn').onclick = () => {
                modal.classList.add('hidden');
            };
        }

                            แก้ไขประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="skillconf.html">
                            <i class="fas fa-tools mr-3"></i>
                            แก้ไขทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="balance.html">
                            <i class="fas fa-wallet mr-3"></i>
                            ยอดคงเหลือ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="history.html">
                            <i class="fas fa-history mr-3"></i>
                            ประวัติการเข้าร่วมกิจกรรม
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="transfer.html">
                            <i class="fas fa-exchange-alt mr-3"></i>
                            แลกเปลี่ยนเวลา
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="contact.html">
                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <!-- Header with back button (left), centered title, and history button (right) -->
            <div class="relative mb-10 z-10 h-[50px]">

                <!-- 🕊️ Back Button (Left) -->
                <div class="absolute left-0 top-0">
                    <button onclick="window.location.href='service.html'"
                        class="group inline-flex items-center gap-2 px-5 py-2.5 bg-white text-gray-900 font-medium rounded-full border border-gray-300 shadow-sm hover:bg-gray-100 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-gray-300">
                        <i class="fas fa-arrow-left text-sm wiggle-icon"></i>
                        <span class="text-sm">ย้อนกลับ</span>
                    </button>
                </div>
            </div>


            <style>
                @keyframes gentle-wiggle {
                    0%, 100% { transform: translateX(0); }
                    25% { transform: translateX(-3px); }
                    50% { transform: translateX(3px); }
                    75% { transform: translateX(-2px); }
                }
                
                /* Only animate on hover */
                .group:hover .wiggle-icon {
                    animation: gentle-wiggle 2.5s ease-in-out infinite;
                }
            </style>
            <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                    รายละเอียดกิจกรรม
                </h2>
                <form onsubmit="updateActivity(event)">
                    <!-- Requester Information -->
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                                ชื่อผู้ขอบริการ
                            </label>
                            <input id="requester-name"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-phone">
                                เบอร์โทรศัพท์
                            </label>
                            <input id="requester-phone"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                    </div>

                    <hr class="my-8 border-gray-200">

                    <!-- Service Information -->
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-title">
                            ชื่อบริการ
                        </label>
                        <input id="service-title"
                            class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" disabled />
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="service-description">
                            รายละเอียดบริการ
                        </label>
                        <textarea id="service-description"
                            class="editable-textarea shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            disabled></textarea>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-location">
                                สถานที่จัด
                            </label>
                            <input id="service-location"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-status">
                                สถานะ
                            </label>
                            <select id="service-status"
                                class="editable-select shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                disabled>
                                <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                                <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                                <option value="เกินเวลา">เกินเวลา</option>
                                <option value="ยกเลิก">ยกเลิก</option>
                                <option value="รอการอนุมัติ">รอการอนุมัติ</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-8 border-gray-200">

                    <!-- Selected Skills Display -->
                    <div id="selected-skills-container" class="mt-4 bg-white p-4 rounded-lg shadow-sm">
                        <h3 class="text-lg font-semibold text-blue-700">ทักษะที่ต้องการ:</h3>
                        <ul id="selected-skills-list" class="mt-2 list-disc list-inside text-gray-700"></ul>
                    </div>
                    <hr class="my-8 border-gray-200">
                    
                    <!-- Date & Time Information -->
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-start-date">
                                วันที่เริ่มต้น
                            </label>
                            <input id="service-start-date"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-end-date">
                                วันที่สิ้นสุด
                            </label>
                            <input id="service-end-date"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="date" disabled />
                        </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-start">
                                เวลาเริ่มต้น
                            </label>
                            <input id="service-time-start"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-time-end">
                                เวลาสิ้นสุด
                            </label>
                            <input id="service-time-end"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="text" disabled />
                        </div>
                    </div>

                    <!-- Participant Count -->
                    <div class="flex flex-wrap -mx-3 mb-4">
                        <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="service-people">
                                จำนวนคน
                            </label>
                            <input id="service-people"
                                class="editable shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                type="number" disabled />
                        </div>
                        <div class="w-full md:w-1/2 px-3">
                            <label class="block text-gray-700 text-sm font-bold mb-2">
                                จำนวนผู้เข้าร่วม
                            </label>
                            <p id="current-participants" class="text-gray-700"></p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="goBack()">ย้อนกลับ</button>
                        <button id="cancel-activity-button"
                            class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button" onclick="cancelActivity()">ยกเลิกกิจกรรม
                        </button>                
                        <button
                            class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="button"
                            onclick="window.location.href='participant-detail.html?id=' + new URLSearchParams(window.location.search).get('id')">รายชื่อผู้เข้าร่วม</button>
                    </div>
                </form>
            </div>
        </div>

    <!-- Success & Error Message Modal -->
    <div id="message-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300">
        <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center transform scale-95 transition-transform duration-300">
            <div class="flex justify-center">
                <div id="message-icon" class="w-24 h-24 flex items-center justify-center rounded-full border-4 animate-bounce">
                    <svg id="message-icon-svg" class="w-16 h-16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path id="message-icon-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                    </svg>
                </div>
            </div>
            <h2 id="message-title" class="text-4xl font-bold mt-6"></h2>
            <p id="message-text" class="text-gray-700 text-xl mt-4"></p>
            <button id="confirm-message-btn" class="mt-8 px-8 py-4 bg-blue-600 text-white text-xl font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>

        <!-- Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300">
        <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-lg text-center transform scale-95 transition-transform duration-300">
            <h2 id="confirm-title" class="text-3xl font-bold text-yellow-600">ยืนยันการทำรายการ</h2>
            <p id="confirm-message" class="text-gray-700 text-xl mt-4"></p>
            <div class="mt-6 flex justify-center gap-4">
                <button id="confirm-yes-btn" class="px-6 py-3 bg-green-600 text-white text-lg font-semibold rounded-lg hover:bg-green-700 transition duration-300">
                    ยืนยัน
                </button>
                <button id="confirm-no-btn" class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>



</body>

</html>

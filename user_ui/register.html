       <ul class="dropdown-menu">

   <!-- Main Content -->
   <div class="center-wrapper">
    <h1 class="site-title">
     สมัครสมาชิก
    </h1>
    <div class="login-container">
     <h2>
      ลงทะเบียน
     </h2>
     <form id="registerForm">
      <input id="full-name" placeholder="ชื่อ-นามสกุล" required="" type="text"/>
      <input id="email" placeholder="อีเมล" required="" type="email"/>
      <input id="id-number" placeholder="เลขบัตรประชาชน" required="" type="text"/>
      <input id="password" placeholder="รหัสผ่าน" required="" type="password"/>
      <input id="confirm-password" placeholder="ยืนยันรหัสผ่าน" required="" type="password"/>
      <button class="login-button" type="submit">
       ลงทะเบียน
      </button>
     </form>
     <p class="signup-text">
      มีบัญชีผู้ใช้อยู่แล้วใช่ไหม?
      <a href="login.html">
       เข้าสู่ระบบ
      </a>
     </p>
    </div>
   </div>
  </div>
  <script>
   document.getElementById("registerForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            if (password !== confirmPassword) {
                alert("รหัสผ่านไม่ตรงกัน!");
                return;
            }

            const fullName = document.getElementById("full-name").value;
            const email = document.getElementById("email").value;
            const idNumber = document.getElementById("id-number").value;

            if (!fullName || !email || !idNumber || !password) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fullName, email, idNumber, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert("ลงทะเบียนสำเร็จ!");
                    localStorage.setItem("isLoggedIn", "true");
                    window.location.href = "HomePage.html";
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                alert("An error occurred. Please try again later.");
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            if (isLoggedIn) {
                const loginLink = document.getElementById("login-link");
                if (loginLink) {
                    loginLink.parentElement.style.display = "none";
                }
            }
        });
  </script>

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>สมัครสมาชิก - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();

            document.getElementById('registerForm').addEventListener('submit', async function (event) {
                event.preventDefault();

                const fullName = document.getElementById('full-name').value;
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const idNumber = document.getElementById('id-number').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const role = "Member"; // Default role

                if (password !== confirmPassword) {
                    alert('รหัสผ่านไม่ตรงกัน!');
                    return;
                }

                try {
                    const response = await fetch('http://localhost:3000/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ fullName, username, email, idNumber, password, role })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('ลงทะเบียนสำเร็จ! กรุณาเข้าสู่ระบบ');
                        window.location.href = 'login.html'; // Redirect to login page
                    } else {
                        console.error('Error:', data);
                        alert(data.error || 'การลงทะเบียนล้มเหลว กรุณาลองใหม่');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
                }
            });
        });
    </script>
</head>

<body class="page-register">
    <div class="container">

        <!-- Main Content -->
        <div class="center-wrapper">
            <h1 class="site-title">สมัครสมาชิก</h1>
            <div class="login-container">
                <h2>ลงทะเบียน</h2>
                <form id="registerForm">
                    <input id="full-name" placeholder="ชื่อ-นามสกุล" required type="text" class="input-field" />
                    <input id="username" placeholder="ชื่อผู้ใช้" required type="text" class="input-field" />
                    <input id="email" placeholder="อีเมล" required type="email" class="input-field" />
                    <input id="id-number" placeholder="เลขบัตรประชาชน" required type="text" class="input-field" />
                    <input id="password" placeholder="รหัสผ่าน" required type="password" class="input-field" />
                    <input id="confirm-password" placeholder="ยืนยันรหัสผ่าน" required type="password" class="input-field" />
                    <button class="login-button" type="submit">ลงทะเบียน</button>
                </form>
                <p class="signup-text">
                    มีบัญชีผู้ใช้อยู่แล้วใช่ไหม?
                    <a href="login.html">เข้าสู่ระบบ</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>

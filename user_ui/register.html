    <style>
        /* Custom styles for searchable dropdown */
        .dropdown-container {
            position: relative;
        }

        .dropdown-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            outline: none;
            font-size: 0.875rem;
            color: #374151;
        }

        .dropdown-list {
            position: absolute;
            z-index: 50;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0 0 0.375rem 0.375rem;
            box-shadow: 0 4px 6px rgb(0 0 0 / 0.1);
            display: none;
        }

        .dropdown-list.active {
            display: block;
        }

        .dropdown-list div {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }

        .dropdown-list div:hover {
            background-color: #e5e7eb;
        }
    </style>

                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const form = document.getElementById('registerForm');
                    
                      form.addEventListener('submit', function (event) {
                        // ดึงเฉพาะช่องที่ required
                        const requiredFields = [
                          'provinceSelect',
                          'districtSelect',
                          'subdistrictSelect',
                          'postalCode',
                          'houseNumber'
                        ];
                    
                        let isValid = true;
                        let firstInvalidField = null;
                    
                        // เช็กทีละช่อง
                        for (let id of requiredFields) {
                          const field = document.getElementById(id);
                          if (!field || field.value.trim() === '') {
                            isValid = false;
                            if (!firstInvalidField) {
                              firstInvalidField = field;
                            }
                            field.classList.add('border-red-500'); // ใส่เส้นขอบแดง
                          } else {
                            field.classList.remove('border-red-500'); // ลบเส้นแดงถ้าแก้ไขถูก
                          }
                        }
                    
                        // ถ้าไม่ valid
                        if (!isValid) {
                          event.preventDefault(); // กันไม่ให้ส่งฟอร์ม
                          alert('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน');
                          if (firstInvalidField) {
                            firstInvalidField.focus(); // เลื่อน focus ไปช่องแรกที่ผิด
                          }
                        }
                      });
                    });
                    </script>
                    

                <script>
                    let addressData = {};
                    let selectedProvince = '';
                    let selectedDistrict = '';
                    
                    let provinceSelectInstance;
                    let districtSelectInstance;
                    let subdistrictSelectInstance;
                    
                    async function loadAddressData() {
                        try {
                            const response = await fetch('address-thailand.json');
                            addressData = await response.json();
                            setupInitialDropdowns();
                            populateProvinceSelect();
                        } catch (error) {
                            console.error('Error loading address data:', error);
                        }
                    }
                    
                    function setupInitialDropdowns() {
                        // เตรียม select เขต/อำเภอ
                        const districtSelect = document.getElementById('districtSelect');
                        districtSelect.innerHTML = '<option value="">เลือกเขต/อำเภอ</option>';
                        districtSelect.disabled = true;
                        districtSelectInstance = new TomSelect('#districtSelect', {
                            create: false,
                            sortField: 'text',
                            onChange: handleDistrictChange
                        });
                    
                        // เตรียม select แขวง/ตำบล
                        const subdistrictSelect = document.getElementById('subdistrictSelect');
                        subdistrictSelect.innerHTML = '<option value="">เลือกแขวง/ตำบล</option>';
                        subdistrictSelect.disabled = true;
                        subdistrictSelectInstance = new TomSelect('#subdistrictSelect', {
                            create: false,
                            sortField: 'text',
                            onChange: handleSubdistrictChange
                        });
                    }
                    
                    function populateProvinceSelect() {
                        const provinceSelect = document.getElementById('provinceSelect');
                        provinceSelect.innerHTML = '<option value="">เลือกจังหวัด</option>';
                        Object.keys(addressData).forEach(province => {
                            const option = document.createElement('option');
                            option.value = province;
                            option.textContent = province;
                            provinceSelect.appendChild(option);
                        });
                    
                        provinceSelectInstance = new TomSelect('#provinceSelect', {
                            create: false,
                            sortField: 'text',
                            onChange: handleProvinceChange
                        });
                    }
                    
                    function handleProvinceChange(value) {
                        selectedProvince = value;
                        selectedDistrict = '';
                    
                        districtSelectInstance.clearOptions();
                        districtSelectInstance.addOption({ value: '', text: 'เลือกเขต/อำเภอ' });
                        districtSelectInstance.setValue('');
                    
                        subdistrictSelectInstance.clearOptions();
                        subdistrictSelectInstance.addOption({ value: '', text: 'เลือกแขวง/ตำบล' });
                        subdistrictSelectInstance.setValue('');
                    
                        document.getElementById('postalCode').value = '';
                    
                        if (selectedProvince && addressData[selectedProvince]) {
                            const districts = Object.keys(addressData[selectedProvince]).map(d => ({ value: d, text: d }));
                            districtSelectInstance.addOptions(districts);
                            districtSelectInstance.enable();
                        } else {
                            districtSelectInstance.disable();
                            subdistrictSelectInstance.disable();
                        }
                    }
                    
                    function handleDistrictChange(value) {
                        selectedDistrict = value;
                    
                        subdistrictSelectInstance.clearOptions();
                        subdistrictSelectInstance.addOption({ value: '', text: 'เลือกแขวง/ตำบล' });
                        subdistrictSelectInstance.setValue('');
                    
                        document.getElementById('postalCode').value = '';
                    
                        if (selectedProvince && selectedDistrict && addressData[selectedProvince][selectedDistrict]) {
                            const subdistricts = Object.keys(addressData[selectedProvince][selectedDistrict]).map(s => ({ value: s, text: s }));
                            subdistrictSelectInstance.addOptions(subdistricts);
                            subdistrictSelectInstance.enable();
                        } else {
                            subdistrictSelectInstance.disable();
                        }
                    }
                    
                    function handleSubdistrictChange(value) {
                        const postalCodeInput = document.getElementById('postalCode');
                        
                        if (selectedProvince && selectedDistrict && value &&
                            addressData[selectedProvince] &&
                            addressData[selectedProvince][selectedDistrict] &&
                            addressData[selectedProvince][selectedDistrict][value]) {
                            
                            const postcode = addressData[selectedProvince][selectedDistrict][value];
                            postalCodeInput.value = postcode;
                        } 
                        // remove 'else { postalCodeInput.value = ""; }' 
                    }
                    
                    
                    
                    document.addEventListener('DOMContentLoaded', () => {
                        loadAddressData();
                    });
                    </script>

            <!-- Success Message Modal -->

            <!-- Failure Message Modal -->

                    <h2 class="text-2xl font-bold text-red-500 mb-4">ล้มเหลว!</h2>
                    <p id="failure-message" class="text-gray-700 whitespace-pre-line"></p>
                    <button onclick="closeMessage('failure-modal')"

    <script>

        function setupSearchableDropdown(inputId, dropdownId, dataList) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(dropdownId);
        
            if (!input || !dropdown) {
                console.error(`Input or Dropdown not found: ${inputId}, ${dropdownId}`);
                return;
            }
        
            input.addEventListener('input', function () {
                const searchTerm = input.value.toLowerCase();
                dropdown.innerHTML = '';
        
                const filteredItems = dataList.filter(item => item.toLowerCase().includes(searchTerm));
        
                filteredItems.forEach(item => {
                    const div = document.createElement('div');
                    div.textContent = item;
                    div.classList.add('dropdown-item');
                    div.addEventListener('click', function () {
                        input.value = item;
                        dropdown.classList.remove('active');
                    });
                    dropdown.appendChild(div);
                });
        
                if (filteredItems.length > 0) {
                    dropdown.classList.add('active');
                } else {
                    dropdown.classList.remove('active');
                }
            });
        
            // Hide dropdown if click outside
            document.addEventListener('click', function (event) {
                if (!input.contains(event.target) && !dropdown.contains(event.target)) {
                    dropdown.classList.remove('active');
                }
            });
        }

        let branchData = []; // <<<< ✅ ย้ายมาไว้บนสุดก่อน

        // Generic function to create searchable dropdown
        function safeSetupDropdown(idInput, idDropdown, arrayData) {
            const input = document.getElementById(idInput);
            const dropdown = document.getElementById(idDropdown);
            if (input && dropdown) {
                setupSearchableDropdown(idInput, idDropdown, arrayData);
            }
        }
        
        // Setup only branch dropdown
        safeSetupDropdown('branchInput', 'branchDropdown', branchData);

        // Fetch branches dynamically
        async function fetchBranches() {
            try {
                const response = await fetch('http://localhost:3000/api/user/branches');
                if (!response.ok) throw new Error('Failed to fetch branches');
                const branches = await response.json();
                branchData = branches.map(b => b.branch_name);
                setupSearchableDropdown('branchInput', 'branchDropdown', branchData);
            } catch (error) {
                console.error('Error fetching branches:', error);
            }
        }

        fetchBranches();


        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();
        
            // Collect form inputs
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const email = document.getElementById('email').value.trim() || null; // optional
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const branch = document.getElementById('branchInput').value.trim() || null;
        
            // Address fields
            const houseNumber = document.getElementById('houseNumber').value.trim();
            const soi = document.getElementById('soi').value.trim();
            const moo = document.getElementById('moo').value.trim();
            const road = document.getElementById('road').value.trim();
            const province = provinceSelectInstance.getValue();
            const district = districtSelectInstance.getValue();
            const subdistrict = subdistrictSelectInstance.getValue();
            const postalCode = document.getElementById('postalCode').value.trim();
        
            // Validate basic required fields
            const errors = [];
        
            if (!username) errors.push('กรุณากรอก Username');
            if (!password) errors.push('กรุณากรอกรหัสผ่าน');
            if (!confirmPassword) errors.push('กรุณากรอกยืนยันรหัสผ่าน');
            if (password !== confirmPassword) errors.push('รหัสผ่านไม่ตรงกัน');
            if (password.length < 8) errors.push('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
            if (!firstName) errors.push('กรุณากรอกชื่อ');
            if (!lastName) errors.push('กรุณากรอกนามสกุล');
            if (!phone.match(/^0\d{9}$/)) errors.push('เบอร์โทรศัพท์ต้องมี 10 หลักและขึ้นต้นด้วย 0');
        
            // Validate address fields
            if (!houseNumber) errors.push('กรุณากรอก บ้านเลขที่');
            if (!subdistrict) errors.push('กรุณาเลือก แขวง/ตำบล');
            if (!district) errors.push('กรุณาเลือก เขต/อำเภอ');
            if (!province) errors.push('กรุณาเลือก จังหวัด');
            if (!postalCode.match(/^\d{5}$/)) errors.push('รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก');
        
            if (errors.length > 0) {
                showFailureMessage(errors.join('\n'));
                return;
            }
        
            let addressFirstPart = houseNumber.trim();
            if (soi.trim()) addressFirstPart += ' ' + soi.trim();
            if (moo.trim()) addressFirstPart += ' ' + moo.trim();
            if (road.trim()) addressFirstPart += ' ' + road.trim();
            
            let addressSecondPart = '';
            if (subdistrict.trim()) addressSecondPart += subdistrict.trim() + ' ';
            if (district.trim()) addressSecondPart += district.trim() + ' ';
            if (province.trim()) addressSecondPart += province.trim() + ' ';
            if (postalCode.trim()) addressSecondPart += postalCode.trim();            
            
            // Final Full Address
            const fullAddress = `${addressFirstPart}, ${addressSecondPart.trim()}`;
            
        
            // Prepare final payload
            const formData = {
                username,
                password,
                email,
                role: 'User', // default
                name: `${firstName} ${lastName}`, // รวมชื่อ+นามสกุล
                phone,
                address: fullAddress,
                branch
            };
        
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
        
                const data = await response.json();
        
                if (!response.ok) {
                    throw new Error(data.error || 'การลงทะเบียนล้มเหลว กรุณาลองใหม่');
                }
        
                // Success
                sessionStorage.setItem('registerUserId', data.user_id);
                showSuccessMessage('ลงทะเบียนสำเร็จ! กำลังพาไปหน้าเพิ่มทักษะ...');
                setTimeout(() => window.location.href = 'register-skill.html', 2000);
        
            } catch (error) {
                console.error('Registration Error:', error);
                showFailureMessage(error.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        });
        

        function showSuccessMessage(message) {
            document.getElementById('success-message').textContent = message;
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function showFailureMessage(message) {
            document.getElementById('failure-message').textContent = message;
            document.getElementById('failure-modal').classList.remove('hidden');
        }

        function closeMessage(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
    <script src="navbar.js"></script>
</body>

</html>

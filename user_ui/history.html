<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ประวัติธรุกรรม - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    
    <style>
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item b {
            color: rgb(0, 123, 255);
            transition: color 0.3s ease;
        }

        .dropdown-item:hover b {
            color: rgb(0, 86, 179);
        }

        .dropdown-item b.red {
            color: red;
        }

        .dropdown-item:hover b.red {
            color: darkred;
        }

        th.sortable:hover {
            cursor: pointer;
            background-color: #f1f1f1;
        }
    </style>
    <script src="navbar.js"></script>
    <script>
        let transactions = [];
        let currentPage = 1;
        const pageSize = 10;
        let totalTransactions = 0;
        let sortColumn = '';
        let sortDirection = 'asc';

        async function fetchTransactions() {
            const userId = parseInt(localStorage.getItem('user_id'), 10);
        
            if (!userId) {
                alert('ไม่พบรหัสผู้ใช้ กรุณาเข้าสู่ระบบใหม่');
                return;
            }
        
            try {
                const response = await fetch(`http://localhost:3000/api/user/transactions/me`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`❌ Error ${response.status}: ${errorText}`);
                    throw new Error('ไม่สามารถดึงข้อมูลธุรกรรมของผู้ใช้ได้');
                }
        
                const data = await response.json();
                transactions = data.transactions;
                totalTransactions = transactions.length;
        
                renderTable(transactions);
                renderPagination();
            } catch (error) {
                console.error('❌ Error fetching transactions:', error);
                alert('เกิดข้อผิดพลาดในการโหลดธุรกรรมของผู้ใช้');
            }
        }
        
        

        async function fetchActivityDescriptions() {
            const activityIds = transactions.map(transaction => transaction.activity_id);
            const uniqueActivityIds = [...new Set(activityIds)];

            const activityDescriptions = {};

            for (const activityId of uniqueActivityIds) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const activity = await response.json();
                    activityDescriptions[activityId] = activity.description;
                } catch (error) {
                    console.error('Error fetching activity description:', error);
                }
            }

            transactions = transactions.map(transaction => ({
                ...transaction,
                activity_description: activityDescriptions[transaction.activity_id] || 'No description available'
            }));
        }

        function renderTable(data) {
            const tbody = document.getElementById('transaction-tbody');
            tbody.innerHTML = '';
        
            if (data.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="9" class="text-center text-gray-500 py-6 text-base font-medium">
                        ไม่มีประวัติธุรกรรมในระบบของคุณ
                    </td>
                `;
                tbody.appendChild(row);
                return;
            }
        
            const activityDetailsPage = 'activity-details.html';
        
            data.forEach((tx) => {
                const isEarn = tx.transaction_type === 'earn';
                const sign = isEarn ? '+' : '−';
                const creditColor = isEarn ? 'text-green-600' : 'text-red-600';
                const typeLabel = isEarn ? 'โอนเข้า' : 'โอนออก';
        
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition text-base text-gray-800';
        
                row.innerHTML = `
                    <td class="px-4 py-3 font-medium">${tx.transaction_id}</td>
                    <td class="px-4 py-3">${new Date(tx.date).toLocaleDateString('th-TH')}</td>
                    <td class="px-4 py-3">${tx.time}</td>
                    <td class="px-4 py-3 ${creditColor} font-semibold">${sign}${tx.time_credits} ชั่วโมง</td>
                    <td class="px-4 py-3">${typeLabel}</td>
                    <td class="px-4 py-3">${tx.activity_title || '—'}</td>
                    <td class="px-4 py-3">${tx.requester_name || '—'}</td>
                    <td class="px-4 py-3">${tx.participant_name || '—'}</td>
                    <td class="px-4 py-3 text-center">
                        ${tx.activity_id ? `
                            <a href="${activityDetailsPage}?id=${tx.activity_id}"
                               class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1 px-3 rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-400">
                                ดูรายละเอียด
                            </a>` : '—'}
                    </td>
                `;
        
                tbody.appendChild(row);
            });
        }
        
        

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalTransactions / pageSize);

            const firstButton = document.createElement('button');
            firstButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            firstButton.textContent = 'หน้าแรก';
            firstButton.onclick = () => {
                currentPage = 1;
                fetchTransactions(); // ✅ FIXED
            };
            paginationContainer.appendChild(firstButton);

            const prevButton = document.createElement('button');
            prevButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            prevButton.textContent = 'ก่อนหน้า';
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchTransactions(); // ✅ FIXED
                }
            };
            paginationContainer.appendChild(prevButton);

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1 ${i === currentPage ? 'bg-blue-700' : ''}`;
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    fetchTransactions(); // ✅ FIXED
                };
                paginationContainer.appendChild(pageButton);
            }

            const nextButton = document.createElement('button');
            nextButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            nextButton.textContent = 'ต่อไป';
            nextButton.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchTransactions(); // ✅ FIXED
                }
            };
            paginationContainer.appendChild(nextButton);

            const lastButton = document.createElement('button');
            lastButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mx-1';
            lastButton.textContent = 'หน้าสุดท้าย';
            lastButton.onclick = () => {
                currentPage = totalPages;
                fetchTransactions(); // ✅ FIXED
            };
            paginationContainer.appendChild(lastButton);
        }

        function sortTable(column) {
            const direction = sortColumn === column && sortDirection === 'asc' ? 'desc' : 'asc';
            sortColumn = column;
            sortDirection = direction;

            transactions.sort((a, b) => {
                if (a[column] < b[column]) {
                    return direction === 'asc' ? -1 : 1;
                }
                if (a[column] > b[column]) {
                    return direction === 'asc' ? 1 : -1;
                }
                return 0;
            });

            renderTable(transactions);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('th.sortable').forEach(header => {
                header.addEventListener('click', () => {
                    const column = header.getAttribute('data-column');
                    sortTable(column);
                });
            });
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'log-in.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'log-in.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'log-in.html';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchTransactions();
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <!-- Header Section -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-extrabold text-blue-800 tracking-tight mb-2 leading-snug">
                        ธุรกรรมเวลา
                    </h2>
                    <p class="text-red-600 text-lg font-medium leading-relaxed max-w-2xl mx-auto">
                        แสดงข้อมูลการให้และรับความช่วยเหลือผ่านกิจกรรมต่าง ๆ ที่ได้ดำเนินการเสร็จสิ้นแล้ว
                    </p>
                </div>
  
                <div class="overflow-x-auto">
                    <div class="table-responsive-sm">
                        <table class="min-w-full text-sm text-gray-800 border border-gray-300 rounded-lg shadow-sm overflow-hidden">
                            <thead class="bg-gray-50 border-b border-gray-300">
                                <tr>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">รหัสธุรกรรม</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">วันที่</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">เวลา</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">เครดิตเวลา</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">ประเภทธุรกรรม</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">ชื่อกิจกรรม</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">ผู้ขอ</th>
                                  <th class="px-4 py-3 text-left text-base font-semibold text-gray-700 uppercase tracking-wide">ผู้เข้าร่วม</th>
                                  <th class="px-4 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wide">รายละเอียด</th>
                                </tr>
                              </thead>                              
                            <tbody id="transaction-tbody" class="divide-y divide-gray-200 bg-white">
                              <!-- Dynamic rows from renderTable() go here -->
                            </tbody>
                          </table>
                          
                    </div>
                </div>
                <div class="flex items-center justify-center mt-5" id="pagination">
                    <!-- Pagination buttons will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>
</body>

</html>

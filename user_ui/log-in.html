<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Time Bank
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex items-center justify-center bg-blue-700">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
                <h1 class="text-4xl font-bold text-center text-blue-900 mb-8">
                    TIME BANK
                </h1>
                <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">
                    เข้าสู่ระบบ
                </h2>
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                            ชื่อผู้ใช้
                        </label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="username" placeholder="ชื่อผู้ใช้" type="text" />
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                            รหัสผ่าน
                        </label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                            id="password" placeholder="รหัสผ่าน" type="password" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="submit">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-gray-700">
                        ไม่มีบัญชี?
                        <a class="text-blue-500" href="register.html">
                            สมัครสมาชิก
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <div class="flex justify-center">
                <div
                    class="w-20 h-20 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500">
                    <svg class="w-12 h-12 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-green-600 mt-6">เข้าสู่ระบบสำเร็จ!</h2>
            <p class="text-gray-700 text-lg mt-4">กำลังนำทางไปยังหน้าหลัก...</p>
            <button id="confirm-btn"
                class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>

    <script src="navbar.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/user/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);

                    // Show success modal
                    const modal = document.getElementById('success-modal');
                    modal.classList.remove('hidden');

                    // Auto redirect after 5 seconds
                    const redirectTimeout = setTimeout(() => {
                        navigateToHome();
                    }, 5000);

                    // Allow user to click button to redirect immediately
                    document.getElementById('confirm-btn').addEventListener('click', function () {
                        clearTimeout(redirectTimeout);
                        navigateToHome();
                    });

                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาด กรุณาลองอีกครั้ง');
            }
        });

        function navigateToHome() {
            window.location.href = 'homepage.html';
        }
    </script>
</body>

</html>

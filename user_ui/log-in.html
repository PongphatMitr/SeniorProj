   document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/user/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save the token in localStorage
                    localStorage.setItem('token', data.token);
                    // Update the sidebar
                    updateSidebar(true);
                } else {
                    console.error('Error:', data);
                    alert(data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            }
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                }
            } else {
                updateSidebar(false);
            }
        }

        // Check if the user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('http://localhost:3000/api/user/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);

                // แสดง Modal
                const modal = document.getElementById('success-modal');
                modal.classList.remove('hidden');

                // ตั้งเวลาให้ redirect อัตโนมัติใน 5 วินาที
                const redirectTimeout = setTimeout(() => {
                    navigateToHome();
                }, 5000);

                // ให้ผู้ใช้กดปุ่มเพื่อไปเร็วขึ้น
                document.getElementById('confirm-btn').addEventListener('click', function () {
                    clearTimeout(redirectTimeout);
                    navigateToHome();
                });

            } else {
                alert(data.error);
            }
        } catch (error) {
            alert('เกิดข้อผิดพลาด กรุณาลองอีกครั้ง');
        }
    });

    function navigateToHome() {
        window.location.href = 'homepage.html';
    }
</script>

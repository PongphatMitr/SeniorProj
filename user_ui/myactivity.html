<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>กิจกรรมของฉัน - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        .day-part {
            display: inline-block;
            width: 40px;
        }

        .month-year-part {
            display: inline-block;
            width: 80px;
        }
    </style>

    <script>
        let activities = [];
        let sortOrder = {
            title: 'asc',
            start_date: 'asc',
            status: 'asc',
            requester_name: 'asc'
        };

        async function confirmAndRemove(event, rowId, activityId) {
            event.preventDefault();
            const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบกิจกรรมนี้?");
            if (confirmation) {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    document.getElementById(rowId).remove();
                    alert("กิจกรรมถูกลบเรียบร้อยแล้ว");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบกิจกรรม");
                }
            }
        }

        async function fetchActivities() {
            try {
                console.log('Fetching activities...');
                const response = await fetch('http://localhost:3000/api/user/activities', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    activities = data.activities.filter(activity => activity.requester_id === parseInt(localStorage.getItem('user_id')));
                    await fetchParticipants();
                    await fetchRequesterNames();
                    updateActivityStatus();
                    renderTable(activities);
                } else {
                    console.error('Error:', data);
                    alert('Error fetching activities. Please try again.');
                }
            } catch (error) {
                console.error('Error fetching activities:', error);
                alert('Error fetching activities. Please try again.');
            }
        }

        async function fetchParticipants() {
            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activity.activity_id}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    const participants = await response.json();
                    activity.current_participants = participants.length;
                } catch (error) {
                    console.error(`Error fetching participants for activity ${activity.activity_id}:`, error);
                    activity.current_participants = 0;
                }
            }
        }

        async function fetchRequesterNames() {
            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${activity.requester_id}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`Failed to fetch user details for user ${activity.requester_id}`);
                    }
                    const user = await response.json();
                    activity.requester_name = user.name;
                } catch (error) {
                    console.error(`Error fetching requester name for user ${activity.requester_id}:`, error);
                    activity.requester_name = 'Unknown';
                }
            }
        }

        function updateActivityStatus() {
            const now = new Date();
            activities.forEach(activity => {
                if (activity.status === 'กำลังจะเริ่ม') {
                    const activityEndDate = new Date(activity.end_date);
                    const activityEndTime = activity.end_time.split(':');
                    activityEndDate.setHours(activityEndTime[0], activityEndTime[1], activityEndTime[2]);

                    if (activityEndDate < now) {
                        activity.status = 'เกินเวลา';
                    }
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('activity-tbody');
            tbody.innerHTML = '';
            data.forEach((activity, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="ชื่อผู้ขอ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.requester_name}
                    </td>
                    <td aria-colindex="2" data-label="กิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.title}
                    </td>
                    <td aria-colindex="3" data-label="วันที่" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.start_date)}
                    </td>
                    <td aria-colindex="4" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded ${activity.status === 'กำลังจะเริ่ม' ? 'bg-blue-500' : activity.status === 'เสร็จสิ้น' ? 'bg-green-500' : activity.status === 'เกินเวลา' ? 'bg-orange-500' : 'bg-red-500'} text-white">${activity.status}</span>
                    </td>
                    <td aria-colindex="5" data-label="จำนวนผู้เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.current_participants} / ${activity.max_participants}
                    </td>
                    <td aria-colindex="6" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <a href="activity-details.html?id=${activity.activity_id}" class="bg-blue-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline">รายละเอียด</a>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear() + 543; // Convert to Buddhist year
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[date.getMonth()];
            const day = date.getDate();
            return `<span class="day-part">${day}</span> <span class="month-year-part">${month}</span> <span class="month-year-part">${year}</span>`;
        }

        function sortTable(column, type) {
            const order = sortOrder[column] === 'asc' ? 'desc' : 'asc';
            sortOrder[column] = order;

            const sortedActivities = [...activities].sort((a, b) => {
                if (type === 'string') {
                    return order === 'asc' ? a[column].localeCompare(b[column]) : b[column].localeCompare(a[column]);
                } else if (type === 'date') {
                    return order === 'asc' ? new Date(a[column]) - new Date(b[column]) : new Date(b[column]) - new Date(a[column]);
                }
            });
            renderTable(sortedActivities);
        }

        function updateSidebar(isLoggedIn) {

            if (isLoggedIn) {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="log-out.html">
                            <i class="fas fa-user mr-3"></i>
                            โปรไฟล์
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="service.html">
                            <i class="fas fa-clipboard-list mr-3"></i>
                            ยื่นข้อของานบริการ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="profile.html">
                            <i class="fas fa-user-edit mr-3"></i>
                            แก้ไขประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="skillconf.html">
                            <i class="fas fa-tools mr-3"></i>
                            แก้ไขทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="balance.html">
                            <i class="fas fa-wallet mr-3"></i>
                            ยอดคงเหลือ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="history.html">
                            <i class="fas fa-history mr-3"></i>
                            ประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="contact.html">
                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                `;
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="service.html">
                            <i class="fas fa-clipboard-list mr-3"></i>
                            ยื่นข้อของานบริการ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="profile.html">
                            <i class="fas fa-user-edit mr-3"></i>
                            แก้ไขประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="skillconf.html">
                            <i class="fas fa-tools mr-3"></i>
                            แก้ไขทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="balance.html">
                            <i class="fas fa-wallet mr-3"></i>
                            ยอดคงเหลือ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="history.html">
                            <i class="fas fa-history mr-3"></i>
                            ประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="contact.html">
                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                `;
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const userData = await response.json();
                        localStorage.setItem('user_id', userData.user.userId);
                        localStorage.setItem('user_name', userData.user.name);
                        updateSidebar(true);
                        fetchActivities(); // Fetch activities only if the user is logged in
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

        function searchActivities() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredActivities = activities.filter(activity => {
                return (
                    (activity.activity_id && activity.activity_id.toString().includes(searchTerm)) ||
                    (activity.title && activity.title.toLowerCase().includes(searchTerm)) ||
                    (activity.description && activity.description.toLowerCase().includes(searchTerm)) ||
                    (activity.location && activity.location.toLowerCase().includes(searchTerm)) ||
                    (activity.requester_id && activity.requester_id.toString().includes(searchTerm))
                );
            });
            renderTable(filteredActivities);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo of Time Bank System, a clock with a handshake in the center"
                    class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/SZMN19J8Me29cSo27wLCtM47woeM4nodx6ecM18dg0snSk9nA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">
                    TIMEBANK
                </span>
            </div>
            <nav>
                <ul id="navList">
                    <!-- Navigation items will be dynamically inserted here -->
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <div class="flex items-center justify-between border-b pb-2 mb-5">
                <a class="text-4xl font-bold mb-5 text-white-600">
                    กิจกรรมของฉัน
                </a>
            </div>            
            <div class="bg-white text-black p-8 rounded-lg shadow-lg">
                <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">กิจกรรม</h2>
                <div class="mb-4 flex items-center">
                    <input id="search-input"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        type="text" placeholder="ค้นหากิจกรรม" oninput="searchActivities()" />
                        <a href="create-service.html" 
                        class="bg-green-500 hover:bg-green-700 text-white text-center font-semibold text-sm py-1.5 px-3 rounded focus:outline-none focus:shadow-outline ml-2">
                        สร้างกิจกรรม
                     </a>
                     
                </div>
                <div class="overflow-x-auto">
                    <div class="table-responsive-sm">
                        <table role="table" aria-busy="false" aria-colcount="6"
                            class="table b-table b-table-stacked-md w-full">
                            <thead role="rowgroup" class="bg-gray-100">
                                <tr role="row">
                                    <th role="columnheader" scope="col" aria-colindex="1"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        onclick="sortTable('requester_name', 'string')">
                                        ชื่อผู้ขอ <i class="fas fa-sort"></i>
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="2"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        onclick="sortTable('title', 'string')">
                                        กิจกรรม <i class="fas fa-sort"></i>
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="3"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        onclick="sortTable('start_date', 'date')">
                                        วันที่ <i class="fas fa-sort"></i>
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="4"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600 cursor-pointer"
                                        onclick="sortTable('status', 'string')">
                                        สถานะ <i class="fas fa-sort"></i>
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="5"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        จำนวนผู้เข้าร่วม
                                    </th>
                                    <th role="columnheader" scope="col" aria-colindex="6"
                                        class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                        การจัดการ
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="activity-tbody" role="rowgroup">
                                <!-- Activities will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

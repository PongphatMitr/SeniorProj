
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>กิจกรรมของฉันที่ดำเนินอยู่ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script src="navbar.js"></script>
    <style>
        .day-part {
            display: inline-block;
            width: 40px;
        }

        .month-year-part {
            display: inline-block;
            width: 80px;
        }
    </style>

    <script>
        let sortOrder = {
            title: 'asc',
            start_date: 'asc',
            status: 'asc',
            requester_name: 'asc'
        };

        async function confirmAndRemove(event, rowId, activityId) {
            event.preventDefault();
            const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบกิจกรรมนี้?");
            if (confirmation) {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    document.getElementById(rowId).remove();
                    alert("กิจกรรมถูกลบเรียบร้อยแล้ว");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบกิจกรรม");
                }
            }
        }

        let allOngoingActivities = [];
        let currentRoleFilter = '';
        
        async function fetchActivities() {
            try {
                const userId = parseInt(localStorage.getItem('user_id'));
                const response = await fetch('http://localhost:3000/api/user/activities', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
        
                const data = await response.json();
                if (!response.ok) throw new Error('Failed to fetch activities.');
        
                const validStatuses = ['กำลังจะเริ่ม', 'กำลังทำกิจกรรม', 'รอผู้ขอยืนยันผล', 'รอการอนุมัติ'];
                let fetchedActivities = data.activities.filter(a => validStatuses.includes(a.status));
        
                // Store all for now, filtering will be done after participants loaded
                allOngoingActivities = fetchedActivities.map(a => ({
                    ...a,
                    required_skill_id: a.required_skills
                }));
                
        
                await fetchParticipants(); // populate `participants`
                await fetchRequesterNames();
        
                // Now filter only activities that the user is involved in
                allOngoingActivities = allOngoingActivities.filter(activity =>
                    activity.requester_id === userId ||
                    activity.participants.some(p => p.user_id === userId)
                );
        
                renderActivityOngoing(allOngoingActivities);
        
            } catch (error) {
                console.error('Error fetching activities:', error);
                alert('Error fetching activities. Please try again.');
            }
        }
        
        
        async function fetchParticipants() {
            for (let activity of allOngoingActivities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activity.activity_id}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    const participants = await response.json();
                    activity.current_participants = participants.length;
                    activity.participants = participants;
                } catch (error) {
                    console.error(`Error fetching participants for activity ${activity.activity_id}:`, error);
                    activity.current_participants = 0;
                    activity.participants = [];
                }
            }
        }
        
        async function fetchRequesterNames() {
            for (let activity of allOngoingActivities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${activity.requester_id}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) throw new Error(`Failed to fetch user details for user ${activity.requester_id}`);
                    const user = await response.json();
                    activity.requester_name = user.name;
                } catch (error) {
                    console.error(`Error fetching requester name for user ${activity.requester_id}:`, error);
                    activity.requester_name = 'Unknown';
                }
            }
        }
        
        function updateActivityStatus() {
            const now = new Date();
            activities.forEach(activity => {
                if (activity.status === 'กำลังจะเริ่ม') {
                    const activityEndDate = new Date(activity.end_date);
                    const activityEndTime = activity.end_time.split(':');
                    activityEndDate.setHours(activityEndTime[0], activityEndTime[1], activityEndTime[2]);

                    if (activityEndDate < now) {
                        activity.status = 'เกินเวลา';
                    }
                }
            });
        }
        

        function renderActivityOngoing(data) {
            const tbody = document.getElementById('activity-tbody');
            tbody.innerHTML = '';
            const userId = parseInt(localStorage.getItem('user_id'));
        
            const filtered = data.filter(activity => {
                const isRequester = activity.requester_id === userId;
                const isParticipant = activity.participants?.some(p => p.user_id === userId);
                if (currentRoleFilter === 'requester') return isRequester;
                if (currentRoleFilter === 'provider') return isParticipant;
                return isRequester || isParticipant;
            });
        
            if (filtered.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="7" class="text-center py-4 text-gray-500 italic">
                        ไม่มีข้อมูลกิจกรรมที่กำลังดำเนินอยู่
                    </td>
                `;
                tbody.appendChild(emptyRow);
                return;
            }
        
            filtered.forEach((activity, index) => {
                const statusColor =
                    activity.status === 'กำลังจะเริ่ม' ? 'bg-blue-500' :
                    activity.status === 'กำลังทำกิจกรรม' ? 'bg-yellow-500' :
                    activity.status === 'รอผู้ขอยืนยันผล' ? 'bg-pink-500' :
                    activity.status === 'รอการอนุมัติ' ? 'bg-indigo-500' :
                    'bg-gray-500';
        
                const isRequester = activity.requester_id === userId;
        
                const row = document.createElement('tr');
                row.id = `ongoing-row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
        
                row.innerHTML = `
                    <td class="py-2 px-4 border-b border-gray-200 font-semibold text-center">
                        <span class="${activity.activity_type === 'exchange' ? 'text-lime-500' : 'text-gray-400'} font-semibold">
                            ${activity.activity_type === 'exchange' ? 'มีเครดิต' : 'ไม่มีเครดิต'}
                        </span>
                    </td>
                    <td class="py-2 px-4 border-b border-gray-200">${activity.title}</td>
                    <td class="py-2 px-4 border-b border-gray-200">${activity.required_skill_name || '-'}</td>
                    <td class="py-2 px-4 border-b border-gray-200">
                        <div class="text-sm leading-snug text-gray-800">
                            <div>${formatDateShort(activity.start_date)}</div>
                            <div class="text-gray-500">(${formatTimeShort(activity.start_time)} - ${formatTimeShort(activity.end_time)})</div>
                        </div>
                    </td>
                    <td class="py-2 px-4 border-b border-gray-200 text-center text-center">
                        <span class="inline-block px-3 py-1 rounded-md text-white font-medium text-base ${statusColor}">
                            ${activity.status}
                        </span>
                    </td>
                    <td class="py-2 px-4 border-b border-gray-200 text-center text-center">
                        <span id="participants-${index}">${activity.current_participants}</span> / ${activity.max_participants}
                    </td>
                    <td class="py-2 px-4 border-b border-gray-200 text-center text-center">
                        <a href="${isRequester ? 'myactivity-details.html' : 'activity-details.html'}?id=${activity.activity_id}"
                           class="inline-block w-full bg-blue-500 text-white font-bold py-1 px-2 rounded text-center whitespace-nowrap">
                           รายละเอียด
                        </a>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function formatDateShort(dateString) {
            const date = new Date(dateString);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = (date.getFullYear() + 543).toString(); // Buddhist year
            return `${day}/${month}/${year}`;
        }
        
        function formatTimeShort(timeString) {
            if (!timeString) return '-';
            const [hour, minute] = timeString.split(':');
            return `${hour.padStart(2, '0')}:${minute.padStart(2, '0')} น.`;
        }
        
        
        function filterOngoingActivities(role) {
            currentRoleFilter = role;
            renderActivityOngoing(allOngoingActivities);
        }
        

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear() + 543; // Convert to Buddhist year
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[date.getMonth()];
            const day = date.getDate();
            return `<span class="day-part">${day}</span> <span class="month-year-part">${month}</span> <span class="month-year-part">${year}</span>`;
        }

        function sortTable(column, type) {
            const order = sortOrder[column] === 'asc' ? 'desc' : 'asc';
            sortOrder[column] = order;

            const sortedActivities = [...activities].sort((a, b) => {
                if (type === 'string') {
                    return order === 'asc' ? a[column].localeCompare(b[column]) : b[column].localeCompare(a[column]);
                } else if (type === 'date') {
                    return order === 'asc' ? new Date(a[column]) - new Date(b[column]) : new Date(b[column]) - new Date(a[column]);
                }
            });
            renderActivityOngoing(sortedActivities);
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const isLoginPage = window.location.pathname.endsWith('login.html');
            const isRegisterPage = window.location.pathname.endsWith('register.html');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        if (!isLoginPage && !isRegisterPage) {
                            showErrorModal('Token verification failed. Redirecting to login page.');
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    if (!isLoginPage && !isRegisterPage) {
                        showErrorModal('Error occurred during token verification. Redirecting to login page.');
                    }
                }
            } else {
                updateSidebar(false);
                if (!isLoginPage && !isRegisterPage) {
                    showErrorModal('No token found. Redirecting to login page.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchActivities();
        });
    </script>
</head>

                <script>
                    let skills = []
                    categories = []

                    function toggleAdvancedFilter() {
                        const filterBox = document.getElementById('advanced-filter');
                        filterBox.classList.toggle('hidden');

                        // Add event listener for click outside when opening
                        if (!filterBox.classList.contains('hidden')) {
                            document.addEventListener('click', handleClickOutsideFilter);
                        } else {
                            document.removeEventListener('click', handleClickOutsideFilter);
                        }
                    }

                    function closeAdvancedFilter() {
                        const filterBox = document.getElementById('advanced-filter');
                        if (!filterBox.classList.contains('hidden')) {
                            filterBox.classList.add('hidden');
                            document.removeEventListener('click', handleClickOutsideFilter);
                        }
                    }

                    function handleClickOutsideFilter(event) {
                        const filterBox = document.getElementById('advanced-filter');
                        const button = document.querySelector('button[onclick="toggleAdvancedFilter()"]');

                        // If the click target is not inside the filter or the toggle button
                        if (!filterBox.contains(event.target) && !button.contains(event.target)) {
                            closeAdvancedFilter();
                        }
                    }

                    function clearFilters() {
                        document.getElementById('search-input').value = '';
                        document.getElementById('filter-start-date').value = '';
                        document.getElementById('filter-end-date').value = '';
                        document.getElementById('start-hours').value = '';
                        document.getElementById('start-minutes').value = '00';
                        document.getElementById('end-hours').value = '';
                        document.getElementById('end-minutes').value = '00';
                        document.getElementById('category-dropdown').value = '';
                        const skillDropdown = document.getElementById('skill-dropdown');
                        skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
                        skillDropdown.disabled = true;
                        document.getElementById('filter-available-slots').checked = false;
                        searchActivities();
                    }

                    async function fetchSkillsAndCategories() {
                        try {
                            const response = await fetch('http://localhost:3000/api/user/skills', {
                                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                            });
                            const data = await response.json();
                            skills = data;
                            categories = [...new Set(skills.map(skill => skill.category))];
                            populateCategoryDropdown();
                        } catch (err) {
                            console.error('Error loading skills:', err);
                        }
                    }

                    function populateCategoryDropdown() {
                        const dropdown = document.getElementById('category-dropdown');
                        dropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>';
                        categories.forEach(cat => {
                            const opt = document.createElement('option');
                            opt.value = cat;
                            opt.textContent = cat;
                            dropdown.appendChild(opt);
                        });
                        document.getElementById('skill-dropdown').disabled = true;
                    }

                    function updateSkillDropdown() {
                        const category = document.getElementById('category-dropdown').value;
                        const skillDropdown = document.getElementById('skill-dropdown');
                        skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
                        if (!category) {
                            skillDropdown.disabled = true;
                            return;
                        }
                        const filteredSkills = skills.filter(skill => skill.category === category);
                        filteredSkills.forEach(skill => {
                            const opt = document.createElement('option');
                            opt.value = skill.skill_id;
                            opt.textContent = skill.name;
                            skillDropdown.appendChild(opt);
                        });
                        skillDropdown.disabled = false;
                    }

                    function searchActivities() {
                        const keyword = document.getElementById('search-input').value.toLowerCase();
                        const startDate = document.getElementById('filter-start-date').value;
                        const endDate = document.getElementById('filter-end-date').value;
                        const startHours = document.getElementById('start-hours').value;
                        const startMinutes = document.getElementById('start-minutes').value;
                        const endHours = document.getElementById('end-hours').value;
                        const endMinutes = document.getElementById('end-minutes').value;
                        const skill = document.getElementById('skill-dropdown').value;
                        const availableOnly = document.getElementById('filter-available-slots').checked;
                    
                        const startTime = startHours && startMinutes ? `${startHours}:${startMinutes}` : null;
                        const endTime = endHours && endMinutes ? `${endHours}:${endMinutes}` : null;
                    
                        const userId = parseInt(localStorage.getItem('user_id'));
                    
                        const filtered = allOngoingActivities.filter(a => {
                            const isRequester = a.requester_id === userId;
                            const isParticipant = a.participants?.some(p => p.user_id === userId);
                    
                            if (currentRoleFilter === 'requester' && !isRequester) return false;
                            if (currentRoleFilter === 'provider' && !isParticipant) return false;
                    
                            const matchText = a.title.toLowerCase().includes(keyword) || (a.description || '').toLowerCase().includes(keyword);
                            const matchStartDate = startDate ? new Date(a.start_date) >= new Date(startDate) : true;
                            const matchEndDate = endDate ? new Date(a.end_date) <= new Date(endDate) : true;
                            const matchStartTime = startTime ? a.start_time >= startTime : true;
                            const matchEndTime = endTime ? a.end_time <= endTime : true;
                            const matchSkill = skill ? String(a.required_skill_id) === String(skill) : true;
                            const matchAvailable = availableOnly ? a.current_participants < a.max_participants : true;
                    
                            return matchText && matchStartDate && matchEndDate && matchStartTime && matchEndTime && matchSkill && matchAvailable;
                        });
                    
                        renderActivityOngoing(filtered);
                    }
                    
                    


                    function populateTimeDropdowns() {
                        const hourOptions = [...Array(24).keys()].map(i => `<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')}</option>`).join('');
                        const minuteOptions = [...Array(12).keys()].map(i => `<option value="${(i * 5).toString().padStart(2, '0')}">${(i * 5).toString().padStart(2, '0')}</option>`).join('');

                        document.getElementById('start-hours').innerHTML = '<option value="" selected disabled>-- ชั่วโมง --</option>' + hourOptions;
                        document.getElementById('end-hours').innerHTML = '<option value="" selected disabled>-- ชั่วโมง --</option>' + hourOptions;
                        document.getElementById('start-minutes').innerHTML = minuteOptions;
                        document.getElementById('end-minutes').innerHTML = minuteOptions;
                    }

                    window.addEventListener('DOMContentLoaded', () => {
                        fetchSkillsAndCategories();
                        populateTimeDropdowns();
                    });
                </script>

                <div class="mb-4 flex items-center justify-center">
                    <button onclick="filterOngoingActivities('')"
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">กิจกรรมทั้งหมด</button>
                    <button onclick="filterOngoingActivities('requester')"
                        class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">ผู้สร้างกิจกรรม</button>
                    <button onclick="filterOngoingActivities('provider')"
                        class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">ผู้เข้าร่วมกิจกรรม</button>
                </div>
                <div class="w-full overflow-x-auto">
                    <table class="table-fixed w-full text-sm border-collapse">
                            <thead class="bg-gray-100">
                                <tr class="h-16">
                                    <th class="px-4 py-2 text-center font-semibold text-gray-600 w-[10%]">ประเภท</th>
                                    <th class="px-4 py-2 text-left font-semibold text-gray-600 w-[20%] cursor-pointer" onclick="sortTable('title', 'string')">กิจกรรม <i class="fas fa-sort"></i></th>
                                    <th class="px-4 py-2 text-left font-semibold text-gray-600 w-[15%]">ทักษะที่ต้องการ</th>
                                    <th class="px-4 py-2 text-left font-semibold text-gray-600 w-[14%]">ช่วงเวลา</th>
                                    <th class="px-4 py-2 text-center font-semibold text-gray-600 w-[12%]">สถานะ</th>
                                    <th class="px-4 py-2 text-center font-semibold text-gray-600 w-[10%]">ผู้เข้าร่วม</th>
                                    <th class="px-4 py-2 text-center font-semibold text-gray-600 w-[10%]">รายละเอียด</th>
                                </tr>
                                </thead>
                                
                            <tbody id="activity-tbody" class="align-top break-words whitespace-normal text-base">
                                <!-- Activity onGoing will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

    <script>
        let activities = [];
        let sortOrder = {
            title: 'asc',
            start_date: 'asc',
            status: 'asc',
            requester_name: 'asc'
        };

        async function confirmAndRemove(event, rowId, activityId) {
            event.preventDefault();
            const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบกิจกรรมนี้?");
            if (confirmation) {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    document.getElementById(rowId).remove();
                    alert("กิจกรรมถูกลบเรียบร้อยแล้ว");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบกิจกรรม");
                }
            }
        }

        async function fetchActivities() {
            try {
                console.log('Fetching activities...');
                const response = await fetch('http://localhost:3000/api/user/activities', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    activities = data.activities.filter(activity => activity.requester_id === parseInt(localStorage.getItem('user_id')));
                    await fetchParticipants();
                    await fetchRequesterNames();
                    updateActivityStatus();
                    renderTable(activities);
                } else {
                    console.error('Error:', data);
                    alert('Error fetching activities. Please try again.');
                }
            } catch (error) {
                console.error('Error fetching activities:', error);
                alert('Error fetching activities. Please try again.');
            }
        }

        async function fetchParticipants() {
            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activity.activity_id}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    const participants = await response.json();
                    activity.current_participants = participants.length;
                    activity.participants = participants; // Store participants for later use
                } catch (error) {
                    console.error(`Error fetching participants for activity ${activity.activity_id}:`, error);
                    activity.current_participants = 0;
                    activity.participants = []; // Ensure participants is an empty array on error
                }
            }
        }

        async function fetchRequesterNames() {
            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${activity.requester_id}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`Failed to fetch user details for user ${activity.requester_id}`);
                    }
                    const user = await response.json();
                    activity.requester_name = user.name;
                } catch (error) {
                    console.error(`Error fetching requester name for user ${activity.requester_id}:`, error);
                    activity.requester_name = 'Unknown';
                }
            }
        }

        function updateActivityStatus() {
            const now = new Date();
            activities.forEach(activity => {
                if (activity.status === 'กำลังจะเริ่ม') {
                    const activityEndDate = new Date(activity.end_date);
                    const activityEndTime = activity.end_time.split(':');
                    activityEndDate.setHours(activityEndTime[0], activityEndTime[1], activityEndTime[2]);

                    if (activityEndDate < now) {
                        activity.status = 'เกินเวลา';
                    }
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('activity-tbody');
            tbody.innerHTML = '';
            data.forEach((activity, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="ชื่อผู้ขอ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.requester_name}
                    </td>
                    <td aria-colindex="2" data-label="กิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.title}
                    </td>
                    <td aria-colindex="3" data-label="วันที่สร้างกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.created_at)}
                    </td>
                    <td aria-colindex="4" data-label="วันที่เริ่มกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.start_date)}
                    </td>
                    <td aria-colindex="5" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded ${activity.status === 'กำลังจะเริ่ม' ? 'bg-blue-500' : activity.status === 'เสร็จสิ้น' ? 'bg-green-500' : activity.status === 'เกินเวลา' ? 'bg-orange-500' : 'bg-red-500'} text-white">${activity.status}</span>
                    </td>
                    <td aria-colindex="6" data-label="จำนวนผู้เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.current_participants} / ${activity.max_participants}
                    </td>
                    <td aria-colindex="7" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">

                `;
                tbody.appendChild(row);

        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear() + 543; // Convert to Buddhist year
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[date.getMonth()];
            const day = date.getDate();
            return `<span class="day-part">${day}</span> <span class="month-year-part">${month}</span> <span class="month-year-part">${year}</span>`;
        }

        function sortTable(column, type) {
            const order = sortOrder[column] === 'asc' ? 'desc' : 'asc';
            sortOrder[column] = order;

            const sortedActivities = [...activities].sort((a, b) => {
                if (type === 'string') {
                    return order === 'asc' ? a[column].localeCompare(b[column]) : b[column].localeCompare(a[column]);
                } else if (type === 'date') {
                    return order === 'asc' ? new Date(a[column]) - new Date(b[column]) : new Date(b[column]) - new Date(a[column]);
                }
            });
            renderTable(sortedActivities);
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
        
                    if (response.ok) {
                        const userData = await response.json();
                        localStorage.setItem('user_id', userData.user.userId);
                        localStorage.setItem('user_name', userData.user.name);
                        updateSidebar(true);
        
                        // ✅ Only fetch history for this page (not created activities)
                        fetchActivityHistory();
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'log-in.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'log-in.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'log-in.html';
                }
            }
        }
        
        let allOngoingActivities = [];

        async function fetchActivityHistory(role = '') {
            const userId = localStorage.getItem('user_id');
            if (!userId) {
                alert('User ID not found. Please log in again.');
                return;
            }
        
            try {
                const response = await fetch(`http://localhost:3000/api/user/activities/ongoing/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
        
                if (!response.ok) {
                    throw new Error('Failed to fetch ongoing activities');
                }
        
                const data = await response.json();
                allOngoingActivities = data.activities;
                filterActivityHistory(role);
            } catch (error) {
                console.error('Error fetching ongoing activity:', error);
                alert('Error fetching ongoing activity. Please try again.');
            }
        }
        
        function filterActivityHistory(role) {
            let filtered = allOngoingActivities;
        
            if (role === 'requester') {
                filtered = allOngoingActivities.filter(act => act.role === 'requester');
            } else if (role === 'provider') {
                filtered = allOngoingActivities.filter(act => act.role === 'provider');
            }
        
            // Set back to allOngoingActivities for filtering
            searchActivities(); // Re-run filters
        }
        
        
        

        function renderActivityOngoing(activities) {
            const historyTbody = document.getElementById('history-tbody');
            historyTbody.innerHTML = '';
        
            if (activities.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="7" class="text-center py-4 text-gray-500">
                        ไม่มีข้อมูลกิจกรรมที่กำลังจะเริ่ม
                    </td>
                `;
                historyTbody.appendChild(emptyRow);
                return;
            }
        
            activities.forEach((activity, index) => {
                const row = document.createElement('tr');
                row.id = `history-row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
        
                // 👇 Determine which page to link to
                const detailPage = activity.role === 'requester'
                    ? 'myactivity-details.html'
                    : 'activity-details.html';
        
                row.innerHTML = `
                    <td aria-colindex="1" data-label="กิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.title}
                    </td>
                    <td aria-colindex="2" data-label="วันที่สร้างกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.created_at)}

                    <td aria-colindex="3" data-label="วันที่เริ่มกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.start_date)}

                    <td aria-colindex="4" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded bg-blue-500 text-white">${activity.status}</span>
                    </td>
                    <td aria-colindex="5" data-label="จำนวนผู้เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.current_participants} / ${activity.max_participants}
                    </td>
                    <td aria-colindex="6" data-label="บทบาท" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.role === 'requester' ? 'ผู้สร้าง' : 'ผู้เข้าร่วม'}
                    </td>
                    <td aria-colindex="7" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <a href="${detailPage}?id=${activity.activity_id}" class="bg-blue-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline">
                            รายละเอียด
                        </a>
                    </td>
                `;
                historyTbody.appendChild(row);
            });
        }
        
        
        

        function filterActivityHistory(role) {
            let filtered = allOngoingActivities;
        
            if (role === 'requester') {
                filtered = allOngoingActivities.filter(act => act.role === 'requester');
            } else if (role === 'provider') {
                filtered = allOngoingActivities.filter(act => act.role === 'provider');
            }
        
            renderActivityOngoing(filtered);
        }
        

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchActivityHistory();
        });

                                    type="text"
                                    placeholder="ค้นหากิจกรรม..."
                                    class="w-full bg-white border border-gray-300 text-gray-800 placeholder-gray-400 rounded-xl px-5 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-200 shadow-sm text-base"
                                    oninput="searchActivities()" />
                                <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                                    <i class="fas fa-search text-gray-400"></i>
                                </div>
                            </div>
                        </div>

                        <!-- ตัวกรองเพิ่มเติม Button -->
                        <div class="relative">
                            <button onclick="toggleAdvancedFilter()"
                                class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow transition duration-200">
                                <i class="fas fa-sliders-h"></i>
                                ตัวกรองเพิ่มเติม
                            </button>

                            <!-- Dropdown box -->
                            <div id="advanced-filter"
                            class="absolute right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-xl w-[700px] p-4 z-50 hidden overflow-y-auto max-h-[600px]">
                                    
                            <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">วันที่เริ่ม</label>
                                        <input id="filter-start-date" type="date"
                                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">วันที่สิ้นสุด</label>
                                        <input id="filter-end-date" type="date"
                                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 focus:outline-none" />
                                    </div>
                                    <!-- Section: Time -->
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="mb-6">
                                            <label for="start-time" class="block text-gray-700 text-sm font-bold mb-2">เวลาเริ่มต้น</label>
                                            <div class="flex items-center bg-white border shadow border rounded w-full py-2 px-3 text-gray-700">
                                                <!-- Hour Selector -->
                                                <select id="start-hours" name="start-hours" class="text-gray-700 w-full text-center focus:outline-none">
                                                    <option value="" selected disabled>-- ชั่วโมง --</option>
                                                    <script>
                                                        for (let i = 0; i < 24; i++) {
                                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาฬิกา</option>`);
                                                        }
                                                    </script>
                                                </select>
                                                <!-- Minute Selector -->
                                                <select id="start-minutes" name="start-minutes" class="text-gray-700 w-full text-center focus:outline-none">
                                                    <option value="00" selected>00 นาที</option>
                                                    <script>
                                                        for (let i = 0; i < 60; i += 5) {
                                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาที</option>`);
                                                        }
                                                    </script>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="mb-6">
                                            <label for="end-time" class="block text-gray-700 text-sm font-bold mb-2">เวลาสิ้นสุด</label>
                                            <div class="flex items-center bg-white border shadow border rounded w-full py-2 px-3 text-gray-700">
                                                <!-- Hour Selector -->
                                                <select id="end-hours" name="end-hours" class="text-gray-700 w-full text-center focus:outline-none">
                                                    <option value="" selected disabled>-- ชั่วโมง --</option>
                                                    <script>
                                                        for (let i = 0; i < 24; i++) {
                                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาฬิกา</option>`);
                                                        }
                                                    </script>
                                                </select>
                                                <!-- Minute Selector -->
                                                <select id="end-minutes" name="end-minutes" class="text-gray-700 w-full text-center focus:outline-none">
                                                    <option value="00" selected>00 นาที</option>
                                                    <script>
                                                        for (let i = 0; i < 60; i += 5) {
                                                            document.write(`<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')} นาที</option>`);
                                                        }
                                                    </script>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="category-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกหมวดหมู่: (กรุณาเลือกหมวดหมู่ก่อนเลือกทักษะ)</label>
                                        <select id="category-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" onchange="updateSkillDropdown()">
                                            <option value="">กรุณาเลือกหมวดหมู่</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="skill-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกทักษะ:</label>
                                        <select id="skill-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" disabled>
                                            <option value="">กรุณาเลือกทักษะ</option>
                                        </select>
                                    </div>
                                    <div class="flex items-center">
                                        <input id="filter-available-slots" type="checkbox"
                                            class="mr-2 h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                                        <label for="filter-available-slots" class="text-sm font-semibold text-gray-700">แสดงเฉพาะกิจกรรมที่มีที่ว่าง</label>
                                    </div>
                                    <div class="flex justify-end">
                                        <button onclick="searchActivities(); closeAdvancedFilter()"
                                            class="mt-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                                            🔍 ค้นหา
                                        </button>
                                        <button onclick="clearFilters(); closeAdvancedFilter()"
                                            class="mt-2 ml-2 bg-gray-300 hover:bg-gray-400 text-black px-4 py-2 rounded-lg font-medium transition duration-200">
                                            ❌ ล้างตัวกรอง
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <script>
                    let skills = []
                    categories = []

                    function toggleAdvancedFilter() {
                        const filterBox = document.getElementById('advanced-filter');
                        filterBox.classList.toggle('hidden');
                    
                        // Add event listener for click outside when opening
                        if (!filterBox.classList.contains('hidden')) {
                            document.addEventListener('click', handleClickOutsideFilter);
                        } else {
                            document.removeEventListener('click', handleClickOutsideFilter);
                        }
                    }
            
                    function closeAdvancedFilter() {
                        const filterBox = document.getElementById('advanced-filter');
                        if (!filterBox.classList.contains('hidden')) {
                            filterBox.classList.add('hidden');
                            document.removeEventListener('click', handleClickOutsideFilter);
                        }
                    }
            
                    function handleClickOutsideFilter(event) {
                        const filterBox = document.getElementById('advanced-filter');
                        const button = document.querySelector('button[onclick="toggleAdvancedFilter()"]');
                    
                        // If the click target is not inside the filter or the toggle button
                        if (!filterBox.contains(event.target) && !button.contains(event.target)) {
                            closeAdvancedFilter();
                        }
                    }

                    function clearFilters() {
                        document.getElementById('search-input').value = '';
                        document.getElementById('filter-start-date').value = '';
                        document.getElementById('filter-end-date').value = '';
                        document.getElementById('start-hours').value = '';
                        document.getElementById('start-minutes').value = '00';
                        document.getElementById('end-hours').value = '';
                        document.getElementById('end-minutes').value = '00';
                        document.getElementById('category-dropdown').value = '';
                        const skillDropdown = document.getElementById('skill-dropdown');
                        skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
                        skillDropdown.disabled = true;
                        document.getElementById('filter-available-slots').checked = false;
                        searchActivities();
                    }

                    async function fetchSkillsAndCategories() {
                        try {
                            const response = await fetch('http://localhost:3000/api/user/skills', {
                                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                            });
                            const data = await response.json();
                            skills = data;
                            categories = [...new Set(skills.map(skill => skill.category))];
                            populateCategoryDropdown();
                        } catch (err) {
                            console.error('Error loading skills:', err);
                        }
                    }

                    function populateCategoryDropdown() {
                        const dropdown = document.getElementById('category-dropdown');
                        dropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>';
                        categories.forEach(cat => {
                            const opt = document.createElement('option');
                            opt.value = cat;
                            opt.textContent = cat;
                            dropdown.appendChild(opt);
                        });
                        document.getElementById('skill-dropdown').disabled = true;
                    }

                    function updateSkillDropdown() {
                        const category = document.getElementById('category-dropdown').value;
                        const skillDropdown = document.getElementById('skill-dropdown');
                        skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';
                        if (!category) {
                            skillDropdown.disabled = true;
                            return;
                        }
                        const filteredSkills = skills.filter(skill => skill.category === category);
                        filteredSkills.forEach(skill => {
                            const opt = document.createElement('option');
                            opt.value = skill.skill_id;
                            opt.textContent = skill.name;
                            skillDropdown.appendChild(opt);
                        });
                        skillDropdown.disabled = false;
                    }

                    function searchActivities() {
                        const keyword = document.getElementById('search-input').value.toLowerCase();
                        const startDate = document.getElementById('filter-start-date').value;
                        const endDate = document.getElementById('filter-end-date').value;
                        const startHours = document.getElementById('start-hours').value;
                        const startMinutes = document.getElementById('start-minutes').value;
                        const endHours = document.getElementById('end-hours').value;
                        const endMinutes = document.getElementById('end-minutes').value;
                        const skill = document.getElementById('skill-dropdown').value;
                        const availableOnly = document.getElementById('filter-available-slots').checked;
                    
                        const startTime = startHours && startMinutes ? `${startHours}:${startMinutes}` : null;
                        const endTime = endHours && endMinutes ? `${endHours}:${endMinutes}` : null;
                    
                        const filtered = allOngoingActivities.filter(a => {
                            const matchText = a.title.toLowerCase().includes(keyword) || (a.description || '').toLowerCase().includes(keyword);
                            const matchStartDate = startDate ? new Date(a.start_date) >= new Date(startDate) : true;
                            const matchEndDate = endDate ? new Date(a.end_date) <= new Date(endDate) : true;
                            const matchStartTime = startTime ? a.start_time >= startTime : true;
                            const matchEndTime = endTime ? a.end_time <= endTime : true;
                            const matchSkill = skill ? a.required_skill_id == skill : true;
                            const matchAvailable = availableOnly ? a.current_participants < a.max_participants : true;
                    
                            return matchText && matchStartDate && matchEndDate && matchStartTime && matchEndTime && matchSkill && matchAvailable;
                        });
                    
                        renderActivityOngoing(filtered);
                    }
                    

                    function populateTimeDropdowns() {
                        const hourOptions = [...Array(24).keys()].map(i => `<option value="${i.toString().padStart(2, '0')}">${i.toString().padStart(2, '0')}</option>`).join('');
                        const minuteOptions = [...Array(12).keys()].map(i => `<option value="${(i * 5).toString().padStart(2, '0')}">${(i * 5).toString().padStart(2, '0')}</option>`).join('');

                        document.getElementById('start-hours').innerHTML = '<option value="" selected disabled>-- ชั่วโมง --</option>' + hourOptions;
                        document.getElementById('end-hours').innerHTML = '<option value="" selected disabled>-- ชั่วโมง --</option>' + hourOptions;
                        document.getElementById('start-minutes').innerHTML = minuteOptions;
                        document.getElementById('end-minutes').innerHTML = minuteOptions;
                    }

                    window.addEventListener('DOMContentLoaded', () => {
                        fetchSkillsAndCategories();
                        populateTimeDropdowns();
                    });
                    </script>

                    <div class="mb-4 flex items-center justify-center">
                        <button onclick="filterActivityHistory('')" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">กิจกรรมทั้งหมด</button>
                        <button onclick="filterActivityHistory('requester')" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">ผู้สร้างกิจกรรม</button>
                        <button onclick="filterActivityHistory('provider')" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-full mx-2 shadow-lg transition duration-300 ease-in-out transform hover:scale-105">ผู้เข้าร่วมกิจกรรม</button>
                    </div>
                    <div class="overflow-x-auto">
                        <div class="table-responsive-sm">
                            <table role="table" aria-busy="false" aria-colcount="7" class="table b-table b-table-stacked-md w-full">
                                <thead role="rowgroup" class="bg-gray-100">
                                    <tr role="row">
                                        <th role="columnheader" scope="col" aria-colindex="1" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            กิจกรรม
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="2" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            วันที่สร้างกิจกรรม
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="3" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            วันที่เริ่มกิจกรรม
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="4" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            สถานะ
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="5" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            จำนวนผู้เข้าร่วม
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="6" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            บทบาท
                                        </th>
                                        <th role="columnheader" scope="col" aria-colindex="7" class="py-2 px-4 text-left text-sm font-semibold text-gray-600">
                                            การจัดการ
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="history-tbody" role="rowgroup">
                                    <!-- Activity history will be dynamically inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>

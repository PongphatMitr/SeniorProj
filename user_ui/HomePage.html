<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Homepage
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        /* Delete Confirmation Modal Styles */
        #delete-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        #delete-modal.active {
            display: flex;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">
                TIME BANK
            </h1>
            <h2 class="text-3xl font-bold mb-5">
                ธนาคารเวลา คืออะไร ?
            </h2>
            <p class="mb-10">
                เป็นรูปแบบกิจกรรม ที่ช่วยส่งเสริมให้ชุมชนดูแลซึ่งกันและกัน ด้วยการแลกเปลี่ยนทักษะ ประสบการณ์
                บริการขั้นพื้นฐาน และสามารถสะสมเวลาไว้ เสมือนเราออมเงิน
            </p>
            <div class="flex items-center mb-5">
                <h2 class="text-3xl font-bold mr-4">ข่าวสารประชาสัมพันธ์</h2>
                <a id="addAnnouncementBtn" class="bg-white text-blue-600 px-4 py-2 rounded hidden"
                    href="announcement.html">เพิ่ม</a>
            </div>
            <div class="grid grid-cols-2 gap-5" id="newsContainer">
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-lg text-center">
            <h2 class="text-3xl font-bold text-red-600 mt-6">ยืนยันการลบประกาศ</h2>
            <p class="text-gray-700 text-lg mt-4">ต้องการลบประกาศหรือไม่?</p>
            <div class="mt-6 flex justify-center">
                <button id="confirm-delete-btn"
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300 mr-4">
                    ยืนยัน
                </button>
                <button id="cancel-delete-btn"
                    class="px-6 py-3 bg-gray-600 text-white text-lg font-semibold rounded-lg hover:bg-gray-700 transition duration-300">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 homepage.js loaded and DOM ready!');

            const newsContainer = document.getElementById('newsContainer');
            const addAnnouncementBtn = document.getElementById('addAnnouncementBtn');

            let userRole = null;

            function arrayBufferToBase64(buffer) {
                if (!buffer || !buffer.length) return '';
                const binary = buffer.map((b) => String.fromCharCode(b)).join('');
                return window.btoa(binary);
            }

            // Function to check user role and show/hide add button
            function checkUserRoleAndToggleAddButton() {
                const token = localStorage.getItem('token');
                if (!token) {
                    addAnnouncementBtn.classList.add('hidden');
                    userRole = null;
                    return;
                }
                // Decode JWT token payload
                try {
                    const payloadBase64 = token.split('.')[1];
                    const payloadJson = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
                    const payload = JSON.parse(payloadJson);
                    userRole = payload.role;
                    if (userRole === 'Admin' || userRole === 'TimeBankManager') {
                        addAnnouncementBtn.classList.remove('hidden');
                    } else {
                        addAnnouncementBtn.classList.add('hidden');
                    }
                } catch (e) {
                    console.warn('⚠️ Failed to decode token payload', e);
                    addAnnouncementBtn.classList.add('hidden');
                    userRole = null;
                }
            }

            // Fetch and render announcements with detailed logging
            function fetchAnnouncements() {
                console.log('🔄 Connecting to database to fetch announcements...');

                fetch('http://localhost:3000/api/user/announcements/')
                    .then(res => {
                        console.log('📡 API Response:', res);
                        if (!res.ok) throw new Error(`❌ Failed to fetch. Status: ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        console.log('📦 Data:', data);
                        newsContainer.innerHTML = '';

                        data.forEach((announcement, index) => {
                            const newsElement = document.createElement('div');
                            newsElement.classList.add('bg-white', 'text-black', 'p-5', 'rounded-lg', 'shadow', 'relative', 'cursor-pointer');
                            newsElement.addEventListener('click', () => {
                                window.location.href = `announcement-detail.html?id=${announcement.announcement_id}`;
                            });

                            let imageUrl = 'https://placehold.co/300x200?text=No+Image';
                            if (announcement.image?.data && Array.isArray(announcement.image.data)) {
                                try {
                                    imageUrl = `data:image/jpeg;base64,${arrayBufferToBase64(announcement.image.data)}`;
                                    console.log(`🖼️ Converted image for #${index + 1}`);
                                } catch (e) {
                                    console.warn(`⚠️ Image conversion failed at #${index + 1}`, e);
                                }
                            }

                            // Determine if modify and delete buttons should be shown
                            const showButtons = (userRole === 'Admin' || userRole === 'TimeBankManager');

                            newsElement.innerHTML = `
                            ${showButtons ? `<button class="absolute top-2 right-2 bg-red-600 text-white px-2 py-1 rounded delete-btn" data-id="${announcement.announcement_id}">
                                <i class="fas fa-trash-alt"></i>
                            </button>` : ''}
                            ${showButtons ? `<button class="absolute top-2 right-14 bg-yellow-500 text-white px-2 py-1 rounded modify-btn" data-id="${announcement.announcement_id}">
                                <i class="fas fa-edit"></i>
                            </button>` : ''}
                            <img src="${imageUrl}" class="h-40 w-full object-cover mb-5 rounded" alt="Announcement image showing a community event with people exchanging skills and services in a friendly environment">
                            <p class="text-gray-500 mb-2">${new Date(announcement.date).toLocaleDateString()}</p>
                            <p class="font-bold text-lg">${announcement.title}</p>
                            <p>${announcement.description}</p>
                        `;

                            newsContainer.appendChild(newsElement);
                            console.log(`✅ Rendered #${index + 1}`);
                        });

                        if (data.length === 0) {
                            console.log('📭 No announcements in DB');
                        }

                        if (userRole === 'Admin' || userRole === 'TimeBankManager') {
                            // Add event listeners to delete buttons
                            document.querySelectorAll('.delete-btn').forEach(button => {
                                button.addEventListener('click', (e) => {
                                    e.stopPropagation(); // Prevent the click event from propagating to the parent element
                                    const announcementId = button.getAttribute('data-id');
                                    const token = localStorage.getItem('token');

                                    // Show delete confirmation modal
                                    const deleteModal = document.getElementById('delete-modal');
                                    deleteModal.classList.remove('hidden');
                                    document.getElementById('confirm-delete-btn').setAttribute('data-id', announcementId);
                                });
                            });

                            // Add event listeners to modify buttons
                            document.querySelectorAll('.modify-btn').forEach(button => {
                                button.addEventListener('click', (e) => {
                                    e.stopPropagation(); // Prevent the click event from propagating to the parent element
                                    const announcementId = button.getAttribute('data-id');
                                    window.location.href = `announcement-modify.html?id=${announcementId}`;
                                });
                            });
                        }
                    })
                    .catch(err => {
                        console.error('🚨 Error fetching announcements:', err);
                    });
            }

            checkUserRoleAndToggleAddButton();
            fetchAnnouncements();

            // Handle delete confirmation
            document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
                const announcementId = document.getElementById('confirm-delete-btn').getAttribute('data-id');
                const token = localStorage.getItem('token');

                try {
                    const response = await fetch(`http://localhost:3000/api/user/announcements/${announcementId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        alert('Announcement deleted successfully.');
                        document.getElementById('delete-modal').classList.add('hidden');
                        fetchAnnouncements(); // Refresh the announcements list
                    } else {
                        alert('Failed to delete announcement.');
                    }
                } catch (error) {
                    console.error('Error deleting announcement:', error);
                    alert('An error occurred while deleting the announcement.');
                }
            });

            // Handle delete cancellation
            document.getElementById('cancel-delete-btn').addEventListener('click', () => {
                document.getElementById('delete-modal').classList.add('hidden');
            });
        });
    </script>
    <script src="navbar.js"></script>
</body>

</html>

        let exchangeRate = null;

        async function fetchUserDetails() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
        
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
        
                const data = await response.json();
                console.log('Fetched User Data:', data); // Debugging log
        
                if (data && data.user_id) {
                    document.getElementById('requester-id').value = data.user_id;
                }
        
                // FIX: Use value instead of textContent
                if (data && data.name) {
                    document.getElementById('requester-name').value = data.name;
                } else {
                    console.error('User name not found in API response');
                    document.getElementById('requester-name').value = 'N/A';
                }
        
                document.getElementById('requester-phone').value = data.phone || 'N/A';
        
            } catch (error) {
                console.error('Error fetching user details:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้');
            }
        }

        let skills = []; // Store all skills
        let categories = []; // Store all categories
        let selectedSkills = []; // Store selected skill objects (max 3)
        
        async function fetchSkillsAndCategories() {
            try {
                const response = await fetch('http://localhost:3000/api/user/skills', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await response.json();
        
                if (Array.isArray(data)) {
                    skills = data;
                    categories = [...new Set(skills.map(skill => skill.category))]; // Extract unique categories
                    populateCategoryDropdown();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }
        
        function populateCategoryDropdown() {
            const categoryDropdown = document.getElementById('category-dropdown');
            categoryDropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>'; // Reset options
        
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryDropdown.appendChild(option);
            });
        
            // Initially disable the skill dropdown
            document.getElementById('skill-dropdown').disabled = true;
        }
        
        function updateSkillDropdown() {
            const selectedCategory = document.getElementById('category-dropdown').value;
            const skillDropdown = document.getElementById('skill-dropdown');
        
            skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>'; // Reset
        
            if (!selectedCategory) {
                skillDropdown.disabled = true;
                return;
            }
        
            const filteredSkills = skills.filter(skill => skill.category === selectedCategory);
        
            filteredSkills.forEach(skill => {
                if (!selectedSkills.some(selected => selected.skill_id === skill.skill_id)) { // Prevent duplicates
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                }
            });
        
            skillDropdown.disabled = false;
        }
        
        function addSkill() {
            const skillDropdown = document.getElementById('skill-dropdown');
            const selectedSkillId = skillDropdown.value;
        
            if (!selectedSkillId) return; // No selection
        
            // Prevent duplicate selections
            if (selectedSkills.some(skill => skill.skill_id == selectedSkillId)) {
                alert('คุณได้เลือกทักษะนี้แล้ว');
                return;
            }
        
            // Get the full skill object
            const skill = skills.find(s => s.skill_id == selectedSkillId);
            if (!skill) return;
        
            // Limit to 3 skills
            if (selectedSkills.length >= 3) {
                alert('คุณสามารถเลือกได้สูงสุด 3 ทักษะเท่านั้น');
                return;
            }
        
            // Add skill to selectedSkills list
            selectedSkills.push(skill);
            updateSelectedSkillsDisplay();
        
            // Reset skill dropdown
            skillDropdown.value = '';
        }
        
        function updateSelectedSkillsDisplay() {
            const selectedSkillsList = document.getElementById('selected-skills-list');
            selectedSkillsList.innerHTML = ''; // Clear previous list
        
            selectedSkills.forEach((skill, index) => {
                const listItem = document.createElement('li');
                listItem.className = "bg-gray-200 p-2 rounded flex justify-between items-center mb-2";
                listItem.innerHTML = `
                    <span>🛠 <strong>หมวดหมู่:</strong> ${skill.category} | <strong>ทักษะ:</strong> ${skill.name}</span>
                    <button class="text-red-600 font-bold" onclick="removeSkill(${index})">❌</button>
                `;
                selectedSkillsList.appendChild(listItem);
            });
        
            // Disable skill dropdown if 3 skills are selected
            document.getElementById('skill-dropdown').disabled = selectedSkills.length >= 3;
        }
        
        function removeSkill(index) {
            selectedSkills.splice(index, 1); // Remove skill from list
            updateSelectedSkillsDisplay(); // Refresh display
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchSkillsAndCategories();
        });
        
    
        
        
        

        async function fetchCommunityConfig() {

                exchangeRate = data.default_exchange_rate_description;
                console.log('Exchange Rate:', exchangeRate);
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function calculateTimeTokens() {
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (isNaN(maxParticipants) || maxParticipants <= 0 || !startDate || !endDate || !startTime || !endTime || !exchangeRate) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }

            const startDateTime = new Date(`${startDate}T${startTime}`);
            const endDateTime = new Date(`${endDate}T${endTime}`);
            const durationInHours = Math.max(0, (endDateTime - startDateTime) / (1000 * 60 * 60));

            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;

            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }

            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function submitActivity(event) {
            event.preventDefault();
        
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const requesterId = document.getElementById('requester-id').value;
            const requesterPhone = document.getElementById('requester-phone').value;
            const status = document.getElementById('status').value;
            const timeTokensRequired = parseFloat(document.getElementById('time-tokens-required').value);
            const timeTokensPerParticipant = parseFloat(document.getElementById('time-tokens-per-participant').value);
            
            // Get selected skills and format them as a comma-separated string
            const requiredSkills = selectedSkills.map(skill => skill.name).join(', '); 
        
            if (selectedSkills.length === 0) {
                alert('กรุณาเลือกอย่างน้อย 1 ทักษะที่ต้องการสำหรับกิจกรรม');
                return;
            }
        
            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_id: requesterId,
                requester_phone: requesterPhone,
                status,
                time_tokens_required: timeTokensRequired,
                time_tokens_per_participant: timeTokensPerParticipant,
                required_skills: JSON.stringify(selectedSkills.map(skill => skill.name)) // Store as string (comma-separated)
            };
        
            try {
                const response = await fetch('http://localhost:3000/api/user/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });
        
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Activity creation failed: ${errorData.error}`);
                }
        
                alert('สร้างกิจกรรมสำเร็จ!');
                window.location.href = 'myactivity.html';
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        }
        
        
        
        

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        updateSidebar(true);
                        fetchUserDetails();
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'log-in.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'log-in.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'log-in.html';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchUserDetails();
            fetchCommunityConfig();
            fetchSkillsAndCategories();
            
            document.getElementById('max-participants').addEventListener('input', calculateTimeTokens);
            document.getElementById('start-date').addEventListener('input', (event) => {
                updateEndDate(event.target.value);
                calculateTimeTokens();
            });
            document.getElementById('start-time').addEventListener('input', (event) => {
                adjustEndTime(event.target.value);
                calculateTimeTokens();
            });
            document.getElementById('end-time').addEventListener('input', calculateTimeTokens);
        
            setStartDateRange();
        });
        
        function setStartDateRange() {
            const now = new Date();
            const minStartDate = new Date();
            minStartDate.setDate(now.getDate() + 3); // Start date must be at least 3 days ahead
        
            const formattedMinStartDate = minStartDate.toISOString().split('T')[0];
        
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
        
            // Set the initial values and min attributes
            startDateInput.setAttribute('min', formattedMinStartDate);
            startDateInput.value = formattedMinStartDate;
            endDateInput.setAttribute('min', formattedMinStartDate);
            endDateInput.value = formattedMinStartDate;
        
            syncDates(formattedMinStartDate);
        }
        
        function syncDates(selectedDate) {
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
        
            startDateInput.value = selectedDate;
            endDateInput.value = selectedDate;
        }
        
        // Event Listeners to keep start and end dates in sync
        document.addEventListener('DOMContentLoaded', () => {
            setStartDateRange();
        
            document.getElementById('start-date').addEventListener('input', (event) => {
                syncDates(event.target.value);
            });
        
            document.getElementById('end-date').addEventListener('input', (event) => {
                syncDates(event.target.value);
            });
        });
        
        
        
        function adjustEndTime(startTime) {
            if (!startTime) return;
            
            let [hours, minutes] = startTime.split(":").map(Number);
            hours += 1; // Add 1 hour
            if (hours >= 24) hours = 0; // Handle 24-hour format overflow
            
            const endTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            document.getElementById('end-time').value = endTime;
        }

                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
            <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
                <h1 class="text-4xl font-bold mb-5">สร้างกิจกรรม</h1>
                <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">รายละเอียดกิจกรรม</h2>
                    <form onsubmit="submitActivity(event)">
                        
                        <!-- Section: Requester Information -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">ชื่อผู้ขอ</label>
                                <input id="requester-name" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-100" placeholder="ระบุชื่อผู้ขอ" readonly />
                                <input id="requester-id" type="hidden" />
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-phone">เบอร์โทรศัพท์</label>
                                <input id="requester-phone" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-100" placeholder="ระบุเบอร์โทรศัพท์" readonly />
                            </div>
                        </div>
                        <hr class="my-8 border-gray-200">
                
                        <!-- Section: Activity Details -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">ชื่อกิจกรรม</label>
                            <input id="title" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" placeholder="ระบุชื่อกิจกรรม" required />
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="description">รายละเอียด</label>
                            <textarea id="description" class="shadow border rounded w-full py-2 px-3 text-gray-700" placeholder="ระบุรายละเอียดกิจกรรม" required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="location">สถานที่</label>
                            <input id="location" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" placeholder="ระบุสถานที่จัดกิจกรรม" required />
                        </div>

                        <!-- Section: Skill Selection -->
                        <hr class="my-8 border-gray-200">

                        <!-- Title -->
                        <div class="text-center">
                            <h1 class="text-2xl font-bold text-blue-700 mb-4">เลือกทักษะที่ต้องการ</h1>
                        </div>

                        <!-- Skill Selection Details -->
                        <div class="bg-gray-100 p-6 rounded-lg shadow-md">
                            <div class="mb-4">
                                <label for="category-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกหมวดหมู่:</label>
                                <select id="category-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" onchange="updateSkillDropdown()">
                                    <option value="">กรุณาเลือกหมวดหมู่</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="skill-dropdown" class="block text-gray-700 text-sm font-bold mb-2">เลือกทักษะ (เลือกได้สูงสุด 3 ทักษะ):</label>
                                <select id="skill-dropdown" class="shadow border rounded w-full py-2 px-3 text-gray-700" disabled onchange="addSkill()">
                                    <option value="">กรุณาเลือกทักษะ</option>
                                </select>
                            </div>

                            <!-- Selected Skills Display -->
                            <div id="selected-skills-container" class="mt-4 bg-white p-4 rounded-lg shadow-sm">
                                <h3 class="text-lg font-semibold text-blue-700">ทักษะที่เลือก:</h3>
                                <ul id="selected-skills-list" class="mt-2 list-disc list-inside text-gray-700"></ul>
                            </div>
                        </div>

                        <hr class="my-8 border-gray-200">

                        <!-- Section: Date & Time -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="start-date">วันที่เริ่มต้น</label>
                                <input id="start-date" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="date" required />
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="start-time">เวลาเริ่มต้น</label>
                                <input id="start-time" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="time" required />
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="end-date">วันที่สิ้นสุด</label>
                                <input id="end-date" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="date" required />
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="end-time">เวลาสิ้นสุด</label>
                                <input id="end-time" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="time" required />
                            </div>
                        </div>
                
                        <!-- Section: Participants & Status -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="max-participants">จำนวนผู้เข้าร่วมสูงสุด</label>
                                <input id="max-participants" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="number" required />
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="status">สถานะ</label>
                                <select id="status" class="shadow border rounded w-full py-2 px-3 text-gray-700" required>
                                    <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                                </select>
                            </div>
                        </div>
                
                        <!-- Section: Time Tokens -->
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-required">จำนวนโทเค็นเวลาที่ต้องการ</label>
                                <input id="time-tokens-required" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" readonly />
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-per-participant">จำนวนโทเค็นเวลาต่อผู้เข้าร่วม</label>
                                <input id="time-tokens-per-participant" class="shadow border rounded w-full py-2 px-3 text-gray-700" type="text" readonly />
                            </div>
                        </div>
                
                        <!-- Buttons -->
                        <div class="flex justify-center space-x-4">
                            <button onclick="window.history.back();" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                                ย้อนกลับ
                            </button>
                            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">
                                สร้างกิจกรรม
                            </button>
                        </div>
                    </form>
                </div>                
            </div>
    </div>  
</body>

</html>

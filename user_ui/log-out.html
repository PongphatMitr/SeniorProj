<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ออกจากระบบ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex items-center justify-center bg-blue-700">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
                <h1 class="text-4xl font-bold text-center text-blue-900 mb-8">โปรไฟล์</h1>
                <div id="profileInfo" class="text-center">
                    <!-- Profile information will be dynamically inserted here -->
                </div>
                <div class="flex items-center justify-center mt-6">
                    <button
                        class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'log-in.html';
                return;
            }

            // Fetch user profile information
            fetch('http://localhost:3000/api/user/auth/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const profileInfo = document.getElementById('profileInfo');
                    profileInfo.innerHTML = `
                        <p class="text-gray-700 text-lg"><strong>Username:</strong> ${data.username}</p>
                        <p class="text-gray-700 text-lg"><strong>Email:</strong> ${data.email}</p>
                        <p class="text-gray-700 text-lg"><strong>Role:</strong> ${data.role}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                    logout();
                });
        });

        function logout() {
            localStorage.removeItem('token');
        }
    </script>

    <!-- Logout Confirmation Modal -->
<div id="confirm-logout-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-xl text-center transform scale-95 transition-transform duration-300">
        <h2 class="text-3xl font-bold text-gray-900">ยืนยันการออกจากระบบ</h2>
        <p class="text-gray-700 text-lg mt-4">คุณแน่ใจหรือไม่ว่าต้องการออกจากระบบ?</p>
        <div class="flex justify-center mt-6 space-x-4">
            <button id="confirm-logout-btn" class="bg-red-600 text-white text-lg px-6 py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-300">
                ตกลง
            </button>
            <button id="cancel-logout-btn" class="bg-gray-400 text-white text-lg px-6 py-3 rounded-lg font-semibold hover:bg-gray-500 transition duration-300">
                ยกเลิก
            </button>
        </div>
    </div>
</div>

<!-- Success Logout Modal -->
<div id="logout-success-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300">
    <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center transform scale-95 transition-transform duration-300">
        <div class="flex justify-center">
            <div class="w-24 h-24 flex items-center justify-center rounded-full bg-green-100 border-4 border-green-500 animate-bounce">
                <svg class="w-16 h-16 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>
        <h2 class="text-4xl font-bold text-green-600 mt-6">ออกจากระบบสำเร็จ!</h2>
        <p class="text-gray-700 text-xl mt-4">ระบบกำลังนำทางไปยังหน้าเข้าสู่ระบบ...</p>
        <button id="confirm-redirect-btn" class="mt-8 px-8 py-4 bg-blue-600 text-white text-xl font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
            ตกลง
        </button>
    </div>
</div>

<script>
    document.querySelector("button[onclick='logout()']").addEventListener('click', function() {
        const modal = document.getElementById('confirm-logout-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
    });

    document.getElementById('cancel-logout-btn').addEventListener('click', function() {
        const modal = document.getElementById('confirm-logout-modal');
        modal.classList.remove('opacity-100', 'scale-100');
        setTimeout(() => modal.classList.add('hidden'), 100);
    });

    document.getElementById('confirm-logout-btn').addEventListener('click', function() {
        const confirmModal = document.getElementById('confirm-logout-modal');
        confirmModal.classList.remove('opacity-100', 'scale-100');
        setTimeout(() => confirmModal.classList.add('hidden'), 100);

        // ลบ Token และแสดง Modal ออกจากระบบสำเร็จ
        localStorage.removeItem('token');

        const successModal = document.getElementById('logout-success-modal');
        successModal.classList.remove('hidden');
        setTimeout(() => successModal.classList.add('opacity-100', 'scale-100'), 50);

        // ตั้งเวลาให้ redirect อัตโนมัติใน 5 วินาที
        const redirectTimeout = setTimeout(() => {
            navigateToLogin();
        }, 5000);

        // ให้ผู้ใช้กดปุ่มเพื่อนำทางทันที
        document.getElementById('confirm-redirect-btn').addEventListener('click', function () {
            clearTimeout(redirectTimeout);
            navigateToLogin();
        });
    });

    function navigateToLogin() {
        window.location.href = 'log-in.html';
    }
</script>
<script src="navbar.js"></script>

</body>

</html>

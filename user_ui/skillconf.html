<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ความสามารถ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <script src="navbar.js"></script>

    <script>
        let memberId;
        let skills = [];
        let memberSkills = [];

        async function fetchMemberId() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data && data.user_id) {
                    memberId = data.user_id;
                    fetchSkills();
                } else {
                    alert('ไม่พบรหัสสมาชิก');
                    throw new Error('No memberId found in the profile response');
                }
            } catch (error) {
                console.error('Error fetching member ID:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลรหัสสมาชิก');
            }
        }

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/user/skills', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    fetchMemberSkills();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        async function fetchMemberSkills() {
            try {
                const response = await fetch(`http://localhost:3000/api/user/members/${memberId}/skills`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();

                if (data.skills && Array.isArray(data.skills)) {
                    // Convert API response into expected structure
                    memberSkills = data.skills.map(skill => ({
                        skill_id: skill.skill_id || null,
                        name: skill.name || 'N/A',
                        category: skill.category || 'N/A'
                    }));

                    renderSkills();
                    populateCategoryDropdowns();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะของสมาชิก');
                }
            } catch (error) {
                console.error('Error fetching member skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะของสมาชิก');
            }
        }


        function renderSkills() {
            const skillContainer1 = document.getElementById('skill-display-1');
            const skillContainer2 = document.getElementById('skill-display-2');
            const skillContainer3 = document.getElementById('skill-display-3');

            if (!skillContainer1 || !skillContainer2 || !skillContainer3) {
                console.error("Error: 'skills-display' elements not found.");
                return;
            }

            skillContainer1.innerHTML = `
            <div>
                <h3 class="text-xl font-semibold text-gray-700">หมวดหมู่: 
                    <span class="text-2xl font-bold text-blue-600">${memberSkills[0]?.category || 'ไม่ระบุหมวดหมู่'}</span>
                </h3>
                <h3 class="text-xl font-semibold text-gray-700 mt-1">ทักษะ: 
                    <span class="text-2xl font-bold text-green-600">${memberSkills[0]?.name || 'ยังไม่มีทักษะที่ลงทะเบียน'}</span>
                </h3>
                <div class="flex justify-center mt-3">
                    <button class="bg-blue-500 text-white px-4 py-2 rounded transition duration-300 hover:bg-blue-600 hover:scale-105" onclick="toggleEdit(1)">แก้ไข</button>
                </div>
            </div>
        `;

            skillContainer2.innerHTML = `
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">หมวดหมู่: 
                        <span class="text-2xl font-bold text-blue-600">${memberSkills[1]?.category || 'ไม่ระบุหมวดหมู่'}</span>
                    </h3>
                    <h3 class="text-xl font-semibold text-gray-700 mt-1">ทักษะ: 
                        <span class="text-2xl font-bold text-green-600">${memberSkills[1]?.name || 'ยังไม่มีทักษะที่ลงทะเบียน'}</span>
                    </h3>
                    <div class="flex justify-center mt-3">
                        <button class="bg-blue-500 text-white px-4 py-2 rounded transition duration-300 hover:bg-blue-600 hover:scale-105" onclick="toggleEdit(2)">แก้ไข</button>
                    </div>
                </div>
            `;

            skillContainer3.innerHTML = `
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">หมวดหมู่: 
                        <span class="text-2xl font-bold text-blue-600">${memberSkills[2]?.category || 'ไม่ระบุหมวดหมู่'}</span>
                    </h3>
                    <h3 class="text-xl font-semibold text-gray-700 mt-1">ทักษะ: 
                        <span class="text-2xl font-bold text-green-600">${memberSkills[2]?.name || 'ยังไม่มีทักษะที่ลงทะเบียน'}</span>
                    </h3>
                    <div class="flex justify-center mt-3">
                        <button class="bg-blue-500 text-white px-4 py-2 rounded transition duration-300 hover:bg-blue-600 hover:scale-105" onclick="toggleEdit(3)">แก้ไข</button>
                    </div>
                </div>
            `;

        }



        function populateSkillDropdown(index) {
            const dropdown = document.getElementById(`skill-dropdown-${index}`);
            dropdown.innerHTML = ''; // Clear existing options

            // Add the "ไม่ลงทะเบียนทักษะ" option
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "ไม่ลงทะเบียนทักษะ";
            dropdown.appendChild(defaultOption);

            // Get all selected skill IDs (excluding current slot)
            const selectedSkillIds = memberSkills.map((skill, i) => i + 1 !== index ? skill.skill_id : null).filter(id => id);

            skills.forEach(skill => {
                if (!selectedSkillIds.includes(skill.skill_id) || memberSkills[index - 1]?.skill_id === skill.skill_id) {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    dropdown.appendChild(option);
                }
            });

            // Set current selection
            dropdown.value = memberSkills[index - 1]?.skill_id || '';
        }


        function filterSkillsByCategory(event) {
            const selectedCategory = event.target.value;
            const skillDropdownId = event.target.id.replace('category-dropdown', 'skill-dropdown');
            const skillDropdown = document.getElementById(skillDropdownId);

            // Clear previous options
            skillDropdown.innerHTML = '<option value="">กรุณาเลือกทักษะ</option>';

            if (!selectedCategory || selectedCategory === "all") {
                return; // Don't populate skills if no category is selected
            }

            // Get currently registered skill IDs
            const registeredSkillIds = memberSkills.map(skill => skill.skill_id).filter(id => id !== null && id !== undefined);

            // Filter skills based on the selected category and remove already registered skills
            const filteredSkills = skills.filter(skill => skill.category === selectedCategory && !registeredSkillIds.includes(skill.skill_id));

            filteredSkills.forEach(skill => {
                const option = document.createElement('option');
                option.value = skill.skill_id;
                option.textContent = skill.name;
                skillDropdown.appendChild(option);
            });

            // Ensure users must select a category before choosing a skill
            skillDropdown.disabled = filteredSkills.length === 0;
        }


        function populateCategoryDropdowns() {
            if (!skills || skills.length === 0) {
                console.error("No skills data available to populate categories.");
                return;
            }

            const categories = [...new Set(skills.map(skill => skill.category))];
            const categoryDropdowns = document.querySelectorAll('[id^="category-dropdown"]');

            categoryDropdowns.forEach(dropdown => {
                dropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่</option>'; // Default option
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    dropdown.appendChild(option);
                });
            });

            // Ensure skill dropdowns are empty and disabled initially
            document.querySelectorAll('[id^="skill-dropdown"]').forEach(dropdown => {
                dropdown.innerHTML = '<option value="">กรุณาเลือกหมวดหมู่ก่อน</option>';
                dropdown.disabled = true;
            });
        }

        async function searchSkills(event, index) {
            const searchTerm = event.target.value.toLowerCase();
            const suggestionsContainer = document.getElementById(`suggestions-${index}`);

            // Clear previous suggestions
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.classList.add('hidden');

            if (!searchTerm.trim()) {
                return; // Do nothing if search term is empty
            }

            try {
                const response = await fetch(`http://localhost:3000/api/user/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                const data = await response.json();

                if (!Array.isArray(data)) {
                    console.error('Expected an array but got:', data);
                    showErrorMessage('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                    return;
                }

                // Get already registered skills to prevent duplicates
                const registeredSkillIds = memberSkills.map(skill => skill.skill_id).filter(id => id !== null);

                // Filter out already selected skills
                const filteredSkills = data.filter(skill => !registeredSkillIds.includes(skill.skill_id));

                // Populate suggestions container with search results
                filteredSkills.forEach(skill => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.className = 'px-4 py-2 cursor-pointer hover:bg-gray-200';
                    suggestionItem.textContent = `${skill.name} (${skill.category})`;
                    suggestionItem.onclick = () => selectSkill(skill, index);
                    suggestionsContainer.appendChild(suggestionItem);
                });

                // Show suggestions container if skills are found
                if (filteredSkills.length > 0) {
                    suggestionsContainer.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error searching skills:', error);
                showErrorMessage('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

        function selectSkill(skill, index) {
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
            const suggestionsContainer = document.getElementById(`suggestions-${index}`);

            // Set the selected skill and category
            skillDropdown.innerHTML = `<option value="${skill.skill_id}">${skill.name}</option>`;
            categoryDropdown.innerHTML = `<option value="${skill.category}">${skill.category}</option>`;

            // Hide suggestions container
            suggestionsContainer.classList.add('hidden');
        }

        function toggleEdit(index) {
            const displaySection = document.getElementById(`skill-display-${index}`);
            const editSection = document.getElementById(`edit-container-${index}`);
        
            displaySection.classList.add('hidden');
            editSection.classList.remove('hidden');
        
            originalSkills[index] = { ...memberSkills[index - 1] };
        
            populateSkillDropdown(index);
        }
        


        // Removed inline updateSidebar function

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
    
                    if (response.ok) {
                        console.log('✅ Login verified');
                        fetchMemberId(); // ⬅️ Trigger skill fetch
                    } else {
                        console.warn('⚠️ Invalid token - logging out');
                        localStorage.removeItem('token');
                        window.location.href = 'login.html'; // Redirect if needed
                    }
                } catch (error) {
                    console.error('❌ Token verification failed:', error);
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            } else {
                console.warn('⚠️ No token found - redirecting to login');
                window.location.href = 'login.html';
            }
        }
    
        // ✅ Automatically call checkLoginStatus when page loads
        window.onload = checkLoginStatus;

    </script>
</head>

                    <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center">
                        <h2 class="text-4xl font-bold text-green-600 mt-6">✅ สำเร็จ!</h2>
                        <p id="success-message" class="text-gray-700 text-xl mt-4"></p>
                        <button id="confirm-success-btn"
                            class="mt-8 px-8 py-4 bg-blue-600 text-white text-xl font-semibold rounded-lg hover:bg-blue-700 transition">ตกลง</button>
                    </div>
                </div>

                <!-- Error Modal -->
                <div id="error-modal"
                    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
                    <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center">
                        <h2 class="text-4xl font-bold text-red-600 mt-6">❌ เกิดข้อผิดพลาด</h2>
                        <p id="error-message" class="text-gray-700 text-xl mt-4"></p>
                        <button id="confirm-error-btn"
                            class="mt-8 px-8 py-4 bg-red-600 text-white text-xl font-semibold rounded-lg hover:bg-red-700 transition">ตกลง</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

        let originalSkills = []; // Store original skills before editing

        function toggleEdit(index) {
            const displaySection = document.getElementById(`skill-display-${index}`);
            const editSection = document.getElementById(`edit-container-${index}`);

            displaySection.classList.add('hidden'); // Hide display
            editSection.classList.remove('hidden'); // Show dropdown

            // Store original skill data before making changes
            originalSkills[index] = { ...memberSkills[index - 1] };

            populateSkillDropdown(index);
        }

        function cancelEdit(index) {
            document.getElementById(`skill-display-${index}`).classList.remove('hidden'); // Show display
            document.getElementById(`edit-container-${index}`).classList.add('hidden'); // Hide dropdown

            // Restore original skill data on cancel
            memberSkills[index - 1] = { ...originalSkills[index] };
            renderSkills(); // Re-render with original skill
        }

        function clearSkill(index) {
            // Clear only the selection, without changing stored data
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);

            if (skillDropdown) skillDropdown.value = ""; // Clear skill dropdown
            if (categoryDropdown) categoryDropdown.value = ""; // Clear category dropdown
        }


        function showSuccessMessage(message, redirectUrl = null) {
            document.getElementById('success-message').textContent = message;
            const modal = document.getElementById('success-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        
            // Auto-close the modal after 3 seconds and navigate if needed
            setTimeout(() => {
                closeModal('success-modal');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 3000);
        }
        
        function showErrorMessage(message, redirectUrl = null) {
            document.getElementById('error-message').textContent = message;
            const modal = document.getElementById('error-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        
            // Auto-close the modal after 3 seconds and navigate if needed
            setTimeout(() => {
                closeModal('error-modal');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 3000);
        }
        
        function confirmAction(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        
            // Confirm action
            document.getElementById('confirm-btn').onclick = function () {
                closeModal('confirm-modal');
                onConfirm();
            };
        
            // Cancel action
            document.getElementById('cancel-btn').onclick = function () {
                closeModal('confirm-modal');
            };
        }
        
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('opacity-100', 'scale-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        
        // Hook up modals close button
        document.getElementById('confirm-success-btn').addEventListener('click', function () {
            closeModal('success-modal');
        });
        
        document.getElementById('confirm-error-btn').addEventListener('click', function () {
            closeModal('error-modal');
        });
        
        // Updated saveSkill function with confirmation and error handling
        async function saveSkill(index) {
            const dropdown = document.getElementById(`skill-dropdown-${index}`);
            const selectedSkillId = dropdown.value || null; // ✅ Ensure null values are handled
        
            confirmAction("คุณต้องการบันทึกการเปลี่ยนแปลงหรือไม่?", async function () {
                const payload = {
                    skill_1: memberSkills[0]?.skill_id || null,
                    skill_2: memberSkills[1]?.skill_id || null,
                    skill_3: memberSkills[2]?.skill_id || null,
                };
        
                payload[`skill_${index}`] = selectedSkillId; // ✅ Allow empty skills
        
                try {
                    const response = await fetch(`http://localhost:3000/api/user/members/${memberId}/skills`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(payload)
                    });
        
                    const responseData = await response.json();
        
                    if (response.ok) {
                        await fetchMemberSkills();
                        renderSkills();
                        cancelEdit(index);
                        showSuccessMessage(`✅ บันทึกทักษะที่ ${index} สำเร็จ!`, "skillconf.html");
                    } else {
                        showErrorMessage(responseData.error || '❌ เกิดข้อผิดพลาดในการบันทึกทักษะ');
                    }
                } catch (error) {
                    showErrorMessage('❌ เกิดข้อผิดพลาดในการบันทึกทักษะ');
                }
            });
        }
        
        function clearSkill(index) {
            // Reset the skill dropdown and category dropdown for the specific skill index
            const skillDropdown = document.getElementById(`skill-dropdown-${index}`);
            const categoryDropdown = document.getElementById(`category-dropdown-${index}`);
    
            if (skillDropdown) {
                skillDropdown.value = ""; // Clear selection
            }
            if (categoryDropdown) {
                categoryDropdown.value = ""; // Reset category
            }
    
            // Update memberSkills array to reflect that the skill is cleared
            memberSkills[index - 1] = { skill_id: null, name: "ไม่ลงทะเบียนทักษะ", category: "ไม่ระบุหมวดหมู่" };
    
            // Re-render the skill display with updated data
            renderSkills();
        }

    </script>
</body>

</html>

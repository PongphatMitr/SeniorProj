        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold mb-5">เพิ่มทักษะใหม่</h1>
            <div class="bg-white text-black p-5 rounded-lg">
                <form onsubmit="createSkill(event)">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="skillName">ชื่อทักษะ</label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="skillName" placeholder="ชื่อทักษะ" required type="text" />
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="categorySelect">หมวดหมู่</label>
                        <div class="flex items-center">
                            <select
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                id="categorySelect" required>
                                <option value="">กำลังโหลดหมวดหมู่...</option>
                            </select>
                            <button
                                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 ml-2 whitespace-nowrap rounded focus:outline-none focus:shadow-outline"
                                onclick="addCategory()" type="button">เพิ่มหมวดหมู่</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            onclick="window.history.back()" type="button">ย้อนกลับ</button>
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                            type="submit">บันทึก</button>
                    </div>
                </form>
            </div>
        
            <!-- Skills List -->
            <div class="bg-white text-black p-5 rounded-lg mt-10">
                <h2 class="text-2xl font-bold mb-4">ทักษะตามหมวดหมู่</h2>
                <div id="skillsByCategory" class="space-y-4">
                    <p>กำลังโหลดทักษะ...</p>
                </div>
            </div>
        </div>
        </div>
        
        <script>
            let categories = [];

            async function fetchCategories() {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/skills/categories', {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (!response.ok) throw new Error('Failed to fetch categories');

                    categories = await response.json();
                    const select = document.getElementById('categorySelect');
                    select.innerHTML = '';

                    if (categories.length > 0) {
                        categories.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category.category_id;
                            option.textContent = category.category;
                            select.appendChild(option);
                        });
                    } else {
                        select.innerHTML = '<option value="">ไม่พบหมวดหมู่</option>';
                    }
                } catch (error) {
                    console.error('Error fetching categories:', error);
                    document.getElementById('categorySelect').innerHTML = '<option value="">ไม่สามารถโหลดหมวดหมู่ได้</option>';
                }
            }

            async function fetchSkills() {
                try {
                    const response = await fetch('http://localhost:3000/api/tbm/skills', {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });

                    if (!response.ok) throw new Error('Failed to fetch skills');

                    const skills = await response.json();
                    renderSkillsByCategory(skills);
                } catch (error) {
                    console.error('Error fetching skills:', error);
                    document.getElementById('skillsByCategory').innerHTML = '<p>ไม่สามารถโหลดทักษะได้</p>';
                }
            }

            function renderSkillsByCategory(skills) {
                const skillsByCategory = document.getElementById('skillsByCategory');
                skillsByCategory.innerHTML = '';

                categories.forEach(category => {
                    const categorySkills = skills.filter(skill => skill.category_id === category.category_id);

                    if (categorySkills.length > 0) {
                        const categoryDiv = document.createElement('div');
                        categoryDiv.classList.add('p-4', 'border', 'rounded', 'bg-gray-100');

                        categoryDiv.innerHTML = `
                                <h3 class="text-lg font-bold mb-2">${category.category}</h3>
                                <ul class="list-disc ml-5 space-y-1">
                                    ${categorySkills.map(skill => `<li>${skill.name}</li>`).join('')}
                                </ul>
                            `;

                        skillsByCategory.appendChild(categoryDiv);
                    }
                });
            }

            async function addCategory() {
                const newCategory = prompt("กรุณาใส่ชื่อหมวดหมู่ใหม่:");
                if (newCategory) {
                    try {
                        const response = await fetch('http://localhost:3000/api/tbm/skills/categories', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('token')}`
                            },
                            body: JSON.stringify({ category: newCategory })
                        });

                        if (response.ok) {
                            await fetchCategories();
                        } else {
                            alert('เกิดข้อผิดพลาดในการเพิ่มหมวดหมู่');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('เกิดข้อผิดพลาดในการเพิ่มหมวดหมู่');
                    }
                }
            }

            async function createSkill(event) {
                event.preventDefault();
                const skillName = document.getElementById('skillName').value;
                const category_id = document.getElementById('categorySelect').value;

                const skillPayload = {
                    name: skillName,
                    category_id: parseInt(category_id)
                };

                try {
                    const response = await fetch('http://localhost:3000/api/tbm/skills', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify(skillPayload)
                    });

                    if (response.ok) {
                        alert('ทักษะถูกเพิ่มเรียบร้อยแล้ว');
                        document.getElementById('skillName').value = '';
                        document.getElementById('categorySelect').selectedIndex = 0;
                        await fetchSkills();  // Refresh skills list
                    } else {
                        alert('เกิดข้อผิดพลาดในการเพิ่มทักษะ');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('เกิดข้อผิดพลาดในการเพิ่มทักษะ');
                }
            }

            document.addEventListener('DOMContentLoaded', async () => {
                await fetchCategories();
                await fetchSkills();
            });
        </script>
        </body>

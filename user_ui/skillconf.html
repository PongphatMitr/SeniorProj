<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ความสามารถ - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script>
        let memberId = new URLSearchParams(window.location.search).get('memberId');
        if (!memberId) {
            alert('ไม่พบรหัสสมาชิกใน URL');
            throw new Error('No memberId provided in the URL');
        }

        let skills = [];

        async function fetchSkills() {
            try {
                const response = await fetch(`http://localhost:3000/api/skills`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    skills = data;
                    renderSkills(skills);
                    renderCategoryButtons();
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
                }
            } catch (error) {
                console.error('Error fetching skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะ');
            }
        }

        async function fetchMemberSkills() {
            try {
                const response = await fetch(`http://localhost:3000/api/members/${memberId}/skills`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const memberSkills = await response.json();
                return memberSkills.skills.map(skill => skill.skill_id);
            } catch (error) {
                console.error('Error fetching member skills:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลทักษะของสมาชิก');
                return [];
            }
        }

        async function renderSkills(data) {
            const memberSkills = await fetchMemberSkills();
            const skillContainer = document.getElementById('skill-container');
            skillContainer.innerHTML = '';
            const categories = [...new Set(data.map(skill => skill.category))];

            function renderCategoryTree(categories, parentElement) {
                if (categories.length === 0) return;

                const midIndex = Math.floor(categories.length / 2);
                const leftCategories = categories.slice(0, midIndex);
                const rightCategories = categories.slice(midIndex + 1);
                const currentCategory = categories[midIndex];

                const categoryDiv = document.createElement('div');
                categoryDiv.className = `bg-gray-100 p-6 rounded-lg category category-${currentCategory} w-3/4 mx-auto mb-5`;
                categoryDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold category-name">${currentCategory}</h3>
                    </div>
                `;

                data.filter(skill => skill.category === currentCategory).forEach(skill => {
                    const skillP = document.createElement('p');
                    skillP.className = 'mb-2';
                    skillP.innerHTML = `
                        <label class="inline-flex items-center">
                            <input type="checkbox" class="form-checkbox" value="${skill.skill_id}" ${memberSkills.includes(skill.skill_id) ? 'checked' : ''}>
                            <span class="ml-2">${skill.name}</span>
                        </label>
                    `;
                    categoryDiv.appendChild(skillP);
                });

                parentElement.appendChild(categoryDiv);

                const leftDiv = document.createElement('div');
                leftDiv.className = 'w-full';
                parentElement.appendChild(leftDiv);
                renderCategoryTree(leftCategories, leftDiv);

                const rightDiv = document.createElement('div');
                rightDiv.className = 'w-full';
                parentElement.appendChild(rightDiv);
                renderCategoryTree(rightCategories, rightDiv);
            }

            renderCategoryTree(categories, skillContainer);
        }

        function renderCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('category-buttons');
            categoryButtonsContainer.innerHTML = '';

            const categories = [...new Set(skills.map(skill => skill.category))];

            const allButton = document.createElement('button');
            allButton.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
            allButton.textContent = 'All';
            allButton.onclick = () => showCategory('all');
            categoryButtonsContainer.appendChild(allButton);

            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mx-1 rounded focus:outline-none focus:shadow-outline';
                button.textContent = category;
                button.onclick = () => showCategory(category);
                categoryButtonsContainer.appendChild(button);
            });
        }

        function showCategory(category) {
            if (category === 'all') {
                renderSkills(skills);
            } else {
                const filteredSkills = skills.filter(skill => skill.category === category);
                renderSkills(filteredSkills);
            }
        }

        async function saveSkills() {
            const checkboxes = document.querySelectorAll('#skill-container input[type="checkbox"]');
            const selectedSkills = Array.from(checkboxes).filter(checkbox => checkbox.checked).map(checkbox => checkbox.value);

            try {
                const response = await fetch(`http://localhost:3000/api/members/${memberId}/skills`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ skills: selectedSkills })
                });

                if (response.ok) {
                    alert('บันทึกทักษะสำเร็จ');
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกทักษะ');
                }
            } catch (error) {
                console.error('Error saving skills:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกทักษะ');
            }
        }

        async function searchSkills() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            try {
                const response = await fetch(`http://localhost:3000/api/skills/search?term=${encodeURIComponent(searchTerm)}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (Array.isArray(data)) {
                    renderSkills(data);
                } else {
                    console.error('Expected an array but got:', data);
                    alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
                }
            } catch (error) {
                console.error('Error searching skills:', error);
                alert('เกิดข้อผิดพลาดในการค้นหาทักษะ');
            }
        }

                    });
        
                    if (!response.ok) {

                    const member = await response.json(); // Adjust based on your backend response

                            </a>

                        </li>

                                href="balance.html">

                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="history.html">
                                <i class="fas fa-history mr-3"></i>
                                ประวัติ
                            </a>
                        </li>
                        <li class="mb-5">
                            <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                                href="contact.html">
                                <i class="fas fa-phone mr-3"></i>
                                ติดต่อเรา
                            </a>
                        </li>
                    `;
                } catch (error) {
                    console.error('Error fetching user details:', error);
                    alert('An error occurred while loading user data. Please log in again.');
                }
            } else {
                navList.innerHTML = `
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300"
                            href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>
                            Login
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="homepage.html">
                            <i class="fas fa-home mr-3"></i>
                            หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="service.html">
                            <i class="fas fa-clipboard-list mr-3"></i>
                            ยื่นข้อของานบริการ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="profile.html">
                            <i class="fas fa-user-edit mr-3"></i>
                            แก้ไขประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="skillconf.html">
                            <i class="fas fa-tools mr-3"></i>
                            แก้ไขทักษะ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="balance.html">
                            <i class="fas fa-wallet mr-3"></i>
                            ยอดคงเหลือ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="history.html">
                            <i class="fas fa-history mr-3"></i>
                            ประวัติ
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-200 p-2 rounded transition duration-300" 
                            href="contact.html">
                            <i class="fas fa-phone mr-3"></i>
                            ติดต่อเรา
                        </a>
                    </li>
                `;
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                }
            } else {
                updateSidebar(false);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchSkills();
        });
    </script>
</head>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ติดต่อเรา - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script src="navbar.js"></script>
    <script>
        async function fetchUserDetails() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('phone').value = data.phone || '';
            } catch (error) {
                console.error('Error fetching user details:', error);
                showMessage('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้', true);
            }
        }

        async function submitContactForm(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !phone || !subject || !message) {
                showMessage('กรุณากรอกข้อมูลให้ครบถ้วน', true);
                return;
            }

            showConfirmation('คุณต้องการส่งข้อความนี้ใช่หรือไม่?', async () => {
                try {
                    const response = await fetch('http://localhost:3000/api/user/contact', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name, email, phone, subject, message })
                    });

                    if (response.ok) {
                        showMessage('ส่งข้อความเรียบร้อยแล้ว', false);
                        // Clear only subject and message fields
                        document.getElementById('subject').value = '';
                        document.getElementById('message').value = '';
                    } else {
                        const errorData = await response.json();
                        showMessage(`เกิดข้อผิดพลาด: ${errorData.error}`, true);
                    }
                } catch (error) {
                    console.error('Error submitting contact form:', error);
                    showMessage('เกิดข้อผิดพลาดในการส่งข้อความ', true);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchUserDetails();
            document.getElementById('contactForm').addEventListener('submit', submitContactForm);
        });

        function showMessage(message, isError = false) {
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('message-title');
            const text = document.getElementById('message-text');
            const icon = document.getElementById('message-icon');
            const iconSvg = document.getElementById('message-icon-svg');
            const iconPath = document.getElementById('message-icon-path');

            text.textContent = message;
            modal.classList.remove('hidden');

            title.classList.remove('text-red-600', 'text-green-600');
            icon.classList.remove('bg-red-100', 'border-red-500', 'bg-green-100', 'border-green-500');
            iconSvg.classList.remove('text-red-500', 'text-green-500');

            if (isError) {
                title.textContent = "เกิดข้อผิดพลาด!";
                title.classList.add('text-red-600');
                icon.classList.add('bg-red-100', 'border-red-500');
                iconSvg.classList.add('text-red-500');
                iconPath.setAttribute("d", "M6 18L18 6M6 6l12 12"); // X icon
            } else {
                title.textContent = "สำเร็จ!";
                title.classList.add('text-green-600');
                icon.classList.add('bg-green-100', 'border-green-500');
                iconSvg.classList.add('text-green-500');
                iconPath.setAttribute("d", "M5 13l4 4L19 7"); // Checkmark icon
            }

            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);

            document.getElementById('confirm-message-btn').onclick = () => {
                modal.classList.add('hidden');
                modal.classList.remove('opacity-100', 'scale-100');
            };
        }

        function showConfirmation(message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const text = document.getElementById('confirm-message');

            text.textContent = message;
            modal.classList.remove('hidden');

            document.getElementById('confirm-yes-btn').onclick = () => {
                modal.classList.add('hidden');
                onConfirm(); // Execute the function if confirmed
            };

            document.getElementById('confirm-no-btn').onclick = () => {
                modal.classList.add('hidden');
            };
        }
    </script>
</head>

<body>
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold text-center mb-8">
                TIME BANK
            </h1>
            <div class="max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6">
                    ติดต่อเรา
                </h2>
                <form id="contactForm" class="space-y-4 bg-white p-6 rounded-md shadow-lg text-black">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="name">ชื่อ:</label>
                        <input id="name" class="w-full p-2 border rounded-md" type="text" readonly />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">อีเมล: <span
                                class="text-red-500">*เลือกกรอกได้</span></label>
                        <input id="email" class="w-full p-2 border rounded-md" type="email" />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">เบอร์โทร:</label>
                        <input id="phone" class="w-full p-2 border rounded-md" type="text" readonly />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="subject">หัวข้อ:</label>
                        <input id="subject" class="w-full p-2 border rounded-md" type="text" placeholder="หัวข้อเรื่อง"
                            required />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="message">ข้อความ:</label>
                        <textarea id="message" class="w-full p-2 border rounded-md h-32" placeholder="ข้อความของคุณ"
                            required></textarea>
                    </div>
                    <button
                        class="bg-blue-900 text-white hover:bg-[#0A2540] hover:text-white py-2 px-6 rounded-md border-white border-blue-900 transition duration-300 w-full"
                        type="submit">
                        ส่งข้อความ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Success & Error Message Modal -->
    <div id="message-modal"
        class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300 z-50">
        <div
            class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-2xl text-center transform scale-95 transition-transform duration-300">
            <div class="flex justify-center">
                <div id="message-icon"
                    class="w-24 h-24 flex items-center justify-center rounded-full border-4 animate-bounce">
                    <svg id="message-icon-svg" class="w-16 h-16" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path id="message-icon-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                    </svg>
                </div>
            </div>
            <h2 id="message-title" class="text-4xl font-bold mt-6"></h2>
            <p id="message-text" class="text-gray-700 text-xl mt-4"></p>
            <button id="confirm-message-btn"
                class="mt-8 px-8 py-4 bg-blue-600 text-white text-xl font-semibold rounded-lg hover:bg-blue-700 transition duration-300">
                ตกลง
            </button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal"
        class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity duration-300 z-50">
        <div
            class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-lg text-center transform scale-95 transition-transform duration-300">
            <h2 id="confirm-title" class="text-3xl font-bold text-yellow-600">ยืนยันการส่งข้อความ</h2>
            <p id="confirm-message" class="text-gray-700 text-xl mt-4"></p>
            <div class="mt-6 flex justify-center gap-4">
                <button id="confirm-yes-btn"
                    class="px-6 py-3 bg-green-600 text-white text-lg font-semibold rounded-lg hover:bg-green-700 transition duration-300">
                    ยืนยัน
                </button>
                <button id="confirm-no-btn"
                    class="px-6 py-3 bg-red-600 text-white text-lg font-semibold rounded-lg hover:bg-red-700 transition duration-300">
                    ยกเลิก
                </button>
            </div>
        </div>
    </div>
</body>

</html>

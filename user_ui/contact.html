    <script>
        async function fetchUserDetails() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                document.getElementById('name').textContent = data.name || 'N/A';
                document.getElementById('email').textContent = data.email || 'N/A';
            } catch (error) {
                console.error('Error fetching user details:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้');
            }
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        updateSidebar(true);
                        fetchUserDetails();
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'login.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'login.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'login.html';
                }
            }
        }

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ติดต่อเรา - Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <script src="navbar.js"></script>
    <script>
        async function fetchUserDetails() {
            try {
                const response = await fetch('http://localhost:3000/api/user/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('phone').value = data.phone || '';
            } catch (error) {
                console.error('Error fetching user details:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้');
            }
        }

        async function submitContactForm(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !phone || !subject || !message) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/user/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, phone, subject, message })
                });

                if (response.ok) {
                    alert('ส่งข้อความเรียบร้อยแล้ว');

                    // Clear only subject and message fields
                    document.getElementById('subject').value = '';
                    document.getElementById('message').value = '';

                } else {
                    const errorData = await response.json();
                    alert(`เกิดข้อผิดพลาด: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error submitting contact form:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อความ');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            fetchUserDetails();
            document.getElementById('contactForm').addEventListener('submit', submitContactForm);
        });

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        updateSidebar(true);
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'log-in.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'log-in.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'log-in.html';
                }
            }
        }
    </script>
</head>

<body>
    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-1/6 bg-white h-screen p-5 sticky top-0 flex flex-col">
            <nav class="flex-grow">
                <ul id="navList" class="space-y-4"></ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="w-full md:w-5/6 bg-blue-700 text-white p-10">
            <h1 class="text-4xl font-bold text-center mb-8">
                TIME BANK
            </h1>
            <div class="max-w-4xl mx-auto">
                <h2 class="text-3xl font-bold mb-6">
                    ติดต่อเรา
                </h2>
                <form id="contactForm" class="space-y-4 bg-white p-6 rounded-md shadow-lg text-black">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="name">ชื่อ:</label>
                        <input id="name" class="w-full p-2 border rounded-md" type="text" readonly />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">อีเมล: <span
                                class="text-red-500">*เลือกกรอกได้</span></label>
                        <input id="email" class="w-full p-2 border rounded-md" type="email" />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">เบอร์โทร:</label>
                        <input id="phone" class="w-full p-2 border rounded-md" type="text" readonly />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="subject">หัวข้อ:</label>
                        <input id="subject" class="w-full p-2 border rounded-md" type="text" placeholder="หัวข้อเรื่อง"
                            required />
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="message">ข้อความ:</label>
                        <textarea id="message" class="w-full p-2 border rounded-md h-32" placeholder="ข้อความของคุณ"
                            required></textarea>
                    </div>
                    <button
                        class="bg-blue-900 text-white hover:bg-[#0A2540] hover:text-white py-2 px-6 rounded-md border-white border-blue-900 transition duration-300 w-full"
                        type="submit">
                        ส่งข้อความ
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>

</head>

<body>
    <div class="container">

                <span class="brand-name">TIMEBANK</span>
            </div>
            <nav>
                <ul>
                    <li id="auth-link">
                        <a href="login.html">
                            <i class="fas fa-sign-in-alt"></i>
                            <span class="link-text">Log out</span>
                        </a>
                    </li>
                    <li>
                        <a href="HomePage.html">
                            <i class="fas fa-home"></i>
                            <span class="link-text">หน้าหลัก</span>
                        </a>
                    </li>
                    <!-- การบริการ Dropdown -->
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">
                            <i class="fas fa-cogs"></i>
                            <span class="link-text">การบริการ</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="service.html" class="sub-link">ยื่นข้อของานบริการ</a>
                            </li>
                        </ul>
                    </li>
                    <!-- การจัดการบัญชี Dropdown -->
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">
                            <i class="fas fa-user-circle"></i>
                            <span class="link-text">การจัดการบัญชี</span>
                            <i class="fas fa-chevron-down dropdown-icon"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="profile.html" class="sub-link">แก้ไขประวัติ</a>
                            </li>
                            <li>
                                <a href="skillconf.html" class="sub-link">แก้ไขทักษะ</a>
                            </li>
                            <li>
                                <a href="balance.html" class="sub-link">ยอดคงเหลือ</a>
                            </li>
                            <li>
                                <a href="history.html" class="sub-link">ประวัติ</a>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <a href="contact.html">
                            <i class="fas fa-phone"></i>
                            <span class="link-text">ติดต่อเรา</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="min-h-screen pl-[500px]">
        <<h1 class="text-4xl font-bold mb-5 pl-[400px] mt-16 ml-128 text-white">
            สร้างกิจกรรม
        </h1>
        <div class="bg-white text-black p-8 rounded-lg shadow-lg max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">
                รายละเอียดกิจกรรม
            </h2>
            <form onsubmit="submitActivity(event)">
                <div class="flex flex-wrap -mx-3 mb-4">
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="title">
                            ชื่อกิจกรรม
                        </label>
                        <input id="title"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" required />
                    </div>
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="requester-name">
                            ชื่อผู้ขอ
                        </label>
                        <input id="requester-name"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="text" oninput="searchMembers()" required />
                        <div id="search-results-dropdown"
                            class="bg-white border border-gray-300 mt-1 rounded shadow-lg z-10 hidden dropdown-content">
                            <!-- Search results will be dynamically inserted here -->
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="description">
                        รายละเอียด
                    </label>
                    <textarea id="description"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="location">
                        สถานที่
                    </label>
                    <input id="location"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        type="text" required />
                </div>
                <div class="flex flex-wrap -mx-3 mb-4">
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="start-date">
                            วันที่เริ่มต้น
                        </label>
                        <input id="start-date"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="date" required />
                    </div>
                    <div class="w-full md:w-1/2 px-3">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="start-time">
                            เวลาเริ่มต้น
                        </label>
                        <input id="start-time"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="time" required />
                    </div>
                </div>
                <div class="flex flex-wrap -mx-3 mb-4">
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="end-date">
                            วันที่สิ้นสุด
                        </label>
                        <input id="end-date"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="date" required />
                    </div>
                    <div class="w-full md:w-1/2 px-3">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="end-time">
                            เวลาสิ้นสุด
                        </label>
                        <input id="end-time"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="time" required />
                    </div>
                </div>
                <div class="flex flex-wrap -mx-3 mb-4">
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="max-participants">
                            จำนวนผู้เข้าร่วมสูงสุด
                        </label>
                        <input id="max-participants"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" oninput="calculateTimeTokens()" required />
                    </div>
                    <div class="w-full md:w-1/2 px-3">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="status"
                            style="margin-left: 10px;">
                            สถานะ
                        </label>
                        <select id="status"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            required>
                            <option value="กำลังจะเริ่ม">กำลังจะเริ่ม</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            <option value="ยกเลิก">ยกเลิก</option>
                        </select>
                    </div>
                </div>
                <div class="flex flex-wrap -mx-3 mb-4">
                    <div class="w-full md:w-1/2 px-3 mb-4 md:mb-0">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-required">
                            จำนวนโทเค็นเวลาที่ต้องการ
                        </label>
                        <input id="time-tokens-required"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" readonly />
                    </div>
                    <div class="w-full md:w-1/2 px-3">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="time-tokens-per-participant">
                            จำนวนโทเค็นเวลาต่อผู้เข้าร่วม
                        </label>
                        <input id="time-tokens-per-participant"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            type="number" readonly />
                    </div>
                </div>
                <div class="flex items-center justify-center">
                    <button onclick="window.history.back();"
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        ย้อนกลับ
                    </button>
                    <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 ml-2 rounded focus:outline-none focus:shadow-outline"
                        type="submit">สร้างกิจกรรม</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>


    <script>
        let members = [];
        let exchangeRate = null;

        async function fetchMembers() {
            try {
                const response = await fetch('http://localhost:3000/api/members', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                members = data.members;
            } catch (error) {
                console.error('Error fetching members:', error);
                alert('เกิดข้อผิดพลาดในการดึงรายชื่อผู้ขอ');
            }
        }

        async function fetchCommunityConfig() {
            try {
                const response = await fetch('http://localhost:3000/api/community-config', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                exchangeRate = data.default_exchange_rate_description;
                console.log('Exchange Rate:', exchangeRate);
            } catch (error) {
                console.error('Error fetching community config:', error);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูลการตั้งค่าชุมชน');
            }
        }

        function searchMembers() {
            const searchTerm = document.getElementById('requester-name').value.toLowerCase();
            const resultsDropdown = document.getElementById('search-results-dropdown');
            resultsDropdown.innerHTML = '';

            if (searchTerm) {
                const filteredMembers = members.filter(member =>
                    member.name.toLowerCase().includes(searchTerm) ||
                    member.member_id.toString().includes(searchTerm)
                );

                filteredMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'py-2 px-4 hover:bg-gray-200 cursor-pointer';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-700">${member.name}</p>
                                <p class="text-gray-500 text-sm">ID: ${member.member_id}</p>
                                <p class="text-gray-500 text-sm">โทเค็นเวลา: ${member.time_credits}</p>
                            </div>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('requester-name').value = member.name;
                        resultsDropdown.innerHTML = '';
                    };
                    resultsDropdown.appendChild(item);
                });

                resultsDropdown.style.display = 'block';
            } else {
                resultsDropdown.style.display = 'none';
            }
        }

        function calculateTimeTokens() {
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (
                isNaN(maxParticipants) ||
                maxParticipants <= 0 ||
                !startDate ||
                !endDate ||
                !startTime ||
                !endTime ||
                !exchangeRate
            ) {
                document.getElementById('time-tokens-required').value = '0.00';
                document.getElementById('time-tokens-per-participant').value = '0.00';
                return;
            }

            const startDateTime = new Date(`${startDate}T${startTime}`);
            const endDateTime = new Date(`${endDate}T${endTime}`);

            const durationInHours = Math.max(0, (endDateTime - startDateTime) / (1000 * 60 * 60));

            let timeTokensRequired = 0;
            let timeTokensPerParticipant = 0;

            if (exchangeRate === '1 โทเคนเวลา ต่อ 1 ชั่วโมง') {
                timeTokensPerParticipant = durationInHours;
                timeTokensRequired = maxParticipants * durationInHours;
            } else if (exchangeRate === '1 โทเคนเวลา ต่อ 1 กิจกรรม') {
                timeTokensPerParticipant = 1;
                timeTokensRequired = maxParticipants;
            }

            document.getElementById('time-tokens-required').value = timeTokensRequired.toFixed(2);
            document.getElementById('time-tokens-per-participant').value = timeTokensPerParticipant.toFixed(2);
        }

        async function submitActivity(event) {
            event.preventDefault();

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const location = document.getElementById('location').value;
            const startDate = document.getElementById('start-date').value;
            const startTime = document.getElementById('start-time').value;
            const endDate = document.getElementById('end-date').value;
            const endTime = document.getElementById('end-time').value;
            const maxParticipants = parseInt(document.getElementById('max-participants').value, 10);
            const requesterName = document.getElementById('requester-name').value;
            const status = document.getElementById('status').value;
            const timeTokensRequired = parseFloat(document.getElementById('time-tokens-required').value);
            const timeTokensPerParticipant = parseFloat(document.getElementById('time-tokens-per-participant').value);

            if (isNaN(maxParticipants) || maxParticipants <= 0) {
                alert('กรุณากรอกจำนวนผู้เข้าร่วมสูงสุดให้ถูกต้อง');
                return;
            }
            if (isNaN(timeTokensRequired) || timeTokensRequired < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาที่ต้องการให้ถูกต้อง');
                return;
            }
            if (isNaN(timeTokensPerParticipant) || timeTokensPerParticipant < 0) {
                alert('กรุณากรอกจำนวนโทเค็นเวลาต่อผู้เข้าร่วมให้ถูกต้อง');
                return;
            }

            const activityData = {
                title,
                description,
                location,
                start_date: startDate,
                start_time: startTime,
                end_date: endDate,
                end_time: endTime,
                max_participants: maxParticipants,
                requester_name: requesterName,
                status,
                time_tokens_required: timeTokensRequired,
                time_tokens_per_participant: timeTokensPerParticipant
            };

            try {
                const response = await fetch('http://localhost:3000/api/activities', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(activityData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Error response from server:', errorData);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                alert('สร้างกิจกรรมเรียบร้อยแล้ว!');
                window.location.href = 'activity.html';
            } catch (error) {
                console.error('Error creating activity:', error);
                alert('เกิดข้อผิดพลาดในการสร้างกิจกรรม กรุณาลองใหม่อีกครั้ง');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMembers();
            fetchCommunityConfig();
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
            const sidebar = document.querySelector('.sidebar');
            const logoutLink = document.querySelector('#auth-link a');
    
            // Handle dropdown toggle click
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevent default anchor behavior
                    const parent = toggle.parentElement;
                    parent.classList.toggle('open'); // Toggle the "open" class
                });
            });
    
            // Reset dropdowns when the mouse leaves the sidebar
            sidebar.addEventListener('mouseleave', () => {
                const dropdowns = document.querySelectorAll('.dropdown');
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('open'); // Remove "open" class
                });
            });
    
            // Add confirmation dialog for logout
            logoutLink.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent immediate navigation
                const confirmation = confirm('Are you sure you want to log out?');
                if (confirmation) {
                    window.location.href = logoutLink.href; // Redirect to the log out page
                }
            });
        });
    </script>
    
</body>

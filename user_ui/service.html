        let activities = [];

        async function confirmAndRemove(event, rowId, activityId) {
            event.preventDefault();
            const confirmation = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบกิจกรรมนี้?");
            if (confirmation) {
                const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                if (response.ok) {
                    document.getElementById(rowId).remove();
                    alert("กิจกรรมถูกลบเรียบร้อยแล้ว");
                } else {
                    alert("เกิดข้อผิดพลาดในการลบกิจกรรม");
                }
            }
        }

        async function fetchActivities() {
            try {
                console.log('Fetching activities...');
                const response = await fetch('http://localhost:3000/api/user/activities', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                if (response.ok) {
                    activities = data.activities;
                    updateActivityStatus();
                    await fetchParticipants();
                    renderTable(activities);
                } else {
                    console.error('Error:', data);
                    alert('Error fetching activities. Please try again.');
                }
            } catch (error) {
                console.error('Error fetching activities:', error);
                alert('Error fetching activities. Please try again.');
            }
        }

        async function fetchParticipants() {
            for (let activity of activities) {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activity.activity_id}/participants`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        }
                    });
                    const participants = await response.json();
                    activity.current_participants = participants.length;
                    activity.participants = participants; // Store participants for later use
                } catch (error) {
                    console.error(`Error fetching participants for activity ${activity.activity_id}:`, error);
                    activity.current_participants = 0;
                    activity.participants = [];
                }
            }
        }

        function updateActivityStatus() {
            const now = new Date();
            activities.forEach(activity => {
                if (activity.status === 'กำลังจะเริ่ม') {
                    const activityEndDate = new Date(activity.end_date);
                    const activityEndTime = activity.end_time.split(':');
                    activityEndDate.setHours(activityEndTime[0], activityEndTime[1], activityEndTime[2]);
                    if (activityEndDate < now) {
                        activity.status = 'เกินเวลา';
                    }
                }
            });
        }

        function renderTable(data) {

                row.id = `row-${index + 1}`;
                row.className = 'hover:bg-gray-100';
                row.innerHTML = `
                    <td aria-colindex="1" data-label="กิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${activity.title}
                    </td>
                    <td aria-colindex="2" data-label="วันที่สร้างกิจกรรม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        ${formatDate(activity.created_at)}

                        ${formatDate(activity.start_date)}

                    <td aria-colindex="4" data-label="สถานะ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span class="py-1 px-2 rounded ${activity.status === 'กำลังจะเริ่ม' ? 'bg-blue-500' : activity.status === 'เสร็จสิ้น' ? 'bg-green-500' : activity.status === 'เกินเวลา' ? 'bg-orange-500' : 'bg-red-500'} text-white">${activity.status}</span>
                    </td>
                    <td aria-colindex="5" data-label="จำนวนผู้เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <span id="participants-${index}">${activity.current_participants}</span> / ${activity.max_participants}
                    </td>
                    <td aria-colindex="6" data-label="การจัดการ" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <a href="${activityDetailsPage}?id=${activity.activity_id}" 
                           class="bg-blue-500 text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline">
                            รายละเอียด
                        </a>
                    </td>
                    <td aria-colindex="7" data-label="เข้าร่วม" role="cell" class="py-2 px-4 border-b border-gray-200">
                        <button onclick="handleJoinButton(${activity.activity_id}, ${index})" 
                                class="${joinButtonClass} text-white font-bold py-1 px-2 rounded focus:outline-none focus:shadow-outline join-button" 
                                ${joinButtonDisabled ? 'disabled' : ''}>
                            ${joinButtonText}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            if (data.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="7" class="text-center text-gray-500 py-6">
                        ไม่พบกิจกรรมที่ตรงกับการค้นหา
                    </td>
                `;
                tbody.appendChild(row);
            }
            
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear() + 543; // Convert to Buddhist year
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const month = monthNames[date.getMonth()];
            const day = date.getDate();
            return `<span class="day-part">${day}</span> <span class="month-year-part">${month}</span> <span class="month-year-part">${year}</span>`;
        }

        function sortTable(column, type) {
            const order = sortOrder[column] === 'asc' ? 'desc' : 'asc';
            sortOrder[column] = order;
            const sortedActivities = [...activities].sort((a, b) => {
                if (type === 'string') {
                    return order === 'asc' ? a[column].localeCompare(b[column]) : b[column].localeCompare(a[column]);
                } else if (type === 'date') {
                    return order === 'asc' ? new Date(a[column]) - new Date(b[column]) : new Date(b[column]) - new Date(a[column]);
                }
            });
            renderTable(sortedActivities);
        }

        async function checkLoginStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/user/auth/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (response.ok) {
                        updateSidebar(true);
                        fetchActivities(); // Fetch activities only if the user is logged in
                    } else {
                        localStorage.removeItem('token');
                        updateSidebar(false);
                        const goToLogin = confirm('Session expired. Do you want to go to the login page?');
                        if (goToLogin) {
                            window.location.href = 'log-in.html';
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    localStorage.removeItem('token');
                    updateSidebar(false);
                    const goToLogin = confirm('An error occurred. Do you want to go to the login page?');
                    if (goToLogin) {
                        window.location.href = 'log-in.html';
                    }
                }
            } else {
                updateSidebar(false);
                const goToLogin = confirm('You are not logged in. Do you want to go to the login page?');
                if (goToLogin) {
                    window.location.href = 'log-in.html';
                }
            }
        }

async function searchActivities() {
    const baseSearch = document.getElementById('search-input').value.toLowerCase();
    const location = document.getElementById('filter-location').value.toLowerCase();
    const status = document.getElementById('filter-status').value;
    const startDate = document.getElementById('filter-start-date').value;
    const skill = document.getElementById('filter-skill').value;

    const filteredActivities = activities.filter(activity => {
        const matchesText =
            (activity.title && activity.title.toLowerCase().includes(baseSearch)) ||
            (activity.description && activity.description.toLowerCase().includes(baseSearch)) ||
            (activity.location && activity.location.toLowerCase().includes(baseSearch)) ||
            (activity.requester_id && activity.requester_id.toString().includes(baseSearch));

        const matchesLocation = location ? activity.location.toLowerCase().includes(location) : true;
        const matchesStatus = status ? activity.status === status : true;
        const matchesDate = startDate ? activity.start_date === startDate : true;
        const matchesSkill = skill ? activity.required_skills?.toString() === skill : true;

        return matchesText && matchesLocation && matchesStatus && matchesDate && matchesSkill;
    });

    renderTable(filteredActivities);
}

        async function handleJoinButton(activityId, index) {
            const joinButton = document.querySelector(`#row-${index + 1} .join-button`);
        
            if (joinButton.innerText === 'เข้าร่วม') {
                await joinActivity(activityId, index);
            } else if (joinButton.innerText === 'ยกเลิก') {
                await leaveActivity(activityId, index);
            }
        }
        

        async function joinActivity(activityId, index) {
            const token = localStorage.getItem('token');
            const userId = globalUserId;
        
            if (!token || !userId) {
                showMessage("คุณต้องเข้าสู่ระบบก่อนเข้าร่วมกิจกรรม", true);
                return;
            }
        
            if (activities[index].requester_id === userId) {
                showMessage("คุณไม่สามารถเข้าร่วมกิจกรรมของตนเองได้", true);
                return;
            }
        
            showConfirmation("คุณต้องการเข้าร่วมกิจกรรมนี้หรือไม่?", async () => {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/participants`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ memberId: userId })
                    });
        
                    const data = await response.json();
        
                    if (response.ok) {
                        activities[index].current_participants += 1;
                        const joinButton = document.querySelector(`#row-${index + 1} .join-button`);
                        joinButton.innerText = 'ยกเลิก';
                        joinButton.classList.remove('bg-blue-500');
                        joinButton.classList.add('bg-red-500');
                        document.getElementById(`participants-${index}`).innerText = activities[index].current_participants;
        
                        showMessage("เข้าร่วมกิจกรรมสำเร็จ!");
                    } else {
                        showMessage(data.error || "เกิดข้อผิดพลาดในการเข้าร่วมกิจกรรม", true);
                    }
                } catch (error) {
                    console.error('Error joining activity:', error);
                    showMessage("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง", true);
                }
            });
        }
        
        

        async function leaveActivity(activityId, index) {
            const token = localStorage.getItem('token');
            const userId = globalUserId;
        
            if (!token || !userId) {
                showMessage("คุณต้องเข้าสู่ระบบก่อนออกจากกิจกรรม", true);
                return;
            }
        
            showConfirmation("คุณต้องการยกเลิกการเข้าร่วมกิจกรรมนี้หรือไม่?", async () => {
                try {
                    const response = await fetch(`http://localhost:3000/api/user/activities/${activityId}/participants/${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
        
                    if (response.ok) {
                        activities[index].current_participants -= 1;
                        const joinButton = document.querySelector(`#row-${index + 1} .join-button`);
                        joinButton.innerText = 'เข้าร่วม';
                        joinButton.classList.remove('bg-red-500');
                        joinButton.classList.add('bg-blue-500');
                        document.getElementById(`participants-${index}`).innerText = activities[index].current_participants;
        
                        showMessage("ออกจากกิจกรรมสำเร็จ!");
                    } else {
                        const data = await response.json();
                        showMessage(data.error || "เกิดข้อผิดพลาดในการออกจากกิจกรรม", true);
                    }
                } catch (error) {
                    console.error('Error leaving activity:', error);
                    showMessage("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง", true);
                }
            });
        }

        function showMessage(message, isError = false) {
            const modal = document.getElementById('message-modal');
            const title = document.getElementById('message-title');
            const text = document.getElementById('message-text');
            const icon = document.getElementById('message-icon');
            const iconSvg = document.getElementById('message-icon-svg');
            const iconPath = document.getElementById('message-icon-path');
        
            text.textContent = message;
            modal.classList.remove('hidden');
        
            if (isError) {
                title.textContent = "เกิดข้อผิดพลาด!";
                title.classList.add('text-red-600');
                icon.classList.add('bg-red-100', 'border-red-500');
                iconSvg.classList.add('text-red-500');
                iconPath.setAttribute("d", "M6 18L18 6M6 6l12 12"); // X icon
            } else {
                title.textContent = "สำเร็จ!";
                title.classList.add('text-green-600');
                icon.classList.add('bg-green-100', 'border-green-500');
                iconSvg.classList.add('text-green-500');
                iconPath.setAttribute("d", "M5 13l4 4L19 7"); // Checkmark icon
            }
        
            setTimeout(() => modal.classList.add('opacity-100', 'scale-100'), 50);
        
            document.getElementById('confirm-message-btn').onclick = () => {
                modal.classList.add('hidden');
                modal.classList.remove('opacity-100', 'scale-100');
            };
        }
        
        function showConfirmation(message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const text = document.getElementById('confirm-message');
        
            text.textContent = message;
            modal.classList.remove('hidden');
        
            document.getElementById('confirm-yes-btn').onclick = () => {
                modal.classList.add('hidden');
                onConfirm(); // Execute the function if confirmed
            };
        
            document.getElementById('confirm-no-btn').onclick = () => {
                modal.classList.add('hidden');
            };
        }
        
        
    </script>
</head>

    <script>
        function toggleAdvancedFilter() {
            const filterBox = document.getElementById('advanced-filter');
            filterBox.classList.toggle('hidden');
        }

        async function fetchSkills() {
            try {
                const response = await fetch('http://localhost:3000/api/skills');
                const skills = await response.json();
        
                const skillDropdown = document.getElementById('filter-skill');
                skills.forEach(skill => {
                    const option = document.createElement('option');
                    option.value = skill.skill_id;
                    option.textContent = skill.name;
                    skillDropdown.appendChild(option);
                });
            } catch (err) {
                console.error('Error fetching skills:', err);
            }
        }
        
        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-location').value = '';
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-start-date').value = '';
            document.getElementById('filter-skill').value = '';
            searchActivities();
        }

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Time Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-1/5 bg-white h-full p-5">
            <div class="flex items-center mb-10">
                <img alt="Logo" class="w-10 h-10 rounded-full" height="50"
                    src="https://storage.googleapis.com/a1aa/image/GOMFBEaepyxe3E3gz2xaZviBDO0q04rV6Cz8h1wgcnNFaw5TA.jpg"
                    width="50" />
                <span class="ml-3 text-xl font-bold text-blue-600">TIMEBANK</span>
            </div>
            <nav>
                <ul>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="HomePage.html">
                            <i class="fas fa-home mr-3"></i>หน้าหลัก
                        </a>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="#">
                            <i class="fas fa-cogs mr-3"></i>การบริการ
                        </a>
                        <ul class="ml-8 mt-2">
                            <li class="mb-2">
                                <a class="text-gray-500 hover:text-blue-600" href="service.html">ยื่นข้อของานบริการ</a>
                            </li>
                        </ul>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="#">
                            <i class="fas fa-user-circle mr-3"></i>การจัดการบัญชี
                        </a>
                        <ul class="ml-8 mt-2">
                            <li class="mb-2">
                                <a class="text-gray-500 hover:text-blue-600" href="profile.html">แก้ไขประวัติ</a>
                            </li>
                            <li class="mb-2">
                                <a class="text-gray-500 hover:text-blue-600" href="skillconf.html">แก้ไขทักษะ</a>
                            </li>
                            <li class="mb-2">
                                <a class="text-gray-500 hover:text-blue-600" href="balance.html">ยอดคงเหลือ</a>
                            </li>
                            <li class="mb-2">
                                <a class="text-gray-500 hover:text-blue-600" href="history.html">ประวัติ</a>
                            </li>
                        </ul>
                    </li>
                    <li class="mb-5">
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="contact.html">
                            <i class="fas fa-phone mr-3"></i>ติดต่อเรา
                        </a>
                    </li>
                    <li>
                        <a class="flex items-center text-gray-700 hover:text-blue-600" href="login.html">
                            <i class="fas fa-sign-in-alt mr-3"></i>Login
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex items-center justify-center bg-blue-700">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
                <h1 class="text-4xl font-bold text-center text-blue-900 mb-8">
                    TIME BANK
                </h1>
                <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">
                    Login
                </h2>
                <form>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="id-number">
                            เลขบัตรประจำตัวประชาชน
                        </label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="id-number" placeholder="" type="text" />
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                            รหัสผ่าน
                        </label>
                        <input
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                            id="password" placeholder="" type="password" />
                    </div>
                    <div class="flex items-center justify-center">
                        <button
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                            type="button">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-gray-700">
                        ไม่มีบัญชีผู้ใช้ ?
                        <a class="text-blue-500" href="#">
                            สมัครสมาชิก
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

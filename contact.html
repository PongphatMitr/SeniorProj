<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Contact Us - Time Bank
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="bg-white">
  <div class="flex">
   <!-- Sidebar -->
   <div class="w-16 bg-white h-screen flex flex-col items-center py-4 space-y-4">
    <img alt="Logo" class="rounded-full" height="40" src="https://storage.googleapis.com/a1aa/image/QE3PKAlBB1KaNRRJlFlfbhkeXJ2eg9m2NAzhW7w6uATxjhznA.jpg" width="40"/>
    <i class="fas fa-home text-gray-500 text-xl">
    </i>
    <i class="fas fa-file-alt text-gray-500 text-xl">
    </i>
    <i class="fas fa-user text-gray-500 text-xl">
    </i>
    <i class="fas fa-bell text-gray-500 text-xl">
    </i>
    <i class="fas fa-cog text-gray-500 text-xl">
    </i>
   </div>
   <!-- Main Content -->
   <div class="flex-1 bg-blue-900 text-white p-8">
    <h1 class="text-4xl font-bold text-center mb-8">
     TIME BANK
    </h1>
    <div class="max-w-4xl mx-auto">
     <h2 class="text-3xl font-bold mb-6">
      ติดต่อเรา
     </h2>
     <form class="space-y-4">
      <div class="flex space-x-4">
       <input class="w-1/2 p-4 rounded-md text-black" placeholder="ชื่อ" type="text"/>
       <input class="w-1/2 p-4 rounded-md text-black" placeholder="อีเมล" type="email"/>
      </div>
      <input class="w-full p-4 rounded-md text-black" placeholder="หัวข้อ" type="text"/>
      <textarea class="w-full p-4 rounded-md text-black h-32" placeholder="ข้อความ"></textarea>
      <button class="bg-blue-700 hover:bg-blue-800 text-white py-2 px-6 rounded-md" type="submit">
       ส่งข้อความ
      </button>
     </form>
     </div>
    </div>
   </div>
  </div>
 </body>
</html>
